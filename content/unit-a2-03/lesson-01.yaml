unit_id: unit-a2-03
lesson_id: lesson-01
title: 'Μάθημα 3: Σχέδια, Όνειρα & Ο Μέλλοντας (Future Plans, Intentions & Forecasts)'
description: Formulating future plans, intentions, and predictions using Simple and
  Continuous Future (Συνοπτικός & Εξακολουθητικός Μέλλοντας), temporal adverbials
  (του χρόνου, σύντομα, σε λίγο), and verbs of intention (σκοπεύω, σχεδιάζω, ελπίζω).
lesson_status: not_started
lesson_notes: "Unit A2-03 Core Notes: Σχέδια, Όνειρα & Ο Μέλλοντας (Future Plans &\
  \ Predictions)\n• Simple Future (Συνοπτικός Μέλλοντας):\n  - Formed with 'θα' +\
  \ aorist dependent stem (θα πάω, θα δω, θα κάνω, θα μείνω, θα ταξιδέψω, θα πάρω,\
  \ θα δώσω, θα έρθω, θα φύγω, θα βρω, θα στείλω).\n  - Used for single, completed\
  \ future events at a specific time.\n\n• Continuous Future (Εξακολουθητικός Μέλλοντας):\n\
  \  - Formed with 'θα' + present stem (θα δουλεύω, θα διαβάζω, θα μένω).\n  - Used\
  \ for duration, repetition, or background state in the future.\n\n• Expressions\
  \ of Intention & Probability:\n  - σκοπεύω να (I intend to), σχεδιάζω να (I plan\
  \ to), ελπίζω να (I hope to), υπόσχομαι να (I promise to).\n  - σίγουρα (definitely),\
  \ ίσως (perhaps), πιθανόν (probably), αποκλείεται να (it is impossible to).\n\n\
  • Temporal Markers:\n  - του χρόνου (next year), τον επόμενο μήνα (next month),\
  \ σύντομα (soon), σε λίγο (shortly), μεθαύριο (day after tomorrow)."
entries:
- id: A2-U03-001
