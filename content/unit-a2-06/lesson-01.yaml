unit_id: unit-a2-06
lesson_id: lesson-01
title: 'Μάθημα 6: Συναλλαγές, Τράπεζα, Ταχυδρομείο & Δημόσιες Υπηρεσίες (Banking,
  Post Office & Public Services)'
description: Navigating banking counters, ATM withdrawals, postal package dispatches,
  utility bills, and Citizens' Service Centers (ΚΕΠ) using polite imperatives (περάστε,
  περιμένετε, δείξτε μου, δώστε μου) and administrative formulas.
lesson_status: not_started
lesson_notes: "Unit A2-06 Core Notes: Συναλλαγές, Τράπεζα & Δημόσιες Υπηρεσίες (Public\
  \ Services & Transactions)\n• Civic & Administrative Environments:\n  - Η τράπεζα:\
  \ λογαριασμός (account), κατάθεση (deposit), ανάληψη (withdrawal), ΑΤΜ, υπόλοιπο\
  \ (balance).\n  - Το ταχυδρομείο (ΕΛΤΑ): δέμα (parcel), γραμματόσημο (stamp), συστημένο\
  \ (registered mail).\n  - Το ΚΕΠ (Κέντρο Εξυπηρέτησης Πολιτών): αίτηση (application),\
  \ πιστοποιητικό (certificate), βεβαίωση (attestation), γνήσιο υπογραφής (signature\
  \ legalization).\n• Imperative Directives in Public Counters:\n  - Περάστε (step\
  \ forward), Περιμένετε (wait), Δείξτε μου (show me), Δώστε μου (give me), Υπογράψτε\
  \ (sign)."
entries:
- id: A2-U06-001
  greek: ο λογαριασμός
  english: bill / bank account
  notes: 'Masculine noun in -ος (-οι). Dual meaning: utility/restaurant bill (''πληρώνω
    τον λογαριασμό'') or bank account (''τραπεζικός λογαριασμός'').'
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι λογαριασμοί
    genitive_singular: του λογαριασμού
    collocations: λογαριασμός ρεύματος, τραπεζικός λογαριασμός
  keg_communicative_function: Settling utility bills and handling bank accounts in
    Speaking Stage 2 role-plays
  example_el: Θα ήθελα να ανοίξω έναν τραπεζικό λογαριασμό ταμιευτηρίου.
  example_en: I would like to open a savings bank account.
  example2_el: Πήγα στο ταχυδρομείο για να πληρώσω τον λογαριασμό του νερού.
  example2_en: I went to the post office to pay the water bill.
  audio: o-logariasmos-0a3d2a.mp3
  status: verified
  example_audio: tha-ithela-na-anoixo-52d0aa.mp3
  example2_audio: piga-sto-tachydromei-ee4d16.mp3
- id: A2-U06-002
  greek: η κατάθεση
  english: bank deposit
  notes: 'Feminine noun in -η (-εις). Verb: ''καταθέτω'' (to deposit). Antonym: ''η
    ανάληψη'' (withdrawal).'
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι καταθέσεις
    verb: καταθέτω
    antonym: η ανάληψη
