    slips
  example_el: Θέλω να κάνω μια κατάθεση χρημάτων στον λογαριασμό του ενοικίου.
  example_en: I want to make a cash deposit into the rent account.
  example2_el: Συμπληρώστε το έντυπο κατάθεσης με το ακριβές ποσό και την υπογραφή
    σας.
  example2_en: Fill in the deposit form with the exact amount and your signature.
  audio: i-katathesi-673ed4.mp3
  status: verified
  example_audio: thelo-na-kano-mia-ka-3d2a41.mp3
  example2_audio: sympliroste-to-entyp-38cc8a.mp3
- id: A2-U06-003
