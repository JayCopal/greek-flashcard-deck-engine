unit_id: unit-08
lesson_id: lesson-01
title: Καθημερινό Πρόγραμμα & Συνήθειες (Daily Routines & Habits)
description: 'CEFR A1: Describing daily routines, work and study schedule, frequency
  adverbs (πάντα, συχνά, ποτέ), Type A, B1, and B2 active verbs, and modal connectors
  (θέλω να).'
lesson_status: not_started
lesson_notes: "Unit 8 Core Grammar Notes:\n\n• Daily Routine Active Verbs:\n  - Type\
  \ A (-ω, -εις, -ει, -ουμε, -ετε, -ουν): αρχίζω, τελειώνω, διαβάζω, γράφω, ακούω,\
  \ βλέπω, μαγειρεύω, φεύγω, γυρίζω, ψωνίζω.\n  - Type B1 (-άω/-ώ, -άς, -άει/-ά, -άμε,\
  \ -άτε, -άνε/-ούν): ξυπνάω/ξυπνώ, περπατάω/περπατώ, τραγουδάω/τραγουδώ.\n  - Type\
  \ B2 (-ώ, -είς, -εί, -ούμε, -είτε, -ούν): οδηγώ, μπορώ, ζω.\n\n• Strict A1 Active\
  \ Routine Phrases (Avoiding Mediopassive):\n  - παίρνω πρωινό (have breakfast)\n\
  \  - κάνω μπάνιο / κάνω ντους (take a bath / shower)\n  - κάνω γυμναστική (work\
  \ out / exercise)\n  - πάω για ύπνο (go to bed / sleep)\n\n• Adverbs of Frequency\
  \ & Scale:\n  - πάντα (100%) > συνήθως (80%) > συχνά (60%) > μερικές φορές (40%)\
  \ > σπάνια (10%) > ποτέ (0%).\n  - Double Negative Rule with ποτέ: 'Δεν' + verb\
  \ + 'ποτέ' (e.g. Δεν πίνω ποτέ καφέ το βράδυ).\n\n• Times of the Day & Temporal\
  \ Markers:\n  - το πρωί, το μεσημέρι, το απόγευμα, το βράδυ, τη νύχτα.\n  - νωρίς\
  \ (early) vs. αργά (late).\n\n• Modal Connective Syntax:\n  - θέλω να + Present\
  \ Active Indicative (θέλω να μάθω...)\n  - μπορώ να + Present Active Indicative\
  \ (μπορώ να μιλήσω...)"
