unit_id: unit-111
lesson_id: lesson-01
title: 'Ενότητα 10: Περαστικά! — Βασικό Λεξιλόγιο (Pages 219-232)'
description: 'Core vocabulary for Unit 10 of Klik sta Ellinika A1: Health and illness
  (υγεία, αρρώστια, ασθένεια, άρρωστος, πυρετός, βήχας, γρίπη, κρυολόγημα, πόνος,
  πονοκέφαλος, πονόλαιμος), medical practitioners and facilities (γιατρός, παθολόγος,
  παιδίατρος, οδοντίατρος, φαρμακοποιός, φαρμακείο, νοσοκομείο, ιατρείο, ασθενοφόρο),
  pharmacy supplies and remedies (φάρμακο, χάπι, ασπιρίνη, σιρόπι, ένεση, αλοιφή,
  επίδεσμος, τσιρότο, θερμόμετρο, παυσίπονο, χαμομήλι), anatomy and human body parts
  (σώμα, κεφάλι, πρόσωπο, μάτι, αυτί, μύτη, στόμα, δόντι, λαιμός, πλάτη, καρδιά, κοιλιά,
  χέρι, πόδι), and illness verbs (αρρωσταίνω, πονάω, κρυώνω, βήχω).'
lesson_status: not_started
