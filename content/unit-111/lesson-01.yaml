unit_id: unit-111
lesson_id: lesson-01
title: 'Ενότητα 11: Στη σειρά σας παρακαλώ! & Τελική Επανάληψη — Βασικό Λεξιλόγιο
  (Pages 233-255)'
description: 'Core vocabulary from Unit 11 and the Comprehensive Capstone Review of
  Klik sta Ellinika A1: banking institutions and accounts (τράπεζα, ταμίας, ταμείο,
  λογαριασμός, άνοιγμα λογαριασμού, κατάθεση, ανάληψη, ΑΤΜ), payment cards and security
  (πιστωτική κάρτα, χρεωστική κάρτα, βιβλιάριο, κωδικός, PIN, υπογραφή, υπόλοιπο,
  μετρητά, ρέστα), official paperwork and personal identity forms (ταυτότητα, αστυνομική
  ταυτότητα, διαβατήριο, έγγραφο, έντυπο, προσωπικά στοιχεία, επώνυμο, όνομα, φύλο,
  ημερομηνία γέννησης, τόπος γέννησης, εθνικότητα, οικογενειακή κατάσταση, άγαμος,
  έγγαμος, ΑΦΜ, βεβαίωση, αντίγραφο), postal services and dispatch (ταχυδρομείο, ταχυδρόμος,
  γράμμα, επιστολή, συστημένο γράμμα, επείγον γράμμα, δέμα, πακέτο, γραμματόσημο,
  φάκελος, γραμματοκιβώτιο, αποστολέας, παραλήπτης, ταχυδρομικός κώδικας), public
  utilities, technology and police (ΔΕΗ, ρεύμα, ΟΤΕ, διαδίκτυο, ηλεκτρονικό μήνυμα,
  παραγγελία, σύνδεσμος, αστυνομία, αστυνομικό τμήμα, αστυνομικός, όχημα, οδηγός,
  ατύχημα, σειρά, ουρά, νούμερο, απόδειξη, συναλλαγή), and communicative verbs of
  transaction and assistance (ανοίγω, κλείνω, συμπληρώνω, καταθέτω, σηκώνω, πληρώνω,
  στέλνω, παραλαμβάνω, υπογράφω, δίνω, παραγγέλνω, εξυπηρετώ).'
lesson_status: not_started
