- id: A1-U09-001
  greek: η ώρα
  phonetic_hint: ''
  english: hour / time / o'clock
  notes: 'Feminine in -α with plural in -ες (οι ώρες). Ubiquitous question: ''Τι ώρα
    είναι;''.'
  gender_or_pos: noun (feminine)
  audio: i-ora-f4377d.mp3
  status: verified
  example_el: Τι ώρα είναι τώρα, παρακαλώ;
  example_en: What time is it now, please?
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι ώρες
    accusative_singular: την ώρα
  keg_communicative_function: Asking for and stating the time
  example_audio: ti-ora-einai-tora-pa-a604f9.mp3
  example2_el: Είναι μία η ώρα το μεσημέρι.
  example2_en: It is one o'clock in the afternoon.
  example2_audio: einai-mia-i-ora-to-m-9d462a.mp3
