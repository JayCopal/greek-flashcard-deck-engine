unit_id: unit-09
lesson_id: lesson-01
title: Ώρα, Ημερολόγιο & Ραντεβού (Telling Time, Calendar & Appointments)
description: 'CEFR A1: Asking for and stating the time, days of the week, months,
  seasons, arranging appointments, and understanding timetable announcements.'
lesson_status: not_started
lesson_notes: "Unit 9 Core Grammar Notes:\n\n• Telling Time (Ώρα):\n  - Inquiring:\
  \ 'Τι ώρα είναι;' (What time is it?) / 'Σε τι ώρα;' (At what time?).\n  - Exact\
  \ hour: 'Είναι μία ακριβώς' (1:00) / 'Είναι δύο ακριβώς' (2:00).\n  - Minutes past:\
  \ 'Είναι τρεις και τέταρτο' (3:15) / 'Είναι τέσσερις και είκοσι' (4:20).\n  - Half\
  \ past: 'Είναι πέντε και μισή' (5:30).\n  - Minutes to: 'Είναι έξι παρά είκοσι'\
  \ (5:40) / 'Είναι επτά παρά τέταρτο' (6:45).\n  - Specifying when: 'Στη μία' (at\
  \ 1:00) vs 'Στις τρεις, στις τέσσερις...' (all other hours).\n\n• Days of the Week\
  \ (Ημέρες της Εβδομάδας):\n  - Feminine (all except Saturday): η Δευτέρα, η Τρίτη,\
  \ η Τετάρτη, η Πέμπτη, η Παρασκευή, η Κυριακή.\n  - Neuter: το Σάββατο, το σαββατοκύριακο.\n\
  \  - Temporal Accusative (no preposition): 'τη Δευτέρα' (on Monday), 'το Σάββατο'\
  \ (on Saturday).\n\n• The Four Seasons (Εποχές):\n  - η άνοιξη (spring), το καλοκαίρι\
  \ (summer), το φθινόπωρο (autumn), ο χειμώνας (winter).\n  - Temporal Accusative:\
  \ 'την άνοιξη', 'το καλοκαίρι', 'το φθινόπωρο', 'τον χειμώνα'.\n\n• Months (Μήνες):\n\
  \  - All months in Modern Greek are masculine (ο Ιανουάριος, ο Απρίλιος, ο Αύγουστος...).\n\
  \  - Temporal Accusative: 'τον Ιανουάριο' (in January), 'τον Αύγουστο' (in August).\n\
  \n• Time Spans & Scheduling Connectives:\n  - από... μέχρι... (from... until...):\
  \ 'από τις εννέα μέχρι τις πέντε'.\n  - πριν από / μετά από + Accusative.\n  - κλείνω\
  \ ραντεβού (make an appointment) / περιμένω (wait for)."
