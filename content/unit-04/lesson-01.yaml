unit_id: unit-04
lesson_id: lesson-01
title: Οικογένεια, Πρόσωπα & Περιγραφή (Family & Physical/Personal Traits)
description: 'CEFR A1: Family relations, marital status, physical descriptions, the
  verb ''έχω'', and possessive enclitics (μου, σου, του, της).'
lesson_status: not_started
lesson_notes: 'Unit 4 Core Grammar Notes:

  • Verb ''έχω'' (Present Active): εγώ έχω, εσύ έχεις, αυτός/αυτή/αυτό έχει, εμείς
  έχουμε, εσείς έχετε, αυτοί/αυτές/αυτά έχουν.

  • Weak Possessive Clitics: Placed directly after the noun (ο πατέρας μου, η μητέρα
  σου, το παιδί μας).

  • Definite Article Rule: Possessive clitics always require the definite article
  before the noun: ''το μωρό μου'' (NOT ''μωρό μου'' in declarative statements).

  • Adjective Agreement: Masculine in -ος, Feminine in -η/-α, Neuter in -ο (ψηλός,
  ψηλή, ψηλό; νέος, νέα, νέο).'
