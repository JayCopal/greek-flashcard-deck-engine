  status: verified
  example_audio: agorazo-kathimerina--66a106.mp3
  example2_audio: to-arthro-dimosieyti-f46518.mp3
- id: A2-U11-014
  greek: το διαδίκτυο
  english: the internet
  notes: 'Neuter compound noun: διά + δίκτυο (net). Prepositional: ''στο διαδίκτυο''
    (online/on the internet).'
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    genitive_singular: του διαδικτύου
    synonym: το ίντερνετ
    adjective: διαδικτυακός, -ή, -ό
  keg_communicative_function: Discussing digital connectivity, online courses, and
    internet safety
  example_el: Σήμερα μπορούμε να βρούμε αμέτρητες πληροφορίες και μαθήματα στο διαδίκτυο.
  example_en: Today we can find countless pieces of information and lessons on the
    internet.
  example2_el: Η διαδικτυακή επικοινωνία μάς επιτρέπει να μένουμε σε επαφή με φίλους
    στο εξωτερικό.
  example2_en: Online communication allows us to stay in touch with friends abroad.
  audio: to-diadiktyo-d31213.mp3
  status: verified
  example_audio: simera-mporoyme-na-v-f37880.mp3
  example2_audio: i-diadiktyaki-epikoi-219bd9.mp3
- id: A2-U11-015
  greek: η ιστοσελίδα
  english: webpage / website
  notes: 'Feminine compound noun: ιστός (web) + σελίδα (page). Plural: ''οι ιστοσελίδες''.'
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι ιστοσελίδες
    synonym: ο ιστότοπος
  keg_communicative_function: Navigating institutional web portals and checking online
    guidelines
  example_el: Επισκεφτείτε την επίσημη ιστοσελίδα του Κέντρου Ελληνικής Γλώσσας για
    παλιά θέματα εξετάσεων.
  example_en: Visit the official website of the Centre for the Greek Language for
    past exam papers.
  example2_el: Η ιστοσελίδα ανανεώνεται τακτικά με νέες ανακοινώσεις και άρθρα.
  example2_en: The website is updated regularly with new announcements and articles.
  audio: i-istoselida-8ce2fb.mp3
  status: verified
  example_audio: episkefteite-tin-epi-40ca8c.mp3
  example2_audio: i-istoselida-ananeon-62d54e.mp3
- id: A2-U11-016
  greek: η εφαρμογή
  english: mobile application / app / implementation
  notes: Feminine noun in -η (-εις). Means both software mobile app and practical
