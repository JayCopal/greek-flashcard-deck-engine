unit_id: unit-a2-11
lesson_id: lesson-01
title: 'Μάθημα 11: Πολιτισμός, ΜΜΕ & Ψηφιακή Ζωή (Culture, Media & Digital Life)'
description: Engaging with Greek cinema, theater, news, digital platforms, and internet
  communication, using neuter third-declension nouns in -ος / -ους (το λάθος, το μέρος,
  το κόστος) and relative pronouns (που, ο οποίος).
lesson_status: not_started
lesson_notes: "Unit A2-11 Core Notes: Πολιτισμός & Ψηφιακή Ζωή (Culture & Digital\
  \ Media)\n• Cultural Events & Media:\n  - θέατρο (theater), παράσταση (performance),\
  \ εισιτήρια (tickets), συναυλία (concert), έκθεση (exhibition).\n  - διαδίκτυο (internet),\
  \ εφαρμογή (app), κοινωνικά δίκτυα (social media), μήνυμα (message).\n• Neuter Nouns\
  \ in -ος / -ους:\n  - το λάθος / τα λάθη (mistake), το μέρος / τα μέρη (place),\
  \ το κόστος (cost), το κράτος (state)."
entries:
- id: A2-U11-001
  greek: ο πολιτισμός
  english: culture / civilization
  notes: Masculine noun in -ός (-οί). Covers arts, cultural heritage, and historical
    civilization.
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι πολιτισμοί
    adjective: πολιτιστικός, -ή, -ό
    collocation: υπουργείο πολιτισμού (ministry of culture)
  keg_communicative_function: Discussing cultural events, festivals, and Greek heritage
    in Reading Part 2
  example_el: Η Ελλάδα έχει πλούσιο πολιτισμό και μακραίωνη ιστορία που προσελκύει
    εκατομμύρια επισκέπτες.
  example_en: Greece has a rich culture and long history that attracts millions of
    visitors.
  example2_el: Ο δήμος διοργανώνει πολιτιστικές εκδηλώσεις για μικρούς και μεγάλους.
  example2_en: The municipality organizes cultural events for young and old.
  audio: o-politismos-8c146f.mp3
  status: verified
  example_audio: i-ellada-echei-ploys-45ab90.mp3
  example2_audio: o-dimos-diorganonei--44e7ea.mp3
- id: A2-U11-002
  greek: η τέχνη
  english: art
  notes: Feminine noun in -η (-ες). Covers fine arts, painting, music, and theater.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι τέχνες
    adjective: καλλιτεχνικός, -ή, -ό
    collocation: έργο τέχνης (work of art)
  keg_communicative_function: Appreciating exhibitions and discussing creative hobbies
  example_el: Η μοντέρνα τέχνη εκφράζει τις αγωνίες και τις ιδέες της σύγχρονης κοινωνίας.
  example_en: Modern art expresses the anxieties and ideas of contemporary society.
  example2_el: Στην πινακοθήκη εκτίθενται αριστουργήματα της νεοελληνικής τέχνης.
  example2_en: Masterpieces of modern Greek art are exhibited in the art gallery.
  audio: i-techni-1fcc6b.mp3
  status: verified
  example_audio: i-monterna-techni-ek-0a708d.mp3
  example2_audio: stin-pinakothiki-ekt-4b5bcb.mp3
- id: A2-U11-003
  greek: η παράσταση
  english: performance / theatrical show
  notes: Feminine noun in -η (-εις). Relates to theater, dance, or musical concerts.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι παραστάσεις
    genitive_singular: της παράστασης
    collocation: θεατρική παράσταση
  keg_communicative_function: Booking tickets and reviewing theater performances in
    personal letters
  example_el: Η θεατρική παράσταση ξεκινάει ακριβώς στις εννιά το βράδυ.
  example_en: The theatrical performance begins at exactly nine in the evening.
  example2_el: Παρακολουθήσαμε μια εξαιρετική αρχαία τραγωδία στην Επίδαυρο.
  example2_en: We attended an extraordinary ancient tragedy at Epidaurus.
  audio: i-parastasi-272af3.mp3
  status: verified
  example_audio: i-theatriki-parastas-e2f5f8.mp3
  example2_audio: parakoloythisame-mia-b1872f.mp3
- id: A2-U11-004
  greek: η συναυλία
  english: concert / live music show
  notes: Feminine noun in -α (-ες). Key cultural pastime in Greek summer open-air
    theaters.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι συναυλίες
    collocation: εισιτήριο συναυλίας
  keg_communicative_function: Inviting friends to concerts and arranging meeting points
  example_el: Θέλεις να πάμε μαζί στη συναυλία του αγαπημένου μας συγκροτήματος;
  example_en: Do you want us to go together to the concert of our favorite band?
  example2_el: Η συναυλία δόθηκε στο Ηρώδειο κάτω από τη φωτισμένη Ακρόπολη.
  example2_en: The concert took place at the Odeon of Herodes Atticus beneath the
    illuminated Acropolis.
  audio: i-synaylia-69d5fb.mp3
  status: verified
  example_audio: theleis-na-pame-mazi-983b6d.mp3
  example2_audio: i-synaylia-dothike-s-b959b4.mp3
- id: A2-U11-005
  greek: η ταινία
  english: movie / film
  notes: Feminine noun in -α (-ες). Collocates with 'βλέπω ταινία' and film genres
    ('κωμωδία, δράμα').
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι ταινίες
    collocation: ελληνική ταινία, θερινός κινηματογράφος
  keg_communicative_function: Expressing film preferences and recommending movies
    in candidate dialogues
  example_el: Είδαμε μια πολύ συγκινητική ταινία στον θερινό κινηματογράφο της γειτονιάς.
  example_en: We saw a very moving movie at the neighborhood's open-air cinema.
  example2_el: Η νέα ταινία του σκηνοθέτη κέρδισε το πρώτο βραβείο στο φεστιβάλ.
  example2_en: The director's new movie won first prize at the festival.
  audio: i-tainia-ee4cf1.mp3
  status: verified
  example_audio: eidame-mia-poly-sygk-f0f2d9.mp3
  example2_audio: i-nea-tainia-toy-ski-edba1b.mp3
- id: A2-U11-006
  greek: ο ηθοποιός
  english: actor / actress
  notes: 'Masculine / feminine noun (ο/η ηθοποιός). Compound: ήθος (character) + ποιώ
    (to create).'
