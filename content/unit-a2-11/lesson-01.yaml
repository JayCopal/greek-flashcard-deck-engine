- id: A2-U11-018
  greek: ο χρήστης
  english: user (computer / internet / transport)
  notes: Masculine noun in -ης (-ες). Relates to 'χρησιμοποιώ' (to use).
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι χρήστες
    feminine: η χρήστης / χρήστρια
    collocation: όνομα χρήστη (username)
  keg_communicative_function: Logging into digital portals and handling authentication
    details
  example_el: Πληκτρολογήστε το όνομα χρήστη και τον κωδικό πρόσβασης για να συνδεθείτε.
  example_en: Type your username and password to log in.
  example2_el: Η πλατφόρμα έχει πάνω από ένα εκατομμύριο ενεργούς χρήστες.
  example2_en: The platform has over one million active users.
  audio: o-christis-e08021.mp3
  status: verified
  example_audio: pliktrologiste-to-on-8cdc1c.mp3
  example2_audio: i-platforma-echei-pa-3c43b8.mp3
- id: A2-U11-019
  greek: το λάθος
  english: mistake / error
  notes: 'Neuter noun in -ος (-η). Genitive singular: ''του λάθους'', plural: ''τα
    λάθη'', genitive plural: ''των λαθών''. Core A2 grammar milestone.'
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα λάθη
    genitive_singular: του λάθους
    genitive_plural: των λαθών
    collocation: κάνω λάθος (to make a mistake)
  keg_communicative_function: Recognizing and correcting language errors; apologising
    for misunderstandings
  example_el: Μη φοβάστε να κάνετε λάθη όταν μιλάτε, από τα λάθη μαθαίνουμε.
  example_en: Do not be afraid to make mistakes when you speak; from mistakes we learn.
  example2_el: Διόρθωσε όλα τα ορθογραφικά λάθη πριν παραδώσει το γραπτό του.
  example2_en: He corrected all spelling mistakes before submitting his paper.
  audio: to-lathos-e42483.mp3
  status: verified
  example_audio: mi-fovaste-na-kanete-16fb9a.mp3
  example2_audio: diorthose-ola-ta-ort-95f0a3.mp3
- id: A2-U11-020
  greek: το μέρος
  english: place / part
  notes: 'Neuter noun in -ος (-η). Genitive: ''του μέρους'', plural: ''τα μέρη''.
    ''Από το ένα μέρος... από το άλλο μέρος'' (on one part... on the other).'
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα μέρη
    genitive_singular: του μέρους
    genitive_plural: των μερών
  keg_communicative_function: Describing geographical locations and structural parts
    of an exam
  example_el: 'Η εξέταση χωρίζεται σε τέσσερα ισότιμα μέρη: κατανόηση και παραγωγή
    λόγου.'
