unit_id: unit-00
lesson_id: lesson-01
title: 'Μάθημα 0: Οδηγίες Εξετάσεων & Ασκήσεων (Lesson 0: Exam Instructions & Rubrics)'
description: Essential exam instructions, rubric imperatives, question formats (true/false,
  multiple choice, matching), and test terminology for Greek citizenship & CEFR exams
  (ΠΕΓΠ & ΚΕΓ) and Klik textbooks.
lesson_status: not_started
lesson_notes: "Unit 0 Core Notes: Γλώσσα Εξετάσεων & Βιβλίου (Exam Rubrics & Textbook\
  \ Instructions)\n\n• The Polite Imperative in Instructions (Πληθυντικός Ευγενείας):\n\
  \  In Modern Greek textbooks (like 'Κλικ στα Ελληνικά') and official certification\
  \ exams\n  (ΠΕΓΠ Citizenship & ΚΕΓ Ellinomatheia), rubrics are consistently written\
  \ in the polite 2nd-person plural (-τε / -στε):\n  - διαβάστε (read!)\n  - γράψτε\
  \ (write!)\n  - ακούστε (listen!)\n  - κοιτάξτε / δείτε (look!)\n  - αντιστοιχίστε\
  \ (match!)\n  - συμπληρώστε (fill in!)\n  - επιλέξτε / διαλέξτε (choose!)\n  - κυκλώστε\
  \ (circle!)\n  - υπογραμμίστε (underline!)\n  - σημειώστε (mark / tick!)\n  - απαντήστε\
  \ (answer!)\n\n• The Standard 4 Skills of Language & Citizenship Exams:\n  1. Κατανόηση\
  \ Γραπτού Λόγου (Reading Comprehension): short texts, public signs, advertisements,\
  \ emails.\n  2. Κατανόηση Προφορικού Λόγου (Listening Comprehension): announcements,\
  \ telephone dialogues, voicemail messages.\n  3. Παραγωγή Γραπτού Λόγου (Writing):\
  \ short personal notes, emails, invitation replies (usually 40-60 words at A1/A2).\n\
  \  4. Παραγωγή Προφορικού Λόγου (Speaking): self-introduction, describing picture\
  \ cards, interview with examiners.\n\n• Question Types & Symbols:\n  - Σωστό ή Λάθος:\
  \ Mark 'Σ' for True (Σωστό) and 'Λ' for False (Λάθος).\n  - Πολλαπλή Επιλογή (Multiple\
  \ Choice): typically 3 or 4 options (α, β, γ, δ).\n  - Συμπλήρωση Κενών: Gap fill\
  \ where one word per numbered blank is required.\n  - Αντιστοίχιση: Matching Column\
  \ A (Στήλη Α) with Column B (Στήλη Β).\n\n• Exam Caution — Watch Out for Negative\
  \ Instructions:\n  - 'Ποιο ΔΕΝ είναι σωστό;' (Which one is NOT correct?)\n  - 'Διαγράψτε\
  \ τη λάθος λέξη' (Cross out the wrong word / odd-one-out)."
