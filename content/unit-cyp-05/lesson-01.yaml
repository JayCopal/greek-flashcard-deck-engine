unit_id: unit-cyp-05
lesson_id: lesson-01
title: 'Μάθημα 5: Οικονομία, Εργασία, Υγεία & Καθημερινότητα (Economy, Labor, Healthcare
  & Daily Life)'
description: Official currency (Euro adoption 2008), economic sectors (services, shipping,
  tourism, EEZ & Aphrodite gas field), VAT rates (19% / 0%), GeSY healthcare, minimum
  wage, left-hand driving, legal airports & ports, emergency numbers (112/199), and
  public holidays.
lesson_status: not_started
lesson_notes: "Unit CYP-05 Core Exam Notes: Οικονομία, Εργασία, Υγεία & Καθημερινότητα\
  \ (Economy, Labor, Healthcare & Daily Life)\n\n• Νόμισμα & Οικονομία της Κύπρου:\n\
  \  - Επίσημο Νόμισμα: Το Ευρώ (€), το οποίο υιοθετήθηκε την 1η Ιανουαρίου 2008,\
  \ αντικαθιστώντας την Κυπριακή Λίρα (1 Ευρώ = 0,585274 Λίρες Κύπρου).\n  - Κύριος\
  \ Τομέας της Οικονομίας: Ο τριτογενής τομέας των υπηρεσιών (Τουρισμός, Ναυτιλία,\
  \ Χρηματοοικονομικές & Επαγγελματικές Υπηρεσίες, Πληροφορική).\n  - Εμπορική Ναυτιλία:\
  \ Η Κύπρος διαθέτει έναν από τους μεγαλύτερους εμπορικούς στόλους στην Ευρωπαϊκή\
  \ Ένωση και παγκοσμίως (με έδρα το Υφυπουργείο Ναυτιλίας στη Λεμεσό).\n  - Ενέργεια\
  \ & ΑΟΖ: Αποκλειστική Οικονομική Ζώνη (ΑΟΖ) της Κύπρου — κοιτάσματα φυσικού αερίου\
  \ («Αφροδίτη», «Καλυψώ», «Γλαύκος», «Κρόνος»).\n  - ΦΠΑ (Φόρος Προστιθέμενης Αξίας):\
  \ Κανονικός συντελεστής 19%, μειωμένοι συντελεστές 9% και 5%, και 0% σε βασικά είδη\
  \ πρώτης ανάγκης (π.χ. γάλα, ψωμί, αυγά).\n\n• Υγεία, Κοινωνικές Ασφαλίσεις & Εργασία:\n\
  \  - ΓεΣΥ (Γενικό Σύστημα Υγείας): Καθολικό σύστημα υγείας που εφαρμόστηκε το 2019–2020\
  \ μέσω του Οργανισμού Ασφάλισης Υγείας (ΟΑΥ), με θεσμό τον Προσωπικό Ιατρό.\n  -\
  \ Εθνικός Κατώτατος Μισθός: Θεσπίστηκε το 2023 (και αναπροσαρμόστηκε στα 1.000 ευρώ\
  \ ακαθάριστα μετά από 6 μήνες εργασίας στον ίδιο εργοδότη).\n\n• Μεταφορές, Σημεία\
  \ Εισόδου & Καθημερινότητα:\n  - Οδήγηση: Στην αριστερή πλευρά του δρόμου (left-hand\
  \ traffic). Δεν υπάρχει σιδηροδρομικό δίκτυο (τρένο).\n  - Νόμιμα Σημεία Εισόδου:\
  \ Διεθνή Αεροδρόμια Λάρνακας και Πάφου· Λιμάνια Λεμεσού, Λάρνακας, Πάφου και Λατσιού.\
  \ (Το αεροδρόμιο της Τύμπου/Ercan και τα λιμάνια Αμμοχώστου/Κερύνειας στα κατεχόμενα\
  \ είναι παράνομα σημεία εισόδου).\n  - Αριθμοί Έκτακτης Ανάγκης: 112 και 199 (Αστυνομία,\
  \ Πυροσβεστική, Ασθενοφόρο). Διεθνής κωδικός κλήσης: +357."
entries:
- id: CYP-U05-001
  greek: — Ποιο είναι το επίσημο νόμισμα της Κυπριακής Δημοκρατίας και πότε υιοθετήθηκε;
    — Το Ευρώ, την 1η Ιανουαρίου 2008.
  phonetic_hint: pyoh EE-neh toh eh-PEE-see-moh NOH-meez-mah tees kee-pree-ah-KEES
    theem-oh-krah-TEE-ahs? toh ev-ROH, teen PROH-tee ee-ah-noo-ah-REE-oo 2008
  english: — What is the official currency of the Republic of Cyprus and when was
    it adopted? — The Euro, on 1 January 2008.
  notes: High-frequency past exam question! Cyprus joined the EU in 2004 and adopted
    the Euro in the Eurozone on 1 January 2008, replacing the Cyprus Pound (η κυπριακή
    λίρα).
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Official currency and Eurozone entry
  example_el: Την 1η Ιανουαρίου 2008 η Κύπρος εντάχθηκε στην Ευρωζώνη και αντικατέστησε
    την κυπριακή λίρα με το ευρώ.
  example_en: On 1 January 2008, Cyprus joined the Eurozone and replaced the Cyprus
    pound with the euro.
  example2_el: Στα κυπριακά κέρματα του ευρώ απεικονίζονται το αγρινό, το καράβι της
    Κερύνειας και το ειδώλιο του Πωμού.
  example2_en: Depicted on the Cypriot euro coins are the mouflon, the Kyrenia ship,
    and the idol of Pomos.
  audio: null
  status: pending_tts
- id: CYP-U05-002
  greek: ο τομέας των υπηρεσιών (ο τριτογενής τομέας)
  phonetic_hint: oh toh-MEH-ahs ton ee-pee-reh-see-ON (oh tree-toh-yeh-NEES toh-MEH-ahs)
  english: the services sector (the tertiary sector)
  notes: Past exam question! The services sector (tourism, shipping, financial/legal
    services, ICT) is the largest contributor to Cyprus's GDP (over 80% of GDP).
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι τομείς των υπηρεσιών
    accusative_singular: τον τομέα των υπηρεσιών
  keg_communicative_function: Economy — Main economic sectors
  example_el: Ποιος είναι ο σημαντικότερος τομέας της κυπριακής οικονομίας; Ο τομέας
    των υπηρεσιών (τουρισμός, ναυτιλία, χρηματοοικονομικά).
  example_en: Which is the most important sector of the Cypriot economy? The services
    sector (tourism, shipping, financial services).
  example2_el: Ο τριτογενής τομέας των υπηρεσιών συνεισφέρει πάνω από το 80% στο Ακαθάριστο
    Εγχώριο Προϊόν (ΑΕΠ) της Κύπρου.
  example2_en: The tertiary services sector contributes over 80% to the Gross Domestic
    Product (GDP) of Cyprus.
  audio: null
  status: pending_tts
- id: CYP-U05-003
  greek: η εμπορική ναυτιλία της Κύπρου
  phonetic_hint: ee ehm-boh-ree-KEE nahf-tee-LEE-ah tees KEE-proo
  english: the merchant shipping of Cyprus
  notes: Cyprus has one of the largest merchant shipping registries in the EU (top
    3 in EU, top 11 worldwide) and is the largest third-party ship management center
    in Europe, centered in Limassol.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: την εμπορική ναυτιλία
  keg_communicative_function: Economy — Shipping & maritime cluster
  example_el: Η Κύπρος διαθέτει έναν από τους μεγαλύτερους εμπορικούς στόλους στην
    Ευρωπαϊκή Ένωση και στον κόσμο.
  example_en: Cyprus possesses one of the largest merchant fleets in the European
    Union and in the world.
  example2_el: Το Υφυπουργείο Ναυτιλίας της Κυπριακής Δημοκρατίας έχει την έδρα του
    στη Λεμεσό.
  example2_en: The Shipping Deputy Ministry of the Republic of Cyprus is headquartered
    in Limassol.
  audio: null
  status: pending_tts
- id: CYP-U05-004
  greek: η Αποκλειστική Οικονομική Ζώνη (ΑΟΖ) και οι υδρογονάνθρακες
  phonetic_hint: ee ah-poh-klee-stee-KEE ee-koh-noh-mee-KEE ZOH-nee (ah-oh-ZEH) keh
    ee ee-throh-ghoh-NAHN-thrah-kehs
  english: the Exclusive Economic Zone (EEZ) and hydrocarbons
  notes: Past exam question! Cyprus has signed EEZ delimitation agreements with Egypt
    (2003), Lebanon (2007), and Israel (2010). The first natural gas discovery in
    Block 12 in 2011 was named «Αφροδίτη» (Aphrodite).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι Αποκλειστικές Οικονομικές Ζώνες
    accusative_singular: την Αποκλειστική Οικονομική Ζώνη
  keg_communicative_function: Economy & Energy — EEZ and natural gas fields
  example_el: Το πρώτο κοίτασμα φυσικού αερίου που ανακαλύφθηκε το 2011 στην κυπριακή
    ΑΟΖ (Τεμάχιο 12) ονομάστηκε «Αφροδίτη».
  example_en: The first natural gas field discovered in 2011 in the Cypriot EEZ (Block
    12) was named 'Aphrodite'.
  example2_el: Η Υπηρεσία Υδρογονανθράκων υπάγεται στο Υπουργείο Ενέργειας, Εμπορίου
    και Βιομηχανίας.
  example2_en: The Hydrocarbons Service falls under the Ministry of Energy, Commerce
    and Industry.
  audio: null
  status: pending_tts
- id: CYP-U05-005
  greek: — Ποιος είναι ο κανονικός συντελεστής ΦΠΑ στην Κύπρο και ποιος ο συντελεστής
    σε βασικά είδη όπως το γάλα και το ψωμί; — 19% ο κανονικός και 0% (ή 5%) στα βασικά
    είδη.
  phonetic_hint: pyos EE-neh oh kah-noh-nee-KOHS seen-deh-leh-STEES fee-pee-AH steen
    KEE-proh? 19% oh kah-noh-nee-KOHS keh 0% stah vah-see-KAH EE-thee
  english: — What is the standard VAT rate in Cyprus and the rate on basic goods like
    milk and bread? — 19% standard rate and 0% (or 5%) on basic essentials.
  notes: Actual past exam question! Standard VAT (Φόρος Προστιθέμενης Αξίας - ΦΠΑ)
    in Cyprus is 19%, reduced rates are 9% and 5%, and 0% applies to core necessities
    such as fresh milk, bread, and eggs.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — VAT rates in Cyprus
  example_el: Ο κανονικός συντελεστής Φόρου Προστιθέμενης Αξίας (ΦΠΑ) στην Κύπρο ανέρχεται
    στο 19%.
  example_en: The standard Value Added Tax (VAT) rate in Cyprus stands at 19%.
  example2_el: Σε βασικά αγαθά πρώτης ανάγκης, όπως το γάλα, το ψωμί και τα αυγά,
    εφαρμόζεται μηδενικός συντελεστής ΦΠΑ (0%).
  example2_en: On basic essential goods, such as milk, bread, and eggs, a zero VAT
    rate (0%) applies.
  audio: null
  status: pending_tts
- id: CYP-U05-006
  greek: το Γενικό Σύστημα Υγείας (ΓεΣΥ)
  phonetic_hint: toh yeh-nee-KOH SEE-stee-mah ee-YEE-ahs (yeh-SEE)
  english: the General Healthcare System (GHS / GeSY)
  notes: Universal healthcare system of Cyprus, rolled out in June 2019 (outpatient
    care) and June 2020 (inpatient hospital care), administered by the Health Insurance
    Organisation (Οργανισμός Ασφάλισης Υγείας - ΟΑΥ).
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    accusative_singular: το Γενικό Σύστημα Υγείας
  keg_communicative_function: Healthcare & Daily Life — Universal health coverage
  example_el: Το Γενικό Σύστημα Υγείας (ΓεΣΥ) παρέχει καθολική ιατροφαρμακευτική περίθαλψη
    στους δικαιούχους κατοίκους της Κύπρου.
  example_en: The General Healthcare System (GeSY) provides universal medical and
    pharmaceutical care to eligible residents of Cyprus.
  example2_el: Κάθε δικαιούχος του ΓεΣΥ εγγράφεται σε έναν Προσωπικό Ιατρό, ο οποίος
    εκδίδει παραπεμπτικά για ειδικούς γιατρούς.
  example2_en: Every GeSY beneficiary registers with a Personal Doctor, who issues
    referrals to specialist doctors.
  audio: null
  status: pending_tts
- id: CYP-U05-007
  greek: ο Εθνικός Κατώτατος Μισθός
  phonetic_hint: oh eth-nee-KOHS kah-TOH-tah-tos mee-STHOHS
  english: the National Minimum Wage
  notes: Past exam question! Introduced across Cyprus on 1 January 2023 (and updated
    in 2024 to €1,000 gross per month after 6 months of continuous employment, or
    €900 during the first 6 months).
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι Εθνικοί Κατώτατοι Μισθοί
    accusative_singular: τον Εθνικό Κατώτατο Μισθό
  keg_communicative_function: Economy & Labor — Minimum wage regulations
  example_el: Ο Εθνικός Κατώτατος Μισθός στην Κύπρο ανέρχεται στα 1.000 ευρώ ακαθάριστα
    μετά από έξι μήνες απασχόλησης.
  example_en: The National Minimum Wage in Cyprus amounts to 1,000 euros gross after
    six months of employment.
  example2_el: Για τους πρώτους έξι μήνες απασχόλησης, ο κατώτατος μισθός πλήρους
    απασχόλησης καθορίστηκε στα 900 ευρώ.
  example2_en: For the first six months of employment, the full-time minimum wage
    is set at 900 euros.
  audio: null
  status: pending_tts
- id: CYP-U05-008
  greek: οι Κοινωνικές Ασφαλίσεις (ΥΚΑ)
  phonetic_hint: ee kee-noh-nee-KEHS ah-sfah-LEE-sees (EE-KAH)
  english: Social Insurance (Social Insurance Services)
  notes: Compulsory social insurance scheme managed by the Ministry of Labour and
    Social Insurance (Υπουργείο Εργασίας και Κοινωνικών Ασφαλίσεων), covering pensions,
    maternity, sickness, and unemployment benefits.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι Κοινωνικές Ασφαλίσεις
    accusative_plural: τις Κοινωνικές Ασφαλίσεις
  keg_communicative_function: Economy & Labor — Social security system
  example_el: Κάθε εργαζόμενος στην Κύπρο είναι υποχρεωτικά ασφαλισμένος στο Ταμείο
    Κοινωνικών Ασφαλίσεων.
  example_en: Every employee in Cyprus is compulsorily insured in the Social Insurance
    Fund.
  example2_el: Οι Υπηρεσίες Κοινωνικών Ασφαλίσεων καταβάλλουν συντάξεις, επίδομα μητρότητας,
    ασθενείας και ανεργίας.
  example2_en: The Social Insurance Services pay pensions, maternity allowance, sickness
    benefit, and unemployment benefit.
  audio: null
  status: pending_tts
- id: CYP-U05-009
  greek: — Σε ποια πλευρά του δρόμου οδηγούν τα οχήματα στην Κύπρο; — Στην αριστερή
    πλευρά.
  phonetic_hint: seh pyah plef-RAH too THROH-moo oh-thee-GHOON tah oh-KHEE-mah-tah
    steen KEE-proh? steen ah-ree-steh-REE plef-RAH
  english: — On which side of the road do vehicles drive in Cyprus? — On the left
    side.
  notes: Past exam question on daily life & transport! Inherited from the British
    colonial period (1878–1960), traffic in Cyprus drives on the left side of the
    road, with the steering wheel on the right.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Road traffic rules in Cyprus
  example_el: Στην Κύπρο η οδήγηση γίνεται στην αριστερή λωρίδα του δρόμου και το
    τιμόνι βρίσκεται στα δεξιά.
  example_en: In Cyprus, driving is in the left lane of the road and the steering
    wheel is on the right.
  example2_el: Το ανώτατο όριο ταχύτητας στους αυτοκινητόδρομους της Κύπρου είναι
    τα 100 χιλιόμετρα την ώρα.
  example2_en: The maximum speed limit on the motorways of Cyprus is 100 kilometers
    per hour.
  audio: null
  status: pending_tts
- id: CYP-U05-010
  greek: — Ποια είναι τα δύο νόμιμα διεθνή αεροδρόμια της Κυπριακής Δημοκρατίας; —
    Το Διεθνές Αεροδρόμιο Λάρνακας και το Διεθνές Αεροδρόμιο Πάφου.
  phonetic_hint: pyah EE-neh tah THEE-oh NOH-mee-mah theeh-THNEE ah-eh-roh-THROH-mee-ah
    tees kee-pree-ah-KEES theem-oh-krah-TEE-ahs? lah-RNAH-kahs keh PAH-foo
  english: — Which are the two legal international airports of the Republic of Cyprus?
    — Larnaca International Airport and Paphos International Airport.
  notes: Frequent past exam question! Larnaca (LCA) and Paphos (PFO) are the ONLY
    legal international airports. The Tymbou (Ercan) airport in the occupied north
    is an illegal port of entry.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Legal vs. illegal ports of entry
  example_el: Τα μόνα νόμιμα αεροδρόμια εισόδου στην Κυπριακή Δημοκρατία είναι της
    Λάρνακας και της Πάφου.
  example_en: The only legal airports of entry into the Republic of Cyprus are those
    of Larnaca and Paphos.
  example2_el: Το αεροδρόμιο της Τύμπου (Ercan) καθώς και τα λιμάνια της Κερύνειας
    και της Αμμοχώστου στα κατεχόμενα είναι παράνομα σημεία εισόδου.
  example2_en: Tymbou (Ercan) airport as well as the ports of Kyrenia and Famagusta
    in the occupied areas are illegal points of entry.
  audio: null
  status: pending_tts
- id: CYP-U05-011
  greek: τα μέσα μαζικής μεταφοράς στην Κύπρο (τα λεωφορεία)
  phonetic_hint: tah MEH-sah mah-zee-KEES meh-tah-foh-RAHS steen KEE-proh (tah leh-oh-foh-REE-ah)
  english: public transport in Cyprus (buses)
  notes: Past exam question! Cyprus has NO operating railway, metro, or tram system
    (the old Cyprus Government Railway closed in 1951). Public transport consists
    exclusively of buses (urban buses & InterCity buses) and taxis.
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα μέσα μαζικής μεταφοράς
    accusative_plural: τα μέσα μαζικής μεταφοράς
  keg_communicative_function: Daily Life & Transport — Public transport modes
  example_el: Στην Κύπρο δεν υπάρχει σιδηροδρομικό δίκτυο (τρένο) ή μετρό· οι δημόσιες
    μεταφορές εξυπηρετούνται αποκλειστικά από λεωφορεία και ταξί.
  example_en: In Cyprus there is no railway network (train) or metro; public transport
    is served exclusively by buses and taxis.
  example2_el: Τα πράσινα υπεραστικά λεωφορεία (InterCity Buses) συνδέουν καθημερινά
    όλες τις ελεύθερες πόλεις της Κύπρου.
  example2_en: The green InterCity buses connect all the free cities of Cyprus on
    a daily basis.
  audio: null
  status: pending_tts
- id: CYP-U05-012
  greek: — Ποιοι είναι οι τηλεφωνικοί αριθμοί έκτακτης ανάγκης στην Κύπρο; — Το 112
    και το 199.
  phonetic_hint: pyee EE-neh ee tee-leh-foh-nee-KEE ah-reeth-MEE EHK-tahk-tees ah-NAHN-gees
    steen KEE-proh? toh 112 keh toh 199
  english: — What are the emergency telephone numbers in Cyprus? — 112 and 199.
  notes: Past exam question! Both 112 (European emergency number) and 199 (national
    Cyprus emergency number) connect free of charge 24/7 to Police, Fire Service,
    and Ambulance.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Emergency numbers in Cyprus
  example_el: Σε περίπτωση έκτακτης ανάγκης στην Κύπρο, οι πολίτες καλούν δωρεάν το
    112 ή το 199.
  example_en: In case of an emergency in Cyprus, citizens call 112 or 199 free of
    charge.
  example2_el: Για δασικές πυρκαγιές λειτουργεί επίσης η ειδική γραμμή 1407 του Τμήματος
    Δασών.
  example2_en: For forest fires, the special hotline 1407 of the Department of Forests
    also operates.
  audio: null
  status: pending_tts
- id: CYP-U05-013
  greek: — Ποιος είναι ο διεθνής τηλεφωνικός κωδικός κλήσης της Κύπρου; — Το +357
    (00357).
  phonetic_hint: pyos EE-neh oh theeh-THNEES tee-leh-foh-nee-KOHS koh-thee-KOHS KLEE-sees
    tees KEE-proo? toh +357
  english: — What is the international telephone dialing code of Cyprus? — +357 (00357).
  notes: Past exam question on telecommunications! Landline numbers in Cyprus have
    8 digits starting with 22 (Nicosia), 25 (Limassol), 24 (Larnaca), 26 (Paphos),
    and 23 (Famagusta); mobile numbers start with 9.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Telecommunications & dialing codes
  example_el: Ο διεθνής τηλεφωνικός κωδικός της Κυπριακής Δημοκρατίας είναι το +357.
  example_en: The international telephone code of the Republic of Cyprus is +357.
  example2_el: Τα σταθερά τηλέφωνα στη Λευκωσία ξεκινούν από 22, στη Λεμεσό από 25,
    στη Λάρνακα από 24, στην Πάφο από 26 και στην Αμμόχωστο από 23.
  example2_en: Landline phones in Nicosia start with 22, in Limassol with 25, in Larnaca
    with 24, in Paphos with 26, and in Famagusta with 23.
  audio: null
  status: pending_tts
- id: CYP-U05-014
  greek: τα Κέντρα Εξυπηρέτησης του Πολίτη (ΚΕΠ)
  phonetic_hint: tah KEHN-drah ehk-see-pee-REH-tee-sees too poh-LEE-tee (KEHP)
  english: the Citizen Service Centers (KEP)
  notes: One-stop government service centers operating across all districts where
    residents obtain ID cards, passports, driving licenses, certificates, and GeSY/Social
    Insurance services.
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    singular: το Κέντρο Εξυπηρέτησης του Πολίτη
    plural: τα Κέντρα Εξυπηρέτησης του Πολίτη
    accusative_plural: τα Κέντρα Εξυπηρέτησης του Πολίτη
  keg_communicative_function: Daily Life & Administration — Public services
