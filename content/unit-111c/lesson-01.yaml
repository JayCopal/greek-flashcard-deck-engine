  notes: Review Unit 111. Locating neighborhood cash dispensers.
  gender_or_pos: phrase
  audio: poy-echei-ena-atm-ed-2901a2.mp3
  status: verified
  example_el: — Μπορώ να κάνω ανάληψη; — Ναι, μπορείτε να κάνετε ανάληψη μετρητών.
  example_en: — Can I make a withdrawal? — Yes, you can make a cash withdrawal.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about nearby ATM locations and card network
    compatibility
- id: A1-U111C-015
  greek: — Μπορώ να πληρώσω με πιστωτική κάρτα; — Βεβαίως, μπορείτε να πληρώσετε με
    κάρτα ή με μετρητά.
  phonetic_hint: — Boh-ROH nah plee-ROH-soh meh pees-toh-tee-KEE KAHR-tah? — Veh-VEH-ohs,
