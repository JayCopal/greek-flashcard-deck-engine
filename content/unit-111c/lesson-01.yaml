  notes: Review Unit 111. Digital receipts via electronic mail ('ηλεκτρονικό μήνυμα').
  gender_or_pos: phrase
  audio: mas-esteilan-tin-apo-eec1af.mp3
  status: verified
  example_el: — Είναι εντάξει η απόδειξη; — Ναι, έχει ημερομηνία και το ποσό της πληρωμής.
  example_en: — Is the receipt fine? — Yes, it has the date and payment amount.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Confirming receipt of electronic transaction confirmations
- id: A1-U111C-019
  greek: — Γεια σας, θέλω να στείλω αυτό το γράμμα στην Ισπανία. — Θέλετε να το στείλετε
    απλό ή συστημένο;
  phonetic_hint: — YAH sahs, THEH-loh nah STEE-loh ahf-TOH toh GHAH-mah steen Ees-pah-NEE-ah.
    — THEH-leh-teh nah toh STEE-leh-teh ah-PLOH ee see-stee-MEH-noh?
  english: — Hello, I want to send this letter to Spain. — Do you want to send it
