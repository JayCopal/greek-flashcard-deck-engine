  notes: 'Review Unit 111. Post office inquiry: regular vs registered mail (''συστημένο'').'
  gender_or_pos: phrase
  audio: geia-sas-thelo-na-st-52faca.mp3
  status: verified
  example_el: — Ποιο είναι καλύτερο; — Το συστημένο είναι καλύτερο για μια επίσημη
    επιστολή.
  example_en: — Which is better? — Registered is better for an official letter.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Mailing an international letter and choosing regular
    vs registered delivery
- id: A1-U111C-020
  greek: — Πόσο κοστίζει για να πάει επείγον με ταχυμεταφορά; — Κοστίζει δώδεκα ευρώ
    και φτάνει σε δύο μέρες.
  phonetic_hint: — POH-soh koh-STEE-zee yah nah PAH-ee eh-PEE-ghon meh tah-khee-meh-tah-foh-RAH?
    — Koh-STEE-zee THOH-theh-kah ev-ROH keh FTAH-nee seh THEE-oh MEH-res.
  english: — How much does it cost to send express by courier? — It costs twelve euros
    and arrives in two days.
  notes: Review Unit 111. Express courier shipping rates ('ταχυμεταφορά').
  gender_or_pos: phrase
  audio: poso-kostizei-gia-na-73334c.mp3
  status: verified
  example_el: — Σε πόσες μέρες θα φτάσει η επιστολή στον προορισμό της; — Θα φτάσει
    σε δύο μέρες το πρωί.
  example_en: — In how many days will the letter reach its destination? — It will
    arrive in two days in the morning.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring delivery speed and express postage rates
- id: A1-U111C-021
  greek: — Πού βάζω το γραμματόσημο; — Κολλήστε αυτό το γραμματόσημο επάνω δεξιά στον
