  example_en: — Where do I put the card? — Put your card here into the machine.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about credit card acceptance and contactless
    payment
- id: A1-U111C-016
  greek: — Σου στέλνω τον σύνδεσμο της ιστοσελίδας στο κινητό σου. — Ευχαριστώ, θα
    ανοίξω αμέσως να δω τον λογαριασμό.
  phonetic_hint: — Soo STEHL-noh ton SEEN-thez-moh tees ees-toh-seh-LEE-thahs stoh
