unit_id: unit-111c
lesson_id: lesson-01
title: 'Ενότητα 11: Διάλογοι & Εξετάσεις — Υπηρεσίες, Τράπεζα, Ταχυδρομείο & A1 Capstone
  (A1 Synthesis)'
description: Conversational, dialogue, and CEFR A1 capstone oral exam practice covering
  banking transactions, ATM usage, postal dispatch, utility bill payments, priority
  queues, indirect speech, and comprehensive A1 conversational synthesis using vocabulary
  from Lessons 100 to 111.
lesson_status: not_started
entries:
- id: A1-U111C-001
  greek: — Καλημέρα σας, πώς μπορώ να σας βοηθήσω; — Καλημέρα, θα ήθελα να ανοίξω
    έναν τραπεζικό λογαριασμό.
  phonetic_hint: — Kah-lee-MEH-rah sahs, pos boh-ROH nah sahs voh-ee-THEE-soh? — Kah-lee-MEH-rah,
    thah EE-theh-lah nah ah-NEEK-soh EH-nahn trah-peh-zee-KOH loh-ghah-ryah-ZMOH.
  english: — Good morning, how can I help you? — Good morning, I would like to open
    a bank account.
  notes: Review Unit 111. Initiating bank account opening with polite conditional
    'θα ήθελα'.
  gender_or_pos: phrase
  audio: kalimera-sas-pos-mpo-ac036b.mp3
  status: verified
  example_el: — Τι λογαριασμό θέλετε; — Θα ήθελα να ανοίξω έναν λογαριασμό ταμιευτηρίου.
  example_en: — What account do you want? — I would like to open a savings account.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Initiating a bank service request to open an account
- id: A1-U111C-002
  greek: — Τι έγγραφα χρειάζεται για το άνοιγμα λογαριασμού; — Χρειάζομαι την ταυτότητά
    σας και ένα αποδεικτικό του ΑΦΜ σας.
  phonetic_hint: — Tee EHG-ghrah-fah khree-AH-zeh-teh yah toh AH-neeg-mah loh-ghah-ryah-ZMOO?
    — Khree-AH-zoh-meh teen tahf-TOH-tee-TAH sahs keh EH-nah ah-poh-theek-tee-KOH
    too ah-fee-MEE sahs.
  english: — What documents are needed to open an account? — I need your ID card and
    proof of your tax number.
  notes: Review Unit 111. Inquiring required banking paperwork.
  gender_or_pos: phrase
  audio: ti-eggrafa-chreiazet-bba733.mp3
  status: verified
  example_el: — Έχετε διαβατήριο; — Ναι, ορίστε το διαβατήριο και το έντυπο με το
    ΑΦΜ μου.
  example_en: — Do you have a passport? — Yes, here is the passport and the form with
    my tax number.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about and presenting identity documents for
    bank procedures
- id: A1-U111C-003
  greek: — Πού πρέπει να υπογράψω; — Συμπληρώστε αυτή την αίτηση και υπογράψτε στο
    κάτω μέρος.
  phonetic_hint: — POO PREH-pee nah ee-poh-GHAHP-soh? — Seem-blee-ROH-steh ahf-TEEN
    teen EH-tee-see keh ee-poh-GHAHP-steh stoh KAH-toh MEH-ros.
  english: — Where must I sign? — Fill out this application and sign at the bottom.
  notes: Review Unit 111. Banking form completion commands.
  gender_or_pos: phrase
  audio: poy-prepei-na-ypogra-d4c093.mp3
  status: verified
  example_el: — Μου δίνετε το στιλό σας, παρακαλώ; — Βεβαίως, ορίστε το στιλό.
  example_en: — Could you lend me your pen, please? — Certainly, here is the pen.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Instructing signature placement and borrowing stationary
- id: A1-U111C-004
  greek: — Θέλετε να κάνετε κατάθεση ή ανάληψη; — Θέλω να κάνω μια κατάθεση τριακοσίων
    ευρώ στον λογαριασμό μου.
  phonetic_hint: — THEH-leh-teh nah KAH-neh-teh kah-TAH-theh-see ee ah-NAH-leep-see?
    — THEH-loh nah KAH-noh myah kah-TAH-theh-see tree-ah-koh-SEE-on ev-ROH ston loh-ghah-ryah-ZMOH
    moo.
  english: — Do you want to make a deposit or withdrawal? — I want to make a deposit
    of three hundred euros into my account.
  notes: Review Unit 111. Distinguishing 'κατάθεση' (deposit) from 'ανάληψη' (withdrawal).
  gender_or_pos: phrase
  audio: thelete-na-kanete-ka-c7ed0b.mp3
  status: verified
  example_el: — Έχετε το βιβλιάριο μαζί σας; — Ναι, ορίστε το βιβλιάριο και τα μετρητά.
  example_en: — Do you have the bankbook with you? — Yes, here is the bankbook and
    the cash.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Executing cash deposit transactions at the teller desk
- id: A1-U111C-005
  greek: — Πόσα χρήματα θέλετε να πάρετε; — Θέλω να κάνω μια ανάληψη εκατόν πενήντα
    ευρώ από το ταμείο.
  phonetic_hint: — POH-sah KHREE-mah-tah THEH-leh-teh nah PAH-reh-teh? — THEH-loh
    nah KAH-noh myah ah-NAH-leep-see eh-kah-TOHN pen-EEN-dah ev-ROH ah-POH toh tah-MEE-oh.
  english: — How much money do you want to take? — I want to make a withdrawal of
    one hundred fifty euros from the counter.
  notes: Review Unit 111. Specifying withdrawal amount at the counter.
  gender_or_pos: phrase
  audio: posa-chrimata-thelet-5afde0.mp3
  status: verified
  example_el: — Ορίστε τα μετρητά σας. — Ευχαριστώ πολύ, κρατήστε και την απόδειξη.
  example_en: — Here is your cash. — Thank you very much, keep the receipt too.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Specifying counter withdrawal amounts and collecting
    cash
- id: A1-U111C-006
  greek: — Ποιο είναι το διαθέσιμο υπόλοιπο του τραπεζικού λογαριασμού μου; — Το υπόλοιπο
    είναι πεντακόσια σαράντα ευρώ.
  phonetic_hint: — PEE-oh EE-neh toh thee-ah-THEH-see-moh ee-POH-lee-poh too trah-peh-zee-KOO
    loh-ghah-ryah-ZMOO moo? — Toh ee-POH-lee-poh EE-neh pen-dah-KOH-syah sah-RAHN-dah
    ev-ROH.
  english: — What is the available balance of my bank account? — The balance is five
    hundred forty euros.
  notes: Review Unit 111. Inquiring account balance ('διαθέσιμο υπόλοιπο').
  gender_or_pos: phrase
  audio: poio-einai-to-diathe-d8cc8a.mp3
  status: verified
  example_el: — Υπάρχει κάποια προμήθεια για τη συναλλαγή; — Όχι, δεν υπάρχει καμία
    προμήθεια.
  example_en: — Is there any commission fee for the transaction? — No, there is no
    fee.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about account balances and banking transaction
    fees
- id: A1-U111C-007
  greek: — Πότε θα πάρω τη χρεωστική κάρτα μου; — Ο τραπεζικός λογαριασμός σας θα
    είναι έτοιμος σε μία εβδομάδα.
  phonetic_hint: — POH-teh thah PAH-roh tee khreh-oh-stee-KEE KAHR-tah moo? — Oh trah-peh-zee-KOHS
    loh-ghah-ryah-ZMOHS sahs thah EE-neh EH-tee-mos seh MYAH ev-thoh-MAH-thah.
  english: — When will I get my debit card? — Your bank account will be ready in one
    week.
  notes: Review Unit 111. Card issuance timeline ('χρεωστική κάρτα').
  gender_or_pos: phrase
  audio: pote-tha-paro-ti-chr-fd6936.mp3
  status: verified
  example_el: — Θα μου στείλετε τον κωδικό PIN; — Ναι, ο κωδικός θα έρθει με μήνυμα
    στο κινητό σας.
  example_en: — Will you send me the PIN code? — Yes, the code will arrive by message
    on your mobile.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about debit card production and PIN dispatch
- id: A1-U111C-008
  greek: — Τι ώρα κλείνει η τράπεζα σήμερα; — Η τράπεζα είναι ανοιχτά μέχρι τις δύο
    και μισή το μεσημέρι.
  phonetic_hint: — Tee OH-rah KLEE-nee ee TRAH-peh-zah SEE-meh-rah? — Ee TRAH-peh-zah
    EE-neh ah-neekh-TAH MEKH-ree tees THEE-oh keh mee-SEE toh meh-see-MEH-ree.
  english: — What time does the bank close today? — The bank is open until two thirty
    in the afternoon.
  notes: Review Unit 111. Standard Greek bank operational schedule.
  gender_or_pos: phrase
  audio: ti-ora-kleinei-i-tra-d6107c.mp3
  status: verified
  example_el: — Είναι ανοιχτά το Σάββατο; — Όχι, το Σάββατο είναι κλειστό.
  example_en: — Is it open on Saturday? — No, on Saturday it is closed.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Checking commercial bank operating hours and weekend
    closures
- id: A1-U111C-009
  greek: — Σε ποιον δίνεις τα χρήματα για τον λογαριασμό; — Τα δίνω στον ταμία στο
    τρίτο γκισέ.
  phonetic_hint: — Seh PEE-on THEE-nees tah KHREE-mah-tah yah ton loh-ghah-ryah-ZMOH?
    — Tah THEE-noh ston tah-MEE-ah stoh TREE-toh ghee-SEH.
  english: — To whom are you giving the money for the bill? — I give it to the teller
    at the third counter.
  notes: Review Unit 111. Interrogative prepositional phrase 'σε ποιον'.
  gender_or_pos: phrase
  audio: se-poion-dineis-ta-c-cecebf.mp3
  status: verified
  example_el: — Πού είναι το ταμείο; — Το ταμείο είναι μπροστά σας.
  example_en: — Where is the cash counter? — The cash counter is in front of you.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Directing customers to specific bank teller windows
- id: A1-U111C-010
  greek: — Μπορώ να κάνω αίτηση για ένα μικρό δάνειο; — Βεβαίως, ο υπάλληλος στο γραφείο
    βοηθάει όλους τους πελάτες.
  phonetic_hint: — Boh-ROH nah KAH-noh EH-tee-see yah EH-nah mee-KROH THAH-nee-oh?
    — Veh-VEH-ohs, oh ee-PAH-lee-los stoh ghrah-FEE-oh voh-ee-THAH-ee OH-loos toos
    peh-LAH-tes.
  english: — Can I apply for a small loan? — Certainly, the clerk in the office helps
    all customers.
  notes: Review Unit 111. Inquiring about personal loan applications ('δάνειο').
  gender_or_pos: phrase
  audio: mporo-na-kano-aitisi-a9e690.mp3
  status: verified
  example_el: — Ποιο είναι το επιτόκιο; — Ο υπάλληλος σας δίνει όλες τις πληροφορίες.
  example_en: — What is the interest rate? — The clerk gives you all the information.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about loan terms and interest rate explanations
- id: A1-U111C-011
  greek: — Πώς βγάζω χρήματα από το ΑΤΜ; — Βάλτε την κάρτα σας στη σχισμή και πληκτρολογήστε
    το PIN σας.
  phonetic_hint: — Pos VHAH-zoh KHREE-mah-tah ah-POH toh ah-tee-EHM? — VHAL-teh teen
    KAHR-tah sahs steen skhees-MEE keh pleek-troh-loh-YEES-teh toh peen sahs.
  english: — How do I withdraw money from the ATM? — Insert your card into the slot
    and type in your PIN.
  notes: Review Unit 111. Step-by-step ATM withdrawal sequence.
  gender_or_pos: phrase
  audio: pos-vgazo-chrimata-a-d79856.mp3
  status: verified
  example_el: — Και μετά τι κάνω; — Επιλέξτε το ποσό που θέλετε στην οθόνη.
  example_en: — And what do I do after that? — Select the amount you want on the screen.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Guiding users through automated teller machine (ATM)
    operations
- id: A1-U111C-012
  greek: — Πήρες τα χρήματα από το μηχάνημα; — Ναι, πήρα τα μετρητά και την απόδειξη.
  phonetic_hint: — PEE-res tah KHREE-mah-tah ah-POH toh mee-KHAH-nee-mah? — Neh, PEE-rah
    tah meh-tree-TAH keh teen ah-POH-theek-see.
  english: — Did you take the money from the machine? — Yes, I took the cash and the
    receipt.
  notes: Review Unit 111. Completing ATM transaction.
  gender_or_pos: phrase
  audio: pires-ta-chrimata-ap-eb0d33.mp3
  status: verified
  example_el: — Μην ξεχάσετε την κάρτα σας! — Ευχαριστώ πάρα πολύ!
  example_en: — Don't forget your card! — Thank you very much!
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Collecting cash and reminders not to leave debit cards
    in the slot
- id: A1-U111C-013
  greek: — Γιατί δεν δουλεύει η κάρτα μου; — Μήπως ο κωδικός PIN ήταν λάθος τρεις
    φορές;
  phonetic_hint: — Yah-TEE then thoo-LEH-vee ee KAHR-tah moo? — MEE-pos oh koh-thee-KOHS
    peen EE-tahn LAH-thos trees foh-RES?
  english: — Why isn't my card working? — Was the PIN code perhaps wrong three times?
  notes: Review Unit 111. Card blockage warning upon 3 incorrect PIN entries.
  gender_or_pos: phrase
  audio: giati-den-doyleyei-i-50b34f.mp3
  status: verified
  example_el: — Είναι η κάρτα μέσα στο ΑΤΜ; — Ναι, πρέπει να πάω στην τράπεζα τη Δευτέρα.
  example_en: — Is the card inside the ATM? — Yes, I must go to the bank on Monday.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Troubleshooting ATM card retention and incorrect PIN
    lockouts
- id: A1-U111C-014
  greek: — Πού έχει ένα ΑΤΜ εδώ κοντά; — Υπάρχει ένα ΑΤΜ ακριβώς απέναντι από το φαρμακείο.
  phonetic_hint: — POO EH-khee EH-nah ah-tee-EHM eh-THOH kohn-DAH? — Eep-AHR-khee
    EH-nah ah-tee-EHM ah-kree-VOHS ah-PEH-nahn-dee ah-POH toh fahr-mah-KEE-oh.
  english: — Where is there an ATM near here? — There is an ATM right across from
