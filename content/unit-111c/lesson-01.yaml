  english: — Did you give him the code to enter the account? — No, I don't give my
    code to anyone.
  notes: Review Unit 111. Cybersecurity and banking PIN confidentiality rules.
  gender_or_pos: phrase
  audio: toy-edoses-ton-kodik-0498e0.mp3
  status: verified
  example_el: — Μην δίνεις ποτέ τον κωδικό σου σε κανέναν. — Έχεις δίκιο, πρέπει να
    προσέχεις.
  example_en: — Never give your code to anyone. — You are right, you must take care.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Emphasizing confidentiality and safety regarding banking
    credentials
- id: A1-U111C-018
  greek: — Μας έστειλαν την απόδειξη πληρωμής με ηλεκτρονικό μήνυμα; — Ναι, την έστειλαν
    στο email μου πριν από λίγο.
  phonetic_hint: — Mahs EH-stee-lahn teen ah-POH-theek-see plee-roh-MEES meh ee-lehk-troh-nee-KOH
