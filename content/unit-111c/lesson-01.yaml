  example_el: — Έχεις κωδικό για το διαδίκτυο; — Ναι, έχω όνομα και κωδικό.
  example_en: — Do you have a code for the internet? — Yes, I have a name and code.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Sharing links and accessing web banking credentials
- id: A1-U111C-017
  greek: — Του έδωσες τον κωδικό για να μπει στον λογαριασμό; — Όχι, δεν δίνω τον
    κωδικό μου σε κανέναν.
  phonetic_hint: — Too EH-thoh-ses ton koh-thee-KOH yah nah bee ston loh-ghah-ryah-ZMOH?
