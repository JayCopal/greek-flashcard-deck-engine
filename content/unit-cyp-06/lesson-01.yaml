unit_id: unit-cyp-06
lesson_id: lesson-01
title: 'Μάθημα 6: Ευρωπαϊκή Ένωση, Διεθνείς Σχέσεις, Επικαιρότητα & Πολιτογράφηση
  (EU, Current Affairs & Naturalization)'
description: Cyprus in the EU (6 MEPs, 2012 & 2026 EU Council Presidencies), international
  organizations (UN, Commonwealth, non-membership in NATO), the 3 public universities
  (UCY, TEPAK, OUC), Olympic medalist Pavlos Kontides, 2024 Local Government Reform,
  and Citizenship Exam rules (60% / 50%).
lesson_status: not_started
lesson_notes: "Unit CYP-06 Core Exam Notes: Ευρωπαϊκή Ένωση, Διεθνείς Σχέσεις, Επικαιρότητα\
  \ & Πολιτογράφηση (EU, International Relations, Current Affairs & Naturalization)\n\
  \n• Η Κύπρος στην Ευρωπαϊκή Ένωση & στους Διεθνείς Οργανισμούς:\n  - Ένταξη στην\
  \ Ευρωπαϊκή Ένωση: 1 Μαΐου 2004.\n  - Ένταξη στην Ευρωζώνη: 1 Ιανουαρίου 2008.\n\
  \  - Κύπριοι Ευρωβουλευτές στο Ευρωπαϊκό Κοινοβούλιο: 6 ευρωβουλευτές (εκλέγονται\
  \ κάθε 5 χρόνια).\n  - Προεδρία του Συμβουλίου της Ευρωπαϊκής Ένωσης: 1η φορά το\
  \ Β΄ εξάμηνο του 2012· 2η φορά το Α΄ εξάμηνο του 2026.\n  - Διεθνείς Οργανισμοί\
  \ στους οποίους είναι μέλος η Κύπρος: ΟΗΕ (από το 1960), Συμβούλιο της Ευρώπης (1961),\
  \ Κοινοπολιτεία των Εθνών (1961), ΟΑΣΕ.\n  - Οργανισμός στον οποίο η Κύπρος ΔΕΝ\
  \ είναι μέλος: Το ΝΑΤΟ (Βορειοατλαντική Συμμαχία).\n\n• Παιδεία, Δημόσια Πανεπιστήμια\
  \ & Αθλητισμός:\n  - Τρία (3) Δημόσια Πανεπιστήμια της Κύπρου:\n    1. Πανεπιστήμιο\
  \ Κύπρου (ΠΚ) στη Λευκωσία (ιδρύθηκε το 1989).\n    2. Τεχνολογικό Πανεπιστήμιο\
  \ Κύπρου (ΤΕΠΑΚ) στη Λεμεσό (ιδρύθηκε το 2004).\n    3. Ανοικτό Πανεπιστήμιο Κύπρου\
  \ (ΑΠΚΥ) στη Λευκωσία (εξ αποστάσεως εκπαίδευση).\n  - Ολυμπιακά Μετάλλια Κύπρου:\
  \ Ο Παύλος Κοντίδης (Ιστιοπλοΐα — κατηγορία Laser) είναι ο μοναδικός Κύπριος Ολυμπιονίκης,\
  \ με δύο αργυρά μετάλλια (Λονδίνο 2012 και Παρίσι 2024).\n\n• Μεταρρύθμιση Τοπικής\
  \ Αυτοδιοίκησης (2024) & Υφυπουργεία:\n  - Από τον Ιούνιο του 2024 οι δήμοι στις\
  \ ελεύθερες περιοχές συνενώθηκαν σε 20 Δήμους και δημιουργήθηκαν οι Επαρχιακοί Οργανισμοί\
  \ Αυτοδιοίκησης (ΕΟΑ).\n  - Τα 6 Υφυπουργεία της Κυπριακής Δημοκρατίας: Ναυτιλίας\
  \ (Λεμεσός), Τουρισμού, Έρευνας/Καινοτομίας/Ψηφιακής Πολιτικής, Κοινωνικής Πρόνοιας,\
  \ Πολιτισμού, και Μετανάστευσης & Διεθνούς Προστασίας.\n\n• Η Εξέταση Σύγχρονης\
  \ Πολιτικής και Κοινωνικής Πραγματικότητας της Κύπρου:\n  - Διοργανώνεται από την\
  \ Υπηρεσία Εξετάσεων του Υπουργείου Παιδείας, Αθλητισμού και Νεολαίας (ΥΠΑΝ).\n\
  \  - Περιλαμβάνει 25 ερωτήσεις πολλαπλής επιλογής σε 45 λεπτά.\n  - Βάση επιτυχίας:\
  \ 60% (τουλάχιστον 15/25) για πολιτογράφηση και 50% (13/25) για καθεστώς επί μακρόν\
  \ διαμένοντος."
entries:
- id: CYP-U06-001
  greek: — Πόσους Ευρωβουλευτές εκλέγει η Κύπρος στο Ευρωπαϊκό Κοινοβούλιο; — Έξι
    (6) Ευρωβουλευτές.
  phonetic_hint: POH-soos ev-roh-voo-lef-TEHS ehk-LEH-yee ee KEE-pros stoh ev-roh-pah-ee-KOH
    kee-noh-VOO-lee-oh? EHK-see ev-roh-voo-lef-TEHS
  english: — How many Members of the European Parliament (MEPs) does Cyprus elect
    to the European Parliament? — Six (6) MEPs.
  notes: One of the most frequently repeated past exam questions! Cyprus elects 6
    MEPs every five years.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Cyprus representation in the European
    Parliament
  example_el: Η Κυπριακή Δημοκρατία εκπροσωπείται στο Ευρωπαϊκό Κοινοβούλιο από έξι
    (6) ευρωβουλευτές.
  example_en: The Republic of Cyprus is represented in the European Parliament by
    six (6) MEPs.
  example2_el: Οι ευρωεκλογές διεξάγονται κάθε πέντε χρόνια σε όλα τα κράτη μέλη της
    Ευρωπαϊκής Ένωσης.
  example2_en: European elections are held every five years across all member states
    of the European Union.
  audio: null
  status: pending_tts
- id: CYP-U06-002
  greek: — Σε ποιον από τους παρακάτω διεθνείς οργανισμούς ΔΕΝ είναι μέλος η Κυπριακή
    Δημοκρατία; — Στο ΝΑΤΟ (Βορειοατλαντική Συμμαχία).
  phonetic_hint: seh pyon ah-POH toos theeh-THNEES or-ghah-nee-ZMOOS thehn EE-neh
    MEH-los ee kee-pree-ah-KEE theem-oh-krah-TEE-ah? stoh NAH-toh
  english: — Of which of the following international organizations is the Republic
    of Cyprus NOT a member? — NATO (North Atlantic Treaty Organization).
  notes: Classic past exam question! Cyprus is a member of the UN (ΟΗΕ), the EU (ΕΕ),
    the Council of Europe (Συμβούλιο της Ευρώπης), and the Commonwealth (Κοινοπολιτεία),
    but is NOT a member of NATO.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — International organization memberships
  example_el: Η Κυπριακή Δημοκρατία είναι μέλος του ΟΗΕ, της Ευρωπαϊκής Ένωσης και
    της Κοινοπολιτείας, αλλά δεν είναι μέλος του ΝΑΤΟ.
  example_en: The Republic of Cyprus is a member of the UN, the European Union, and
    the Commonwealth, but is not a member of NATO.
  example2_el: Η Κύπρος έγινε μέλος του Οργανισμού Ηνωμένων Εθνών (ΟΗΕ) τον Σεπτέμβριο
    του 1960, λίγο μετά την ανεξαρτησία της.
  example2_en: Cyprus became a member of the United Nations (UN) in September 1960,
    shortly after its independence.
  audio: null
  status: pending_tts
- id: CYP-U06-003
  greek: η Κυπριακή Προεδρία του Συμβουλίου της Ευρωπαϊκής Ένωσης (2012 & 2026)
  phonetic_hint: ee kee-pree-ah-KEE proh-eth-REE-ah too seem-voo-LEE-oo tees ev-roh-pah-ee-KEES
    EH-noh-sees
  english: the Cyprus Presidency of the Council of the European Union (2012 & 2026)
  notes: Cyprus held the rotating 6-month Presidency of the Council of the EU for
    the first time in the second half of 2012 (July–December 2012) and for the second
    time in the first half of 2026 (January–June 2026).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: την Κυπριακή Προεδρία του Συμβουλίου της ΕΕ
  keg_communicative_function: European Union & Current Affairs — Council of the EU
    Presidency
  example_el: Η Κύπρος ανέλαβε για πρώτη φορά την Προεδρία του Συμβουλίου της ΕΕ το
    δεύτερο εξάμηνο του 2012 και για δεύτερη φορά το πρώτο εξάμηνο του 2026.
  example_en: Cyprus assumed the Presidency of the Council of the EU for the first
    time in the second half of 2012 and for the second time in the first half of 2026.
  example2_el: Κάθε κράτος μέλος της ΕΕ ασκεί επίσης το δικαίωμα διορισμού ενός Ευρωπαίου
    Επιτρόπου στην Ευρωπαϊκή Επιτροπή.
  example2_en: Each EU member state also nominates one European Commissioner to the
    European Commission.
  audio: null
  status: pending_tts
- id: CYP-U06-004
  greek: η Κοινοπολιτεία των Εθνών (Commonwealth)
  phonetic_hint: ee kee-noh-poh-lee-TEE-ah ton eth-NON
  english: the Commonwealth of Nations
  notes: Cyprus joined the Commonwealth of Nations in March 1961 under President Makarios
    III and hosted the Commonwealth Heads of Government Meeting (CHOGM) in Limassol
    in 1993.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: την Κοινοπολιτεία των Εθνών
  keg_communicative_function: International Relations — Commonwealth membership
  example_el: Η Κυπριακή Δημοκρατία είναι κράτος μέλος της Κοινοπολιτείας των Εθνών
    από το 1961.
  example_en: The Republic of Cyprus has been a member state of the Commonwealth of
    Nations since 1961.
  example2_el: Επίσης, από το 1961 η Κύπρος είναι πλήρες μέλος του Συμβουλίου της
    Ευρώπης που εδρεύει στο Στρασβούργο.
  example2_en: Also, since 1961 Cyprus has been a full member of the Council of Europe
    based in Strasbourg.
  audio: null
  status: pending_tts
- id: CYP-U06-005
  greek: — Ποια είναι τα τρία (3) δημόσια πανεπιστήμια της Κυπριακής Δημοκρατίας;
    — Το Πανεπιστήμιο Κύπρου, το ΤΕΠΑΚ και το Ανοικτό Πανεπιστήμιο Κύπρου.
  phonetic_hint: pyah EE-neh tah TREE-ah theem-OH-syah pah-neh-pee-STEE-mee-ah tees
    kee-pree-ah-KEES theem-oh-krah-TEE-ahs?
  english: — Which are the three (3) public universities of the Republic of Cyprus?
    — The University of Cyprus, the Cyprus University of Technology (TEPAK), and the
    Open University of Cyprus.
  notes: Frequent past exam question! Watch out for private universities (like University
    of Nicosia, European University, Frederick, Neapolis, UCLan) used as distractors
    when the question specifically asks for PUBLIC universities (δημόσια πανεπιστήμια).
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Public universities in Cyprus
  example_el: Το Πανεπιστήμιο Κύπρου (ΠΚ) και το Ανοικτό Πανεπιστήμιο Κύπρου (ΑΠΚΥ)
    εδρεύουν στη Λευκωσία, ενώ το Τεχνολογικό Πανεπιστήμιο Κύπρου (ΤΕΠΑΚ) εδρεύει
    στη Λεμεσό.
  example_en: The University of Cyprus (UCY) and the Open University of Cyprus (OUC)
    are based in Nicosia, while the Cyprus University of Technology (TEPAK) is based
    in Limassol.
  example2_el: Το Πανεπιστήμιο Κύπρου ιδρύθηκε το 1989 και δέχθηκε τους πρώτους του
    φοιτητές το 1992.
  example2_en: The University of Cyprus was founded in 1989 and admitted its first
    students in 1992.
  audio: null
  status: pending_tts
- id: CYP-U06-006
  greek: η υποχρεωτική εκπαίδευση στην Κύπρο
  phonetic_hint: ee ee-poh-khreh-oh-tee-KEE ehk-PEH-thef-see steen KEE-proo
  english: compulsory education in Cyprus
  notes: Education in Cyprus is compulsory and free in public schools from pre-primary
    school (προδημοτική, age 4 years and 8 months) through primary school (Δημοτικό,
    6 years) up to the end of Gymnasium (Γυμνάσιο, age 15).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: την υποχρεωτική εκπαίδευση
  keg_communicative_function: Education & Society — Compulsory schooling stages
  example_el: Η εκπαίδευση στην Κύπρο είναι υποχρεωτική από την προδημοτική ηλικία
    μέχρι τη συμπλήρωση του Γυμνασίου (ή του 15ου έτους).
  example_en: Education in Cyprus is compulsory from pre-primary age until completion
    of Gymnasium (or age 15).
  example2_el: Μετά το Γυμνάσιο ακολουθεί η τριετής φοίτηση στο Λύκειο ή στις Τεχνικές
    και Επαγγελματικές Σχολές.
  example2_en: After Gymnasium follows three years of study at Lyceum or at Technical
    and Vocational Schools.
  audio: null
  status: pending_tts
- id: CYP-U06-007
  greek: — Ποιος είναι ο πρώτος (και μοναδικός) Κύπριος αθλητής που κατέκτησε Ολυμπιακό
    μετάλλιο για την Κύπρο; — Ο Παύλος Κοντίδης στην ιστιοπλοΐα.
  phonetic_hint: pyos EE-neh oh PROH-tos KEE-pree-os ah-thlee-TEES poo kah-TEHK-tee-seh
    oh-leem-byah-KOH meh-TAH-lee-oh? oh PAHV-los kohn-DEE-thees
  english: — Who is the first (and only) Cypriot athlete to win an Olympic medal for
    Cyprus? — Pavlos Kontides in sailing.
  notes: High-frequency past exam question! Sailor Pavlos Kontides (born in Limassol)
    won the Silver Medal at the London 2012 Olympics AND a second Olympic Silver Medal
    at the Paris 2024 Olympics in the Men's Laser/ILCA 7 class.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Cyprus Olympic achievements
  example_el: Ο ιστιοπλόος Παύλος Κοντίδης χάρισε στην Κύπρο δύο αργυρά Ολυμπιακά
    μετάλλια, στο Λονδίνο το 2012 και στο Παρίσι το 2024.
  example_en: Sailor Pavlos Kontides won two silver Olympic medals for Cyprus, in
    London in 2012 and in Paris in 2024.
  example2_el: Στους Παραολυμπιακούς Αγώνες διακρίθηκε ιδιαίτερα η Κύπρια κολυμβήτρια
    Καρολίνα Πελενδρίτου με χρυσά μετάλλια.
  example2_en: At the Paralympic Games, Cypriot swimmer Karolina Pelendritou excelled
    with gold medals.
  audio: null
  status: pending_tts
- id: CYP-U06-008
  greek: η Μεταρρύθμιση της Τοπικής Αυτοδιοίκησης (2024)
  phonetic_hint: ee meh-tah-REETH-mee-see tees toh-pee-KEES ahf-toh-thee-EE-kee-sees
  english: the Local Government Reform (2024)
  notes: 'Major reform implemented with the June 2024 local elections: merged the
    30 free municipalities and many communities into 20 Municipalities (20 Δήμοι)
    and created 5 District Local Government Organizations (Επαρχιακοί Οργανισμοί Αυτοδιοίκησης
    - ΕΟΑ).'
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: τη Μεταρρύθμιση της Τοπικής Αυτοδιοίκησης
  keg_communicative_function: Current Affairs & Polity — 2024 Municipal & District
    Reform
  example_el: Με τη μεταρρύθμιση της Τοπικής Αυτοδιοίκησης το 2024, οι δήμοι στις
    ελεύθερες περιοχές της Κύπρου μειώθηκαν σε είκοσι (20).
  example_en: With the Local Government reform in 2024, the municipalities in the
    free areas of Cyprus were reduced to twenty (20).
  example2_el: Παράλληλα συστάθηκαν οι Επαρχιακοί Οργανισμοί Αυτοδιοίκησης (ΕΟΑ) για
    την ύδρευση, την αποχέτευση και τις πολεοδομικές άδειες.
  example2_en: At the same time, District Local Government Organizations (EOA) were
    established for water supply, sewerage, and planning permits.
  audio: null
  status: pending_tts
- id: CYP-U06-009
  greek: τα έξι (6) Υφυπουργεία της Κυπριακής Δημοκρατίας
  phonetic_hint: tah EHK-see ee-fee-poor-YEE-ah tees kee-pree-ah-KEES theem-oh-krah-TEE-ahs
  english: the six (6) Deputy Ministries of the Republic of Cyprus
  notes: 'Past exam question! The 6 Deputy Ministries are: 1. Ναυτιλίας (Shipping
    - in Limassol), 2. Τουρισμού (Tourism), 3. Έρευνας, Καινοτομίας και Ψηφιακής Πολιτικής,
    4. Κοινωνικής Πρόνοιας (Social Welfare), 5. Πολιτισμού (Culture), 6. Μετανάστευσης
    και Διεθνούς Προστασίας (Migration & International Protection).'
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    singular: το Υφυπουργείο
    plural: τα Υφυπουργεία
    accusative_plural: τα Υφυπουργεία
  keg_communicative_function: Polity & Current Affairs — Deputy Ministries of Cyprus
  example_el: Στην Κυπριακή Δημοκρατία λειτουργούν έντεκα Υπουργεία και έξι εξειδικευμένα
    Υφυπουργεία.
  example_en: In the Republic of Cyprus, eleven Ministries and six specialized Deputy
    Ministries operate.
  example2_el: Το Υφυπουργείο Ναυτιλίας είναι το μόνο που εδρεύει στη Λεμεσό, ενώ
    τα υπόλοιπα εδρεύουν στη Λευκωσία.
  example2_en: The Deputy Ministry of Shipping is the only one headquartered in Limassol,
    while the rest are based in Nicosia.
  audio: null
  status: pending_tts
- id: CYP-U06-010
  greek: το Ινστιτούτο Νευρολογίας και Γενετικής Κύπρου (ΙΝΓΚ) και το Ινστιτούτο Κύπρου
  phonetic_hint: toh een-stee-TOO-toh nev-roh-loh-YEE-ahs keh yeh-neh-tee-KEES KEE-proo
  english: the Cyprus Institute of Neurology and Genetics (CING) and the Cyprus Institute
  notes: Leading scientific research centers in Nicosia, internationally recognized
    in biomedical/genetic research (including thalassemia research) and environmental/climate
    science.
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    accusative_singular: το Ινστιτούτο Νευρολογίας και Γενετικής Κύπρου
  keg_communicative_function: Science & Education — Research centers in Cyprus
  example_el: Το Ινστιτούτο Νευρολογίας και Γενετικής Κύπρου (ΙΝΓΚ) στη Λευκωσία είναι
    κορυφαίο ερευνητικό και ιατρικό κέντρο.
  example_en: The Cyprus Institute of Neurology and Genetics (CING) in Nicosia is
    a leading research and medical center.
  example2_el: Ο ετήσιος φιλανθρωπικός θεσμός «Telethon» στηρίζει το έργο του Ινστιτούτου
    Νευρολογίας και Γενετικής.
  example2_en: The annual charity event 'Telethon' supports the work of the Institute
    of Neurology and Genetics.
  audio: null
  status: pending_tts
- id: CYP-U06-011
  greek: η εκστρατεία «Ραδιομαραθώνιος» και η «Πορεία Χριστοδούλας»
  phonetic_hint: ee ehk-strah-TEE-ah rah-thee-oh-mah-rah-THOH-nee-os keh ee poh-REE-ah
    khree-stoh-THOO-lahs
  english: the 'Radiomarathon' charity campaign and the 'Christodoula March'
  notes: 'Two of Cyprus''s best-known annual social solidarity institutions: Radiomarathon
    (supporting children with special needs) and the Christodoula March (organized
    every April by the Cyprus Anti-Cancer Society / Αντικαρκινικός Σύνδεσμος Κύπρου,
    named after cancer patient Christodoula Tsiarta from 1974).'
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: την Πορεία Χριστοδούλας
  keg_communicative_function: Society & Solidarity — Major charity institutions in
    Cyprus
  example_el: Η «Πορεία Χριστοδούλας» διοργανώνεται κάθε Απρίλιο από τον Αντικαρκινικό
    Σύνδεσμο Κύπρου για τη στήριξη καρκινοπαθών.
  example_en: The 'Christodoula March' is organized every April by the Cyprus Anti-Cancer
    Society in support of cancer patients.
  example2_el: Ο «Ραδιομαραθώνιος» είναι παγκύπριος φιλανθρωπικός θεσμός για τη στήριξη
    παιδιών με ειδικές ανάγκες.
  example2_en: The 'Radiomarathon' is a pan-Cyprian charity institution supporting
    children with special needs.
  audio: null
  status: pending_tts
- id: CYP-U06-012
  greek: ο ΚΟΑ (Κυπριακός Οργανισμός Αθλητισμού) και το Στάδιο ΓΣΠ
  phonetic_hint: oh KOH-AH (kee-pree-ah-KOHS or-ghah-nee-ZMOHS ah-thlee-tee-ZMOO)
    keh toh STAH-thee-oh yee-see-PEE
  english: KOA (Cyprus Sport Organisation) and the GSP Stadium
  notes: KOA (founded 1969) is the supreme state authority for sports in Cyprus; GSP
    Stadium (Στάδιο Γυμναστικού Συλλόγου «Τα Παγκύπρια») in Nicosia is the largest
    football stadium in Cyprus (~22,859 capacity), alongside the new Alphamega Stadium
    in Limassol.
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    accusative_singular: τον Κυπριακό Οργανισμό Αθλητισμού
  keg_communicative_function: Society & Sports — Sports institutions and stadiums
  example_el: Ο Κυπριακός Οργανισμός Αθλητισμού (ΚΟΑ) είναι ο ανώτατος ημικρατικός
    φορέας για τον αθλητισμό στην Κύπρο.
  example_en: The Cyprus Sport Organisation (KOA) is the supreme semi-governmental
    body for sports in Cyprus.
  example2_el: Το Στάδιο ΓΣΠ στη Λευκωσία είναι το μεγαλύτερο ποδοσφαιρικό στάδιο
    της Κύπρου.
  example2_en: The GSP Stadium in Nicosia is the largest football stadium in Cyprus.
  audio: null
  status: pending_tts
- id: CYP-U06-013
