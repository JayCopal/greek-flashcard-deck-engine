unit_id: unit-10
lesson_id: lesson-01
title: Στην Πόλη, Μετακινήσεις & Οδηγίες (City Navigation, Transport & Directions)
description: 'CEFR A1: Asking for and giving directions in town, public transportation
  (metro, bus, train), ticket purchases, and spatial prepositions.'
lesson_status: not_started
lesson_notes: "Unit 10 Core Grammar Notes:\n\n• Asking for Directions in Town:\n \
  \ - Inquiring politely: 'Συγγνώμη, πού είναι το/η/ο...;' (Excuse me, where is the...?).\n\
  \  - 'Πώς πάω στο/στη/στον...;' (How do I get to...?).\n  - 'Ψάχνω τον σταθμό /\
  \ το φαρμακείο...' (I am looking for the station / pharmacy...).\n\n• Giving Directions\
  \ (Indicative / Polite 2nd Person Plural -ετε):\n  - Πηγαίνετε όλο ευθεία. (Go straight\
  \ ahead.)\n  - Στρίβετε δεξιά / αριστερά στο πρώτο φανάρι. (Turn right / left at\
  \ the first traffic light.)\n  - Περνάτε τη διάβαση / τον δρόμο. (Cross the crosswalk\
  \ / street.)\n\n• Spatial Prepositions & Adverbs (Governing Accusative):\n  - κοντά\
  \ σε + Accusative: 'κοντά στον σταθμό' (near the station).\n  - μακριά από + Accusative:\
  \ 'μακριά από το κέντρο' (far from downtown).\n  - απέναντι από + Accusative: 'απέναντι\
  \ από την τράπεζα' (across from the bank).\n  - δίπλα σε + Accusative: 'δίπλα στο\
  \ ταχυδρομείο' (next to the post office).\n\n• Public Transportation Formulas:\n\
  \  - Mode of transit with 'με + Definite Accusative': με το μετρό, με το λεωφορείο,\
  \ με το τρένο, με το ταξί.\n  - Walking: 'με τα πόδια' (on foot).\n  - Boarding\
  \ / Alighting: ανεβαίνω στο λεωφορείο (board) / κατεβαίνω στη στάση (get off).\n\
  \  - Purchasing tickets: ένα απλό εισιτήριο (single) / ένα εισιτήριο μετ' επιστροφής\
  \ (round-trip)."
