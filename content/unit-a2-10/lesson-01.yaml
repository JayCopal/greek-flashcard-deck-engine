  example_el: Συνέβη ένα τροχαίο ατύχημα στη διασταύρωση, αλλά ευτυχώς χωρίς σοβαρούς
    τραυματισμούς.
  example_en: A traffic accident occurred at the intersection, but fortunately without
    serious injuries.
  example2_el: Η τροχαία διερευνά τα αίτια του ατυχήματος.
  example2_en: The traffic police are investigating the causes of the accident.
