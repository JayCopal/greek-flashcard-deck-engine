- id: A2-U10-018
  greek: το ατύχημα
  english: accident
  notes: 'Neuter noun in -μα (-ματα). Examples: τροχαίο ατύχημα (traffic accident),
    εργατικό ατύχημα (workplace accident).'
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα ατυχήματα
    genitive_singular: του ατυχήματος
    collocation: τροχαίο ατύχημα (traffic accident)
  keg_communicative_function: Reporting emergency incidents and vehicle collisions
