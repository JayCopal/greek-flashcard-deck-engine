unit_id: unit-a2-10
lesson_id: lesson-01
title: 'Μάθημα 10: Υγεία, Ατυχήματα & Φαρμακείο (Health, Accidents & Medical Consultation)'
description: Explaining bodily symptoms, consulting doctors and pharmacists, following
  medical prescriptions, and reporting emergencies using mediopassive verbs (αισθάνομαι,
  κουράζομαι, τραυματίζομαι) and anatomy vocabulary.
lesson_status: not_started
lesson_notes: "Unit A2-10 Core Notes: Υγεία & Φαρμακείο (Health & Medicine)\n• Anatomy\
  \ & Symptoms:\n  - πυρετός (fever), πονοκέφαλος (headache), πονόλαιμος (sore throat),\
  \ βήχας (cough), κρυολόγημα (cold), γρίπη (flu).\n  - πονάει το... / πονάνε τα...\
  \ (my ... hurts).\n• Mediopassive Health Verbs:\n  - αισθάνομαι (feel), κουράζομαι\
  \ (get tired), τραυματίζομαι (get injured), κοιμάμαι (sleep)."
entries:
- id: A2-U10-001
  greek: πονάω
  english: to hurt / to ache / I feel pain
  notes: 'Group B1 verb (πονάω / πονώ). Takes direct object of body part: ''πονάει
    το κεφάλι μου'' (my head hurts) or ''πονάω στο στομάχι''.'
  gender_or_pos: verb
  grammatical_info:
    part_of_speech: verb
    third_person: πονάει / πονούν
    simple_past: πόνεσα
    noun_derivative: ο πόνος (pain)
  keg_communicative_function: Describing localized pain and physical discomfort to
    a doctor or pharmacist
  example_el: Με πονάει πολύ ο λαιμός μου και δυσκολεύομαι να καταπιώ.
  example_en: My throat hurts a lot and I have difficulty swallowing.
  example2_el: Πονάει το στομάχι μου από χθες το βράδυ, χρειάζομαι ένα παυσίπονο.
  example2_en: My stomach has been aching since yesterday evening; I need a painkiller.
  audio: ponao-f36b23.mp3
  status: verified
  example_audio: me-ponaei-poly-o-lai-06aa5d.mp3
  example2_audio: ponaei-to-stomachi-m-e553af.mp3
- id: A2-U10-002
  greek: αισθάνομαι
  english: to feel / I feel
  notes: 'Deponent verb (αισθάνομαι, αισθάνεσαι, αισθάνεται). Simple past: ''αισθάνθηκα''
    or ''ένιωσα''. Collocates with ''αισθάνομαι άρρωστος / καλά''.'
  gender_or_pos: verb (deponent)
  grammatical_info:
    part_of_speech: verb
    simple_past: αισθάνθηκα
    synonym: νιώθω
    noun_derivative: το αίσθημα
  keg_communicative_function: Explaining general physical and psychological symptoms
    during clinical consultations
  example_el: Αισθάνομαι έντονη αδυναμία και ζαλάδα από το πρωί.
  example_en: I feel intense weakness and dizziness since morning.
  example2_el: Πώς αισθάνεστε σήμερα μετά τη λήψη των φαρμάκων;
  example2_en: How do you feel today after taking the medicines?
  audio: aisthanomai-3c2210.mp3
  status: verified
  example_audio: aisthanomai-entoni-a-a11989.mp3
  example2_audio: pos-aisthaneste-sime-9084a7.mp3
- id: A2-U10-003
  greek: ο πυρετός
  english: fever / temperature
  notes: Masculine noun in -ός (-οί). Collocates with 'έχω / ανεβάζω πυρετό' (to have/run
    a fever).
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι πυρετοί
    collocation: έχω πυρετό (I have a fever), βάζω θερμόμετρο
  keg_communicative_function: Reporting body temperature and fever spikes to medical
    staff
  example_el: Το παιδί ανέβασε υψηλό πυρετό, σχεδόν τριάντα εννέα βαθμούς.
  example_en: The child developed a high fever, nearly thirty-nine degrees.
  example2_el: Πάρτε αυτό το αντιπυρετικό σιρόπι για να πέσει ο πυρετός.
  example2_en: Take this antipyretic syrup to bring the fever down.
  audio: o-pyretos-95d8d4.mp3
  status: verified
  example_audio: to-paidi-anevase-yps-7ab6b8.mp3
  example2_audio: parte-ayto-to-antipy-462310.mp3
- id: A2-U10-004
  greek: ο πονοκέφαλος
  english: headache
  notes: 'Masculine compound noun: πόνος + κεφάλι. Plural: ''οι πονοκέφαλοι''.'
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι πονοκέφαλοι
    collocation: έντονος πονοκέφαλος
  keg_communicative_function: Stating head aches and asking for analgesic tablets
    in pharmacy role-plays
  example_el: Έχω έναν αφόρητο πονοκέφαλο, έχετε κάτι αποτελεσματικό για να μου δώσετε;
  example_en: I have an unbearable headache; do you have something effective to give
    me?
  example2_el: Η πολλή ώρα μπροστά στην οθόνη του υπολογιστή μού προκαλεί συχνά πονοκέφαλο.
  example2_en: Too much time in front of the computer screen often causes me a headache.
  audio: o-ponokefalos-f0102a.mp3
  status: verified
  example_audio: echo-enan-aforito-po-cec9a4.mp3
  example2_audio: i-polli-ora-mprosta--0cc679.mp3
- id: A2-U10-005
  greek: ο πονόλαιμος
  english: sore throat
  notes: 'Masculine compound noun: πόνος + λαιμός. Common symptom of seasonal infections.'
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι πονόλαιμοι
    collocation: καραμέλες για τον πονόλαιμο
  keg_communicative_function: Requesting throat lozenges or sprays at the pharmacy
  example_el: Ο πονόλαιμος δεν με αφήνει να μιλήσω καθαρά, θα ήθελα καραμέλες με μέλι.
  example_en: My sore throat won't let me speak clearly; I would like lozenges with
    honey.
  example2_el: Αν ο πονόλαιμος επιμένει για μέρες, πρέπει να σας εξετάσει ένας γιατρός.
  example2_en: If the sore throat persists for days, a doctor must examine you.
  audio: o-ponolaimos-d21d0f.mp3
  status: verified
  example_audio: o-ponolaimos-den-me--44ebe8.mp3
  example2_audio: an-o-ponolaimos-epim-a0d662.mp3
- id: A2-U10-006
  greek: ο βήχας
  english: cough
  notes: Masculine noun in -ας (-ες). Relates to 'βήχω' (to cough).
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
