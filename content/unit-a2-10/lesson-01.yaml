  english: blood tests
  notes: 'Feminine noun phrase plural (singular: η εξέταση αίματος). Routine diagnostic
    procedure.'
  gender_or_pos: noun phrase (feminine plural)
  grammatical_info:
    part_of_speech: noun phrase
    singular: η εξέταση αίματος
