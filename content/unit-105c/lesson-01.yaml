- id: A1-U105C-011
  greek: — Έχεις αδέλφια; — Ναι, έχω έναν αδελφό και μία αδελφή.
  phonetic_hint: EH-khees ah-THEL-fyah? — Neh, EH-kho EH-nahn ah-thel-FOH keh MEE-ah
