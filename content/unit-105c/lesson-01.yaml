- id: A1-U105C-017
  greek: — Συγγνώμη, πού είναι ο σταθμός του μετρό; — Είναι στην επόμενη γωνία, δίπλα
    στην πλατεία.
  phonetic_hint: seeg-NOH-mee, poo EE-neh o stahth-MOHS too meh-TROH? — EE-neh steen
