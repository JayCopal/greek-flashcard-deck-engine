  english: — Excuse me, where is the metro station? — It is on the next corner, next
    to the square.
  notes: Review Units 103 & 106. Asking for directions politely with filler 'συγγνώμη'
    and locative prepositions.
  gender_or_pos: phrase
  audio: syggnomi-poy-einai-o-221534.mp3
  status: verified
  example_el: — Συγγνώμη, μήπως ξέρετε πού είναι το μετρό; — Ναι, είναι απέναντι από
    την πλατεία.
  example_en: — Excuse me, do you happen to know where the metro is? — Yes, it is
    across from the square.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking for and giving street directions in the city
- id: A1-U105C-018
