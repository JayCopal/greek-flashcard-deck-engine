unit_id: unit-105c
lesson_id: lesson-01
title: 'Ενότητες 1-5: Διάλογοι, Εξετάσεις & Συνομιλίες (A1 Conversational Synthesis)'
description: 'Cumulative conversational, dialogue, and CEFR A1 oral exam practice
  synthesizing vocabulary and structures from Units 100 to 105: personal presentations,
  origin and family inquiries, city directions and transport, daily routines and times,
  booking hotels and buying tickets, and realistic spoken interactions.'
lesson_status: not_started
entries:
- id: A1-U105C-001
  greek: — Γεια σας! Πώς σας λένε; — Με λένε Νίκο, χαίρω πολύ.
  phonetic_hint: YAH sahs! POS sahs LEH-neh? — Meh LEH-neh NEE-ko, CHEH-ro po-LEE.
  english: — Hello! What is your name? — My name is Nikos, pleased to meet you.
  notes: 'Review Units 101-102. CEFR A1 Oral Exam Task 1: Formal introduction using
    polite 2nd plural ''σας'' and introduction formula ''με λένε''.'
  gender_or_pos: phrase
  audio: geia-sas-pos-sas-len-b2ddb3.mp3
  status: verified
  example_el: — Καλημέρα σας, πώς σας λένε; — Με λένε Νίκο. — Χαίρω πολύ, Νίκο!
  example_en: — Good morning, what is your name? — My name is Nikos. — Pleased to
    meet you, Nikos!
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Introducing oneself and exchanging names in formal or
    exam situations
- id: A1-U105C-002
  greek: — Γεια σου, Ελένη! Τι κάνεις; — Είμαι πολύ καλά, ευχαριστώ. Εσύ;
  phonetic_hint: YAH soo, eh-LEH-nee! Tee KAH-nees? — EE-meh po-LEE kah-LAH, ef-khah-ree-STOH.
    Eh-SEE?
  english: — Hi, Eleni! How are you? — I am very well, thank you. And you?
  notes: Review Unit 102. Informal greeting and wellbeing inquiry between friends
    or colleagues.
  gender_or_pos: phrase
  audio: geia-soy-eleni-ti-ka-816d06.mp3
  status: verified
  example_el: — Γεια σου, Ελένη! Πώς είσαι; — Μια χαρά! Εσύ τι κάνεις; — Κι εγώ καλά.
  example_en: — Hi, Eleni! How are you? — Great! What are you doing? — I'm good too.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Greeting friends and inquiring about health and wellbeing
- id: A1-U105C-003
  greek: — Από πού είστε; — Είμαι από την Ιταλία, είμαι Ιταλός.
  phonetic_hint: ah-POH poo EE-steh? — EE-meh ah-POH teen ee-tah-LEE-ah, EE-meh ee-tah-LOHS.
  english: — Where are you from? — I am from Italy, I am Italian.
  notes: Review Units 102 & 104. Inquiring about national origin and stating nationality
    with masculine noun/adjective 'Ιταλός'.
  gender_or_pos: phrase
  audio: apo-poy-eiste-eimai--07104b.mp3
  status: verified
  example_el: — Από ποια χώρα είστε; — Είμαι από την Ιταλία, από τη Ρώμη.
  example_en: — Which country are you from? — I am from Italy, from Rome.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about and stating country of origin and nationality
- id: A1-U105C-004
  greek: — Μιλάτε ελληνικά; — Ναι, μιλάω λίγα ελληνικά και αγγλικά.
  phonetic_hint: mee-LAH-teh eh-lee-nee-KAH? — Neh, mee-LAH-o LEE-ghah eh-lee-nee-KAH
    keh ahng-glee-KAH.
  english: — Do you speak Greek? — Yes, I speak a little Greek and English.
  notes: Review Unit 104. Stating language abilities with Type B1 verb 'μιλάω' and
    neuter plural language adverbs.
  gender_or_pos: phrase
  audio: milate-ellinika-nai--cb3821.mp3
  status: verified
  example_el: — Ποιες γλώσσες μιλάς; — Μιλάω πολύ καλά αγγλικά και λίγα ελληνικά.
  example_en: — Which languages do you speak? — I speak English very well and a little
    Greek.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Communicating foreign language proficiency in an interview
- id: A1-U105C-005
  greek: — Ποιο είναι το τηλέφωνό σου; — Το τηλέφωνό μου είναι δύο ένα μηδέν.
  phonetic_hint: PYO EE-neh to tee-LEH-fo-NOH soo? — To tee-LEH-fo-NOH moo EE-neh
    THEE-o EH-nah mee-THEN.
  english: — What is your phone number? — My phone number is two one zero.
