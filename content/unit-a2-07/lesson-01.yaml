unit_id: unit-a2-07
lesson_id: lesson-01
title: 'Μάθημα 7: Ταξίδια, Διακοπές & Κρατήσεις (Travel, Vacations & Reservations)'
description: Making hotel and transport bookings, discussing departure and arrival
  schedules, and comparing prices and travel duration using comparative adjectives
  (πιο, καλύτερος, φθηνότερος, ακριβότερος, γρηγορότερος).
lesson_status: not_started
lesson_notes: "Unit A2-07 Core Notes: Ταξίδια, Διακοπές & Κρατήσεις (Travel & Bookings)\n\
  • Travel Logistics:\n  - Διαμονή: δίκλινο δωμάτιο (double room), μονόκλινο (single),\
  \ θέα στη θάλασσα (sea view), πρωινό (breakfast).\n  - Μετακινήσεις: δρομολόγιο\
  \ (schedule), καθυστέρηση (delay), ακύρωση (cancellation), επιστροφή (return).\n\
  • Comparative Adjectives & Adverbs:\n  - πιο + adjective + από (πιο γρήγορος από\
  \ το λεωφορείο).\n  - Irregular comparatives: καλύτερος (better), χειρότερος (worse),\
  \ μεγαλύτερος (bigger/older), μικρότερος (smaller/younger)."
