unit_id: unit-109c
lesson_id: lesson-01
title: 'Ενότητα 9: Διάλογοι & Εξετάσεις — Σπουδές, Εργασία, Επαγγέλματα & Αόριστος
  (A1 Synthesis)'
description: Conversational, dialogue, and CEFR A1 oral exam practice focusing on
  university studies, courses, stationery, job interviews, professional duties, work
  schedules, salary negotiations, leave entitlement, and simple past (aorist) narrative
  interactions using vocabulary from Lessons 100 to 109.
lesson_status: not_started
entries:
- id: A1-U109C-001
  greek: — Τι σπουδάζεις στο πανεπιστήμιο; — Σπουδάζω αρχιτεκτονική και είμαι στο
