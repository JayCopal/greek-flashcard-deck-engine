unit_id: unit-11
lesson_id: lesson-01
title: Ελεύθερος Χρόνος, Καιρός & Διακοπές (Leisure, Weather & Holidays)
description: 'CEFR A1: Talking about hobbies, sports, cinema, beach and island vacations,
  describing the weather, and using direct-object clitic pronouns.'
lesson_status: not_started
lesson_notes: "Unit 11 Core Grammar Notes:\n\n• Weather Idioms & Impersonal Expressions:\n\
  \  - 'Τι καιρό κάνει σήμερα;' (What's the weather like today?).\n  - 'Κάνει ζέστη\
  \ / κάνει κρύο' (It is hot / cold).\n  - 'Έχει ήλιο / έχει συννεφιά / έχει αέρα'\
  \ (It is sunny / cloudy / windy).\n  - Impersonal verbs: βρέχει (it rains), χιονίζει\
  \ (it snows), φυσάει (the wind blows).\n  - Degrees of temperature: 'Η θερμοκρασία\
  \ είναι 28 βαθμοί.'\n\n• Expressing Likes & Preferences ('Μου αρέσει / Μου αρέσουν'):\n\
  \  - 'Μου αρέσει' + Singular noun or verb: 'Μου αρέσει η θάλασσα' / 'Μου αρέσει\
  \ να ταξιδεύω'.\n  - 'Μου αρέσουν' + Plural noun: 'Μου αρέσουν τα νησιά'.\n  - Verb\
  \ 'προτιμάω / προτιμώ': 'Προτιμώ τη θάλασσα από το βουνό.'\n\n• Weak Direct-Object\
  \ Clitic Pronouns (Αιτιατική Προσωπικών Αντωνυμιών):\n  - Singular: με (me), σε\
  \ (you), τον (him/it), την (her/it), το (it).\n  - Plural: μας (us), σας (you all),\
  \ τους (them masc), τις (them fem), τα (them neut).\n  - Syntactic position: Placed\
  \ immediately BEFORE the conjugated verb in active indicative:\n    * 'Τον βλέπω'\
  \ (I see him).\n    * 'Τις ξέρεις;' (Do you know them?).\n    * 'Δεν το θέλω' (I\
  \ don't want it)."
