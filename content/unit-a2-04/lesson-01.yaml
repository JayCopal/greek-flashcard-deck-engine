unit_id: unit-a2-04
lesson_id: lesson-01
title: 'Μάθημα 4: Επιθυμίες, Ανάγκες & Υποτακτική (Wishes, Obligations & Subjunctive
  Mood)'
description: Expressing wishes, necessity, prohibitions, and polite requests using
  the Subjunctive mood (Υποτακτική) with modal operators (πρέπει να, απαγορεύεται
  να, επιτρέπεται να, μπορώ να, θέλω να, για να, αξίζει να).
lesson_status: not_started
lesson_notes: "Unit A2-04 Core Notes: Επιθυμίες, Ανάγκες & Υποτακτική (Wishes, Obligations\
  \ & Subjunctive Mood)\n• Dependent Subjunctive (Υποτακτική) Structure:\n  - Introduced\
  \ by particles: να, για να (purpose), μήπως (fear/lest).\n  - Continuous Subjunctive\
  \ (present stem): να διαβάζω (habit/duration).\n  - Simple Subjunctive (aorist stem):\
  \ να διαβάσω (single completion).\n\n• Core Impersonal & Modal Operators at A2:\n\
  \  - πρέπει να (must / ought to) / δεν πρέπει να (must not).\n  - χρειάζεται να\
  \ (needs to) / δεν χρειάζεται να (no need to).\n  - απαγορεύεται να (forbidden to)\
  \ vs. επιτρέπεται να (permitted to).\n  - μπορώ να (I can / may I) / θα ήθελα να\
  \ (polite: I would like to).\n  - προτιμώ να (I prefer to) / αξίζει να (it is worth\
  \ doing).\n  - είναι απαραίτητο / σημαντικό / δύσκολο / εύκολο να.\n\n• Regulatory\
  \ & Communicative Register:\n  - High frequency in official public signs, exam rubrics,\
  \ rules of conduct, and polite administrative correspondence."
entries:
- id: A2-U04-001
  greek: πρέπει να
  english: must / ought to / have to
  notes: Impersonal modal phrase taking subjunctive. Fundamental for rules, obligations,
    and instructions across all exam papers.
  gender_or_pos: modal phrase (impersonal)
  grammatical_info:
    part_of_speech: modal phrase
    syntax: πρέπει να + υποτακτική
    past_form: έπρεπε να (should have / had to)
    future_form: θα πρέπει να (will have to)
  keg_communicative_function: Expressing necessity and stating examination rules
  example_el: Πρέπει να έχετε μαζί σας την αστυνομική ταυτότητα και το δελτίο εξεταζομένου.
  example_en: You must have with you your police identity card and candidate card.
  example2_el: Πρέπει να συμπληρώσετε όλες τις απαντήσεις μέσα σε σαράντα λεπτά.
  example2_en: You must fill in all answers within forty minutes.
  audio: prepei-na-1843de.mp3
  status: verified
  example_audio: prepei-na-echete-maz-225729.mp3
  example2_audio: prepei-na-symplirose-8aa18b.mp3
- id: A2-U04-002
  greek: χρειάζεται να
  english: it is necessary to / one needs to
  notes: Impersonal verb phrase followed by subjunctive. Expresses practical necessity
    or lack thereof ('δεν χρειάζεται να').
  gender_or_pos: modal phrase (impersonal)
  grammatical_info:
    part_of_speech: modal phrase
    syntax: χρειάζεται να + υποτακτική
    negative: δεν χρειάζεται να (there is no need to)
  keg_communicative_function: Explaining requirements or clarifying that an action
    is unnecessary
  example_el: Δεν χρειάζεται να γράψετε πρόχειρο, μπορείτε να γράψετε απευθείας στο
    έντυπο.
  example_en: There is no need to write a rough draft; you can write directly on the
    form.
  example2_el: Χρειάζεται να πληρώσετε τα εξέταστρα πριν από τη λήξη της προθεσμίας.
  example2_en: It is necessary to pay the exam fees before the deadline expires.
  audio: chreiazetai-na-ac5301.mp3
  status: verified
  example_audio: den-chreiazetai-na-g-082ced.mp3
  example2_audio: chreiazetai-na-pliro-3fece8.mp3
- id: A2-U04-003
  greek: απαγορεύεται να
  english: it is forbidden to / you must not
  notes: Impersonal passive phrase taking subjunctive. Core regulatory formula seen
    on signs, official notices, and test instructions.
  gender_or_pos: regulatory phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: απαγορεύεται να + υποτακτική / απαγορεύεται + ουσιαστικό
    noun_derivative: η απαγόρευση
    antonym: επιτρέπεται να
  keg_communicative_function: Understanding regulatory prohibitions in notices and
    rules
  example_el: Απαγορεύεται αυστηρά να χρησιμοποιείτε κινητά τηλέφωνα κατά τη διάρκεια
    των εξετάσεων.
  example_en: It is strictly forbidden to use mobile phones during examinations.
  example2_el: Στην αίθουσα απαγορεύεται να καπνίζετε και να καταναλώνετε τρόφιμα.
  example2_en: In the hall it is forbidden to smoke and consume food.
  audio: apagoreyetai-na-d519ba.mp3
  status: verified
  example_audio: apagoreyetai-aystira-dff86e.mp3
  example2_audio: stin-aithoysa-apagor-6a2755.mp3
- id: A2-U04-004
  greek: επιτρέπεται να
  english: it is permitted to / you may
  notes: Impersonal passive phrase taking subjunctive. Contrasts with 'απαγορεύεται'.
  gender_or_pos: regulatory phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: επιτρέπεται να + υποτακτική
    noun_derivative: η άδεια
    antonym: απαγορεύεται να
  keg_communicative_function: Understanding permitted actions in official regulations
    and reading brochures
  example_el: Στο μουσείο επιτρέπεται να βγάζετε φωτογραφίες χωρίς φλας.
  example_en: In the museum it is permitted to take photographs without a flash.
  example2_el: Επιτρέπεται να έχετε μαζί σας ένα μπουκάλι νερό.
  example2_en: You are permitted to have a bottle of water with you.
  audio: epitrepetai-na-347097.mp3
  status: verified
  example_audio: sto-moyseio-epitrepe-bfe2d8.mp3
  example2_audio: epitrepetai-na-echet-89a460.mp3
- id: A2-U04-005
  greek: μπορώ να
  english: I can / may I / am I able to
  notes: Modal verb 'μπορώ' followed by subjunctive. Expresses ability, possibility,
    or polite requests ('μπορώ να ρωτήσω κάτι;').
  gender_or_pos: modal phrase
  grammatical_info:
    part_of_speech: verb phrase
    syntax: μπορώ να + υποτακτική
    past: μπόρεσα να (I was able to)
    polite_conditional: θα μπορούσα να (could I / I could)
  keg_communicative_function: Formulating polite inquiries and asking permission in
    Speaking Stage 2
  example_el: Μπορώ να ρωτήσω πού βρίσκεται το γραφείο του διευθυντή;
  example_en: May I ask where the director's office is located?
  example2_el: Τώρα που έμαθα γραμματική, μπορώ να διαβάζω απλά άρθρα στα ελληνικά.
  example2_en: Now that I learned grammar, I can read simple articles in Greek.
  audio: mporo-na-707ff3.mp3
  status: verified
  example_audio: mporo-na-rotiso-poy--ead4f5.mp3
  example2_audio: tora-poy-ematha-gram-09b020.mp3
- id: A2-U04-006
  greek: θέλω να
  english: I want to
  notes: Verb 'θέλω' followed by subjunctive. Basic formula for expressing intentions
    and desires.
  gender_or_pos: verb phrase
  grammatical_info:
    part_of_speech: verb phrase
    syntax: θέλω να + υποτακτική
    polite_form: θα ήθελα να (I would like to)
  keg_communicative_function: Expressing personal desires, career aims, and ordering
    in commercial dialogues
  example_el: Θέλω να βελτιώσω την προφορά μου για να μιλάω με μεγαλύτερη άνεση.
  example_en: I want to improve my pronunciation in order to speak with greater ease.
  example2_el: Θέλετε να πάμε μαζί για καφέ μετά το πέρας των μαθημάτων;
  example2_en: Do you want us to go together for coffee after classes finish?
  audio: thelo-na-f8fef9.mp3
  status: verified
  example_audio: thelo-na-veltioso-ti-11b8c5.mp3
  example2_audio: thelete-na-pame-mazi-31dabd.mp3
- id: A2-U04-007
  greek: θα ήθελα να
  english: I would like to
  notes: Polite conditional formula with 'ήθελα' + subjunctive. Essential for polite
    customer requests and formal emails.
  gender_or_pos: polite phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: θα ήθελα να + υποτακτική
    register: formal / polite
  keg_communicative_function: Making polite service requests and initiating formal
    correspondence
  example_el: Θα ήθελα να ζητήσω πληροφορίες σχετικά με τα δίδακτρα του προγράμματος.
  example_en: I would like to request information regarding the program's tuition
    fees.
  example2_el: Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο για το πρώτο δεκαήμερο του Αυγούστου.
  example2_en: I would like to book a double room for the first ten days of August.
  audio: tha-ithela-na-c1f2d5.mp3
  status: verified
  example_audio: tha-ithela-na-zitiso-957997.mp3
  example2_audio: tha-ithela-na-kleiso-db2f81.mp3
- id: A2-U04-008
  greek: προτιμώ να
  english: I prefer to
  notes: Group B1 verb 'προτιμάω / προτιμώ' followed by subjunctive. Essential in
    pair debates (Speaking Stage 3).
  gender_or_pos: verb phrase
  grammatical_info:
    part_of_speech: verb phrase
    syntax: προτιμώ να + υποτακτική / προτιμώ + ουσιαστικό
    noun_derivative: η προτίμηση
  keg_communicative_function: Stating preferences and comparing options during candidate
    joint negotiations
  example_el: Προτιμώ να ταξιδεύω με πλοίο επειδή μπορώ να απολαμβάνω τη διαδρομή.
  example_en: I prefer to travel by ship because I can enjoy the journey.
  example2_el: Προτιμάτε να μείνουμε σε ξενοδοχείο ή να νοικιάσουμε διαμέρισμα;
  example2_en: Do you prefer that we stay at a hotel or rent an apartment?
  audio: protimo-na-ebca7c.mp3
  status: verified
  example_audio: protimo-na-taxideyo--f66831.mp3
  example2_audio: protimate-na-meinoym-7ce169.mp3
- id: A2-U04-009
  greek: για να
  english: in order to / so that
  notes: Final subordinating conjunction expressing purpose. Followed strictly by
    subjunctive.
  gender_or_pos: conjunction
  grammatical_info:
    part_of_speech: final conjunction
    syntax: για να + υποτακτική
    meaning: expresses purpose or objective
  keg_communicative_function: Explaining motivations, causes, and intentions in written
    essays
  example_el: Ήρθα νωρίς στο εξεταστικό κέντρο για να βρω εύκολα την αίθουσα.
  example_en: I came early to the examination center in order to easily find the room.
  example2_el: Μελετάει κάθε βράδυ για να αποκτήσει το πτυχίο.
  example2_en: She studies every evening so that she can obtain the degree.
  audio: gia-na-f4f1ef.mp3
  status: verified
  example_audio: irtha-noris-sto-exet-30672c.mp3
  example2_audio: meletaei-kathe-vrady-0618f0.mp3
- id: A2-U04-010
  greek: εύχομαι να
  english: I wish that / I wish you
  notes: Deponent verb 'εύχομαι' followed by subjunctive or accusative. Vital for
    social pleasantries.
  gender_or_pos: verb phrase
  grammatical_info:
    part_of_speech: verb phrase
    syntax: εύχομαι να + υποτακτική / εύχομαι + αιτιατική (εύχομαι καλή επιτυχία)
    noun_derivative: η ευχή
  keg_communicative_function: Offering best wishes for exams, holidays, and milestones
    in emails
  example_el: Σας εύχομαι καλή επιτυχία στις εξετάσεις της ελληνομάθειας!
  example_en: I wish you good luck in the examinations of Greek language attainment!
  example2_el: Εύχομαι να περάσετε υπέροχα στις καλοκαιρινές σας διακοπές.
  example2_en: I wish that you have a wonderful time on your summer holidays.
  audio: eychomai-na-a8d7b8.mp3
  status: verified
  example_audio: sas-eychomai-kali-ep-d779db.mp3
  example2_audio: eychomai-na-perasete-d135b1.mp3
- id: A2-U04-011
  greek: παρακαλώ να
  english: I kindly request that / please
  notes: Formal verb phrase 'παρακαλώ να' + subjunctive. Typical in administrative
    requests and polite notices.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: 'παρακαλώ να + υποτακτική / παρακαλείστε να (passive: you are requested
      to)'
    register: polite / formal
  keg_communicative_function: Formulating polite administrative inquiries and understanding
    official notices
  example_el: Παρακαλώ να μου στείλετε την επιβεβαίωση της εγγραφής μου.
  example_en: I kindly request that you send me the confirmation of my registration.
  example2_el: Παρακαλείστε να παραμείνετε στις θέσεις σας μέχρι τη λήξη της εξέτασης.
  example2_en: You are requested to remain in your seats until the end of the examination.
  audio: parakalo-na-718c92.mp3
  status: verified
  example_audio: parakalo-na-moy-stei-82b26d.mp3
  example2_audio: parakaleiste-na-para-45bce9.mp3
- id: A2-U04-012
  greek: φοβάμαι μήπως
  english: I fear that / I am afraid lest
  notes: Deponent verb 'φοβάμαι' followed by 'μήπως / να'. Expresses anxiety or potential
    negative outcome.
  gender_or_pos: verb phrase
  grammatical_info:
    part_of_speech: verb phrase
    syntax: φοβάμαι μήπως + υποτακτική
    noun_derivative: ο φόβος
  keg_communicative_function: Expressing apprehension about exam results, weather,
    or travel delays
  example_el: Φοβάμαι μήπως χάσουμε την πτήση αν έχει πολλή κίνηση στον δρόμο.
  example_en: I am afraid lest we miss the flight if there is heavy traffic on the
    road.
  example2_el: Φοβάται να μιλήσει μπροστά σε κοινό επειδή ντρέπεται.
  example2_en: He is afraid to speak in front of an audience because he is shy.
  audio: fovamai-mipos-22d474.mp3
  status: verified
  example_audio: fovamai-mipos-chasoy-903a91.mp3
  example2_audio: fovatai-na-milisei-m-ccdf74.mp3
- id: A2-U04-013
  greek: είναι απαραίτητο να
  english: it is essential to / it is necessary to
  notes: Impersonal evaluative structure taking subjunctive. Standard in formal instructions.
  gender_or_pos: impersonal phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: είναι απαραίτητο να + υποτακτική
    adjective: απαραίτητος, -η, -ο
  keg_communicative_function: Stating indispensable conditions and prerequisite qualifications
  example_el: Είναι απαραίτητο να γνωρίζετε καλά γραμματική για το επίπεδο Α2.
  example_en: It is essential to know grammar well for level A2.
  example2_el: Είναι απαραίτητο να προσκομίσετε φωτοτυπία του διαβατηρίου σας.
  example2_en: It is essential to provide a photocopy of your passport.
  audio: einai-aparaitito-na-99c93a.mp3
  status: verified
  example_audio: einai-aparaitito-na--ef4a3a.mp3
  example2_audio: einai-aparaitito-na--f05dbd.mp3
- id: A2-U04-014
  greek: είναι σημαντικό να
  english: it is important to
  notes: Evaluative impersonal expression followed by subjunctive.
  gender_or_pos: impersonal phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: είναι σημαντικό να + υποτακτική
    adjective: σημαντικός, -ή, -ό
  keg_communicative_function: Highlighting crucial advice and recommendations in essays
    and presentations
  example_el: Είναι σημαντικό να κοιμηθείτε καλά το βράδυ πριν από τις εξετάσεις.
  example_en: It is important to sleep well the night before the examinations.
  example2_el: Είναι σημαντικό να ακούτε προσεκτικά τις οδηγίες των επιτηρητών.
  example2_en: It is important to listen carefully to the invigilators' instructions.
  audio: einai-simantiko-na-dea267.mp3
  status: verified
  example_audio: einai-simantiko-na-k-85d337.mp3
  example2_audio: einai-simantiko-na-a-3c6558.mp3
- id: A2-U04-015
  greek: αξίζει να
  english: it is worth doing / it pays to
  notes: Impersonal phrase with 'αξίζει' + subjunctive. Core expression when recommending
    sights and experiences.
  gender_or_pos: impersonal phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: αξίζει να + υποτακτική
    noun_derivative: η αξία
  keg_communicative_function: Recommending attractions, museums, and activities to
    tourists and friends
  example_el: Αξίζει να επισκεφτείτε το Μουσείο της Ακρόπολης όταν έρθετε στην Αθήνα.
  example_en: It is worth visiting the Acropolis Museum when you come to Athens.
  example2_el: Αξίζει να προσπαθήσετε, ακόμα κι αν η δοκιμασία φαίνεται δύσκολη.
  example2_en: It is worth trying, even if the test seems difficult.
  audio: axizei-na-fe7259.mp3
  status: verified
  example_audio: axizei-na-episkeftei-c761b4.mp3
  example2_audio: axizei-na-prospathis-8c5a3d.mp3
- id: A2-U04-016
  greek: είναι δύσκολο να
  english: it is difficult to
  notes: 'Evaluative impersonal structure with subjunctive. Antonym: ''είναι εύκολο
    να''.'
  gender_or_pos: impersonal phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: είναι δύσκολο να + υποτακτική
    antonym: είναι εύκολο να
  keg_communicative_function: Discussing learning difficulties and obstacles in oral
    interviews
  example_el: Στην αρχή ήταν δύσκολο να καταλάβω τους φυσικούς ομιλητές όταν μιλούσαν
    γρήγορα.
  example_en: At first it was difficult to understand native speakers when they spoke
    quickly.
  example2_el: Είναι δύσκολο να βρεις θέση στάθμευσης στο κέντρο της πόλης.
  example2_en: It is difficult to find a parking space in the city center.
  audio: einai-dyskolo-na-d671c8.mp3
  status: verified
  example_audio: stin-archi-itan-dysk-73203b.mp3
  example2_audio: einai-dyskolo-na-vre-f5f5f6.mp3
- id: A2-U04-017
  greek: είναι εύκολο να
  english: it is easy to
  notes: 'Evaluative impersonal structure with subjunctive. Antonym: ''είναι δύσκολο
    να''.'
  gender_or_pos: impersonal phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: είναι εύκολο να + υποτακτική
    adjective: εύκολος, -η, -ο
  keg_communicative_function: Expressing ease of navigation, learning, or communication
  example_el: Είναι εύκολο να μετακινηθείτε στην Αθήνα χρησιμοποιώντας το μετρό.
  example_en: It is easy to get around Athens using the metro.
  example2_el: Μετά από συνεχή εξάσκηση, είναι εύκολο να θυμάσαι τις καταλήξεις των
    ρημάτων.
  example2_en: After continuous practice, it is easy to remember verb endings.
  audio: einai-eykolo-na-6eb27a.mp3
  status: verified
  example_audio: einai-eykolo-na-meta-d64a8c.mp3
  example2_audio: meta-apo-synechi-exa-c877af.mp3
- id: A2-U04-018
  greek: έχω ανάγκη να
  english: I need to / I have a need to
  notes: 'Idiomatic locution expressing pressing necessity: ''έχω ανάγκη να'' + subjunctive.'
  gender_or_pos: idiomatic phrase
  grammatical_info:
    part_of_speech: phrase
    syntax: έχω ανάγκη να + υποτακτική / έχω ανάγκη από + αιτιατική
    noun: η ανάγκη
  keg_communicative_function: Stating urgent personal requirements and seeking assistance
  example_el: Έχω μεγάλη ανάγκη να ξεκουραστώ μετά από μια εξαντλητική εβδομάδα εργασίας.
  example_en: I really need to rest after an exhausting week of work.
  example2_el: Έχουμε ανάγκη από περισσότερες πληροφορίες πριν πάρουμε την τελική
    απόφαση.
  example2_en: We need more information before we make the final decision.
  audio: echo-anagki-na-4dd695.mp3
  status: verified
  example_audio: echo-megali-anagki-n-145dd7.mp3
  example2_audio: echoyme-anagki-apo-p-691729.mp3
- id: A2-U04-019
  greek: η ανάγκη
  english: need / necessity / emergency
  notes: Feminine noun in -η (-ες). In plural 'σε περίπτωση ανάγκης' means 'in case
    of emergency'.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι ανάγκες
    collocation: σε περίπτωση ανάγκης (in case of emergency)
  keg_communicative_function: Identifying safety signs, urgent requirements, and personal
    necessities
  example_el: Σε περίπτωση ανάγκης καλέστε αμέσως τον ευρωπαϊκό αριθμό 112.
  example_en: In case of emergency immediately call the European number 112.
  example2_el: Το πρόγραμμα προσαρμόζεται στις ανάγκες κάθε υποψηφίου.
  example2_en: The program is adapted to the needs of each candidate.
  audio: i-anagki-37d6c8.mp3
  status: verified
  example_audio: se-periptosi-anagkis-a1467d.mp3
  example2_audio: to-programma-prosarm-bc5082.mp3
- id: A2-U04-020
  greek: η επιθυμία
  english: desire / wish
  notes: Feminine noun in -α (-ες). Relates to 'επιθυμώ' (to desire/wish).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι επιθυμίες
    verb: επιθυμώ (-είς)
    genitive_singular: της επιθυμίας
  keg_communicative_function: Expressing personal aspirations and customer preferences
  example_el: Εξέφρασε την επιθυμία να συνεχίσει τις σπουδές του στην Ελλάδα.
  example_en: He expressed the desire to continue his studies in Greece.
  example2_el: Σεβόμαστε τις επιθυμίες και τις επιλογές των πελατών μας.
  example2_en: We respect the desires and choices of our clients.
  audio: i-epithymia-0d6cc7.mp3
  status: verified
  example_audio: exefrase-tin-epithym-13fc77.mp3
  example2_audio: sevomaste-tis-epithy-671826.mp3
- id: A2-U04-021
  greek: η υποχρέωση
  english: obligation / duty
