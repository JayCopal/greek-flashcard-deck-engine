  example_el: Λόγω της κακοκαιρίας και των ισχυρών ανέμων υπήρξε ακύρωση δρομολογίων
    στα πλοία.
  example_en: Due to bad weather and high winds, there was a cancellation of ferry
    services.
  example2_el: Σε περίπτωση ακύρωσης δρομολογίου, δικαιούστε πλήρη επιστροφή του εισιτηρίου.
  example2_en: In case of trip cancellation, you are entitled to a full ticket refund.
