unit_id: unit-a2p2-06
lesson_id: lesson-01
title: 'Μάθημα 6: Ταξίδια, Μεταφορές & Προσανατολισμός στην Πόλη (Travel, Transit
  & Urban Navigation)'
description: Navigating airports, ports, train and metro stations, booking tickets,
  interpreting transit delays, and giving or following detailed city street directions
  for the KEG A2 Listening and Speaking exams.
lesson_status: not_started
lesson_notes: "Unit A2P2-06 Core Notes: Ταξίδια, Μεταφορές & Προσανατολισμός στην\
  \ Πόλη (Travel, Transit & Urban Navigation)\n• Official KEG A2 Exam Alignment:\n\
  \  - Listening Section 1 & 2: Transport announcements at airports (πτήση, κάρτα\
  \ επιβίβασης, πύλη, καθυστέρηση) and ports (λιμάνι, πλοίο της γραμμής, αποβάθρα).\n\
  \  - Speaking Stage 2 & 3: Ticket booking (εισιτήριο με επιστροφή, απλό εισιτήριο),\
  \ transit transfers (αλλάζω γραμμή, ανταπόκριση).\n  - Street Directions & Orientation:\
  \ Locative adverbs and navigation imperatives (στρίβω δεξιά/αριστερά, πηγαίνω ευθεία,\
  \ στο φανάρι, στη διασταύρωση, απέναντι, δίπλα, ανάμεσα)."
entries:
- id: A2P2-U06-001
  greek: το αεροδρόμιο
  english: airport
  notes: 'Compound noun: αέρας + δρόμος. Genitive: του αεροδρομίου.'
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun
    gender: neuter
    genitive: του αεροδρομίου
    plural: τα αεροδρόμια
  keg_communicative_function: Navigating airport environments and transit connections
  example_el: Πρέπει να φτάσουμε στο αεροδρόμιο τουλάχιστον δύο ώρες πριν από την
    πτήση.
  example_en: We must arrive at the airport at least two hours before the flight.
  example2_el: Το διεθνές αεροδρόμιο της Αθήνας συνδέεται με το μετρό και τον προαστιακό.
  example2_en: Athens International Airport is connected with the metro and suburban
    railway.
  audio: to-aerodromio-c8faeb.mp3
