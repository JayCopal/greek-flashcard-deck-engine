unit_id: unit-sp-01
lesson_id: lesson-01
title: 'Προφορικά SP-01: Προσωπική Συνέντευξη & Ζέσταμα (Stage 1 Examiner Q&A Drills)'
description: '40 rapid examiner question-and-answer drills for Stage 1 of the KEG
  A2 Speaking exam: personal identity, family, daily routine, work/studies, weekend
  habits, hobbies, neighborhood, and motivation for learning Greek.'
lesson_status: not_started
lesson_notes: "Module SP-01 Core Notes: Προσωπική Συνέντευξη & Ζέσταμα (Stage 1 Examiner\
  \ Q&A Drills)\n• Official KEG A2 Exam Alignment (Stage 1 — ~2–3 minutes):\n  - Covers\
  \ all 5 personal interview domains: Personal identity & family (001–008), Daily\
  \ routine & work/studies (009–016), Free time & weekend habits (017–024), Home &\
  \ neighborhood life (025–032), and Why Greek? / Travel / Future goals (033–040).\n\
  \  - High-Score Strategy: Avoid one-word or bare 3-word replies. Answer using the\
  \ Rule of Three: Direct Answer + Reason/Connector (γιατί, επειδή, όταν, αλλά) +\
  \ Concrete Detail."
entries:
- id: SP-U01-001
  greek: Πώς σας λένε και από πού είστε;
  english: What is your name and where are you from? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Personal introduction, origin prepositions (από + accusative), present
      tense of είμαι and μένω
  notes: 'Examiner Objective: Warm-up check on basic self-introduction, nationality/origin,
    and current residence.

    Strategy: State full name, city/country of origin, and add how long you have lived
    in your current city.'
  example_el: Με λένε Μαρία Σμιθ και είμαι από το Λονδίνο της Αγγλίας, αλλά τα τελευταία
    τρία χρόνια μένω μόνιμα στην Αθήνα μαζί με τον σύζυγό μου.
  example_en: My name is Maria Smith and I am from London, England, but for the last
    three years I have been living permanently in Athens with my husband.
  example2_el: Ονομάζομαι Νίκος Μπράουν, κατάγομαι από τον Καναδά και ζω στη Θεσσαλονίκη
    εδώ και δύο χρόνια επειδή εργάζομαι σε μια ελληνική εταιρεία.
  example2_en: My name is Nikos Brown, I come from Canada and I have been living in
    Thessaloniki for two years because I work at a Greek company.
  keg_communicative_function: Introducing oneself, stating origin and current place
    of residence
  audio: pos-sas-lene-kai-apo-1887fb.mp3
  example_audio: me-lene-maria-smith--550cce.mp3
  example2_audio: onomazomai-nikos-mpr-625047.mp3
- id: SP-U01-002
  greek: Σε ποια πόλη μένετε τώρα και πόσο καιρό ζείτε εκεί;
  english: Which city do you live in now and how long have you been living there?
    (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Duration expressions (εδώ και + accusative / τα τελευταία + time), locative
      prepositions (σε + accusative)
  notes: 'Examiner Objective: Tests ability to express duration of an ongoing state
    using Present Tense in Greek.

    Strategy: Never use English-style perfect tense here; use Present Tense + ''εδώ
    και'' or ''τα τελευταία χρόνια''.'
  example_el: Τώρα μένω στη Λεμεσό της Κύπρου και ζω εκεί εδώ και τέσσερα χρόνια,
    γιατί μου αρέσει πολύ το ζεστό κλίμα και η θάλασσα.
  example_en: Now I live in Limassol, Cyprus, and I have been living there for four
    years because I really like the warm climate and the sea.
  example2_el: Αυτή την περίοδο μένω στο Ηράκλειο της Κρήτης τα τελευταία δύο χρόνια
    και είμαι πολύ ευχαριστημένος με την καθημερινότητά μου εκεί.
  example2_en: During this period I have been living in Heraklion, Crete for the last
    two years and I am very pleased with my daily life there.
  keg_communicative_function: Expressing place of residence and duration of stay using
    present tense time markers
  audio: se-poia-poli-menete--efe2c3.mp3
  example_audio: tora-meno-sti-lemeso-b204ee.mp3
  example2_audio: ayti-tin-periodo-men-d848d7.mp3
- id: SP-U01-003
  greek: Πείτε μου λίγα λόγια για την οικογένειά σας.
  english: Tell me a few words about your family. (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Family kinship nouns, possessive clitics (μου, μας), cardinal numbers and
      professions
  notes: 'Examiner Objective: Evaluates vocabulary of family members, basic age/profession
    descriptors, and relational cohesion.

    Strategy: Mention family size, immediate relatives, and one brief detail about
    what they do or where they live.'
  example_el: Έχω μια μικρή αλλά πολύ δεμένη οικογένεια. Είμαι παντρεμένος, έχω δύο
    μικρά παιδιά που πηγαίνουν στο δημοτικό σχολείο και οι γονείς μου ζουν κοντά μας.
  example_en: I have a small but very close-knit family. I am married, I have two
    young children who go to primary school, and my parents live near us.
  example2_el: Στην οικογένειά μου είμαστε τέσσερα άτομα, οι γονείς μου, η μεγαλύτερη
    αδελφή μου που είναι γιατρός και εγώ, και μιλάμε στο τηλέφωνο κάθε μέρα.
  example2_en: In my family there are four of us—my parents, my older sister who is
    a doctor, and me—and we talk on the phone every day.
  keg_communicative_function: Describing immediate family structure and family members'
    occupations
  audio: peite-moy-liga-logia-edad01.mp3
  example_audio: echo-mia-mikri-alla--e1137d.mp3
  example2_audio: stin-oikogeneia-moy--0176f7.mp3
- id: SP-U01-004
  greek: Έχετε αδέλφια ή άλλα κοντινά πρόσωπα στην οικογένειά σας;
  english: Do you have siblings or other close people in your family? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Comparative adjectives (μεγαλύτερος, μικρότερος), accusative object forms,
      interpersonal expressions
  notes: 'Examiner Objective: Checks comparison of ages and personality/relationship
    descriptions.

    Strategy: Even if you are an only child (μοναχοπαίδι), expand by talking about
    cousins or close relatives.'
  example_el: Ναι, έχω έναν μεγαλύτερο αδελφό που μένει στη Γερμανία και μια μικρότερη
    αδελφή που σπουδάζει ακόμα, και τα πηγαίνουμε εξαιρετικά μεταξύ μας.
  example_en: Yes, I have an older brother who lives in Germany and a younger sister
    who is still studying, and we get along excellently with each other.
  example2_el: Όχι, είμαι μοναχοπαίδι και δεν έχω αδέλφια, αλλά έχω δύο πρώτα ξαδέλφια
    στην ίδια ηλικία με εμένα και είμαστε σαν αδέλφια από παιδιά.
  example2_en: No, I am an only child and do not have siblings, but I have two first
    cousins the same age as me and we have been like siblings since childhood.
  keg_communicative_function: Describing siblings, age comparisons, and family closeness
  audio: echete-adelfia-i-all-456712.mp3
  example_audio: nai-echo-enan-megaly-4f6e4b.mp3
  example2_audio: ochi-eimai-monachopa-3c2afb.mp3
- id: SP-U01-005
  greek: Πώς είναι ο χαρακτήρας του καλύτερού σας φίλου ή της καλύτερής σας φίλης;
  english: What is the personality of your best friend like? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Personality adjectives (κοινωνικός, ευγενικός, υπομονετικός, ειλικρινής),
      causal clauses with γιατί/επειδή
  notes: 'Examiner Objective: Tests descriptive adjectives of character and ability
    to justify why you value someone.

    Strategy: Use 2-3 character adjectives and give a concrete example of how they
    support you.'
  example_el: Η καλύτερή μου φίλη λέγεται Ελένη και είναι πολύ ευγενική, ειλικρινής
    και αισιόδοξη κοπέλα, γιατί πάντα με ακούει με υπομονή όταν έχω κάποιο πρόβλημα.
  example_en: My best friend is called Eleni and she is a very polite, honest, and
    optimistic girl, because she always listens to me patiently when I have a problem.
  example2_el: Ο καλύτερός μου φίλος είναι ο Κώστας, ένας πολύ κοινωνικός και γενναιόδωρος
    άνθρωπος με υπέροχο χιούμορ, που με κάνει πάντα να γελάω όταν βρισκόμαστε.
  example2_en: My best friend is Kostas, a very sociable and generous person with
    a wonderful sense of humor, who always makes me laugh when we meet up.
  keg_communicative_function: Describing character traits and explaining personal
    friendships
  audio: pos-einai-o-charakti-0c3ba5.mp3
  example_audio: i-kalyteri-moy-fili--fdb852.mp3
  example2_audio: o-kalyteros-moy-filo-641d6f.mp3
- id: SP-U01-006
  greek: Πόσο συχνά βλέπετε τους συγγενείς και τους φίλους σας;
  english: How often do you see your relatives and friends? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Frequency expressions (μία φορά την εβδομάδα, κάθε σαββατοκύριακο, σπάνια),
      plural accusative nouns
  notes: 'Examiner Objective: Assesses mastery of frequency adverbs and contrast between
    nearby friends vs. distant relatives.

    Strategy: Contrast how often you meet local friends in person versus speaking
    with distant relatives online.'
  example_el: Τους φίλους μου τους βλέπω σχεδόν κάθε σαββατοκύριακο για καφέ ή φαγητό,
    ενώ τους συγγενείς μου τους επισκέπτομαι δύο φορές τον χρόνο στις γιορτές.
  example_en: I see my friends almost every weekend for coffee or food, whereas I
    visit my relatives twice a year during the holidays.
  example2_el: Επειδή δουλεύω αρκετές ώρες τις καθημερινές, συναντώ τους φίλους μου
    μία φορά την εβδομάδα, αλλά μιλάω με τους γονείς μου μέσω βιντεοκλήσης κάθε Κυριακή.
  example2_en: Because I work quite a few hours on weekdays, I meet my friends once
    a week, but I speak with my parents via video call every Sunday.
  keg_communicative_function: Stating frequency of social and family contact
  audio: poso-sychna-vlepete--db7ccf.mp3
  example_audio: toys-filoys-moy-toys-de1698.mp3
  example2_audio: epeidi-doyleyo-arket-d32a14.mp3
- id: SP-U01-007
  greek: Ποια είναι η οικογενειακή σας κατάσταση και με ποιον μένετε;
  english: What is your marital status and who do you live with? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Marital status adjectives (ελεύθερος/η, παντρεμένος/η), accompaniment (μαζί
      με + accusative), verb συγκατοικώ
  notes: 'Examiner Objective: Checks accurate gender agreement on status adjectives
    (παντρεμένος/παντρεμένη, ελεύθερος/ελεύθερη).

    Strategy: Make sure adjective endings match your grammatical gender and mention
    household dynamics.'
  example_el: Είμαι παντρεμένη εδώ και πέντε χρόνια και μένω σε ένα φωτεινό διαμέρισμα
    με τον άντρα μου, την κόρη μας και έναν μικρό σκύλο.
  example_en: I have been married for five years and I live in a bright apartment
    with my husband, our daughter, and a small dog.
  example2_el: Αυτή τη στιγμή είμαι ελεύθερος και συγκατοικώ με έναν καλό μου φίλο
    από το πανεπιστήμιο, ώστε να μοιραζόμαστε τα έξοδα του σπιτιού.
  example2_en: Right now I am single and share an apartment with a good friend of
    mine from university so that we split the household expenses.
  keg_communicative_function: Describing marital status and household living arrangements
  audio: poia-einai-i-oikogen-596076.mp3
  example_audio: eimai-pantremeni-edo-1e624b.mp3
  example2_audio: ayti-ti-stigmi-eimai-92a2c4.mp3
- id: SP-U01-008
  greek: Τι σας αρέσει να κάνετε όταν περνάτε χρόνο με την οικογένειά σας;
  english: What do you like to do when you spend time with your family? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Impersonal construction (μας αρέσει να + first plural subjunctive), temporal
      clauses with όταν
  notes: 'Examiner Objective: Tests first-person plural verb forms (-ουμε / -όμαστε)
    and shared family routines.

    Strategy: Describe both an indoor habit (cooking, board games) and an outdoor
    activity (excursions).'
  example_el: Όταν είμαστε όλοι μαζί, μας αρέσει να μαγειρεύουμε παραδοσιακά φαγητά
    την Κυριακή το μεσημέρι και να συζητάμε γύρω από το τραπέζι για τα νέα μας.
  example_en: When we are all together, we like to cook traditional dishes on Sunday
    afternoon and chat around the table about our news.
  example2_el: Μας αρέσει πολύ να πηγαίνουμε ημερήσιες εκδρομές στη φύση με το αυτοκίνητο
    ή να βλέπουμε όλοι μαζί μια ωραία ταινία το βράδυ στο σαλόνι.
  example2_en: We really like going on day trips to nature by car or watching a nice
    movie all together in the evening in the living room.
  keg_communicative_function: Expressing shared family activities and preferences
  audio: ti-sas-aresei-na-kan-46fb14.mp3
  example_audio: otan-eimaste-oloi-ma-106ba9.mp3
  example2_audio: mas-aresei-poly-na-p-419a55.mp3
- id: SP-U01-009
  greek: Τι δουλειά κάνετε και πώς είναι το ωράριό σας;
  english: What job do you do and what are your working hours like? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Professions without indefinite article (είμαι/εργάζομαι ως), time expressions
      (από τις... μέχρι τις...)
  notes: 'Examiner Objective: Tests profession vocabulary and telling time in the
    accusative plural (από τις εννέα ως τις πέντε).

    Strategy: State your occupation, workplace type, and whether your schedule is
    fixed or flexible.'
  example_el: Εργάζομαι ως λογιστής σε μια ιδιωτική εταιρεία και έχω σταθερό ωράριο,
    από τις εννέα το πρωί μέχρι τις πέντε το απόγευμα, από Δευτέρα έως Παρασκευή.
  example_en: I work as an accountant at a private company and I have fixed hours,
    from nine in the morning until five in the afternoon, Monday through Friday.
  example2_el: Είμαι γραφίστρια και δουλεύω από το σπίτι μου με ευέλικτο ωράριο, αλλά
    συνήθως ξεκινάω στις οκτώμισι το πρωί και τελειώνω νωρίς το απόγευμα.
  example2_en: I am a graphic designer and I work from home with a flexible schedule,
    but I usually start at eight-thirty in the morning and finish early in the afternoon.
  keg_communicative_function: Describing occupation, workplace, and working hours
  audio: ti-doyleia-kanete-ka-8ea949.mp3
  example_audio: ergazomai-os-logisti-df0c1d.mp3
  example2_audio: eimai-grafistria-kai-909e6d.mp3
- id: SP-U01-010
  greek: Πώς είναι μια τυπική μέρα σας από το πρωί ως το βράδυ;
  english: What is a typical day of yours like from morning to night? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Reflexive/middle voice routine verbs (ξυπνάω, ετοιμάζομαι, ξεκουράζομαι,
      κοιμάμαι), chronological connectors (πρώτα, μετά, τέλος)
  notes: 'Examiner Objective: Core A2 check on daily routine verbs and chronological
    sequencing.

    Strategy: Structure into Morning (πρωί), Afternoon (μεσημέρι/απόγευμα), and Evening
    (βράδυ) using connectors.'
  example_el: Ξυπνάω στις επτά το πρωί, πίνω έναν καφέ και πηγαίνω στη δουλειά μου.
    Το απόγευμα γυρίζω στο σπίτι, μαγειρεύω κάτι ελαφρύ και το βράδυ διαβάζω ελληνικά.
  example_en: I wake up at seven in the morning, drink a coffee, and go to work. In
    the afternoon I return home, cook something light, and in the evening I study
    Greek.
  example2_el: Κάθε πρωί ετοιμάζομαι γρήγορα, παίρνω το μετρό για το γραφείο και μετά
    τη δουλειά πηγαίνω στο γυμναστήριο πριν επιστρέψω στο σπίτι για δείπνο και ξεκούραση.
  example2_en: Every morning I get ready quickly, take the metro to the office, and
    after work I go to the gym before returning home for dinner and rest.
  keg_communicative_function: Narrating daily routines in chronological sequence
  audio: pos-einai-mia-typiki-e58f99.mp3
  example_audio: xypnao-stis-epta-to--d9b34e.mp3
  example2_audio: kathe-proi-etoimazom-2e79f8.mp3
- id: SP-U01-011
  greek: Σας αρέσει η δουλειά σας ή οι σπουδές σας; Γιατί;
  english: Do you like your job or your studies? Why? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Causal subordination (επειδή, γιατί), evaluative adjectives (δημιουργικός,
      ενδιαφέρων, κουραστικός), concession (παρόλο που)
  notes: 'Examiner Objective: Tests ability to express job/study satisfaction with
    balanced pros and cons.

    Strategy: Give a positive reason first, then add a realistic minor challenge using
    ''παρόλο που'' or ''αλλά''.'
  example_el: Ναι, μου αρέσει πάρα πολύ η δουλειά μου επειδή είναι δημιουργική και
    συνεργάζομαι με ευγενικούς συναδέλφους, παρόλο που μερικές φορές έχει αρκετό άγχος.
  example_en: Yes, I like my job very much because it is creative and I work with
    polite colleagues, even though sometimes it has quite a bit of stress.
  example2_el: Οι σπουδές μου στην πληροφορική μού αρέσουν πολύ γιατί μαθαίνω συνέχεια
    καινούργια πράγματα και πιστεύω ότι θα βρω εύκολα μια καλή εργασία στο μέλλον.
  example2_en: I like my studies in computer science very much because I am constantly
    learning new things and I believe I will easily find a good job in the future.
  keg_communicative_function: Expressing and justifying satisfaction with work or
    studies
  audio: sas-aresei-i-doyleia-6ed243.mp3
  example_audio: nai-moy-aresei-para--c85409.mp3
  example2_audio: oi-spoydes-moy-stin--4db6c2.mp3
- id: SP-U01-012
  greek: Πώς πηγαίνετε συνήθως στη δουλειά σας και πόση ώρα διαρκεί η διαδρομή;
  english: How do you usually get to work and how long does the commute take? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Means of transport (με το λεωφορείο, με το μετρό, με τα πόδια), duration
      verb (διαρκεί / μου παίρνει + minutes)
  notes: 'Examiner Objective: Assesses transport vocabulary and commuting duration
    descriptions.

    Strategy: Mention the vehicle you take, traffic conditions (κίνηση), and what
    you do during the commute.'
  example_el: Συνήθως πηγαίνω στη δουλειά μου με τον ηλεκτρικό σιδηρόδρομο γιατί έχει
    πολλή κίνηση στους δρόμους, και η διαδρομή διαρκεί περίπου τριάντα λεπτά.
  example_en: I usually go to work by electric train because there is a lot of traffic
    on the roads, and the commute lasts about thirty minutes.
  example2_el: Επειδή το γραφείο μου βρίσκεται αρκετά κοντά στο σπίτι μου, προτιμώ
    να πηγαίνω με τα πόδια κάθε πρωί και κάνω μόνο δεκαπέντε λεπτά.
  example2_en: Because my office is located quite close to my home, I prefer to go
    on foot every morning and it only takes me fifteen minutes.
  keg_communicative_function: Describing daily commuting means and travel duration
  audio: pos-pigainete-synith-bd7358.mp3
  example_audio: synithos-pigaino-sti-30c142.mp3
  example2_audio: epeidi-to-grafeio-mo-ef5c0c.mp3
- id: SP-U01-013
  greek: Τι σπουδάσατε στο πανεπιστήμιο ή τι επάγγελμα θα θέλατε να κάνετε;
  english: What did you study at university or what profession would you like to do?
    (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: 'Simple Past (Αόριστος: σπούδασα, τελείωσα) and Conditional desire (θα
      ήθελα να + subjunctive)'
  notes: 'Examiner Objective: Tests shift from Present to Simple Past (Αόριστος) for
    educational background or Conditional for career goals.

    Strategy: Combine past studies (''σπούδασα...'') with present work or future aspirations
    (''θα ήθελα να...'').'
  example_el: Σπούδασα οικονομικά στο πανεπιστήμιο της πόλης μου πριν από δέκα χρόνια
    και στο μέλλον θα ήθελα πολύ να ανοίξω το δικό μου λογιστικό γραφείο.
  example_en: I studied economics at my city's university ten years ago, and in the
    future I would really like to open my own accounting office.
  example2_el: Τελείωσα τη σχολή ιστορίας και αρχαιολογίας γιατί αγαπώ τον αρχαίο
    πολιτισμό, και τώρα θα ήθελα να εργαστώ ως ξεναγός σε μουσεία της Ελλάδας.
  example2_en: I graduated from the school of history and archaeology because I love
    ancient civilization, and now I would like to work as a tour guide in museums
    in Greece.
  keg_communicative_function: Recounting educational background and stating future
    career ambitions
  audio: ti-spoydasate-sto-pa-12f9cc.mp3
  example_audio: spoydasa-oikonomika--a81b06.mp3
  example2_audio: teleiosa-ti-scholi-i-6c04ec.mp3
- id: SP-U01-014
  greek: Προτιμάτε να δουλεύετε από το σπίτι ή στο γραφείο με συναδέλφους;
  english: Do you prefer working from home or at the office with colleagues? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Preference structures (προτιμώ να + subjunctive), comparative justification,
      workplace lexicon
  notes: 'Examiner Objective: Evaluates ability to express preferences and weigh two
    options.

    Strategy: State your preference clearly and mention both efficiency/comfort and
    social contact.'
  example_el: Προτιμώ να δουλεύω στο γραφείο τρεις μέρες την εβδομάδα για να βλέπω
    τους συναδέλφους μου, και τις υπόλοιπες δύο μέρες από το σπίτι με ησυχία.
  example_en: I prefer to work at the office three days a week so I can see my colleagues,
    and the remaining two days from home in peace and quiet.
  example2_el: Προσωπικά προτιμώ να εργάζομαι από το σπίτι μου, επειδή δεν χάνω καθόλου
    χρόνο στις μετακινήσεις το πρωί και μπορώ να συγκεντρώνομαι πολύ καλύτερα.
  example2_en: Personally I prefer working from home because I do not waste any time
    commuting in the morning and I can concentrate much better.
  keg_communicative_function: Comparing work environments and justifying personal
    preference
  audio: protimate-na-doyleye-08368f.mp3
  example_audio: protimo-na-doyleyo-s-2b7aea.mp3
  example2_audio: prosopika-protimo-na-7d220c.mp3
- id: SP-U01-015
  greek: Τι κάνετε συνήθως στο διάλειμμά σας το μεσημέρι στη δουλειά;
  english: What do you usually do during your lunch break at work? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Present tense habitual actions, food and refreshment vocabulary, prepositions
      of place
  notes: 'Examiner Objective: Tests everyday midday routine and food/socializing vocabulary.

    Strategy: Mention how long your break is, what you eat, and whether you step outside
    for fresh air.'
  example_el: Στο μεσημεριανό μου διάλειμμα, που κρατάει μία ώρα, τρώω συνήθως το
    φαγητό που έχω φέρει από το σπίτι και μετά κάνω έναν σύντομο περίπατο.
  example_en: During my lunch break, which lasts one hour, I usually eat the food
    I brought from home and afterwards take a short walk.
  example2_el: Το μεσημέρι βγαίνω μαζί με τους συναδέλφους μου σε ένα μικρό εστιατόριο
    κοντά στο γραφείο μας, όπου τρώμε μια σαλάτα και πίνουμε καφέ.
  example2_en: At noon I go out with my colleagues to a small restaurant near our
    office, where we eat a salad and drink coffee.
  keg_communicative_function: Describing midday breaks and workplace meal habits
  audio: ti-kanete-synithos-s-3498d9.mp3
  example_audio: sto-mesimeriano-moy--9c9bee.mp3
  example2_audio: to-mesimeri-vgaino-m-1d1d35.mp3
- id: SP-U01-016
  greek: Πότε έχετε τις περισσότερες υποχρεώσεις μέσα στην εβδομάδα;
  english: When do you have the most obligations during the week? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Days of the week in accusative (τη Δευτέρα, την Τετάρτη), superlative quantifier
      (τις περισσότερες υποχρεώσεις)
  notes: 'Examiner Objective: Tests days of the week with proper feminine articles
    and workload explanation.

    Strategy: Name specific days (e.g., Monday/Wednesday) and list the obligations
    (meetings, lessons, errands).'
  example_el: Έχω τις περισσότερες υποχρεώσεις τη Δευτέρα και την Τετάρτη, γιατί εκτός
    από τη δουλειά μου έχω απογευματινά μαθήματα ελληνικών και προπόνηση στο κολυμβητήριο.
  example_en: I have the most obligations on Monday and Wednesday, because besides
    my job I have afternoon Greek lessons and training at the swimming pool.
  example2_el: Οι πιο δύσκολες μέρες της εβδομάδας για εμένα είναι η Τρίτη και η Πέμπτη,
    επειδή έχουμε πολλές συναντήσεις στο γραφείο και γυρίζω αργά στο σπίτι.
  example2_en: The hardest days of the week for me are Tuesday and Thursday, because
    we have many meetings at the office and I return home late.
  keg_communicative_function: Identifying busy days of the week and explaining weekly
    obligations
  audio: pote-echete-tis-peri-7c4e48.mp3
  example_audio: echo-tis-perissotere-757bfd.mp3
  example2_audio: oi-pio-dyskoles-mere-14d010.mp3
- id: SP-U01-017
  greek: Πώς περνάτε συνήθως τα σαββατοκύριακά σας;
  english: How do you usually spend your weekends? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Habitual aspect, leisure vocabulary, frequency adverbs and weather conditions
      (όταν ο καιρός είναι καλός)
  notes: 'Examiner Objective: Tests present tense fluency and connector usage (συνήθως,
    μερικές φορές, όταν).

    Strategy: Avoid one-word answers. Follow the Rule of Three: Saturday activity
    + Sunday activity + weather condition.'
  example_el: Τα σαββατοκύριακα συνήθως ξεκουράζομαι στο σπίτι, αλλά όταν ο καιρός
    είναι καλός, μου αρέσει να πηγαίνω μεγάλες βόλτες δίπλα στη θάλασσα με τους φίλους
    μου.
  example_en: On weekends I usually rest at home, but when the weather is fine, I
    enjoy taking long walks by the sea with my friends.
  example2_el: Το Σάββατο το πρωί κάνω τα ψώνια της εβδομάδας στη λαϊκή αγορά και
    την Κυριακή μαγειρεύω για όλη την οικογένεια και βλέπουμε ταινίες.
  example2_en: On Saturday morning I do the week's shopping at the farmers' market,
    and on Sunday I cook for the whole family and we watch movies.
  keg_communicative_function: Describing weekend routines and habitual leisure activities
  audio: pos-pernate-synithos-b04253.mp3
  example_audio: ta-savvatokyriaka-sy-115947.mp3
  example2_audio: to-savvato-to-proi-k-b74cc2.mp3
- id: SP-U01-018
  greek: Έχετε κάποιο αγαπημένο χόμπι ή ασχολείστε με κάποιο άθλημα;
  english: Do you have a favorite hobby or do you play any sport? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Deponent verb ασχολούμαι με + accusative, sports/hobby collocations (παίζω
      τένις, κάνω γιόγκα/ποδήλατο)
  notes: 'Examiner Objective: Checks accurate use of ''ασχολούμαι με'' and ''κάνω/παίζω''
    with sports and hobbies.

    Strategy: State the hobby/sport, how often you practice it, and how it makes you
    feel (με βοηθάει να χαλαρώνω).'
  example_el: Ναι, στον ελεύθερό μου χρόνο ασχολούμαι με τη φωτογραφία και τρεις φορές
    την εβδομάδα κάνω τρέξιμο στο πάρκο, γιατί με βοηθάει να διώχνω το άγχος.
  example_en: Yes, in my free time I do photography and three times a week I go running
    in the park, because it helps me relieve stress.
  example2_el: Το αγαπημένο μου άθλημα είναι η κολύμβηση και πηγαίνω στη θάλασσα ή
    στο κολυμβητήριο κάθε Σάββατο, ενώ στο σπίτι μου αρέσει να παίζω κιθάρα.
  example2_en: My favorite sport is swimming and I go to the sea or the pool every
    Saturday, while at home I like playing the guitar.
  keg_communicative_function: Discussing hobbies, sports, and their benefits for well-being
  audio: echete-kapoio-agapim-dbc47d.mp3
  example_audio: nai-ston-eleythero-m-7908c8.mp3
  example2_audio: to-agapimeno-moy-ath-e43a45.mp3
- id: SP-U01-019
  greek: Τι είδους μουσική ακούτε και τι βιβλία προτιμάτε να διαβάζετε;
  english: What kind of music do you listen to and what books do you prefer to read?
    (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Cultural genre adjectives (έντεχνη μουσική, αστυνομικά μυθιστορήματα, ιστορικά
      βιβλία), temporal clauses
  notes: 'Examiner Objective: Tests cultural/artistic vocabulary and ability to connect
    habits to specific moments of the day.

    Strategy: Mention Greek music if applicable (έντεχνα/λαϊκά) to show cultural engagement,
    plus your preferred book genre.'
  example_el: Μου αρέσει πολύ να ακούω ελληνική έντεχνη μουσική όταν οδηγώ, και το
    βράδυ πριν κοιμηθώ προτιμώ να διαβάζω αστυνομικά μυθιστορήματα ή ιστορικά βιβλία.
  example_en: I really like listening to Greek art-folk music when I drive, and at
    night before sleeping I prefer reading detective novels or history books.
  example2_el: Ακούω κυρίως κλασική μουσική και τζαζ όταν θέλω να συγκεντρωθώ, ενώ
    τον τελευταίο καιρό διαβάζω εύκολα ελληνικά διηγήματα για να εμπλουτίσω το λεξιλόγιό
    μου.
  example2_en: I mainly listen to classical music and jazz when I want to concentrate,
    while lately I have been reading easy Greek short stories to enrich my vocabulary.
  keg_communicative_function: Expressing tastes in music and reading material
  audio: ti-eidoys-moysiki-ak-a909fb.mp3
  example_audio: moy-aresei-poly-na-a-050824.mp3
  example2_audio: akoyo-kyrios-klasiki-946205.mp3
- id: SP-U01-020
  greek: Προτιμάτε να βλέπετε ταινίες στον κινηματογράφο ή στο σπίτι σας;
  english: Do you prefer watching movies at the cinema or at home? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Comparative adjectives (πιο άνετα, πιο οικονομικά), seasonal vocabulary
      (θερινός κινηματογράφος)
  notes: 'Examiner Objective: Assesses entertainment vocabulary and comparison of
    two leisure venues.

    Strategy: Mention Greek open-air summer cinemas (θερινό σινεμά) for an authentic
    cultural touch!'
  example_el: Τον χειμώνα προτιμώ να βλέπω ταινίες στο σπίτι μου στον καναπέ, αλλά
    το καλοκαίρι μου αρέσει πάρα πολύ να πηγαίνω σε θερινό κινηματογράφο με φίλους.
  example_en: In winter I prefer watching movies at home on the couch, but in summer
    I really love going to an open-air cinema with friends.
  example2_el: Προτιμώ τον κινηματογράφο γιατί η μεγάλη οθόνη και ο ήχος είναι εντυπωσιακά,
    και μετά την ταινία μπορούμε να πάμε για ένα ποτό και να τη σχολιάσουμε.
  example2_en: I prefer the cinema because the big screen and sound are impressive,
    and after the movie we can go for a drink and discuss it.
  keg_communicative_function: Comparing entertainment venues and explaining seasonal
    preferences
  audio: protimate-na-vlepete-9d5ed2.mp3
  example_audio: ton-cheimona-protimo-5ba7e8.mp3
  example2_audio: protimo-ton-kinimato-4b3ee6.mp3
- id: SP-U01-021
  greek: Σας αρέσει να μαγειρεύετε ή προτιμάτε να τρώτε έξω σε εστιατόρια;
  english: Do you like cooking or do you prefer eating out at restaurants? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Food & nutrition adjectives (υγιεινό, σπιτικό, νόστιμο), contrast connectors
      (τις καθημερινές... ενώ το Σάββατο...)
  notes: 'Examiner Objective: Tests culinary vocabulary and ability to distinguish
    weekday routines from weekend outings.

    Strategy: Explain that you cook healthy homemade food on weekdays and go to a
    taverna on weekends.'
  example_el: Τις καθημερινές προτιμώ να μαγειρεύω στο σπίτι γιατί το σπιτικό φαγητό
    είναι πιο υγιεινό και οικονομικό, αλλά το Σάββατο το βράδυ βγαίνουμε σε κάποια
    ταβέρνα.
  example_en: On weekdays I prefer cooking at home because homemade food is healthier
    and more economical, but on Saturday night we go out to a taverna.
  example2_el: Μου αρέσει πολύ η μαγειρική και δοκιμάζω συχνά ελληνικές συνταγές,
    όπως γεμιστά και μουσακά, όμως μία φορά την εβδομάδα τρώω έξω με την παρέα μου.
  example2_en: I really like cooking and often try Greek recipes like gemista and
    moussaka, however once a week I eat out with my group of friends.
  keg_communicative_function: Discussing cooking habits versus dining out
  audio: sas-aresei-na-mageir-b54a96.mp3
  example_audio: tis-kathimerines-pro-ac4df2.mp3
  example2_audio: moy-aresei-poly-i-ma-784d2e.mp3
- id: SP-U01-022
  greek: Πώς χρησιμοποιείτε το διαδίκτυο στον ελεύθερό σας χρόνο;
  english: How do you use the internet in your free time? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Purpose clauses (για να + subjunctive), digital/media vocabulary (ενημερώνομαι,
      επικοινωνώ, βίντεο)
  notes: 'Examiner Objective: Tests digital technology vocabulary in Greek and purpose
    clauses.

    Strategy: Mention practical uses (news, Greek learning videos, keeping in touch
    with family abroad).'
  example_el: Χρησιμοποιώ το διαδίκτυο καθημερινά για να διαβάζω τις ειδήσεις, να
    επικοινωνώ με τους φίλους μου στο εξωτερικό και να παρακολουθώ εκπαιδευτικά βίντεο
    στα ελληνικά.
  example_en: I use the internet daily to read the news, communicate with my friends
    abroad, and watch educational videos in Greek.
  example2_el: Στον ελεύθερό μου χρόνο μπαίνω στο διαδίκτυο για να ακούω μουσική,
    να βρίσκω ιδέες για ταξίδια και μερικές φορές να κάνω ηλεκτρονικές αγορές.
  example2_en: In my free time I go on the internet to listen to music, find travel
    ideas, and sometimes do online shopping.
  keg_communicative_function: Describing everyday internet use and digital habits
  audio: pos-chrisimopoieite--34c98f.mp3
  example_audio: chrisimopoio-to-diad-e5e473.mp3
  example2_audio: ston-eleythero-moy-c-c1653b.mp3
- id: SP-U01-023
  greek: Πού σας αρέσει να βγαίνετε το βράδυ με την παρέα σας;
  english: Where do you like going out in the evening with your friends? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Entertainment venues (ταβέρνα, καφετέρια, θέατρο, μπαρ), plural verbs of
      socializing (συζητάμε, διασκεδάζουμε)
  notes: 'Examiner Objective: Checks vocabulary for social venues and atmosphere adjectives
    (ήσυχος, ζωντανός).

    Strategy: Describe the type of venue and why you prefer that atmosphere (e.g.,
    quiet place where we can talk).'
  example_el: Όταν βγαίνω το βράδυ με την παρέα μου, προτιμάμε να πηγαίνουμε σε ήσυχες
    ταβέρνες με ζωντανή μουσική, όπου μπορούμε να φάμε μεζέδες και να συζητήσουμε.
  example_en: When I go out in the evening with my friends, we prefer going to quiet
    tavernas with live music, where we can eat meze and chat.
  example2_el: Μας αρέσει να πηγαίνουμε πρώτα στο θέατρο ή στον κινηματογράφο στο
    κέντρο της πόλης και μετά να καθόμαστε σε ένα όμορφο μαγαζί για ένα ποτήρι κρασί.
  example2_en: We like going first to the theater or cinema in the city center and
    afterwards sitting at a nice place for a glass of wine.
  keg_communicative_function: Describing evening social outings and preferred venues
  audio: poy-sas-aresei-na-vg-805346.mp3
  example_audio: otan-vgaino-to-vrady-67f1be.mp3
  example2_audio: mas-aresei-na-pigain-7d293d.mp3
- id: SP-U01-024
  greek: Πώς γιορτάζετε συνήθως τα γενέθλιά σας ή τις μεγάλες γιορτές;
  english: How do you usually celebrate your birthday or major holidays? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Celebration verbs (γιορτάζω, καλώ, προσφέρω), festive vocabulary (γενέθλια,
      τούρτα, δώρα)
  notes: 'Examiner Objective: Evaluates vocabulary related to celebrations, hospitality,
    and social customs.

    Strategy: Mention who you invite, whether you celebrate at home or outside, and
    a special detail.'
  example_el: Στα γενέθλιά μου συνήθως καλώ τους πιο στενούς μου φίλους στο σπίτι,
    ετοιμάζω διάφορα φαγητά και γλυκά, και περνάμε ένα πολύ ευχάριστο βράδυ μαζί.
  example_en: On my birthday I usually invite my closest friends to my home, prepare
    various dishes and sweets, and we spend a very pleasant evening together.
  example2_el: Προτιμώ να γιορτάζω τα γενέθλιά μου σε ένα ωραίο εστιατόριο δίπλα στη
    θάλασσα μαζί με την οικογένειά μου, όπου κόβουμε την τούρτα και ανταλλάσσουμε
    ευχές.
  example2_en: I prefer celebrating my birthday at a nice restaurant by the sea with
    my family, where we cut the cake and exchange wishes.
  keg_communicative_function: Describing personal celebrations and festive customs
  audio: pos-giortazete-synit-7dd4c3.mp3
  example_audio: sta-genethlia-moy-sy-8d6947.mp3
  example2_audio: protimo-na-giortazo--728c4f.mp3
- id: SP-U01-025
  greek: Σε τι είδους σπίτι μένετε τώρα; Περιγράψτε το μας λίγο.
  english: What kind of home do you live in now? Describe it to us a little. (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Housing lexicon (διαμέρισμα, μονοκατοικία, όροφος, δωμάτια), descriptive
      adjectives (φωτεινό, άνετο, ευρύχωρο)
  notes: 'Examiner Objective: Core A2 topic testing rooms of the house, floor numbers,
    and descriptive adjectives.

    Strategy: Mention housing type, floor, number of rooms, and one standout feature
    (e.g., a big balcony).'
  example_el: Μένω σε ένα φωτεινό και άνετο διαμέρισμα στον τρίτο όροφο μιας πολυκατοικίας,
    το οποίο έχει δύο υπνοδωμάτια, μεγάλο σαλόνι, κουζίνα και ένα υπέροχο μπαλκόνι.
  example_en: I live in a bright and comfortable apartment on the third floor of an
    apartment building, which has two bedrooms, a large living room, a kitchen, and
    a wonderful balcony.
  example2_el: Ζούμε σε μια μικρή μονοκατοικία λίγο έξω από το κέντρο της πόλης, που
    διαθέτει έναν όμορφο κήπο με δέντρα και λουλούδια όπου παίζουν τα παιδιά μας.
  example2_en: We live in a small detached house just outside the city center, which
    has a beautiful garden with trees and flowers where our children play.
  keg_communicative_function: Describing one's home, rooms, and layout
  audio: se-ti-eidoys-spiti-m-dd90da.mp3
  example_audio: meno-se-ena-foteino--a23411.mp3
  example2_audio: zoyme-se-mia-mikri-m-5e028c.mp3
- id: SP-U01-026
  greek: Ποιο είναι το αγαπημένο σας δωμάτιο στο σπίτι και γιατί;
  english: Which is your favorite room in the house and why? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Neuter nouns and adjectives (το αγαπημένο μου δωμάτιο, το σαλόνι), furniture
      vocabulary, relative pronoun όπου
  notes: 'Examiner Objective: Checks furniture/interior vocabulary and explanation
    of personal comfort.

    Strategy: Pick the living room, kitchen, or balcony, describe 2 pieces of furniture,
    and say what you do there.'
  example_el: Το αγαπημένο μου μέρος στο σπίτι είναι το σαλόνι, γιατί έχει μεγάλα
    παράθυρα με πολύ ήλιο, έναν αναπαυτικό καναπέ και τη βιβλιοθήκη μου όπου διαβάζω.
  example_en: My favorite place in the house is the living room, because it has large
    windows with lots of sun, a comfortable sofa, and my bookcase where I read.
  example2_el: Προτιμώ την κουζίνα και το μεγάλο μπαλκόνι μας, επειδή εκεί πίνω τον
    πρωινό μου καφέ βλέποντας τη θέα και το βράδυ μαγειρεύω ακούγοντας μουσική.
  example2_en: I prefer the kitchen and our big balcony, because that is where I drink
    my morning coffee looking at the view and in the evening I cook while listening
    to music.
  keg_communicative_function: Describing a specific room and explaining personal attachment
  audio: poio-einai-to-agapim-e1266b.mp3
  example_audio: to-agapimeno-moy-mer-94c868.mp3
  example2_audio: protimo-tin-koyzina--553065.mp3
- id: SP-U01-027
  greek: Πώς είναι η γειτονιά σας; Έχει καταστήματα και συγκοινωνίες;
  english: What is your neighborhood like? Does it have shops and public transport?
    (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Existential verbs (έχει / υπάρχουν), urban infrastructure nouns (σούπερ
      μάρκετ, φαρμακείο, στάση λεωφορείου)
  notes: 'Examiner Objective: Tests neighborhood amenities vocabulary and existential
    plural structures (''υπάρχουν...'').

    Strategy: Describe the general vibe (ήσυχη και ασφαλής) and list 3-4 practical
    shops/transport links nearby.'
  example_el: Η γειτονιά μου είναι πολύ ήσυχη και φιλική, αλλά ταυτόχρονα έχει τα
    πάντα κοντά, όπως σούπερ μάρκετ, φούρνο, φαρμακείο και σταθμό του μετρό σε πέντε
    λεπτά.
  example_en: My neighborhood is very quiet and friendly, yet at the same time it
    has everything nearby, such as a supermarket, bakery, pharmacy, and a metro station
    five minutes away.
  example2_el: Μένω σε μια ζωντανή γειτονιά κοντά στο κέντρο, όπου υπάρχουν πολλά
    μικρά μαγαζιά, ένα μεγάλο πάρκο με πράσινο και πολύ συχνές συγκοινωνίες με λεωφορεία.
  example2_en: I live in a lively neighborhood near the center, where there are many
    small shops, a large green park, and very frequent bus connections.
  keg_communicative_function: Describing neighborhood amenities, shops, and transport
    access
  audio: pos-einai-i-geitonia-3d02aa.mp3
  example_audio: i-geitonia-moy-einai-121d02.mp3
  example2_audio: meno-se-mia-zontani--47a356.mp3
- id: SP-U01-028
  greek: Τι σας αρέσει περισσότερο στη γειτονιά σας και τι θα θέλατε να αλλάξει;
  english: What do you like most about your neighborhood and what would you like to
    change? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Contrastive evaluation (μου αρέσει ότι... αλλά θα ήθελα να...), urban issues
      (πάρκινγκ, θόρυβος, καθαριότητα)
  notes: 'Examiner Objective: Assesses ability to evaluate local living conditions
    positively and critically.

    Strategy: Praise one feature (trees, safety, proximity to sea) and suggest one
    realistic urban improvement (parking, wider pavements).'
  example_el: Μου αρέσει περισσότερο ότι η γειτονιά μας έχει πολλά δέντρα και καλούς
    γείτονες, αλλά θα ήθελα να υπάρχουν περισσότερες θέσεις στάθμευσης για τα αυτοκίνητα.
  example_en: What I like most is that our neighborhood has many trees and good neighbors,
    but I would like there to be more parking spaces for cars.
  example2_el: Αυτό που αγαπώ στη γειτονιά μου είναι ότι βρίσκεται δίπλα στη θάλασσα,
    όμως θα ήθελα ο δήμος να φτιάξει καλύτερα πεζοδρόμια και λιγότερο θόρυβο το βράδυ.
  example2_en: What I love about my neighborhood is that it is right by the sea, however
    I would like the municipality to build better sidewalks and have less noise at
    night.
  keg_communicative_function: Evaluating neighborhood advantages and suggesting urban
    improvements
  audio: ti-sas-aresei-periss-556fa6.mp3
  example_audio: moy-aresei-perissote-52185d.mp3
  example2_audio: ayto-poy-agapo-sti-g-921e65.mp3
- id: SP-U01-029
  greek: Προτιμάτε τη ζωή σε μια μεγάλη πόλη ή σε ένα μικρό χωριό στην εξοχή;
  english: Do you prefer life in a big city or in a small village in the countryside?
    (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Comparative arguments, urban vs. rural lexicon (επιλογές διασκέδασης, καθαρός
      αέρας, ρυθμοί ζωής)
  notes: 'Examiner Objective: Classic KEG A2 comparison question testing city vs.
    countryside vocabulary.

    Strategy: Acknowledge the benefits of both before stating which suits your current
    stage of life.'
  example_el: Αυτή τη στιγμή προτιμώ τη ζωή στην πόλη γιατί βρίσκω πιο εύκολα δουλειά,
    νοσοκομεία και θέατρα, αλλά το καλοκαίρι λατρεύω την ηρεμία του χωριού.
  example_en: Right now I prefer city life because I find work, hospitals, and theaters
    more easily, but in the summer I adore the tranquility of the village.
  example2_el: Προτιμώ να ζω σε μια μικρή πόλη ή σε ένα χωριό κοντά στη φύση, επειδή
    ο αέρας είναι καθαρός και οι ρυθμοί της ζωής είναι πιο ανθρώπινοι.
  example2_en: I prefer living in a small town or a village close to nature, because
    the air is clean and the pace of life is more humane.
  keg_communicative_function: Comparing urban and rural lifestyles and justifying
    preferences
  audio: protimate-ti-zoi-se--af8f84.mp3
  example_audio: ayti-ti-stigmi-proti-f30426.mp3
  example2_audio: protimo-na-zo-se-mia-364032.mp3
- id: SP-U01-030
  greek: Πώς είναι οι σχέσεις σας με τους γείτονές σας;
  english: What are your relations with your neighbors like? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Reciprocal/social verbs (χαιρετιόμαστε, βοηθάμε ο ένας τον άλλον), adjectives
      of politeness (εξυπηρετικός, διακριτικός)
  notes: 'Examiner Objective: Tests social interaction vocabulary within an apartment
    building or neighborhood.

    Strategy: Describe friendly everyday gestures (saying good morning, watering plants
    when away, sharing sweets).'
  example_el: Έχω εξαιρετικές σχέσεις με τους γείτονές μου στην πολυκατοικία, χαιρετιόμαστε
    πάντα με χαμόγελο και βοηθάμε ο ένας τον άλλον όταν λείπουμε σε ταξίδι.
  example_en: I have excellent relations with my neighbors in the apartment building;
    we always greet each other with a smile and help one another when we are away
    on a trip.
  example2_el: Οι γείτονές μου είναι πολύ ευγενικοί και διακριτικοί άνθρωποι, και
    μάλιστα η κυρία που μένει στον κάτω όροφο μού φέρνει συχνά σπιτικά γλυκά.
  example2_en: My neighbors are very polite and discreet people, and in fact the lady
    who lives on the floor below often brings me homemade sweets.
  keg_communicative_function: Describing neighborly relations and community interaction
  audio: pos-einai-oi-schesei-0e7812.mp3
  example_audio: echo-exairetikes-sch-abad46.mp3
  example2_audio: oi-geitones-moy-eina-80a0d3.mp3
- id: SP-U01-031
  greek: Πού κάνετε συνήθως τα ψώνια σας για το σπίτι;
  english: Where do you usually do your household shopping? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Shopping nouns (λαϊκή αγορά, σούπερ μάρκετ, κρεοπωλείο, φούρνος), comparative
      quality/price adjectives (φρέσκα, φθηνά)
  notes: 'Examiner Objective: Tests everyday consumer vocabulary and distinction between
    specialty shops and supermarkets.

    Strategy: Contrast buying fresh produce at the ''λαϊκή αγορά'' with buying dry
    goods at the supermarket.'
  example_el: Κάθε Σάββατο πηγαίνω στη λαϊκή αγορά της γειτονιάς μου για να αγοράσω
    φρέσκα φρούτα και λαχανικά σε καλές τιμές, και τα υπόλοιπα τα παίρνω από το σούπερ
    μάρκετ.
  example_en: Every Saturday I go to my neighborhood farmers' market to buy fresh
    fruit and vegetables at good prices, and I get the rest from the supermarket.
  example2_el: Προτιμώ να ψωνίζω από τα μικρά καταστήματα της περιοχής μου, όπως τον
    φούρνο και το μανάβικο, γιατί η ποιότητα των προϊόντων είναι εξαιρετική.
  example2_en: I prefer shopping at the small local stores in my area, like the bakery
    and the greengrocer's, because the quality of the products is excellent.
  keg_communicative_function: Describing shopping habits and preferred local markets
  audio: poy-kanete-synithos--58651e.mp3
  example_audio: kathe-savvato-pigain-67849e.mp3
  example2_audio: protimo-na-psonizo-a-8aad34.mp3
- id: SP-U01-032
  greek: Πώς μοιράζεστε τις δουλειές του σπιτιού στην οικογένειά σας;
  english: How do you share the household chores in your family? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Household chore verbs (σκουπίζω, πλένω τα πιάτα, σιδερώνω, μαγειρεύω),
      distributive structure (εγώ... ενώ ο/η...)
  notes: 'Examiner Objective: Evaluates vocabulary of domestic chores and cooperative
    action.

    Strategy: Use ''εγώ αναλαμβάνω...'' and ''ενώ ο/η σύντροφός μου...'' to show clear
    sentence contrast.'
  example_el: Στο σπίτι μας μοιραζόμαστε όλες τις δουλειές δίκαια. Εγώ συνήθως μαγειρεύω
    και βάζω πλυντήριο, ενώ ο σύζυγός μου κάνει τα ψώνια και καθαρίζει το σπίτι.
  example_en: In our home we share all the chores fairly. I usually cook and do the
    laundry, while my husband does the shopping and cleans the house.
  example2_el: Επειδή μένω μόνος μου, κάνω όλες τις δουλειές του σπιτιού το Σάββατο
    το πρωί, δηλαδή σκουπίζω, τακτοποιώ τα δωμάτια και σιδερώνω τα ρούχα της εβδομάδας.
  example2_en: Because I live alone, I do all the housework on Saturday morning, meaning
    I vacuum, tidy the rooms, and iron the week's clothes.
  keg_communicative_function: Describing domestic chores and division of household
    labor
  audio: pos-moirazeste-tis-d-9ae869.mp3
  example_audio: sto-spiti-mas-moiraz-34bf81.mp3
  example2_audio: epeidi-meno-monos-mo-770560.mp3
- id: SP-U01-033
  greek: Γιατί αποφασίσατε να μάθετε ελληνικά;
  english: Why did you decide to learn Greek? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Simple Past + Subjunctive (αποφάσισα να μάθω), causal & purpose clauses
      (επειδή, για να μπορώ να...)
  notes: 'Examiner Objective: High-frequency Stage 1 question testing personal motivation
    and connection to Greek culture/life.

    Strategy: Combine a practical reason (work, living in Greece/Cyprus, family) with
    an emotional/cultural appreciation.'
  example_el: Αποφάσισα να μάθω ελληνικά επειδή ζω και εργάζομαι στην Ελλάδα, και
    θέλω να επικοινωνώ άνετα στην καθημερινότητά μου με τους Έλληνες φίλους και συναδέλφους
    μου.
  example_en: I decided to learn Greek because I live and work in Greece, and I want
    to communicate comfortably in my daily life with my Greek friends and colleagues.
  example2_el: Αγαπώ πάρα πολύ την ελληνική ιστορία και τον πολιτισμό, επισκέπτομαι
    την Ελλάδα κάθε χρόνο και ήθελα να μιλάω με τους κατοίκους στη δική τους γλώσσα.
  example2_en: I love Greek history and culture very much, I visit Greece every year,
    and I wanted to speak with the locals in their own language.
  keg_communicative_function: Explaining personal and practical motivations for learning
    Greek
  audio: giati-apofasisate-na-fc08e1.mp3
  example_audio: apofasisa-na-matho-e-090c03.mp3
  example2_audio: agapo-para-poly-tin--2a7d95.mp3
- id: SP-U01-034
  greek: Πόσο καιρό μαθαίνετε ελληνικά και πώς κάνετε εξάσκηση;
  english: How long have you been learning Greek and how do you practice? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Duration in present tense (μαθαίνω ελληνικά εδώ και...), instrumental phrases
      (με δάσκαλο, ακούγοντας ραδιόφωνο)
  notes: 'Examiner Objective: Tests language-learning vocabulary and active study
    strategies.

    Strategy: Mention how long you have taken lessons and 2 ways you practice outside
    class (Greek radio, flashcards, chatting).'
  example_el: Μαθαίνω ελληνικά εδώ και ενάμιση χρόνο με μια πολύ καλή δασκάλα, και
    κάθε μέρα κάνω εξάσκηση ακούγοντας ελληνικό ραδιόφωνο και μιλώντας με τους γείτονές
    μου.
  example_en: I have been learning Greek for a year and a half with a very good teacher,
    and every day I practice by listening to Greek radio and speaking with my neighbors.
  example2_el: Παρακολουθώ μαθήματα ελληνικών δύο φορές την εβδομάδα τους τελευταίους
    δέκα μήνες και μελετάω καθημερινά λεξιλόγιο και διαλόγους στον υπολογιστή μου.
  example2_en: I have been attending Greek lessons twice a week for the last ten months
    and I study vocabulary and dialogues daily on my computer.
  keg_communicative_function: Describing duration of language study and practice methods
  audio: poso-kairo-mathainet-f0231b.mp3
  example_audio: mathaino-ellinika-ed-19af0b.mp3
  example2_audio: parakoloytho-mathima-65d652.mp3
- id: SP-U01-035
  greek: Τι σας δυσκολεύει περισσότερο στην ελληνική γλώσσα και τι σας φαίνεται πιο
    εύκολο;
  english: What do you find most difficult in the Greek language and what seems easier
    to you? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Psychological/experiential verbs with clitics (με δυσκολεύει, μου φαίνεται),
      grammatical terminology (τα ρήματα, η ορθογραφία, η προφορά)
  notes: 'Examiner Objective: Checks meta-linguistic vocabulary and accurate singular/plural
    agreement with ''με δυσκολεύει / με δυσκολεύουν''.

    Strategy: Note that if the subject is plural (e.g., οι καταλήξεις), use plural
    verb ''με δυσκολεύουν''.'
  example_el: Με δυσκολεύουν περισσότερο η ορθογραφία και οι χρόνοι των ρημάτων, αλλά
    η προφορά και η καθημερινή προφορική επικοινωνία μού φαίνονται αρκετά πιο εύκολες.
  example_en: Spelling and verb tenses give me the most difficulty, but pronunciation
    and everyday spoken communication seem much easier to me.
  example2_el: Στην αρχή με δυσκόλευαν τα τρία γένη των ουσιαστικών, όμως τώρα καταλαβαίνω
    πολύ εύκολα τους Έλληνες όταν μιλούν καθαρά και μαθαίνω γρήγορα νέες λέξεις.
  example2_en: At the beginning the three genders of nouns were difficult for me,
    however now I understand Greeks very easily when they speak clearly and I learn
    new words quickly.
  keg_communicative_function: Identifying linguistic challenges and strengths in learning
    Greek
  audio: ti-sas-dyskoleyei-pe-0e1363.mp3
  example_audio: me-dyskoleyoyn-peris-afb299.mp3
  example2_audio: stin-archi-me-dyskol-c439e1.mp3
- id: SP-U01-036
  greek: Έχετε ταξιδέψει σε διάφορα μέρη στην Ελλάδα ή στην Κύπρο; Πού πήγατε;
  english: Have you traveled to various places in Greece or Cyprus? Where did you
    go? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Simple Past (Αόριστος) of travel verbs (ταξίδεψα, πήγα, επισκέφθηκα, έμεινα,
      είδα), geographical place names
  notes: 'Examiner Objective: Tests past narrative skills (Αόριστος) and geographical
    names in the accusative case.

    Strategy: Name 2-3 specific islands or cities you visited and mention one memorable
    sight or impression.'
  example_el: Ναι, πέρυσι το καλοκαίρι ταξίδεψα στη Νάξο και στη Σαντορίνη, όπου είδα
    υπέροχες παραλίες, δοκίμασα παραδοσιακά φαγητά και εντυπωσιάστηκα από τη φιλοξενία
    των κατοίκων.
  example_en: Yes, last summer I traveled to Naxos and Santorini, where I saw wonderful
    beaches, tried traditional food, and was impressed by the hospitality of the locals.
  example2_el: Έχω επισκεφθεί την Αθήνα, το Ναύπλιο και την Πάφο στην Κύπρο, και μου
    άρεσαν πάρα πολύ οι αρχαιολογικοί χώροι και τα γραφικά σοκάκια δίπλα στη θάλασσα.
  example2_en: I have visited Athens, Nafplio, and Paphos in Cyprus, and I really
    liked the archaeological sites and the picturesque alleys by the sea.
  keg_communicative_function: Narrating past travel experiences in Greece and Cyprus
  audio: echete-taxidepsei-se-bb7731.mp3
  example_audio: nai-perysi-to-kaloka-53b858.mp3
  example2_audio: echo-episkefthei-tin-347da2.mp3
- id: SP-U01-037
  greek: Ποιο είναι το αγαπημένο σας ελληνικό φαγητό ή έθιμο;
  english: What is your favorite Greek dish or custom? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Gastronomy and cultural traditions lexicon (παραδοσιακή κουζίνα, το Πάσχα,
      η ονομαστική γιορτή), descriptive clauses
  notes: 'Examiner Objective: Assesses cultural appreciation and descriptive vocabulary
    for food or Greek traditions.

    Strategy: Name a specific dish (e.g., παστίτσιο, χωριάτικη σαλάτα) or custom (e.g.,
    Easter in the village) and explain why you love it.'
  example_el: Το αγαπημένο μου ελληνικό φαγητό είναι ο μουσακάς και η χωριάτικη σαλάτα
    με φέτα και ελαιόλαδο, γιατί τα υλικά είναι πάντα φρέσκα και πολύ νόστιμα.
  example_en: My favorite Greek food is moussaka and Greek village salad with feta
    and olive oil, because the ingredients are always fresh and very tasty.
  example2_el: Μου αρέσει πάρα πολύ το ελληνικό Πάσχα στην εξοχή, επειδή όλη η οικογένεια
    και οι φίλοι μαζεύονται έξω στη φύση, ψήνουν, τραγουδούν και γιορτάζουν μαζί.
  example2_en: I really love Greek Easter in the countryside, because the whole family
    and friends gather outside in nature, roast food, sing, and celebrate together.
  keg_communicative_function: Expressing appreciation for Greek cuisine and cultural
    traditions
  audio: poio-einai-to-agapim-662e15.mp3
  example_audio: to-agapimeno-moy-ell-b2e608.mp3
  example2_audio: moy-aresei-para-poly-76279e.mp3
- id: SP-U01-038
  greek: Ποια εποχή του χρόνου προτιμάτε και γιατί;
  english: Which season of the year do you prefer and why? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Seasons with definite article (η άνοιξη, το καλοκαίρι, το φθινόπωρο, ο
      χειμώνας), weather expressions (κάνει ζέστη, έχει ήλιο)
  notes: 'Examiner Objective: Tests weather/climate vocabulary and seasonal activities.

    Strategy: State the season, describe the weather (''η φύση ανθίζει'' / ''η μέρα
    είναι μεγάλη''), and mention what you do then.'
  example_el: Η αγαπημένη μου εποχή είναι η άνοιξη, επειδή ο καιρός είναι γλυκός χωρίς
    υπερβολική ζέστη, η φύση είναι καταπράσινη και μπορώ να κάνω εκδρομές.
  example_en: My favorite season is spring, because the weather is mild without excessive
    heat, nature is lush green, and I can go on excursions.
  example2_el: Προτιμώ το καλοκαίρι γιατί οι μέρες είναι μεγάλες και φωτεινές, παίρνω
    την άδειά μου από τη δουλειά και κολυμπάω στη θάλασσα κάθε απόγευμα.
  example2_en: I prefer summer because the days are long and bright, I take my leave
    from work, and I swim in the sea every afternoon.
  keg_communicative_function: Describing seasonal preferences, weather conditions,
    and outdoor activities
  audio: poia-epochi-toy-chro-8aa1b6.mp3
  example_audio: i-agapimeni-moy-epoc-f1f9fb.mp3
  example2_audio: protimo-to-kalokairi-cdef8a.mp3
- id: SP-U01-039
  greek: Ποια είναι τα σχέδιά σας για το επόμενο καλοκαίρι;
  english: What are your plans for next summer? (Examiner Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: 'Simple Future (Συνοπτικός Μέλλοντας: θα πάω, θα μείνω, θα ξεκουραστώ)
      and intention verbs (σκοπεύω να, σκέφτομαι να)'
  notes: 'Examiner Objective: Crucial test of Future Tense (''θα + συνοπτικός μέλλοντας'')
    and planning verbs (''σκοπεύω να'').

    Strategy: Use at least two future verbs (''θα ταξιδέψουμε'', ''θα επισκεφθούμε'')
    and mention destination and companions.'
  example_el: Το επόμενο καλοκαίρι σκοπεύω να πάρω δύο εβδομάδες άδεια τον Αύγουστο
    και θα ταξιδέψω με την οικογένειά μου στην Κρήτη για να ξεκουραστούμε.
  example_en: Next summer I plan to take two weeks' vacation in August and I will
    travel with my family to Crete to rest.
  example2_el: Σκέφτομαι να επισκεφθώ τους γονείς μου για λίγες μέρες τον Ιούλιο και
    στη συνέχεια θα πάω με τους φίλους μου διακοπές σε ένα ελληνικό νησί.
  example2_en: I am thinking of visiting my parents for a few days in July and afterwards
    I will go on vacation with my friends to a Greek island.
  keg_communicative_function: Expressing future vacation plans and intentions
  audio: poia-einai-ta-schedi-137563.mp3
  example_audio: to-epomeno-kalokairi-d56eba.mp3
  example2_audio: skeftomai-na-episkef-4c516b.mp3
- id: SP-U01-040
  greek: Ποιος είναι ο επόμενος στόχος σας αφού πάρετε το πτυχίο ελληνικών Α2;
  english: What is your next goal after you get the A2 Greek certificate? (Examiner
    Question)
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Stage 1 (Personal Interview)
    focus: Temporal clause with future reference (αφού πάρω / μόλις πάρω + subjunctive),
      future aspirations (θα συνεχίσω)
  notes: 'Examiner Objective: Tests temporal-conditional clauses (''αφού πάρω'') and
    long-term personal/linguistic goals.

    Strategy: Express enthusiasm for continuing to level B1 and applying Greek in
    your daily/professional life.'
  example_el: Αφού πάρω το πτυχίο του επιπέδου Α2, θα συνεχίσω αμέσως τα μαθήματα
    για το επίπεδο Β1, γιατί θέλω να μιλάω ελληνικά με ακόμα μεγαλύτερη άνεση.
  example_en: After I get the A2 level certificate, I will immediately continue lessons
    for the B1 level, because I want to speak Greek with even greater fluency.
  example2_el: Μόλις ολοκληρώσω με επιτυχία αυτές τις εξετάσεις, σκοπεύω να χρησιμοποιώ
    τα ελληνικά καθημερινά στη δουλειά μου και να διαβάζω ελληνική λογοτεχνία χωρίς
    λεξικό.
  example2_en: As soon as I successfully complete these exams, I plan to use Greek
    daily in my job and read Greek literature without a dictionary.
  keg_communicative_function: Stating future language-learning and personal development
