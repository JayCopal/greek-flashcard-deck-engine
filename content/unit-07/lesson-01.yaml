unit_id: unit-07
lesson_id: lesson-01
title: Το Σπίτι, Έπιπλα & Διαμονή (House, Furniture & Accommodation)
description: 'CEFR A1: Describing an apartment, rooms of the house, core furniture,
  spatial prepositions, and understanding classified accommodation listings.'
lesson_status: not_started
lesson_notes: "Unit 7 Core Grammar Notes:\n\n• Existential Construction 'υπάρχει /\
  \ υπάρχουν':\n  - Singular: 'Υπάρχει ένα μεγάλο σαλόνι.' (There is a large living\
  \ room.)\n  - Plural: 'Υπάρχουν δύο κρεβατοκάμαρες.' (There are two bedrooms.)\n\
  \  - Negative: 'Δεν υπάρχει ασανσέρ.' (There is no elevator.)\n\n• Spatial Prepositions\
  \ & Adverbs (Governing Accusative):\n  - Governed by 'σε + άρθρο' (contracted):\
  \ μέσα σε (inside), πάνω σε (on top of), δίπλα σε (next to), ανάμεσα σε (between).\n\
  \  - Governed by 'από + άρθρο': έξω από (outside of), κάτω από (under), απέναντι\
  \ από (across from), μπροστά από (in front of), πίσω από (behind).\n\n• Definite\
  \ Article Grid (Nominative & Accusative):\n  - Masculine: Nom: ο / οι — Acc: τον\
  \ / τους\n  - Feminine:  Nom: η / οι — Acc: τη(ν) / τις\n  - Neuter:    Nom: το\
  \ / τα — Acc: το / τα\n\n• Reading Housing Classified Ads (Αγγελίες Κατοικιών):\n\
  \  - ενοικιάζεται (for rent) / πωλείται (for sale)\n  - γκαρσονιέρα (studio flat),\
  \ δυάρι (2-room flat), τριάρι (3-room flat)\n  - όροφος: 1ος (πρώτος), 2ος (δεύτερος),\
  \ ισόγειο (ground floor)\n  - επιπλωμένο (furnished) / αυτόνομη θέρμανση (independent\
  \ heating)"
entries:
- id: A1-U07-001
  greek: το σπίτι
  phonetic_hint: ''
  english: house / home
  notes: 'Paroxytone neuter in -ι (plural: τα σπίτια). ''Στο σπίτι'' means both ''at
    home'' and ''in the house''.'
  gender_or_pos: noun (neuter)
  audio: to-spiti-b7d111.mp3
  status: verified
  example_el: Μένω σε ένα παλιό αλλά όμορφο σπίτι.
  example_en: I live in an old but beautiful house.
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα σπίτια
    accusative_singular: το σπίτι
  keg_communicative_function: Describing one's residence and home
  example_audio: meno-se-ena-palio-al-b60f58.mp3
  example2_el: Το σπίτι μας έχει τρία υπνοδωμάτια και κήπο.
  example2_en: Our house has three bedrooms and a garden.
