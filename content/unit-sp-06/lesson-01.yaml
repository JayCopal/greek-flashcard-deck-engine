  example_en: In August we sit every evening in the cool courtyard of our house, far
    from the noise that the cars make.
  example2_el: Αφήσαμε το αυτοκίνητό μας έξω από την αυλή και μπήκαμε στο σπίτι για
    να φτιάξουμε καφέ και τηγανητά αυγά.
  example2_en: We left our car outside the courtyard and went into the house to make
    coffee and fried eggs.
