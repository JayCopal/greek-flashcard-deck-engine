unit_id: unit-sp-06
lesson_id: lesson-01
title: 'Προφορικά SP-06: Προφορά, Επιτονισμός & Παγίδες Προφορικού Λόγου (Spoken Phonology
  & Trap Drills)'
description: '40 orthoepic and morphological trap drills targeting Criterion 4 (Pronunciation
  & Intonation) and Criterion 2 (Accuracy): nasal stops (μπ/π, ντ/τ, γκ/κ), diphthongs
  (αυ/ευ), stress shifts across tenses, and polite conditional tone modulation.'
lesson_status: not_started
lesson_notes: "Unit SP-06 Core Notes: Προφορά, Επιτονισμός & Παγίδες Προφορικού Λόγου\
  \ (Spoken Phonology & Trap Drills)\n• Official KEG A2 Exam Alignment:\n  - Criterion\
  \ 4 (Προφορά & Επιτονισμός) & Criterion 2 (Γραμματική & Συντακτική Ορθότητα):\n\
  \  - Nasal Stops & Connected Speech Sandhi (001–010): Voiced vs. unvoiced stops\
  \ (μπ/π, ντ/τ, γκ/γ/κ, τζ/τσ) and cross-word nasal assimilation (δεν μπορώ, την\
  \ Κυριακή).\n  - Diphthongs & Fricatives (011–018): Assimilation of αυ ([av]/[af])\
  \ and ευ ([ev]/[ef]), plus dental (θ/δ) and velar/palatal (χ/γ) fricative contrasts.\n\
  \  - Stress-Placement & Aspect Traps (019–028): Antepenultimate Aorist stress retraction\
  \ (μένω/έμεινα, δουλεύω/δούλεψα, γυρίζω/γύρισα, πληρώνω/πλήρωσα), lexical minimal\
  \ pairs (παίρνω/πήρα vs. περνάω/πέρασα), and enclitic stress (ο δάσκαλός μας).\n\
  \  - Polite Conditional Tone & Morphological Traps (029–040): Replacing imperatives\
  \ with Θα ήθελα / Θα μπορούσατε / Μήπως, rising polar question intonation, πολύς/πολλή/πολύ,\
  \ feminine nouns in -ος, and τρεις/τρία."
entries:
- id: SP-U06-001
  greek: Ο μπαμπάς μου πήγε στο περίπτερο για να πάρει εφημερίδα.
  english: My dad went to the kiosk to get a newspaper. (Phonology & Nasal Stop Drill)
  phonetic_hint: '[o baˈbas mu ˈpije sto peˈriptero ja na ˈpari efimeˈriða] — Contrast
    voiced bilabial [b] in ''μπαμπάς'' with unaspirated voiceless [p] in ''πήγε /
    περίπτερο / πάρει''.'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Voiced bilabial stop μπ [b/mb] vs. voiceless unaspirated stop π [p]
  notes: 'Examiner Objective: English speakers often aspirate Greek /p/ ([pʰ]) or
    confuse initial μπ [b] with π [p].

    Strategy: Keep π crisp and unaspirated (like Spanish/French p), and voice μπ fully
    from the vocal cords.'
  keg_communicative_function: Articulating voiced and voiceless bilabial stops clearly
    in everyday narrative
  example_el: Το πρωί ο μπαμπάς μου πίνει πάντα έναν ελληνικό καφέ στο μπαλκόνι πριν
    πάει με τα πόδια στο περίπτερο της γειτονιάς.
  example_en: In the morning my dad always drinks a Greek coffee on the balcony before
    going on foot to the neighborhood kiosk.
  example2_el: Μπορείς να περάσεις από το περίπτερο και να πάρεις δύο μπουκάλια παγωμένο
    νερό για την παραλία;
  example2_en: Can you pass by the kiosk and get two bottles of ice-cold water for
    the beach?
  audio: o-mpampas-moy-pige-s-81a36c.mp3
  example_audio: to-proi-o-mpampas-mo-0a73d6.mp3
  example2_audio: mporeis-na-peraseis--e47650.mp3
- id: SP-U06-002
  greek: Μπαίνω στο μπάνιο, πλένω τα χέρια μου και πιάνω μια καθαρή πετσέτα.
  english: I go into the bathroom, wash my hands, and grab a clean towel. (Phonology
    & Nasal Stop Drill)
  phonetic_hint: '[ˈbeno sto ˈbaɲo, ˈpleno ta ˈçerja mu ce ˈpjano mɲa kaθaˈri peˈtseta]
    — Initial μπ [b] (''μπαίνω'', ''μπάνιο'') vs. cluster πλ [pl] and π+ι [pj] (''πλένω'',
    ''πιάνω'').'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Word-initial μπ [b] vs. voiceless bilabial clusters πλ [pl] and πι [pj]
  notes: 'Examiner Objective: Tests rapid alternation between [b] and [p] in household
    routine verbs.

    Strategy: Practice the transition `στο μπάνιο [sto ˈbaɲo]` -> `πλένω [ˈpleno]`
    without puffing air on `π`.'
  keg_communicative_function: Describing daily hygiene routines with accurate bilabial
    articulation
  example_el: Μόλις μπαίνω στο σπίτι, πηγαίνω κατευθείαν στο μπάνιο, πλένω καλά τα
    χέρια μου με σαπούνι και παίρνω μια μικρή πετσέτα.
  example_en: As soon as I enter the house, I go straight to the bathroom, wash my
    hands well with soap, and take a small towel.
  example2_el: Στο μπάνιο του ξενοδοχείου υπάρχουν πάντα καθαρές πετσέτες, σαμπουάν
    και ζεστό νερό όλη την ημέρα.
  example2_en: In the hotel bathroom there are always clean towels, shampoo, and hot
    water all day long.
  audio: mpaino-sto-mpanio-pl-7b5dfd.mp3
  example_audio: molis-mpaino-sto-spi-0c9ef0.mp3
  example2_audio: sto-mpanio-toy-xenod-dd316c.mp3
- id: SP-U06-003
  greek: Ντύνομαι γρήγορα γιατί έχω ραντεβού στις πέντε το απόγευμα.
  english: I get dressed quickly because I have an appointment at five in the afternoon.
    (Phonology & Nasal Stop Drill)
  phonetic_hint: '[ˈdinome ˈɣriɣora jaˈti ˈexo radeˈvu stis ˈpende to aˈpojevma] —
    Initial ντ [d] in ''ντύνομαι'' and word-internal ντ [nd/d] in ''ραντεβού'' and
    ''πέντε''.'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Voiced alveolar stop ντ [d/nd] vs. voiceless dental/alveolar stop τ [t]
  notes: 'Examiner Objective: Evaluates clarity of `ντ` in core time and scheduling
    words (`πέντε`, `έντεκα`, `ραντεβού`, `ντύνομαι`).

    Strategy: Never pronounce `πέντε` as `[pente]` with a voiceless `[t]`; soften
    the dental stop to `[ˈpende]` or `[ˈpede]`.'
  keg_communicative_function: Stating appointment times and preparation routines with
    natural nasal-stop voicing
  example_el: Κάθε απόγευμα στις πέντε και τέταρτο ντύνομαι, παίρνω την τσάντα μου
    και φεύγω για το ραντεβού μου στο κέντρο.
  example_en: Every afternoon at five fifteen I get dressed, take my bag, and leave
    for my appointment in the center.
  example2_el: Έκλεισα ραντεβού με τον οδοντίατρο την Τετάρτη στις έντεκα το πρωί,
    επειδή με πονάει πολύ το δόντι μου.
  example2_en: I booked an appointment with the dentist on Wednesday at eleven in
    the morning, because my tooth hurts a lot.
  audio: ntynomai-grigora-gia-443a46.mp3
  example_audio: kathe-apogeyma-stis--4c9750.mp3
  example2_audio: ekleisa-rantevoy-me--d11cc9.mp3
- id: SP-U06-004
  greek: Στο εστιατόριο παραγγείλαμε ντοματοσαλάτα, πατάτες τηγανητές και τυρί.
  english: At the restaurant we ordered tomato salad, fried potatoes, and cheese.
    (Phonology & Nasal Stop Drill)
  phonetic_hint: '[sto estiaˈtorio paraˈɟilame domatosaˈlata, paˈtates tiɣaniˈtes
    ce tiˈri] — Contrast initial ντ [d] (''ντοματοσαλάτα'') with crisp dental τ [t]
    (''πατάτες τηγανητές'', ''τυρί'').'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Contrastive articulation of ντ [d], γγ [ɟ], and dental τ [t] in food ordering
  notes: 'Examiner Objective: Tests pronunciation of high-frequency taverna items
    in Stage 2/3.

    Strategy: Keep the tongue against the upper teeth for unaspirated `τ` in `πατάτες
    τηγανητές`.'
  keg_communicative_function: Ordering food and describing meals with clear dental
    and palatal stops
  example_el: Όταν τρώμε στην ταβέρνα, παίρνουμε πάντα μια φρέσκια ντοματοσαλάτα με
    φέτα, ζεστές πατάτες τηγανητές και ψητό κοτόπουλο.
  example_en: When we eat at the taverna, we always get a fresh tomato salad with
    feta, hot fried potatoes, and grilled chicken.
  example2_el: Μου αρέσουν πολύ οι κόκκινες ντομάτες το καλοκαίρι, ειδικά όταν τις
    κόβω σε σαλάτα με ελαιόλαδο και ρίγανη.
  example2_en: I really like red tomatoes in the summer, especially when I cut them
    into a salad with olive oil and oregano.
  audio: sto-estiatorio-parag-021c72.mp3
  example_audio: otan-trome-stin-tave-a364f7.mp3
  example2_audio: moy-aresoyn-poly-oi--0f9160.mp3
- id: SP-U06-005
  greek: Έχω ανάγκη από λίγο ελεύθερο χρόνο για να ξεκουραστώ στον κήπο.
  english: I need a little free time to rest in the garden. (Phonology & Nasal Stop
    Drill)
  phonetic_hint: '[ˈexo aˈnaɟi aˈpo ˈliɣo eˈlefθero ˈxrono ja na ksekuraˈsto ston
    ˈcipo] — Palatalized γκ [ɟ/ɲɟ] before front vowel [i] in ''ανάγκη'' and sandhi
    ''στον κήπο'' [ston ˈɟipo / ston ˈcipo].'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Palatal vs. velar nasal stops γκ/γγ ([ɟ/g]) andvoiceless velar/palatal
      κ ([k/c])
  notes: 'Examiner Objective: Candidates frequently mispronounce `ανάγκη` as `[anagi]`
    with a hard velar instead of palatal `[aˈnaɟi / aˈnaɲɟi]`.

    Strategy: Before `ε/ι` (`ανάγκη`, `άγγελος`, `αγκινάρα`), soften `γκ/γγ` toward
    the hard palate.'
  keg_communicative_function: Expressing personal need for rest with accurate palatal
    and velar consonants
  example_el: Μετά από τόσες ώρες δουλειάς στο γραφείο, έχω πραγματικά ανάγκη να καθίσω
    ήσυχα στον κήπο και να πιω έναν καφέ.
  example_en: After so many hours of work at the office, I really need to sit quietly
    in the garden and drink a coffee.
  example2_el: Ο παππούς μου περνάει όλο το πρωί στον κήπο του σπιτιού, γιατί του
    αρέσει να ποτίζει τις τριανταφυλλιές και τα λαχανικά.
  example2_en: My grandfather spends the whole morning in the house garden, because
    he likes watering the rosebushes and the vegetables.
  audio: echo-anagki-apo-ligo-1ec6c2.mp3
  example_audio: meta-apo-toses-ores--17b526.mp3
  example2_audio: o-pappoys-moy-pernae-1c3dae.mp3
- id: SP-U06-006
  greek: Το γκαράζ της πολυκατοικίας βρίσκεται ακριβώς στη γωνία του δρόμου.
  english: The apartment building's garage is located right on the corner of the street.
    (Phonology & Nasal Stop Drill)
  phonetic_hint: '[to gaˈraz tis polikatiˈcias ˈvriscete akriˈvos sti ɣoˈnia tu ˈðromu]
    — Hard voiced velar stop γκ [g] in ''γκαράζ'' vs. voiced velar fricative γ [ɣ]
    in ''γωνία''.'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Distinguishing voiced velar stop γκ [g] ('γκαράζ', 'γκρι') from voiced
      velar fricative γ [ɣ] ('γωνία', 'γάλα')
  notes: 'Examiner Objective: L2 speakers often replace the Greek fricative `γ [ɣ]`
    (`γωνία`) with the English hard stop `[g]` (`γκαράζ`).

    Strategy: Let air flow smoothly through the back of the throat for `γωνία [ɣoˈnia]`,
    and make a full stop only on `γκαράζ [gaˈraz]`.'
  keg_communicative_function: Giving spatial directions and describing building facilities
    with clear velar contrasts
  example_el: Αφήνω πάντα το γκρι αυτοκίνητό μου στο υπόγειο γκαράζ, που βρίσκεται
    ακριβώς στη γωνία δίπλα στον φούρνο της γειτονιάς.
  example_en: I always leave my grey car in the underground garage, which is located
    right on the corner next to the neighborhood bakery.
  example2_el: Στη γωνία του δρόμου μας άνοιξε ένα καινούργιο γαλακτοπωλείο που πουλάει
    φρέσκο γάλα, γιαούρτι και παραδοσιακά γλυκά.
  example2_en: On the corner of our street a new dairy shop opened that sells fresh
    milk, yogurt, and traditional sweets.
  audio: to-gkaraz-tis-polyka-a4e29c.mp3
  example_audio: afino-panta-to-gkri--1e7bad.mp3
  example2_audio: sti-gonia-toy-dromoy-e6c357.mp3
- id: SP-U06-007
  greek: Ήπια ένα φλιτζάνι ζεστό τσάι με λεμόνι γιατί είχα έντονο βήχα.
  english: I drank a cup of hot tea with lemon because I had a bad cough. (Phonology
    & Affricate Drill)
  phonetic_hint: '[ˈipja ˈena fliˈdzani zeˈsto ˈtsai me leˈmoni jaˈti ˈixa ˈendono
    ˈvixa] — Voiced alveolar affricate τζ [dz] (''φλιτζάνι'') vs. voiceless affricate
    τσ [ts] (''τσάι'').'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Alveolar affricates τζ [dz] vs. τσ [ts] (avoiding postalveolar English
      [dʒ]/[tʃ])
  notes: 'Examiner Objective: Greek `τσ/τζ` are crisp dental-alveolar `[ts/dz]`, never
    thick English `ch/j` (`[tʃ/dʒ]`).

    Strategy: Keep the tongue tip behind the front teeth when saying `φλιτζάνι`, `τζάκι`,
    `τσάι`, and `τσάντα`.'
  keg_communicative_function: Describing remedies for minor illnesses using accurate
    dental-alveolar affricates
  example_el: Τον χειμώνα μου αρέσει να κάθομαι δίπλα στο τζάκι και να πίνω ένα μεγάλο
    φλιτζάνι ζεστό τσάι του βουνού με μέλι.
  example_en: In winter I like sitting next to the fireplace and drinking a large
    cup of hot mountain tea with honey.
  example2_el: Ξέχασα την καινούργια μου τσάντα και το πορτοφόλι μου πάνω στο τραπεζάκι
    της καφετέριας, δίπλα στο τζάμι.
  example2_en: I forgot my new bag and my wallet on the small table of the café, next
    to the windowpane.
  audio: ipia-ena-flitzani-ze-fc2b5f.mp3
  example_audio: ton-cheimona-moy-are-885ea9.mp3
  example2_audio: xechasa-tin-kainoyrg-24d718.mp3
- id: SP-U06-008
  greek: Δεν μπορώ να καταλάβω γιατί το λεωφορείο αργεί πάντα στον σταθμό.
  english: I cannot understand why the bus is always late at the station. (Phonology
    & Sandhi Assimilation Drill)
  phonetic_hint: '[ðem boˈro na kataˈlavo jaˈti to leofoˈrio arˈji ˈpanda ston staˈθmo]
    — Cross-word nasal assimilation: ''δεν μπορώ'' -> [ðem boˈro], ''στον σταθμό''
    -> [sto(n) staˈθmo].'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Connected speech nasal sandhi (δεν + π/μπ -> [mb], την + π -> [mb], τον
      + κ -> [ŋg])
  notes: 'Examiner Objective: Natural spoken Greek links `δεν/μην/τον/την/στον/στην`
    smoothly into the following stop without an artificial pause.

    Strategy: Pronounce `δεν μπορώ` as a single rhythmic unit `[ðemboˈro]` and `δεν
    πειράζει` as `[ðembiˈrazi]`.'
  keg_communicative_function: Using natural connected-speech sandhi in everyday complaints
    and observations
  example_el: Δεν πειράζει αν αργήσεις πέντε λεπτά στο ραντεβού μας, γιατί κι εγώ
    περιμένω ακόμα στην πόρτα του σταθμού.
  example_en: It doesn't matter if you are five minutes late to our appointment, because
    I too am still waiting at the station door.
  example2_el: Την Παρασκευή το απόγευμα δεν μπορώ να έρθω μαζί σας στον κινηματογράφο,
    επειδή έχω μάθημα ελληνικών.
  example2_en: On Friday afternoon I cannot come with you to the cinema, because I
    have a Greek lesson.
  audio: den-mporo-na-katalav-6ef35b.mp3
  example_audio: den-peirazei-an-argi-207937.mp3
  example2_audio: tin-paraskeyi-to-apo-c54949.mp3
- id: SP-U06-009
  greek: Την Κυριακή το πρωί πήγαμε μια μεγάλη εκδρομή στην εξοχή με τους γονείς μας.
  english: On Sunday morning we went on a big excursion to the countryside with our
    parents. (Phonology & Sandhi Drill)
  phonetic_hint: '[tiŋ ɟirjaˈci to proˈi ˈpiɣame mɲa meˈɣali ekðroˈmi stin eksoˈçi
    me tuz ɣoˈniz mas] — Connected speech voicing: ''Την Κυριακή'' [tiŋ ɟirjaˈci],
    ''με τους γονείς'' [me tuz ɣoˈnis].'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: 'Cross-word assimilation: την Κυριακή [tiŋ ɟirjaˈci] and final -ς voicing
      before voiced consonants (τους γονείς [tuz ɣoˈnis])'
  notes: 'Examiner Objective: Trains smooth phrase-level prosody instead of choppy
    word-by-word reading.

    Strategy: Link article + noun (`την Κυριακή`, `τους γονείς`) without breaking
    airflow.'
  keg_communicative_function: Narrating weekend outings with smooth phrase-level prosody
    and consonant linking
  example_el: Την Κυριακή που μας πέρασε, πήραμε το αυτοκίνητο και πήγαμε με τους
    φίλους μας σε ένα όμορφο χωριό κοντά στη θάλασσα.
  example_en: Last Sunday, we took the car and went with our friends to a beautiful
    village near the sea.
  example2_el: Μου αρέσει να περνάω την Κυριακή μου ήρεμα στο σπίτι με τους γονείς
    μου και να τρώμε όλοι μαζί το μεσημέρι.
  example2_en: I like spending my Sunday quietly at home with my parents and eating
    all together at noon.
  audio: tin-kyriaki-to-proi--e926bc.mp3
  example_audio: tin-kyriaki-poy-mas--da2d11.mp3
  example2_audio: moy-aresei-na-pernao-f3dc16.mp3
- id: SP-U06-010
  greek: Ο άντρας της αδερφής μου δουλεύει σε μια μεγάλη τράπεζα στην Αθήνα.
  english: My sister's husband works at a big bank in Athens. (Phonology & Cluster
    Drill)
  phonetic_hint: '[o ˈandras tis aðerˈfiz mu ðuˈlevi se mɲa meˈɣali ˈtrapeza stin
    aˈθina] — Contrast voiced cluster ντρ [ndr/dr] (''άντρας'') with voiceless τρ
    [tr] (''τράπεζα'').'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: Cluster contrast ντρ [ndr/dr] ('άντρας', 'δέντρο') vs. τρ [tr] ('τράπεζα',
      'τρεις')
  notes: 'Examiner Objective: Ensures clear distinction between `ντρ` and `τρ` with
    a single alveolar tap `[ɾ]`.

    Strategy: Use a quick, light tap of the tongue tip for `ρ` right after `[d]` or
    `[t]`.'
  keg_communicative_function: Describing family members and professions with accurate
    consonant clusters
  example_el: Κάτω από τα μεγάλα δέντρα της πλατείας υπάρχει μια τράπεζα, ένα ταχυδρομείο
    και τρία μικρά καφέ.
  example_en: Under the big trees of the square there is a bank, a post office, and
    three small cafés.
  example2_el: Ο άντρας που στέκεται μπροστά στην είσοδο της τράπεζας κρατάει μια
    μαύρη ομπρέλα και περιμένει το ταξί.
  example2_en: The man standing in front of the bank entrance is holding a black umbrella
    and waiting for the taxi.
  audio: o-antras-tis-aderfis-510af9.mp3
  example_audio: kato-apo-ta-megala-d-271ac2.mp3
  example2_audio: o-antras-poy-steketa-2ac0dc.mp3
- id: SP-U06-011
  greek: Αύριο το πρωί θα ταξιδέψω με αυτό το πλοίο για τα νησιά.
  english: Tomorrow morning I will travel on this ship to the islands. (Phonology
    & Diphthong Drill)
  phonetic_hint: '[ˈavrio to proˈi θa taksiˈðepso me afˈto to ˈplio ja ta niˈsça]
    — Diphthong αυ = [av] before voiced ρ (''αύριο'') vs. [af] before voiceless τ
    (''αυτό'').'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: 'Phonological rule for αυ: [av] before vowels and voiced consonants (β,
      γ, δ, ζ, λ, μ, ν, ρ) vs. [af] before voiceless (κ, π, τ, χ, φ, θ, σ, ξ, ψ)'
  notes: 'Examiner Objective: High-frequency pronunciation criterion in KEG A2.

    Strategy: Hear the instant switch in the same sentence: `αύριο [ˈavrio]` (voiced
    [v] before ρ) vs. `αυτό [afˈto]` (voiceless [f] before τ).'
  keg_communicative_function: Applying thevoiced/voiceless assimilation rule for the
    digraph αυ in travel statements
  example_el: Αύριο θα ξυπνήσω πολύ νωρίς, γιατί αυτό το λεωφορείο φεύγει στις επτά
    ακριβώς από την κεντρική αυλή του σταθμού.
  example_en: Tomorrow I will wake up very early, because this bus leaves at seven
    sharp from the central courtyard of the station.
  example2_el: Σε αυτό το μικρό μαγαζί αγόρασα χθες φρέσκα αυγά, βούτυρο και ωραίο
    ψωμί για το αυριανό μας πρωινό.
  example2_en: At this small shop yesterday I bought fresh eggs, butter, and nice
    bread for our breakfast tomorrow.
  audio: ayrio-to-proi-tha-ta-002b22.mp3
  example_audio: ayrio-tha-xypniso-po-43bfa2.mp3
  example2_audio: se-ayto-to-mikro-mag-4e4b77.mp3
- id: SP-U06-012
  greek: Το αυτοκίνητο είναι παρκαρισμένο στη μικρή αυλή πίσω από το σπίτι.
  english: The car is parked in the small courtyard behind the house. (Phonology &
    Diphthong Drill)
  phonetic_hint: '[to aftoˈcinito ˈine parkarizˈmeno sti miˈkri avˈli ˈpiso aˈpo to
    ˈspiti] — ''αυτοκίνητο'' [aftoˈcinito] ([af] before τ) vs. ''αυλή'' [avˈli] ([av]
    before λ).'
  gender_or_pos: speaking-drill
  status: verified
  grammatical_info:
    stage: Criterion 4 (Pronunciation & Intonation)
    focus: 'Contrastive αυ in noun pairs: αυτοκίνητο / αυτόματος [af] vs. αυλή / αυγό
      / Αύγουστος [av]'
  notes: 'Examiner Objective: Tests automatic `[af]` vs. `[av]` production in Stage
    3 house/street descriptions.

    Strategy: Remember that `λ`, `γ`, `ρ` are voiced so `αυλή`, `αυγό`, `Αύγουστος`
    always take `[av]`.'
  keg_communicative_function: Describing residential spaces and vehicles with accurate
    diphthong voicing
  example_el: Τον Αύγουστο καθόμαστε κάθε βράδυ στη δροσερή αυλή του σπιτιού μας,
