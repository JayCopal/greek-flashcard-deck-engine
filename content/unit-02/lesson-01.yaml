unit_id: unit-02
lesson_id: lesson-01
title: Καταγωγή, Εθνικότητες & Γλώσσες (Origins, Nationalities & Languages)
description: 'CEFR A1: Countries, nationalities, spoken languages, and verbs of residence
  & communication (μένω, μιλάω, μαθαίνω).'
lesson_status: not_started
lesson_notes: 'Unit 2 Core Grammar Notes:

  • Expressing Origin: ''από + Accusative'' (e.g., Από πού είσαι; — Είμαι από την
  Ελλάδα).

  • Expressing Residence: ''σε + Accusative'' contracts with article: σε + την = στην,
  σε + το = στο, σε + τον = στον (e.g., Μένω στην Αθήνα).

  • Nationalities: Masculine in -ος/-ας/-ης, Feminine in -ίδα/-α (ο Έλληνας / η Ελληνίδα,
  ο Άγγλος / η Αγγλίδα).

  • Languages: Neuter plural with definite article (τα ελληνικά, τα αγγλικά, τα γαλλικά).'
