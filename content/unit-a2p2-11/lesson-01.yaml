unit_id: unit-a2p2-11
lesson_id: lesson-01
title: 'Μάθημα 11: Πολιτισμός, Τέχνες, ΜΜΕ & Ψηφιακή Επικοινωνία (Culture, Arts &
  Digital Media)'
description: Mastering theater, exhibitions, cinema, news media, social networking,
  and expressing cultural recommendations for the KEG A2 exam.
lesson_status: not_started
lesson_notes: "Unit A2P2-11 Core Notes: Πολιτισμός, Τέχνες, ΜΜΕ & Ψηφιακή Επικοινωνία\n\
  • Cultural Life & Entertainment Vocabulary:\n  - Performing Arts & Exhibitions (η\
  \ θεατρική παράσταση, η έκθεση ζωγραφικής, το μουσείο σύγχρονης τέχνης, το μουσικό\
  \ φεστιβάλ, η πρεμιέρα, ο/η θεατής).\n  - Media & Press (το δελτίο ειδήσεων, η εφημερίδα,\
  \ το ενημερωτικό άρθρο, ο/η δημοσιογράφος, η ηλεκτρονική συνδρομή).\n  - Digital\
  \ Media & Networking (τα μέσα κοινωνικής δικτύωσης, η ανάρτηση, ο λογαριασμός χρήστη,\
  \ ο κωδικός πρόσβασης, η ψηφιακή εφαρμογή, η κοινοποίηση συνδέσμου, το σχόλιο).\n\
  \  - Critical Review & Personal Opinions (προτείνω ανεπιφύλακτα, εντυπωσιάστηκα\
  \ από την παράσταση, παρακολουθώ τα πολιτιστικά δρώμενα)."
entries:
- id: A2P2-U11-001
  greek: η θεατρική παράσταση
  english: theatrical performance / play
  notes: 'Collocation: η παράσταση (performance) + adjective θεατρικός, -ή, -ό.'
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
    gender: feminine
  keg_communicative_function: Discussing cultural events, theater attendance, and
    leisure activities
  example_el: Κλείσαμε εισιτήρια για μια εξαιρετική θεατρική παράσταση το Σάββατο.
  example_en: We booked tickets for an excellent theater performance on Saturday.
  example2_el: Η θεατρική παράσταση ξεκινάει ακριβώς στις εννέα το βράδυ.
  example2_en: The theater performance starts punctually at nine in the evening.
  status: verified
  audio: i-theatriki-parastas-ae1fb3.mp3
  example_audio: kleisame-eisitiria-g-86bd35.mp3
  example2_audio: i-theatriki-parastas-dcc8f0.mp3
- id: A2P2-U11-002
  greek: η έκθεση ζωγραφικής
  english: painting exhibition / art exhibition
  notes: Noun η έκθεση + γενική της ζωγραφικής (painting).
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
    gender: feminine
