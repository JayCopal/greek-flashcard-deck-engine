    δημιουργών.
  example_en: The art gallery is hosting a new painting exhibition by well-known Greek
    artists.
  example2_el: Θέλεις να πάμε μαζί στην έκθεση ζωγραφικής την Κυριακή το πρωί;
  example2_en: Do you want us to go together to the painting exhibition on Sunday
    morning?
