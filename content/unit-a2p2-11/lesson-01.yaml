  example_el: Κάθε καλοκαίρι διοργανώνεται ένα διεθνές μουσικό φεστιβάλ στο αρχαίο
    θέατρο.
  example_en: Every summer an international music festival is organized at the ancient
    theater.
  example2_el: Αγοράσαμε κάρτα διαρκείας για όλες τις συναυλίες του μουσικού φεστιβάλ.
  example2_en: We bought a season pass for all the concerts of the music festival.
  status: verified
