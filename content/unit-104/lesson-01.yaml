unit_id: unit-104
lesson_id: lesson-01
title: 'Ενότητα 3: Η οικογένειά μου — Μέλη Οικογένειας, Επίθετα, Χώρες, Γλώσσες &
  Ρήμα Μιλάω (Pages 69-82)'
description: 'CEFR A1: Talking about family members, marital status, possessive clitics,
  physical descriptions, countries, nationalities, languages, and Type B1 contract
  verbs (μιλάω) from Klik A1 (pages 69-82).'
lesson_status: not_started
lesson_notes: "Κλικ στα Ελληνικά Α1 — Ενότητα 3: Η οικογένειά μου (Σελίδες 69-82):\n\
  • Μέλη της Οικογένειας (Family Members):\n  - οι γονείς (ο πατέρας/μπαμπάς, η μητέρα/μαμά)\n\
  \  - τα παιδιά (ο γιος, η κόρη)\n  - τα αδέλφια (ο αδελφός, η αδελφή)\n  - οι παππούδες\
  \ (ο παππούς, η γιαγιά)\n  - τα εγγόνια (ο εγγονός, η εγγονή)\n  - οι σύζυγοι (ο\
  \ άντρας/σύζυγος, η γυναίκα/σύζυγος)\n• Οικογενειακή Κατάσταση (Marital Status):\n\
  \  - παντρεμένος, παντρεμένη, παντρεμένο (married)\n  - ελεύθερος, ελεύθερη, ελεύθερο\
  \ (single)\n• Κτητικές Αντωνυμίες (Weak Possessive Clitics):\n  - μου, σου, του,\
  \ της, μας, σας, τους\n  - Κανόνας διπλού τόνου: Όταν η λέξη τονίζεται στην προπαραλήγουσα,\
  \ παίρνει δεύτερο τόνο στη λήγουσα πριν από κτητική αντωνυμία (π.χ. το όνομά μου,\
  \ η οικογένειά της).\n• Επίθετα & Εξωτερική Περιγραφή (Physical Appearance Adjectives):\n\
  \  - ψηλός ↔ κοντός\n  - αδύνατος ↔ χοντρός\n  - νέος ↔ μεγάλος\n  - όμορφος ↔ άσχημος\n\
  \  - ξανθός ↔ μελαχρινός\n  - μοντέρνος, αθλητικός\n• Χώρες, Εθνικότητες & Γλώσσες\
  \ (Countries, Demonyms & Languages):\n  - Ελλάδα → ο Έλληνας, η Ελληνίδα → τα ελληνικά\n\
  \  - Αγγλία → ο Άγγλος, η Αγγλίδα → τα αγγλικά\n  - Γερμανία → ο Γερμανός, η Γερμανίδα\
  \ → τα γερμανικά\n  - Γαλλία → ο Γάλλος, η Γαλλίδα → τα γαλλικά\n  - Ιταλία → ο\
  \ Ιταλός, η Ιταλίδα → τα ιταλικά\n  - Ισπανία → ο Ισπανός, η Ισπανίδα → τα ισπανικά\n\
  \  - Αμερική → ο Αμερικανός, η Αμερικανίδα → τα αγγλικά\n• Ρήματα Β' Συζυγίας (Type\
  \ B1 Contract Verbs - μιλάω):\n  - Ενεστώτας: μιλάω/μιλώ, μιλάς, μιλάει, μιλάμε,\
  \ μιλάτε, μιλάνε/μιλούν."
