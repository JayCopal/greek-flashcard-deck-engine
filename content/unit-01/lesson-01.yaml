unit_id: unit-01
lesson_id: lesson-01
title: Χαιρετισμοί & Γνωριμία (Greetings & Introductions)
description: 'CEFR A1: Formal & informal greetings, polite addresses, personal pronouns,
  and core verbs (είμαι, λέω, γράφω).'
lesson_status: not_started
lesson_notes: 'Unit 1 Core Grammar Notes:

  • Vocative Singular: Masculine nouns in -ος end in -ε (κύριε Παπαδόπουλε). Feminine
  nouns in -α/-η remain unchanged (κυρία, δεσποινίς).

  • Copular Verb ''είμαι'' (Present): εγώ είμαι, εσύ είσαι, αυτός/αυτή/αυτό είναι,
  εμείς είμαστε, εσείς είστε, αυτοί/αυτές/αυτά είναι.

  • Stating Names: ''Με λένε + Accusative'' (e.g. Με λένε Κώστα) or ''Είμαι ο/η +
  Nominative''.'
entries:
- id: A1-U01-001
  greek: ο κύριος
  phonetic_hint: ''
  english: Mr. / sir / gentleman
  notes: Vocative singular drops final -ς and changes to -ε (κύριε).
  gender_or_pos: noun (masculine)
  audio: o-kyrios-022974.mp3
  status: verified
  example_el: Γεια σας, κύριε Παπαδόπουλε.
  example_en: Hello, Mr. Papadopoulos.
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι κύριοι
    accusative_singular: τον κύριο
  keg_communicative_function: Addressing individuals politely and formal introductions
  example_audio: geia-sas-kyrie-papad-bc492e.mp3
  example2_el: Ποιος είναι αυτός ο κύριος εκεί;
  example2_en: Who is that gentleman over there?
  example2_audio: poios-einai-aytos-o--d2f05b.mp3
- id: A1-U01-002
  greek: η κυρία
  phonetic_hint: ''
  english: Mrs. / Ms. / lady
  notes: 'Vocative singular is identical to nominative: κυρία.'
  gender_or_pos: noun (feminine)
  audio: i-kyria-15b8ff.mp3
  status: verified
  example_el: Αυτή είναι η κυρία Καραγιάννη.
  example_en: This is Mrs. Karagianni.
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι κυρίες
    accusative_singular: την κυρία
  keg_communicative_function: Addressing adult women respectfully
  example_audio: ayti-einai-i-kyria-k-e0bed4.mp3
  example2_el: Η κυρία Παπαδάκη είναι καθηγήτρια ελληνικών.
  example2_en: Mrs. Papadaki is a Greek teacher.
  example2_audio: i-kyria-papadaki-ein-48964e.mp3
- id: A1-U01-003
  greek: η δεσποινίδα
  phonetic_hint: ''
  english: Miss / young lady
  notes: In daily spoken Greek, often truncated to the vocative particle 'δεσποινίς'.
  gender_or_pos: noun (feminine)
  audio: i-despoinida-50adc7.mp3
  status: verified
  example_el: Καλημέρα σας, δεσποινίς Ελένη.
  example_en: Good morning, Miss Eleni.
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι δεσποινίδες
    accusative_singular: τη δεσποινίδα
  keg_communicative_function: Polite address to an unmarried young woman
  example_audio: kalimera-sas-despoin-1a0d9f.mp3
  example2_el: Η δεσποινίς Μαρία είναι γραμματέας στο σχολείο.
  example2_en: Miss Maria is a secretary at the school.
  example2_audio: i-despoinis-maria-ei-6d3662.mp3
- id: A1-U01-004
  greek: το όνομα
  phonetic_hint: ''
  english: name / first name
  notes: 'Neuter noun in -μα; plural adds -τα (τα ονόματα). Takes a second accent
    before possessive clitic: το όνομά μου.'
  gender_or_pos: noun (neuter)
  audio: to-onoma-3f4b6c.mp3
  status: verified
  example_el: Ποιο είναι το όνομά σου;
  example_en: What is your name?
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα ονόματα
    accusative_singular: το όνομα
  keg_communicative_function: Asking for and stating names in introductions
  example_audio: poio-einai-to-onoma--d1e0c2.mp3
  example2_el: Γράψτε το όνομά σας στο έντυπο, παρακαλώ.
  example2_en: Write your name on the form, please.
  example2_audio: grapste-to-onoma-sas-10f76e.mp3
- id: A1-U01-005
  greek: το επώνυμο
  phonetic_hint: ''
  english: surname / last name
  notes: 'Proparoxytone noun (accent on antepenult). Takes an enclitic accent before
    possessive: το επώνυμό μου.'
  gender_or_pos: noun (neuter)
  audio: to-eponymo-1420da.mp3
  status: verified
  example_el: Το επώνυμό μου είναι Αντωνίου.
  example_en: My last name is Antoniou.
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα επώνυμα
    accusative_singular: το επώνυμο
  keg_communicative_function: Official registration and identity forms
  example_audio: to-eponymo-moy-einai-548377.mp3
  example2_el: Πώς γράφετε το επώνυμό σας;
  example2_en: How do you spell your last name?
  example2_audio: pos-grafete-to-epony-3f6a9b.mp3
- id: A1-U01-006
  greek: το γράμμα
  phonetic_hint: ''
  english: letter (alphabet) / postal letter
  notes: 'Neuter noun in -μα (plural: τα γράμματα). Essential for KEG listening task
    on name spelling.'
  gender_or_pos: noun (neuter)
  audio: to-gramma-9b532e.mp3
  status: verified
  example_el: Ποιο είναι το πρώτο γράμμα;
  example_en: What is the first letter?
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα γράμματα
    accusative_singular: το γράμμα
  keg_communicative_function: Spelling Greek names and asking about the alphabet
  example_audio: poio-einai-to-proto--db7669.mp3
  example2_el: Έχω ένα γράμμα από τον φίλο μου στην Ιταλία.
  example2_en: I have a letter from my friend in Italy.
  example2_audio: echo-ena-gramma-apo--0b4e6d.mp3
- id: A1-U01-007
  greek: ο φίλος
  phonetic_hint: ''
  english: friend (male)
  notes: 'Vocative singular: (ε) φίλε μου! Note masculine nominative article ''ο''.'
  gender_or_pos: noun (masculine)
  audio: o-filos-568da6.mp3
  status: verified
  example_el: Αυτός είναι ο φίλος μου, ο Νίκος.
  example_en: This is my friend, Nikos.
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι φίλοι
    accusative_singular: τον φίλο
  keg_communicative_function: Introducing social acquaintances and friends
  example_audio: aytos-einai-o-filos--4c60b9.mp3
  example2_el: Ο φίλος μου μιλάει πολύ καλά ελληνικά.
  example2_en: My friend speaks Greek very well.
  example2_audio: o-filos-moy-milaei-p-dbeb7c.mp3
- id: A1-U01-008
  greek: η φίλη
  phonetic_hint: ''
  english: friend (female)
  notes: Regular feminine in -η with plural in -ες. Accusative drops final -ν before
    fricatives (τη φίλη).
  gender_or_pos: noun (feminine)
  audio: i-fili-01b48a.mp3
  status: verified
  example_el: Αυτή είναι η φίλη μου, η Μαρία.
  example_en: This is my friend, Maria.
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι φίλες
    accusative_singular: τη φίλη
  keg_communicative_function: Introducing female friends
  example_audio: ayti-einai-i-fili-mo-c66aec.mp3
  example2_el: Η φίλη μου μένει στη Θεσσαλονίκη.
  example2_en: My friend lives in Thessaloniki.
  example2_audio: i-fili-moy-menei-sti-c824c2.mp3
- id: A1-U01-009
  greek: είμαι
  phonetic_hint: ''
  english: to be / I am
  notes: 'Copular auxiliary verb. Full present paradigm: είμαι, είσαι, είναι, είμαστε,
    είστε (είσαστε), είναι.'
  gender_or_pos: verb (irregular)
  audio: eimai-8863b2.mp3
  status: verified
  example_el: Εγώ είμαι ο Γιώργος.
  example_en: I am Giorgos.
  grammatical_info:
    part_of_speech: verb (irregular)
    verb_type: irregular
    third_person_singular: αυτός / αυτή / αυτό είναι
    first_person_plural: εμείς είμαστε
  keg_communicative_function: Self-identification, stating profession and identity
  example_audio: ego-eimai-o-giorgos-b15e5e.mp3
  example2_el: Είστε έτοιμοι για τις εξετάσεις;
  example2_en: Are you ready for the exams?
  example2_audio: eiste-etoimoi-gia-ti-4b46d2.mp3
- id: A1-U01-010
  greek: λέω
  phonetic_hint: ''
  english: to say / to tell / to call
  notes: '''Με λένε + Accusative'' literally means ''They call me''. Most natural
    everyday way to state your name.'
  gender_or_pos: verb
  audio: leo-5cb2e9.mp3
  status: verified
  example_el: Με λένε Κώστα και είμαι μαθητής.
  example_en: My name is Kostas and I am a student.
  grammatical_info:
    part_of_speech: verb
    verb_type: A
    third_person_singular: αυτός / αυτή / αυτό λέει
    first_person_plural: εμείς λέμε
  keg_communicative_function: Stating one's name via direct object formula ('με λένε')
  example_audio: me-lene-kosta-kai-ei-ff95e1.mp3
  example2_el: Τι λέει ο διάλογος στο κείμενο;
  example2_en: What does the dialogue in the text say?
  example2_audio: ti-leei-o-dialogos-s-a6e73e.mp3
- id: A1-U01-011
  greek: γράφω
  phonetic_hint: ''
  english: to write / to spell
  notes: Model Type A regular active verb (-ω, -εις, -ει, -ουμε, -ετε, -ουν).
  gender_or_pos: verb
  audio: grafo-ee0d8a.mp3
  status: verified
  example_el: Πώς γράφετε το όνομά σας;
  example_en: How do you write (spell) your name?
  grammatical_info:
    part_of_speech: verb
    verb_type: A
    third_person_singular: αυτός / αυτή / αυτό γράφει
    first_person_plural: εμείς γράφουμε
  keg_communicative_function: Asking how names and contact information are spelled
  example_audio: pos-grafete-to-onoma-7fc2cd.mp3
  example2_el: Γράφω μια σύντομη κάρτα στη μητέρα μου.
  example2_en: I am writing a short card to my mother.
  example2_audio: grafo-mia-syntomi-ka-4011bf.mp3
- id: A1-U01-012
  greek: εγώ
  phonetic_hint: ''
  english: I (subject pronoun)
  notes: Modern Greek is a pro-drop language; 'εγώ' is reserved for emphasis or contrast.
  gender_or_pos: personal pronoun
  audio: ego-98e697.mp3
  status: verified
  example_el: Εγώ είμαι από την Ελλάδα, εσύ;
  example_en: I am from Greece, and you?
  grammatical_info:
    part_of_speech: personal pronoun
    case: nominative
    person_number: 1st person singular
  keg_communicative_function: Emphasizing personal identity or contrasting with others
  example_audio: ego-eimai-apo-tin-el-efc406.mp3
  example2_el: Εγώ μένω στην Αθήνα και σπουδάζω.
  example2_en: I live in Athens and I study.
  example2_audio: ego-meno-stin-athina-6b7fd4.mp3
- id: A1-U01-013
  greek: εσύ
  phonetic_hint: ''
  english: you (informal singular)
  notes: Informal address. Contrasts strictly with the formal polite 'εσείς'.
  gender_or_pos: personal pronoun
  audio: esy-96c0ba.mp3
  status: verified
  example_el: Εσύ πώς είσαι σήμερα;
  example_en: How are you today?
  grammatical_info:
    part_of_speech: personal pronoun
    case: nominative
    person_number: 2nd person singular
  keg_communicative_function: Directly addressing a friend, colleague, or child
  example_audio: esy-pos-eisai-simera-1ad389.mp3
  example2_el: Εσύ τι γλώσσες μιλάς;
  example2_en: What languages do you speak?
  example2_audio: esy-ti-glosses-milas-6a7aa1.mp3
- id: A1-U01-014
  greek: αυτός
  phonetic_hint: ''
  english: he / this (masculine)
  notes: Functions both as 3rd person subject pronoun ('he') and demonstrative ('this').
  gender_or_pos: demonstrative / personal pronoun
  audio: aytos-9a3230.mp3
  status: verified
  example_el: Αυτός είναι ο δάσκαλός μας.
  example_en: He is our teacher.
  grammatical_info:
    part_of_speech: demonstrative / personal pronoun
    gender: masculine
    case: nominative singular
    plural: αυτοί
  keg_communicative_function: Introducing and pointing out a male individual
  example_audio: aytos-einai-o-daskal-305988.mp3
  example2_el: Αυτός είναι ο νέος γιατρός του νοσοκομείου.
  example2_en: He is the new doctor of the hospital.
  example2_audio: aytos-einai-o-neos-g-81aefc.mp3
- id: A1-U01-015
  greek: αυτή
  phonetic_hint: ''
  english: she / this (feminine)
  notes: Feminine nominative singular. Plural is 'αυτές'.
  gender_or_pos: demonstrative / personal pronoun
  audio: ayti-2d323d.mp3
  status: verified
  example_el: Αυτή είναι η Άννα.
  example_en: She is Anna.
  grammatical_info:
    part_of_speech: demonstrative / personal pronoun
    gender: feminine
    case: nominative singular
    plural: αυτές
  keg_communicative_function: Introducing and pointing out a female individual
  example_audio: ayti-einai-i-anna-17ef6f.mp3
  example2_el: Αυτή δουλεύει σε μία μεγάλη τράπεζα.
  example2_en: She works in a big bank.
  example2_audio: ayti-doyleyei-se-mia-ebf68f.mp3
- id: A1-U01-016
  greek: αυτό
  phonetic_hint: ''
  english: it / this (neuter)
  notes: 'Neuter singular. Universal question prompt in KEG A1 listening items: ''Τι
    είναι αυτό;''.'
  gender_or_pos: demonstrative / personal pronoun
  audio: ayto-89e896.mp3
  status: verified
  example_el: Τι είναι αυτό;
  example_en: What is this?
  grammatical_info:
    part_of_speech: demonstrative / personal pronoun
    gender: neuter
    case: nominative singular
    plural: αυτά
  keg_communicative_function: Inquiring about or identifying objects and concepts
  example_audio: ti-einai-ayto-5207b3.mp3
  example2_el: Αυτό το βιβλίο είναι για το επίπεδο Α1.
  example2_en: This book is for level A1.
  example2_audio: ayto-to-vivlio-einai-9095a1.mp3
- id: A1-U01-017
  greek: εμείς
  phonetic_hint: ''
  english: we (subject pronoun)
  notes: Triggers 1st person plural verb ending -ουμε / -μαστε.
  gender_or_pos: personal pronoun
  audio: emeis-2dfd81.mp3
  status: verified
  example_el: Εμείς είμαστε μαθητές.
  example_en: We are students.
  grammatical_info:
    part_of_speech: personal pronoun
    case: nominative
    person_number: 1st person plural
  keg_communicative_function: Expressing shared identity or group actions
  example_audio: emeis-eimaste-mathit-cdf3d9.mp3
  example2_el: Εμείς μαθαίνουμε ελληνικά κάθε μέρα.
  example2_en: We learn Greek every day.
  example2_audio: emeis-mathainoyme-el-364c82.mp3
- id: A1-U01-018
  greek: εσείς
  phonetic_hint: ''
  english: you (polite singular / plural)
  notes: The plural of courtesy (πληθυντικός ευγενείας). Essential KEG A1 social competence
    marker.
  gender_or_pos: personal pronoun
  audio: eseis-f7b073.mp3
  status: verified
  example_el: Εσείς από πού είστε;
  example_en: Where are you from? (formal or plural)
  grammatical_info:
    part_of_speech: personal pronoun
    case: nominative
    person_number: 2nd person plural / polite singular
  keg_communicative_function: Polite formula for addressing adult strangers or a group
  example_audio: eseis-apo-poy-eiste-def91d.mp3
  example2_el: Εσείς τι δουλειά κάνετε;
  example2_en: What kind of work do you do?
  example2_audio: eseis-ti-doyleia-kan-472018.mp3
- id: A1-U01-019
  greek: αυτοί, αυτές, αυτά
  phonetic_hint: ''
  english: they (m. / f. / n.)
  notes: 'Gender agreement is mandatory in 3rd person plural: άντρες -> αυτοί, γυναίκες
    -> αυτές, πράγματα -> αυτά.'
  gender_or_pos: demonstrative / personal pronoun
  audio: aytoi-aytes-ayta-2df532.mp3
  status: verified
  example_el: Αυτοί είναι οι νέοι συμμαθητές μας.
  example_en: They are our new classmates.
  grammatical_info:
    part_of_speech: demonstrative / personal pronoun
    case: nominative plural
    forms: αυτοί (m), αυτές (f), αυτά (n)
  keg_communicative_function: Identifying multiple third persons or objects
  example_audio: aytoi-einai-oi-neoi--2dc4a7.mp3
  example2_el: Αυτά τα μαθήματα είναι πολύ χρήσιμα.
  example2_en: These lessons are very useful.
  example2_audio: ayta-ta-mathimata-ei-3a20e3.mp3
- id: A1-U01-020
  greek: πώς
  phonetic_hint: ''
  english: how
  notes: Always takes a written accent (τόνος) in questions to distinguish from the
    conjunction 'πως' (that).
  gender_or_pos: interrogative adverb
  audio: pos-9157e7.mp3
  status: verified
  example_el: Πώς σε λένε;
  example_en: 'What is your name? (Literally: How do they call you?)'
  grammatical_info:
    part_of_speech: interrogative adverb
  keg_communicative_function: Inquiring about well-being, names, and methods
  example_audio: pos-se-lene-dcea99.mp3
  example2_el: Πώς πάτε στο πανεπιστήμιο;
  example2_en: How do you go to the university?
  example2_audio: pos-pate-sto-panepis-77e55a.mp3
- id: A1-U01-021
  greek: ποιος, ποια, ποιο
  phonetic_hint: ''
  english: who / which (m. / f. / n.)
  notes: 'Always accented. Agrees in gender with the referenced noun: ποιος είναι
    αυτός; / ποια είναι αυτή;.'
  gender_or_pos: interrogative pronoun
  audio: poios-poia-poio-37e5e1.mp3
  status: verified
  example_el: Ποιος είναι αυτός ο κύριος;
  example_en: Who is that gentleman?
  grammatical_info:
    part_of_speech: interrogative pronoun
    forms: ποιος (masculine), ποια (feminine), ποιο (neuter)
  keg_communicative_function: Inquiring about the identity of specific persons or
    objects
  example_audio: poios-einai-aytos-o--f741d4.mp3
  example2_el: Ποιο είναι το τηλέφωνό σας;
  example2_en: What is your phone number?
  example2_audio: poio-einai-to-tilefo-5513a3.mp3
- id: A1-U01-022
  greek: τι
  phonetic_hint: ''
  english: what
  notes: Monosyllabic and never accented. 'Τι κάνεις;' is the ubiquitous everyday
    Greek greeting.
  gender_or_pos: interrogative pronoun (indeclinable)
  audio: ti-45404c.mp3
  status: verified
  example_el: Τι κάνεις;
  example_en: How are you doing? / What are you doing?
  grammatical_info:
    part_of_speech: interrogative pronoun (indeclinable)
  keg_communicative_function: Asking for information about things, actions, and states
  example_audio: ti-kaneis-108950.mp3
  example2_el: Τι ώρα αρχίζει η εξέταση;
  example2_en: What time does the exam begin?
  example2_audio: ti-ora-archizei-i-ex-614275.mp3
- id: A1-U01-023
  greek: γεια σου
  phonetic_hint: ''
  english: hello / hi / bye (informal singular)
  notes: Derived from 'υγεία σου' (to your health). Used symmetrically for both 'hello'
    and 'goodbye'.
  gender_or_pos: phrase
  audio: geia-soy-f16a94.mp3
  status: verified
  example_el: Γεια σου, Ελένη! Τι νέα;
  example_en: Hi, Eleni! What's new?
  grammatical_info:
    part_of_speech: phrase
    register: informal singular
  keg_communicative_function: Greeting or saying farewell to friends, family, and
    peers
  example_audio: geia-soy-eleni-ti-ne-fbcfe8.mp3
  example2_el: Γεια σου, Νίκο! Τα λέμε αύριο.
  example2_en: Hello, Nikos! See you tomorrow.
  example2_audio: geia-soy-niko-ta-lem-df8abe.mp3
- id: A1-U01-024
  greek: γεια σας
  phonetic_hint: ''
  english: hello / goodbye (formal singular / plural)
  notes: Standard formal opening for KEG oral examination interviews.
  gender_or_pos: phrase
  audio: geia-sas-874d29.mp3
  status: verified
  example_el: Γεια σας, κύριε καθηγητά.
  example_en: Hello, professor.
  grammatical_info:
    part_of_speech: phrase
    register: formal singular or plural
  keg_communicative_function: Greeting professionals, elders, strangers, or multiple
    people
  example_audio: geia-sas-kyrie-kathi-a8a915.mp3
  example2_el: Γεια σας, παιδιά! Είστε καλά;
  example2_en: Hello, guys! Are you well?
  example2_audio: geia-sas-paidia-eist-76efa5.mp3
- id: A1-U01-025
  greek: καλημέρα
  phonetic_hint: ''
  english: good morning / good day
  notes: Compound of καλή + μέρα. Written as a single word with accent on -ε-.
  gender_or_pos: phrase (greeting)
  audio: kalimera-bf9fcd.mp3
  status: verified
  example_el: Καλημέρα σε όλους!
  example_en: Good morning to everyone!
  grammatical_info:
    part_of_speech: phrase (greeting)
  keg_communicative_function: Standard daytime greeting from dawn until early afternoon
  example_audio: kalimera-se-oloys-12243e.mp3
  example2_el: Καλημέρα, θέλω ένα εισιτήριο παρακαλώ.
  example2_en: Good morning, I want a ticket please.
  example2_audio: kalimera-thelo-ena-e-1e8f85.mp3
- id: A1-U01-026
  greek: καλησπέρα
  phonetic_hint: ''
  english: good afternoon / good evening
  notes: Used exclusively as a greeting upon arrival/meeting, never as a farewell.
