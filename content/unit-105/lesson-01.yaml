unit_id: unit-105
lesson_id: lesson-01
title: 'Ενότητα 4: Από το πρωί μέχρι το βράδυ — Καθημερινότητα, Ώρα, Μήνες & Ρήματα
  (Pages 87-110)'
description: 'CEFR A1: Daily routines, leisure activities, months of the year, seasons
  and weather, numbers 11-100, telling time, and core irregular & mediopassive verbs
  (πηγαίνω/πάω, ακούω, λέω, κοιμάμαι, έρχομαι) from Klik A1 (pages 87-110).'
lesson_status: not_started
lesson_notes: "Κλικ στα Ελληνικά Α1 — Ενότητα 4: Από το πρωί μέχρι το βράδυ (Σελίδες\
  \ 87-110):\n• Ελεύθερος Χρόνος & Δραστηριότητες (Leisure & Hobbies):\n  - μου αρέσει\
  \ + ενικός / μου αρέσουν + πληθυντικός (π.χ. μου αρέσει η μουσική, μου αρέσουν τα\
  \ μουσεία).\n  - Collocations: ακούω μουσική, παίζω ποδόσφαιρο, βλέπω αγώνες, διαβάζω\
  \ βιβλία.\n• Χρονικοί Προσδιορισμοί & Καθημερινότητα (Time Frames & Routines):\n\
  \  - το πρωί, το μεσημέρι, το απόγευμα, το βράδυ, το σαββατοκύριακο.\n  - Επιρρήματα\
  \ συχνότητας: νωρίς ↔ αργά, πάντα ↔ ποτέ, κάθε μέρα.\n• Μήνες του Έτους & Καιρός\
  \ (Months & Weather):\n  - Ιανουάριος, Φεβρουάριος, Μάρτιος, Απρίλιος, Μάιος, Ιούνιος,\
  \ Ιούλιος, Αύγουστος, Σεπτέμβριος, Οκτώβριος, Νοέμβριος, Δεκέμβριος.\n  - Καιρικές\
  \ εκφράσεις: Έχει καλό καιρό, Κάνει ζέστη / κρύο, βρέχει, χιονίζει.\n• Αριθμοί 11\
  \ - 100 (Numbers 11-100):\n  - 11: έντεκα, 12: δώδεκα, 15: δεκαπέντε, 20: είκοσι,\
  \ 30: τριάντα, 40: σαράντα, 50: πενήντα, 60: εξήντα, 70: εβδομήντα, 80: ογδόντα,\
  \ 90: ενενήντα, 100: εκατό.\n• Έκφραση της Ώρας (Telling Time):\n  - Τι ώρα είναι;\
  \ → Είναι επτά ακριβώς / οκτώ και τέταρτο / δύο και μισή / εννέα παρά τέταρτο.\n\
  \  - Ρήματα λειτουργίας: ανοίγει ↔ κλείνει, αρχίζει ↔ τελειώνει.\n• Ανώμαλα & Μέσα\
  \ Ρήματα (Irregular & Mediopassive Verbs):\n  - πηγαίνω / πάω (πάω, πας, πάει, πάμε,\
  \ πάτε, πάνε)\n  - ακούω (ακούω, ακούς, ακούει, ακούμε, ακούτε, ακούνε)\n  - λέω\
  \ (λέω, λες, λέει, λέμε, λέτε, λένε)\n  - κοιμάμαι (κοιμάμαι, κοιμάσαι, κοιμάται,\
  \ κοιμόμαστε, κοιμάστε, κοιμούνται)\n  - έρχομαι (έρχομαι, έρχεσαι, έρχεται, ερχόμαστε,\
  \ έρχεστε, έρχονται)\n  - ξεκουράζομαι (ξεκουράζομαι, ξεκουράζεσαι, ξεκουράζεται,\
  \ ξεκουραζόμαστε)."
