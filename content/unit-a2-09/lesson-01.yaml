unit_id: unit-a2-09
lesson_id: lesson-01
title: 'Μάθημα 9: Εργασία, Επαγγέλματα & Αγγελίες (Workplaces, CVs & Classified Ads)'
description: Navigating job advertisements, employment contracts, working conditions,
  and interview questions using Type 1 Conditionals (αν + ενεστώτας -> μέλλοντας)
  and temporal connectives (μόλις, αφού, πριν).
lesson_status: not_started
lesson_notes: "Unit A2-09 Core Notes: Εργασία & Επαγγέλματα (Work & Employment)\n\
  • Workplace Vocabulary:\n  - βιογραφικό (CV), συνέντευξη (interview), μισθός (salary),\
  \ ωράριο (working hours), άδεια (leave/vacation).\n  - σύμβαση (contract), προϋπηρεσία\
  \ (previous experience), προσόντα (qualifications).\n• Type 1 Conditionals:\n  -\
  \ Αν + Present -> Future / Imperative: «Αν με προσλάβετε, θα δουλέψω σκληρά.»"
entries:
- id: A2-U09-001
  greek: η αγγελία εργασίας
  english: job advertisement / vacancy listing
  notes: Feminine noun phrase. Fundamental authentic genre in KEG A2 Reading Section
    3 (matching job ads with candidates).
  gender_or_pos: noun phrase (feminine)
  grammatical_info:
    part_of_speech: noun phrase
    plural: οι αγγελίες εργασίας
    genitive: της αγγελίας εργασίας
  keg_communicative_function: Analyzing job offers, qualifications, and employment
    terms in classifieds
  example_el: Είδα μια πολύ ενδιαφέρουσα αγγελία εργασίας για γραμματέα σε δικηγορικό
    γραφείο.
  example_en: I saw a very interesting job advertisement for a secretary at a law
    office.
  example2_el: Η αγγελία ζητάει άτομο με άριστη γνώση υπολογιστών και εμπειρία στις
    πωλήσεις.
  example2_en: The ad asks for an individual with excellent computer knowledge and
    sales experience.
  audio: i-aggelia-ergasias-cacbef.mp3
  status: verified
  example_audio: eida-mia-poly-endiaf-7c0797.mp3
  example2_audio: i-aggelia-zitaei-ato-daf8bd.mp3
- id: A2-U09-002
  greek: ο μισθός
  english: salary / wage
  notes: Masculine noun in -ός (-οί). Collocates with 'βασικός μισθός' (minimum wage)
    and 'καθαρός μισθός' (net salary).
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι μισθοί
    collocation: βασικός μισθός (minimum wage)
  keg_communicative_function: Inquiring about remuneration and payment terms in job
    interviews
  example_el: Ο μηνιαίος μισθός καταβάλλεται στον τραπεζικό λογαριασμό την τελευταία
    εργάσιμη ημέρα.
  example_en: The monthly salary is paid into the bank account on the last working
    day.
  example2_el: Προσφέρουν ικανοποιητικό μισθό και δυνατότητα επαγγελματικής εξέλιξης.
  example2_en: They offer a satisfactory salary and potential for career development.
  audio: o-misthos-73fe69.mp3
  status: verified
  example_audio: o-miniaios-misthos-k-3974d5.mp3
  example2_audio: prosferoyn-ikanopoii-fee5d7.mp3
- id: A2-U09-003
  greek: η προϋπηρεσία
  english: previous work experience
  notes: 'Feminine noun in -α. Compound: προ + υπηρεσία. Prime requirement in Greek
    job applications.'
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    collocation: προϋπηρεσία τουλάχιστον δύο ετών (at least two years of experience)
  keg_communicative_function: Detailing professional background and years of service
    in CVs
  example_el: Απαιτείται προϋπηρεσία τουλάχιστον τριών ετών σε αντίστοιχη θέση.
  example_en: At least three years of previous experience in an equivalent position
    is required.
  example2_el: Έχω πενταετή προϋπηρεσία στον τομέα της φιλοξενίας και του τουρισμού.
  example2_en: I have five years of previous work experience in the hospitality and
    tourism sector.
  audio: i-proypiresia-ce2285.mp3
  status: verified
  example_audio: apaiteitai-proypires-21a45e.mp3
  example2_audio: echo-pentaeti-proypi-31bb58.mp3
- id: A2-U09-004
  greek: τα προσόντα
  english: qualifications / credentials
  notes: Neuter plural noun (singular 'το προσόν' is rare). Essential heading in CVs
    and vacancies.
  gender_or_pos: noun (neuter plural)
  grammatical_info:
    part_of_speech: noun (plural)
    genitive_plural: των προσόντων
    collocation: απαιτούμενα προσόντα (required qualifications)
  keg_communicative_function: Matching candidate profiles with employment prerequisites
  example_el: Τα βασικά προσόντα για τη θέση περιλαμβάνουν πτυχίο πανεπιστημίου και
    ξένες γλώσσες.
  example_en: The basic qualifications for the position include a university degree
    and foreign languages.
  example2_el: Διαθέτει όλα τα απαραίτητα τυπικά και ουσιαστικά προσόντα.
  example2_en: He possesses all the necessary formal and substantive qualifications.
  audio: ta-prosonta-747999.mp3
  status: verified
  example_audio: ta-vasika-prosonta-g-48c4f7.mp3
  example2_audio: diathetei-ola-ta-apa-f8eaeb.mp3
- id: A2-U09-005
  greek: η πλήρης απασχόληση
  english: full-time employment
  notes: 'Feminine noun phrase. Contrast: ''η μερική απασχόληση'' (part-time).'
  gender_or_pos: noun phrase (feminine)
  grammatical_info:
    part_of_speech: noun phrase
    antonym: η μερική απασχόληση (part-time)
    adjective: πλήρης (full)
  keg_communicative_function: Specifying contract working modality in job searches
    and interviews
  example_el: Η εταιρεία αναζητά υπάλληλο γραφείου για πλήρη απασχόληση.
  example_en: The company is seeking an office clerk for full-time employment.
  example2_el: Προτιμώ την πλήρη απασχόληση επειδή παρέχει μεγαλύτερη σταθερότητα.
  example2_en: I prefer full-time employment because it provides greater stability.
  audio: i-pliris-apascholisi-d343b0.mp3
  status: verified
  example_audio: i-etaireia-anazita-y-6ecfdb.mp3
  example2_audio: protimo-tin-pliri-ap-0716e3.mp3
- id: A2-U09-006
  greek: η μερική απασχόληση
  english: part-time employment
  notes: 'Feminine noun phrase. Contrast: ''η πλήρης απασχόληση''.'
  gender_or_pos: noun phrase (feminine)
  grammatical_info:
    part_of_speech: noun phrase
    antonym: η πλήρης απασχόληση
  keg_communicative_function: Discussing flexible student jobs and part-time shifts
  example_el: Ως φοιτητής εργαζόμουν με μερική απασχόληση σε ένα βιβλιοπωλείο.
  example_en: As a student I worked part-time at a bookstore.
  example2_el: Η θέση αφορά μερική απασχόληση τεσσάρων ωρών ημερησίως.
  example2_en: The position concerns part-time employment of four hours daily.
  audio: i-meriki-apascholisi-2f9933.mp3
  status: verified
  example_audio: os-foititis-ergazomo-d94ffc.mp3
  example2_audio: i-thesi-afora-meriki-4588a8.mp3
- id: A2-U09-007
  greek: η συνέντευξη εργασίας
  english: job interview
  notes: Feminine noun phrase. Relates to 'δίνω συνέντευξη' (to give an interview).
  gender_or_pos: noun phrase (feminine)
  grammatical_info:
    part_of_speech: noun phrase
    plural: οι συνεντεύξεις εργασίας
    collocation: περνάω από συνέντευξη
  keg_communicative_function: Preparing for and describing employment interviews in
    speaking Stage 1
  example_el: Αύριο το πρωί έχω μια κρίσιμη συνέντευξη εργασίας με τον υπεύθυνο προσωπικού.
  example_en: Tomorrow morning I have a crucial job interview with the HR manager.
  example2_el: Στη συνέντευξη εργασίας με ρώτησαν για την εμπειρία μου και τους στόχους
    μου.
  example2_en: In the job interview they asked me about my experience and my goals.
  audio: i-synenteyxi-ergasia-959404.mp3
  status: verified
  example_audio: ayrio-to-proi-echo-m-71e6e9.mp3
  example2_audio: sti-synenteyxi-ergas-06eb3a.mp3
- id: A2-U09-008
  greek: η σύμβαση
  english: employment contract / agreement
  notes: Feminine noun in -η (-εις). Collocates with 'σύμβαση αορίστου χρόνου' (permanent
    contract) or 'ορισμένου χρόνου' (fixed-term).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι συμβάσεις
    collocation: υπογράφω σύμβαση (to sign a contract)
  keg_communicative_function: Understanding formal employment terms and contract conditions
  example_el: Υπέγραψα σύμβαση εργασίας αορίστου χρόνου με την εταιρεία πληροφορικής.
  example_en: I signed an open-ended employment contract with the IT company.
  example2_el: Διαβάστε προσεκτικά όλους τους όρους πριν υπογράψετε τη σύμβαση.
  example2_en: Read all terms carefully before signing the contract.
  audio: i-symvasi-97b455.mp3
  status: verified
  example_audio: ypegrapsa-symvasi-er-de9b84.mp3
  example2_audio: diavaste-prosektika--69b188.mp3
- id: A2-U09-009
  greek: οι υπερωρίες
  english: overtime (hours)
  notes: Feminine noun plural (singular 'η υπερωρία'). Collocates with 'πληρώνομαι
    υπερωρίες'.
  gender_or_pos: noun (feminine plural)
  grammatical_info:
    part_of_speech: noun (plural)
    singular: η υπερωρία
    verb: κάνω υπερωρίες
  keg_communicative_function: Negotiating working schedule limits and overtime payments
  example_el: Όταν υπάρχει πολλή δουλειά, κάνουμε υπερωρίες οι οποίες πληρώνονται
    επιπλέον.
  example_en: When there is a lot of work, we work overtime which is paid extra.
  example2_el: Ο νόμος καθορίζει το ανώτατο όριο υπερωριών ανά μήνα.
  example2_en: The law defines the maximum limit of overtime per month.
  audio: oi-yperories-043a45.mp3
  status: verified
  example_audio: otan-yparchei-polli--f32ccd.mp3
  example2_audio: o-nomos-kathorizei-t-dc0ea4.mp3
- id: A2-U09-010
  greek: η ασφάλιση
  english: insurance / social security coverage
  notes: Feminine noun in -η (-εις). Core civic entitlement (ΕΦΚΑ).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι ασφαλίσεις
    collocation: κοινωνική ασφάλιση, ασφάλιση υγείας
  keg_communicative_function: Clarifying social security benefits and health coverage
    in employment inquiries
  example_el: Η θέση παρέχει πλήρη ασφάλιση υγείας και συνταξιοδοτικά δικαιώματα.
  example_en: The position provides full health insurance and pension rights.
  example2_el: Πρέπει να ελέγξετε αν η ασφάλισή σας είναι ενεργή.
  example2_en: You must check whether your insurance coverage is active.
  audio: i-asfalisi-824b33.mp3
  status: verified
  example_audio: i-thesi-parechei-pli-706a8b.mp3
  example2_audio: prepei-na-elegxete-a-233792.mp3
- id: A2-U09-011
  greek: τα ένσημα
  english: social security contributions / stamps
  notes: Neuter plural noun. Quintessential Greek labor system concept denoting registered
    workdays.
  gender_or_pos: noun (neuter plural)
  grammatical_info:
    part_of_speech: noun (plural)
    singular: το ένσημο
    collocation: κολλάω ένσημα (to accrue social security stamps)
  keg_communicative_function: Confirming legal registration of working days and insurance
    stamps
  example_el: Ο εργοδότης είναι υποχρεωμένος να κολλάει όλα τα νόμιμα ένσημα στον
    εργαζόμενο.
  example_en: The employer is obliged to contribute all legal social security stamps
    for the employee.
  example2_el: Χρειάζομαι βεβαίωση ενσήμων από τον ασφαλιστικό μου φορέα.
  example2_en: I need an attestation of insurance stamps from my social security agency.
  audio: ta-ensima-e87746.mp3
  status: verified
  example_audio: o-ergodotis-einai-yp-8de1ac.mp3
  example2_audio: chreiazomai-vevaiosi-eb2731.mp3
- id: A2-U09-012
  greek: ο εργαζόμενος
  english: employee / worker
  notes: 'Masculine substantivized participle (-ος, -η, -ο). Plural: ''οι εργαζόμενοι''.'
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    feminine: η εργαζόμενη
    plural: οι εργαζόμενοι
    antonym: ο εργοδότης
  keg_communicative_function: Discussing workers' rights, schedules, and responsibilities
  example_el: Οι εργαζόμενοι της επιχείρησης δικαιούνται ετήσια άδεια με αποδοχές.
  example_en: Employees of the enterprise are entitled to annual paid leave.
  example2_el: Είναι ένας πολύ συνεπής και εργατικός εργαζόμενος.
  example2_en: He is a very punctual and hardworking employee.
  audio: o-ergazomenos-e1dc38.mp3
  status: verified
  example_audio: oi-ergazomenoi-tis-e-b78902.mp3
  example2_audio: einai-enas-poly-syne-8df99f.mp3
- id: A2-U09-013
  greek: ο εργοδότης
  english: employer
  notes: 'Masculine noun in -ης (-ες). Feminine: ''η εργοδότρια''. Antonym: ''ο εργαζόμενος''.'
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι εργοδότες
    feminine: η εργοδότρια
    antonym: ο εργαζόμενος
  keg_communicative_function: Referring to management and employer responsibilities
    in workplace texts
  example_el: Ο εργοδότης οφείλει να διασφαλίζει συνθήκες υγιεινής και ασφάλειας στον
    χώρο εργασίας.
  example_en: The employer is obliged to ensure health and safety conditions in the
    workplace.
  example2_el: Είχαμε μια εποικοδομητική συζήτηση με τον νέο εργοδότη.
  example2_en: We had a constructive discussion with the new employer.
  audio: o-ergodotis-15f80f.mp3
  status: verified
  example_audio: o-ergodotis-ofeilei--c78ea1.mp3
  example2_audio: eichame-mia-epoikodo-0b3f3b.mp3
- id: A2-U09-014
  greek: η πρόσληψη
  english: hiring / recruitment
  notes: 'Feminine noun in -η (-εις). Verb: ''προσλαμβάνω'' (to hire). Antonym: ''η
    απόλυση''.'
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι προσλήψεις
    verb: προσλαμβάνω
    antonym: η απόλυση
  keg_communicative_function: Recognizing announcement of new hirings or job vacancy
    offers
  example_el: Η εταιρεία ανακοίνωσε την πρόσληψη είκοσι νέων προγραμματιστών.
  example_en: The company announced the hiring of twenty new software developers.
  example2_el: Μετά τη δεύτερη συνέντευξη έλαβα την επίσημη ειδοποίηση πρόσληψης.
  example2_en: After the second interview I received the official hiring notification.
  audio: i-proslipsi-09f35e.mp3
  status: verified
  example_audio: i-etaireia-anakoinos-807bfa.mp3
  example2_audio: meta-ti-deyteri-syne-8ef8d4.mp3
- id: A2-U09-015
  greek: προσλαμβάνω
  english: to hire / to employ
  notes: 'Active compound verb (προς + λαμβάνω). Simple past: ''προσέλαβα''. Simple
    future: ''θα προσλάβω''.'
  gender_or_pos: verb
  grammatical_info:
    part_of_speech: verb
    simple_past: προσέλαβα
    simple_future: θα προσλάβω
    noun_derivative: η πρόσληψη
  keg_communicative_function: Describing recruitment decisions and employer actions
    in business dialogues
  example_el: Το ξενοδοχείο προσλαμβάνει προσωπικό για την καλοκαιρινή τουριστική
    περίοδο.
  example_en: The hotel is hiring staff for the summer tourist season.
  example2_el: Με προσέλαβαν αμέσως μόλις είδαν τις συστατικές μου επιστολές.
  example2_en: They hired me immediately as soon as they saw my reference letters.
  audio: proslamvano-7c2ed7.mp3
  status: verified
  example_audio: to-xenodocheio-prosl-bd77e3.mp3
  example2_audio: me-proselavan-amesos-5d2986.mp3
- id: A2-U09-016
  greek: παραιτούμαι
  english: to resign / to step down
  notes: 'Deponent verb (παραιτούμαι, παραιτείσαι, παραιτείται). Simple past: ''παραιτήθηκα''.'
  gender_or_pos: verb (deponent)
  grammatical_info:
    part_of_speech: verb
    simple_past: παραιτήθηκα
    simple_future: θα παραιτηθώ
    noun_derivative: η παραίτηση
  keg_communicative_function: Explaining past career transitions and resignation motives
    in interviews
  example_el: Παραιτήθηκα από την προηγούμενη δουλειά μου επειδή δεν υπήρχε προοπτική
    εξέλιξης.
  example_en: I resigned from my previous job because there was no prospect of advancement.
  example2_el: Υπέβαλε την παραίτησή του και αποφάσισε να κάνει ένα νέο ξεκίνημα.
  example2_en: He submitted his resignation and decided to make a fresh start.
  audio: paraitoymai-795b31.mp3
  status: verified
  example_audio: paraitithika-apo-tin-d7f477.mp3
  example2_audio: ypevale-tin-paraitis-dc1241.mp3
- id: A2-U09-017
  greek: αναζητώ
  english: to seek / to look for
  notes: 'Formal verb (αναζητώ, αναζητάς/αναζητείς). Standard formula in job ads:
    ''εταιρεία αναζητά...''.'
  gender_or_pos: verb
  grammatical_info:
    part_of_speech: verb
    simple_past: αναζήτησα
    noun_derivative: η αναζήτηση
  keg_communicative_function: Identifying employer search criteria in newspaper and
    online vacancy listings
  example_el: Μεγάλη εμπορική εταιρεία αναζητά άμεσα πωλητή με άριστες επικοινωνιακές
    δεξιότητες.
  example_en: A large commercial company is actively seeking a salesperson with excellent
    communication skills.
  example2_el: Αναζητώ μια σταθερή εργασία με προοπτικές μακροχρόνιας συνεργασίας.
  example2_en: I am seeking a stable job with long-term collaboration prospects.
  audio: anazito-7352ff.mp3
  status: verified
  example_audio: megali-emporiki-etai-29fb86.mp3
  example2_audio: anazito-mia-statheri-a71e72.mp3
- id: A2-U09-018
  greek: αν
  english: if (conditional particle)
  notes: 'Conditional conjunction. Variant: ''εάν''. At A2 level, introduces Type
    1 conditionals: ''αν + ενεστώτας -> μέλλοντας''.'
  gender_or_pos: conjunction
  grammatical_info:
    part_of_speech: conditional conjunction
    variant: εάν
    type_1_rule: αν + ενεστώτας -> θα + συνοπτικός μέλλοντας
  keg_communicative_function: Stating realistic conditions and their future outcomes
    in advice & proposals
  example_el: Αν περάσετε τις εξετάσεις του Μαΐου, θα αποκτήσετε το επίσημο πιστοποιητικό.
  example_en: If you pass the May exams, you will obtain the official certificate.
  example2_el: Αν έχετε απορίες σχετικά με την αγγελία, καλέστε στο τηλέφωνο της εταιρείας.
  example2_en: If you have questions regarding the advertisement, call the company
    phone.
  audio: an-23eff6.mp3
  status: verified
  example_audio: an-perasete-tis-exet-9a44fd.mp3
  example2_audio: an-echete-apories-sc-4322e1.mp3
- id: A2-U09-019
  greek: μόλις
  english: as soon as / just now
  notes: 'Temporal conjunction taking subjunctive or past: ''μόλις λάβω'' (as soon
    as I receive), ''μόλις έφτασα'' (I just arrived).'
  gender_or_pos: conjunction / adverb
  grammatical_info:
    part_of_speech: conjunction
    syntax: μόλις + υποτακτική (future time) / μόλις + αόριστος (immediate past)
  keg_communicative_function: Sequencing immediate successive actions in business
    correspondence
  example_el: Θα σας ενημερώσω μόλις ολοκληρωθεί η αξιολόγηση των βιογραφικών.
  example_en: I will inform you as soon as the evaluation of CVs is completed.
  example2_el: Μόλις έλαβα την επιστολή αποδοχής της αίτησής μου.
  example2_en: I just received the letter of acceptance of my application.
  audio: molis-f0158b.mp3
  status: verified
  example_audio: tha-sas-enimeroso-mo-2db10f.mp3
  example2_audio: molis-elava-tin-epis-3d5bfe.mp3
- id: A2-U09-020
  greek: αφού
  english: after / since
  notes: Subordinating temporal conjunction taking past tense or subjunctive.
  gender_or_pos: conjunction
  grammatical_info:
    part_of_speech: conjunction
    temporal_role: marks prior action before main clause
  keg_communicative_function: Narrating chronological sequences in past career achievements
  example_el: Αφού τελείωσε το πανεπιστήμιο, έκανε πρακτική άσκηση σε μεγάλη τράπεζα.
  example_en: After finishing university, she did an internship at a major bank.
  example2_el: Αφού συμφωνήσουμε στους όρους, θα προχωρήσουμε στην υπογραφή της σύμβασης.
  example2_en: After we agree on the terms, we will proceed to signing the contract.
  audio: afoy-7ba565.mp3
  status: verified
  example_audio: afoy-teleiose-to-pan-c9dd7f.mp3
  example2_audio: afoy-symfonisoyme-st-d6a685.mp3
- id: A2-U09-021
  greek: πριν
  english: before
  notes: 'Temporal conjunction/adverb. Followed by ''να + subjunctive'': ''πριν υπογράψετε''.'
  gender_or_pos: conjunction / adverb
  grammatical_info:
    part_of_speech: conjunction
