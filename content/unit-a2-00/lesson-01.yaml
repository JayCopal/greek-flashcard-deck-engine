unit_id: unit-a2-00
lesson_id: lesson-01
title: 'Μάθημα 0: Οδηγίες Εξετάσεων Α2 & Γλώσσα Rubrics (KEG A2 Exam Instructions
  & Rubrics)'
description: Essential exam instructions, task rubrics, official test terminology,
  and evaluation guidelines for the Centre for the Greek Language (ΚΕΓ / KEG) Level
  A2 May certification examinations.
lesson_status: not_started
lesson_notes: "Unit A2-00 Core Notes: Γλώσσα Εξετάσεων & Οδηγίες Επιπέδου Α2 (KEG\
  \ A2 Exam Specifications)\n\n• Overview of the Official May Examination (Πιστοποιητικό\
  \ Επάρκειας της Ελληνομάθειας - Επίπεδο Α2):\n  Conducted annually in May by the\
  \ Centre for the Greek Language (ΚΕΓ) under the Hellenic Ministry of Education.\n\
  \  Comprises four mandatory evaluation sections:\n  1. Κατανόηση Προφορικού Λόγου\
  \ (Listening Comprehension - 30 mins): 3 parts covering recorded announcements,\
  \ public notices, and dialogic interviews.\n  2. Κατανόηση Γραπτού Λόγου (Reading\
  \ Comprehension - 45 mins): 3 parts covering brochures, advertisements, articles,\
  \ and short authentic texts.\n  3. Παραγωγή Γραπτού Λόγου (Written Production -\
  \ 45 mins): 2 tasks. Task 1: Short communicative email/postcard (40-50 words). Task\
  \ 2: Narrative or descriptive letter/email (70-80 words).\n  4. Παραγωγή Προφορικού\
  \ Λόγου (Oral Production - 10-15 mins): 3 tasks in candidate pairs. Task 1: Personal\
  \ interview & biography. Task 2: Role-play using cue cards (κάρτες ρόλου). Task\
  \ 3: Joint problem-solving or discussion.\n\n• Key Advanced Rubric Imperatives at\
  \ Level A2:\n  - αιτιολογήστε (justify/substantiate your answer with evidence from\
  \ the text)\n  - συγκρίνετε (compare the two options or situations)\n  - συντάξτε\
  \ (draft a formal letter or email)\n  - διατυπώστε (formulate a polite request or\
  \ complaint)\n  - περιγράψτε (describe an event, place, or person in detail)\n \
  \ - αφηγηθείτε (narrate a past experience using chronological past tenses)\n\n•\
  \ Scoring & Success Threshold:\n  Success requires passing each individual skill\
  \ with at least 60% (12/20 marks)."
