unit_id: unit-cyp-02
lesson_id: lesson-01
title: 'Μάθημα 2: Σύγχρονη Ιστορία της Κύπρου 1955–Σήμερα (Modern History of Cyprus)'
description: The 1955–1959 EOKA liberation struggle, Zurich-London Agreements, proclamation
  of independence (1960), chronological succession of Presidents of the Republic,
  the 1974 coup and Turkish invasion, the Green Line, the 2004 Annan Plan referendum,
  and EU accession.
lesson_status: not_started
lesson_notes: "Unit CYP-02 Core Exam Notes: Σύγχρονη Ιστορία της Κύπρου (Modern History\
  \ of Cyprus: 1955–Present)\n\n• Αγώνας της ΕΟΚΑ & Ίδρυση της Κυπριακής Δημοκρατίας\
  \ (1955–1960):\n  - 1878–1960: Περίοδος Αγγλοκρατίας (Βρετανική αποικιοκρατία).\n\
  \  - 1 Απριλίου 1955 – 1959: Απελευθερωτικός Αγώνας της ΕΟΚΑ (Εθνική Οργάνωση Κυπρίων\
  \ Αγωνιστών) κατά της βρετανικής αποικιοκρατίας, με στρατιωτικό αρχηγό τον Γεώργιο\
  \ Γρίβα (Διγενή) και πολιτικό ηγέτη τον Αρχιεπίσκοπο Μακάριο Γ΄.\n  - Φεβρουάριος\
  \ 1959: Υπογραφή των Συμφωνιών Ζυρίχης-Λονδίνου. Τρεις Εγγυήτριες Δυνάμεις: Ελλάδα,\
  \ Τουρκία, Ηνωμένο Βασίλειο.\n  - 16 Αυγούστου 1960: Επίσημη ανακήρυξη της ανεξαρτησίας\
  \ της Κυπριακής Δημοκρατίας. (Εορτάζεται την 1η Οκτωβρίου).\n\n• Οι Πρόεδροι της\
  \ Κυπριακής Δημοκρατίας (Chronological List — High Exam Frequency!):\n  1. Αρχιεπίσκοπος\
  \ Μακάριος Γ΄ (1960–1977) — Πρώτος Πρόεδρος\n  2. Σπύρος Κυπριανού (1977–1988)\n\
  \  3. Γιώργος Βασιλείου (1988–1993)\n  4. Γλαύκος Κληρίδης (1993–2003)\n  5. Τάσσος\
  \ Παπαδόπουλος (2003–2008) — Επί προεδρίας του έγινε το δημοψήφισμα για το Σχέδιο\
  \ Ανάν & η ένταξη στην ΕΕ (2004)\n  6. Δημήτρης Χριστόφιας (2008–2013)\n  7. Νίκος\
  \ Αναστασιάδης (2013–2023)\n  8. Νίκος Χριστοδουλίδης (2023–σήμερα)\n\n• Γεγονότα\
  \ 1963–1974 & Το Κυπριακό Πρόβλημα:\n  - 1963–1964: Διακοινοτικές ταραχές, χάραξη\
  \ της Πράσινης Γραμμής στη Λευκωσία και άφιξη της Ειρηνευτικής Δύναμης του ΟΗΕ (ΟΥΝΦΙΚΥΠ\
  \ / UNFICYP) το 1964.\n  - 15 Ιουλίου 1974: Στρατιωτικό πραξικόπημα της ελληνικής\
  \ χούντας και της ΕΟΚΑ Β΄ κατά του Προέδρου Μακαρίου.\n  - 20 Ιουλίου 1974: Τουρκική\
  \ στρατιωτική εισβολή («Αττίλας Ι» τον Ιούλιο και «Αττίλας ΙΙ» στις 14 Αυγούστου\
  \ 1974).\n  - Συνέπειες: Κατοχή περίπου του 36,2%–37% του εδάφους της Κυπριακής\
  \ Δημοκρατίας, ~200.000 πρόσφυγες, αγνοούμενοι, εγκλωβισμένοι στην Καρπασία.\n \
  \ - 15 Νοεμβρίου 1983: Παράνομη ανακήρυξη του «ψευδοκράτους» στα κατεχόμενα, η οποία\
  \ καταδικάστηκε από το Ψήφισμα 541 του Συμβουλίου Ασφαλείας του ΟΗΕ (αναγνωρίζεται\
  \ μόνο από την Τουρκία).\n  - 24 Απριλίου 2004: Δημοψήφισμα για το Σχέδιο Ανάν (απορρίφθηκε\
  \ από το 76% των Ελληνοκυπρίων, εγκρίθηκε από το 65% των Τουρκοκυπρίων).\n  - 1\
  \ Μαΐου 2004: Επίσημη ένταξη της Κυπριακής Δημοκρατίας στην Ευρωπαϊκή Ένωση."
entries:
- id: CYP-U02-001
  greek: — Πότε ανακηρύχθηκε επίσημα η Κυπριακή Δημοκρατία ως ανεξάρτητο κράτος; —
    Στις 16 Αυγούστου 1960.
  phonetic_hint: POH-teh ah-nah-kee-REEK-thee-keh eh-PEE-see-mah ee kee-pree-ah-KEE
    theem-oh-krah-TEE-ah? stees theh-kah-EHK-see ahv-GHOO-stoo 1960
  english: — When was the Republic of Cyprus officially proclaimed an independent
    state? — On 16 August 1960.
  notes: 'Crucial exam distinction: Independence was actually proclaimed on 16 August
    1960, whereas Independence Day is celebrated on 1 October (to avoid the summer
    heat and holidays).'
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Date of proclamation of Independence
  example_el: Η Κυπριακή Δημοκρατία ιδρύθηκε στις 16 Αυγούστου 1960 μετά το τέλος
    της βρετανικής αποικιοκρατίας.
  example_en: The Republic of Cyprus was founded on 16 August 1960 after the end of
    British colonial rule.
  example2_el: Αν και η ανεξαρτησία ανακηρύχθηκε στις 16 Αυγούστου, η επίσημη εθνική
    επέτειος γιορτάζεται την 1η Οκτωβρίου.
  example2_en: Although independence was proclaimed on 16 August, the official national
    anniversary is celebrated on 1 October.
  audio: null
  status: pending_tts
- id: CYP-U02-002
  greek: — Πότε γιορτάζεται η Ημέρα Ανεξαρτησίας της Κυπριακής Δημοκρατίας; — Την
    1η Οκτωβρίου.
  phonetic_hint: POH-teh yor-TAH-zeh-teh ee ee-MEH-rah ah-nehk-sahr-tee-SEE-ahs tees
    kee-pree-ah-KEES theem-oh-krah-TEE-ahs? teen PROH-tee ohk-toh-VREE-oo
  english: — When is the Independence Day of the Republic of Cyprus celebrated? —
    On 1 October.
  notes: Past exam question! Decided by the Council of Ministers in 1963 so that schools,
    diplomatic missions, and the public could participate after summer.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Celebration of Cyprus Independence Day
  example_el: Την 1η Οκτωβρίου είναι επίσημη αργία και πραγματοποιείται μεγάλη στρατιωτική
    παρέλαση στη Λευκωσία.
  example_en: October 1st is a public holiday and a grand military parade takes place
    in Nicosia.
  example2_el: Η Ημέρα Ανεξαρτησίας της Κύπρου μεταφέρθηκε από τον Αύγουστο στην 1η
    Οκτωβρίου λόγω των υψηλών θερμοκρασιών του καλοκαιριού.
  example2_en: Cyprus Independence Day was moved from August to 1 October due to the
    high summer temperatures.
  audio: null
  status: pending_tts
- id: CYP-U02-003
  greek: ο απελευθερωτικός αγώνας της ΕΟΚΑ
  phonetic_hint: oh ah-peh-lef-theh-roh-tee-KOHS ah-GHOH-nahs tees eh-OH-kah
  english: the EOKA liberation struggle (1955–1959)
  notes: EOKA = Εθνική Οργάνωση Κυπρίων Αγωνιστών (National Organisation of Cypriot
    Fighters). Began on 1 April 1955 against British colonial rule.
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι απελευθερωτικοί αγώνες
    accusative_singular: τον απελευθερωτικό αγώνα της ΕΟΚΑ
  keg_communicative_function: Modern History — Anti-colonial struggle 1955–1959
  example_el: Ο απελευθερωτικός αγώνας της ΕΟΚΑ ξεκίνησε την 1η Απριλίου 1955 και
    έληξε το 1959.
  example_en: The EOKA liberation struggle began on 1 April 1955 and ended in 1959.
  example2_el: Η 1η Απριλίου είναι επίσημη εθνική επέτειος και αργία στην Κύπρο.
  example2_en: April 1st is an official national anniversary and public holiday in
    Cyprus.
  audio: null
  status: pending_tts
- id: CYP-U02-004
  greek: οι Συμφωνίες Ζυρίχης-Λονδίνου
  phonetic_hint: ee seem-foh-NEE-ehs zee-REE-khees lohn-THEE-noo
  english: the Zurich and London Agreements (1959)
  notes: Signed in February 1959 by Britain, Greece, Turkey, and representatives of
    the Greek Cypriot (Makarios III) and Turkish Cypriot (Fazıl Küçük) communities,
    establishing the Republic of Cyprus.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι Συμφωνίες Ζυρίχης-Λονδίνου
    accusative_plural: τις Συμφωνίες Ζυρίχης-Λονδίνου
  keg_communicative_function: Modern History — Founding treaties of 1959
  example_el: Οι Συμφωνίες Ζυρίχης-Λονδίνου υπογράφηκαν τον Φεβρουάριο του 1959 και
    οδήγησαν στην ανεξαρτησία της Κύπρου.
  example_en: The Zurich and London Agreements were signed in February 1959 and led
    to the independence of Cyprus.
  example2_el: Με τις συμφωνίες αυτές το Ηνωμένο Βασίλειο διατήρησε δύο κυρίαρχες
    στρατιωτικές βάσεις στο Ακρωτήρι και στη Δεκέλεια.
  example2_en: Under these agreements, the United Kingdom retained two Sovereign Base
    Areas at Akrotiri and Dhekelia.
  audio: null
  status: pending_tts
- id: CYP-U02-005
  greek: — Ποιος ήταν ο πρώτος Πρόεδρος της Κυπριακής Δημοκρατίας; — Ο Αρχιεπίσκοπος
    Μακάριος Γ΄.
  phonetic_hint: pyos EE-tahn oh PROH-tos PROH-eth-ros tees kee-pree-ah-KEES theem-oh-krah-TEE-ahs?
    oh ahr-khee-eh-PEE-skoh-pos mah-KAH-ree-os oh TREE-tos
  english: — Who was the first President of the Republic of Cyprus? — Archbishop Makarios
    III.
  notes: Past exam question! Archbishop Makarios III (Μιχαήλ Χριστοδούλου Μούσκος)
    served as the first President from 1960 until his death on 3 August 1977.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — First President of Cyprus
  example_el: Ο Αρχιεπίσκοπος Μακάριος Γ΄ υπήρξε ο πρώτος Πρόεδρος της Κυπριακής Δημοκρατίας
    από το 1960 έως το 1977.
  example_en: Archbishop Makarios III was the first President of the Republic of Cyprus
    from 1960 to 1977.
  example2_el: Πρώτος Αντιπρόεδρος της Κυπριακής Δημοκρατίας το 1960 εξελέγη ο Τουρκοκύπριος
    Φαζίλ Κουτσιούκ.
  example2_en: The Turkish Cypriot Fazil Kucuk was elected first Vice-President of
    the Republic of Cyprus in 1960.
  audio: null
  status: pending_tts
- id: CYP-U02-006
  greek: οι εγγυήτριες δυνάμεις
  phonetic_hint: ee ehng-ghee-EE-tree-ehs thee-NAH-mees
  english: the Guarantor Powers (Greece, Turkey, United Kingdom)
  notes: Under the 1960 Treaty of Guarantee (Συνθήκη Εγγυήσεως), Greece, Turkey, and
    the UK became guarantors of the independence, territorial integrity, and Constitution
    of Cyprus.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι εγγυήτριες δυνάμεις
    accusative_plural: τις εγγυήτριες δυνάμεις
  keg_communicative_function: Modern History — 1960 Treaty of Guarantee
  example_el: Ποιες ήταν οι τρεις εγγυήτριες δυνάμεις της Κυπριακής Δημοκρατίας το
    1960; Η Ελλάδα, η Τουρκία και το Ηνωμένο Βασίλειο.
  example_en: Which were the three guarantor powers of the Republic of Cyprus in 1960?
    Greece, Turkey, and the United Kingdom.
  example2_el: Οι εγγυήτριες δυνάμεις ανέλαβαν την υποχρέωση να προστατεύουν την ανεξαρτησία
    και την εδαφική ακεραιότητα της Κύπρου.
  example2_en: The guarantor powers undertook the obligation to protect the independence
    and territorial integrity of Cyprus.
  audio: null
  status: pending_tts
- id: CYP-U02-007
  greek: η Πράσινη Γραμμή (η Νεκρή Ζώνη)
  phonetic_hint: ee PRAH-see-nee ghrah-MEE (ee neh-KREE ZOH-nee)
  english: the Green Line (the UN Buffer Zone)
  notes: First drawn in December 1963 in Nicosia with a green chinagraph pencil by
    British General Peter Young; extended across the island (180 km) after the 1974
    Turkish invasion.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι Πράσινες Γραμμές
    accusative_singular: την Πράσινη Γραμμή
  keg_communicative_function: Modern History — Division of Cyprus & UN Buffer Zone
  example_el: Η Πράσινη Γραμμή χωρίζει τις ελεύθερες περιοχές της Κυπριακής Δημοκρατίας
    από τις κατεχόμενες περιοχές.
  example_en: The Green Line separates the government-controlled areas of the Republic
    of Cyprus from the occupied areas.
  example2_el: Η Νεκρή Ζώνη ελέγχεται από την Ειρηνευτική Δύναμη των Ηνωμένων Εθνών
    στην Κύπρο (ΟΥΝΦΙΚΥΠ).
  example2_en: The Buffer Zone is controlled by the United Nations Peacekeeping Force
    in Cyprus (UNFICYP).
  audio: null
  status: pending_tts
- id: CYP-U02-008
  greek: η ΟΥΝΦΙΚΥΠ (Ειρηνευτική Δύναμη του ΟΗΕ)
  phonetic_hint: ee OON-fee-keep (ee-ree-nef-tee-KEE THEE-nah-mee too oh-ee-EH)
  english: UNFICYP (United Nations Peacekeeping Force in Cyprus)
  notes: Established in March 1964 by UN Security Council Resolution 186 to prevent
    recurrence of fighting and supervise the ceasefire lines.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι Ειρηνευτικές Δυνάμεις
    accusative_singular: την ΟΥΝΦΙΚΥΠ
  keg_communicative_function: Modern History — UN peacekeeping in Cyprus
  example_el: Η Ειρηνευτική Δύναμη του ΟΗΕ (ΟΥΝΦΙΚΥΠ) βρίσκεται στην Κύπρο από το
    1964.
  example_en: The UN Peacekeeping Force (UNFICYP) has been in Cyprus since 1964.
  example2_el: Αποστολή της ΟΥΝΦΙΚΥΠ είναι η επιτήρηση της Νεκρής Ζώνης και η διατήρηση
    της ειρήνης.
  example2_en: The mission of UNFICYP is the supervision of the Buffer Zone and the
    maintenance of peace.
  audio: null
  status: pending_tts
- id: CYP-U02-009
  greek: το πραξικόπημα της 15ης Ιουλίου 1974
  phonetic_hint: toh prahk-see-KOH-pee-mah tees theh-kah-PEHN-dees ee-oo-LEE-oo 1974
  english: the coup d'état of 15 July 1974
  notes: Staged on 15 July 1974 by the military junta in Athens and EOKA B to overthrow
    President Makarios III, giving Turkey the pretext to invade five days later.
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα πραξικοπήματα
    accusative_singular: το πραξικόπημα της 15ης Ιουλίου 1974
  keg_communicative_function: Modern History — Events of July 1974
  example_el: Στις 15 Ιουλίου 1974 εκδηλώθηκε στρατιωτικό πραξικόπημα για την ανατροπή
    του Προέδρου Μακαρίου.
  example_en: On 15 July 1974, a military coup was staged to overthrow President Makarios.
  example2_el: Το πραξικόπημα της 15ης Ιουλίου 1974 έδωσε την αφορμή στην Τουρκία
    να εισβάλει στην Κύπρο πέντε ημέρες αργότερα.
  example2_en: The coup of 15 July 1974 gave Turkey the pretext to invade Cyprus five
    days later.
  audio: null
  status: pending_tts
- id: CYP-U02-010
  greek: — Πότε έγινε η τουρκική εισβολή στην Κύπρο; — Στις 20 Ιουλίου 1974.
  phonetic_hint: POH-teh EH-yee-neh ee toor-kee-KEE ees-voh-LEE steen KEE-proh? stees
    EE-koh-see ee-oo-LEE-oo 1974
  english: — When did the Turkish invasion of Cyprus take place? — On 20 July 1974.
  notes: 'Essential exam question! The invasion occurred in two phases: Phase 1 on
    20 July 1974 (landing at Pentemili, Kyrenia) and Phase 2 on 14 August 1974 (occupying
    Morphou, Famagusta, and Karpasia).'
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Date of the Turkish invasion
  example_el: Η τουρκική εισβολή στην Κύπρο ξεκίνησε τα ξημερώματα της 20ής Ιουλίου
    1974 από τις ακτές της Κερύνειας.
  example_en: The Turkish invasion of Cyprus began at dawn on 20 July 1974 on the
    coast of Kyrenia.
  example2_el: Η δεύτερη φάση της τουρκικής εισβολής εκδηλώθηκε στις 14 Αυγούστου
    1974.
  example2_en: The second phase of the Turkish invasion took place on 14 August 1974.
  audio: null
  status: pending_tts
- id: CYP-U02-011
  greek: τα κατεχόμενα εδάφη
  phonetic_hint: tah kah-teh-KHOH-meh-nah eh-THAH-fee
  english: the occupied territories
  notes: Since August 1974, approximately 36.2%–37% of the territory of the Republic
    of Cyprus remains under illegal Turkish military occupation.
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα κατεχόμενα εδάφη
    accusative_plural: τα κατεχόμενα εδάφη
  keg_communicative_function: Modern History — Consequences of 1974
  example_el: Περίπου το 37% του εδάφους της Κυπριακής Δημοκρατίας παραμένει υπό τουρκική
    στρατιωτική κατοχή από το 1974.
  example_en: Approximately 37% of the territory of the Republic of Cyprus remains
    under Turkish military occupation since 1974.
  example2_el: Η επαρχία της Κερύνειας βρίσκεται εξ ολοκλήρου στα κατεχόμενα εδάφη.
  example2_en: The district of Kyrenia is located entirely within the occupied territories.
  audio: null
  status: pending_tts
- id: CYP-U02-012
  greek: οι πρόσφυγες
  phonetic_hint: ee PROH-sfee-yehs
  english: the refugees / internally displaced persons
  notes: Approximately 200,000 Greek Cypriots (one-third of the population) were forcibly
    displaced from their homes in 1974.
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    singular: ο πρόσφυγας / η πρόσφυγας
    plural: οι πρόσφυγες
    accusative_singular: τον πρόσφυγα
  keg_communicative_function: Modern History — Displacement & humanitarian impact
  example_el: Το 1974 περίπου διακόσιες χιλιάδες (200.000) Ελληνοκύπριοι έγιναν πρόσφυγες
    στην ίδια τους την πατρίδα.
  example_en: In 1974, approximately two hundred thousand (200,000) Greek Cypriots
    became refugees in their own homeland.
  example2_el: Το κράτος δημιούργησε προσφυγικούς συνοικισμούς για τη στέγαση των
    εκτοπισθέντων πολιτών.
  example2_en: The state created refugee housing estates to house the displaced citizens.
  audio: null
  status: pending_tts
- id: CYP-U02-013
  greek: οι αγνοούμενοι
  phonetic_hint: ee ah-ghnoh-OO-meh-nee
  english: the missing persons
  notes: Humanitarian tragedy of the 1963–64 and 1974 events. Investigated by the
    bi-communal Committee on Missing Persons in Cyprus (Διερευνητική Επιτροπή για
    τους Αγνοουμένους - ΔΕΑ).
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    singular: ο αγνοούμενος
    plural: οι αγνοούμενοι
    accusative_singular: τον αγνοούμενο
  keg_communicative_function: Modern History — Humanitarian issues of the Cyprus Problem
  example_el: Η Διερευνητική Επιτροπή για τους Αγνοουμένους (ΔΕΑ) εργάζεται για τον
    εντοπισμό και την ταυτοποίηση των αγνοουμένων.
  example_en: The Committee on Missing Persons (CMP) works to locate and identify
    the missing persons.
  example2_el: Το ζήτημα των αγνοουμένων αποτελεί μία από τις πιο τραγικές ανθρωπιστικές
    πτυχές της τουρκικής εισβολής.
  example2_en: The issue of missing persons constitutes one of the most tragic humanitarian
    aspects of the Turkish invasion.
  audio: null
  status: pending_tts
- id: CYP-U02-014
  greek: οι εγκλωβισμένοι
  phonetic_hint: ee ehng-gloh-veez-MEH-nee
  english: the enclaved persons
  notes: Greek Cypriots and Maronites who remained in their ancestral villages in
    the occupied Karpasia peninsula (π.χ. Ριζοκάρπασο) and Maronite villages (π.χ.
    Κορμακίτης) after 1974.
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    singular: ο εγκλωβισμένος
    plural: οι εγκλωβισμένοι
    accusative_singular: τον εγκλωβισμένο
  keg_communicative_function: Modern History — Enclaved population in Karpasia
  example_el: Οι εγκλωβισμένοι παρέμειναν στα χωριά τους στη χερσόνησο της Καρπασίας
    και στα μαρωνίτικα χωριά μετά το 1974.
  example_en: The enclaved remained in their villages on the Karpasia peninsula and
    in the Maronite villages after 1974.
  example2_el: Στο Ριζοκάρπασο λειτουργούν ελληνικό δημοτικό σχολείο και γυμνάσιο
    για τα παιδιά των εγκλωβισμένων.
  example2_en: In Rizokarpaso, a Greek primary school and high school operate for
    the children of the enclaved.
  audio: null
  status: pending_tts
- id: CYP-U02-015
