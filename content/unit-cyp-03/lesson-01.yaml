unit_id: unit-cyp-03
lesson_id: lesson-01
title: 'Μάθημα 3: Γεωγραφία, Επαρχίες, Πόλεις & Φύση της Κύπρου (Geography, Districts,
  Cities & Nature)'
description: Geographical position in the northeastern Mediterranean, the 6 administrative
  districts, major cities and traditional villages (Omodos, Lefkara, Kakopetria, Fikardou),
  Troodos and Pentadaktylos mountain ranges, Pedieos river, Kouris dam, and endemic
  flora and fauna (mouflon, golden oak).
lesson_status: not_started
lesson_notes: "Unit CYP-03 Core Exam Notes: Γεωγραφία, Επαρχίες, Πόλεις & Φύση της\
  \ Κύπρου (Geography, Districts, Cities & Nature)\n\n• Γεωγραφική Θέση & Μέγεθος:\n\
  \  - Η Κύπρος βρίσκεται στη βορειοανατολική Μεσόγειο (Northeastern Mediterranean),\
  \ στο σταυροδρόμι Ευρώπης, Ασίας και Αφρικής.\n  - Είναι το τρίτο μεγαλύτερο νησί\
  \ της Μεσογείου (μετά τη Σικελία και τη Σαρδηνία), με έκταση 9.251 τετραγωνικά χιλιόμετρα\
  \ (τ.χλμ.).\n\n• Οι 6 Επαρχίες της Κύπρου (The 6 Administrative Districts — High\
  \ Exam Frequency!):\n  1. Λευκωσία (Nicosia): Πρωτεύουσα και μεγαλύτερη σε πληθυσμό\
  \ πόλη, στο κέντρο του νησιού. Η τελευταία διαιρεμένη πρωτεύουσα της Ευρώπης.\n\
  \  2. Λεμεσός (Limassol): Δεύτερη μεγαλύτερη πόλη, στη νότια ακτή. Διαθέτει το μεγαλύτερο\
  \ εμπορικό λιμάνι της Κύπρου και αποτελεί κέντρο ναυτιλίας.\n  3. Λάρνακα (Larnaca):\
  \ Στη νοτιοανατολική ακτή. Διαθέτει το κύριο διεθνές αεροδρόμιο, την Αλυκή Λάρνακας\
  \ (με τα φλαμίνγκο) και το τέμενος Χαλά Σουλτάν Τεκκέ.\n  4. Πάφος (Paphos): Στη\
  \ νοτιοδυτική Κύπρο. Διαθέτει το δεύτερο διεθνές αεροδρόμιο, την Πόλη Χρυσοχούς,\
  \ τη χερσόνησο του Ακάμα και μνημεία UNESCO.\n  5. Αμμόχωστος (Famagusta): Στα ανατολικά.\
  \ Η πόλη της Αμμοχώστου είναι κατεχόμενη από το 1974. Στην ελεύθερη επαρχία Αμμοχώστου\
  \ ανήκουν το Παραλίμνι (προσωρινή διοικητική έδρα), η Αγία Νάπα, ο Πρωταράς και\
  \ η Δερύνεια.\n  6. Κερύνεια (Kyrenia): Στη βόρεια ακτή. Είναι η μικρότερη επαρχία\
  \ και η μόνη που βρίσκεται εξ ολοκλήρου υπό τουρκική κατοχή από το 1974.\n\n• Βουνά,\
  \ Πεδιάδες, Ποτάμια & Φύση:\n  - Οροσειρά του Τροόδους: Η μεγαλύτερη οροσειρά (κεντρική/νοτιοδυτική\
  \ Κύπρος). Ψηλότερη κορυφή: ο Όλυμπος (Χιονίστρα) στα 1.952 μέτρα. Άλλες κορυφές\
  \ Τροόδους: Μαδαρή, Παπούτσα.\n  - Οροσειρά του Πενταδακτύλου (Βόρεια): Κατεχόμενη\
  \ ασβεστολιθική οροσειρά. Κορυφές & κάστρα: Κυπαρισσόβουνο (1.024 μ.), Άγιος Ιλαρίωνας,\
  \ Βουφαβέντο, Καντάρα.\n  - Πεδιάδα της Μεσαορίας: Η μεγαλύτερη εύφορη πεδιάδα,\
  \ ανάμεσα στο Τρόοδος και τον Πενταδάκτυλο.\n  - Ποταμοί & Φράγματα: Μεγαλύτερος\
  \ ποταμός ο Πεδιαίος (ή Πηδιάς, ~100 χλμ.). Μεγαλύτερο φράγμα: το φράγμα του Κούρη\
  \ (στην επαρχία Λεμεσού).\n  - Χλωρίδα & Πανίδα: Εθνικό ζώο το κυπριακό αγρινό (Ovis\
  \ orientalis ophion), θαλάσσιες χελώνες Καρέτα-Καρέτα και Πράσινη Χελώνα (στον Ακάμα/Λάρα),\
  \ εθνικό δέντρο η λατζιά (χρυσή δρυς της Κύπρου)."
entries:
- id: CYP-U03-001
  greek: — Σε ποιο μέρος της Μεσογείου βρίσκεται η Κύπρος; — Στη βορειοανατολική Μεσόγειο.
  phonetic_hint: seh pyoh MEH-ros tees meh-soh-YEE-oo VREE-skeh-teh ee KEE-pros? stee
    voh-ree-oh-ah-nah-toh-lee-KEE meh-SOH-yee-oh
  english: — In which part of the Mediterranean is Cyprus located? — In the northeastern
    Mediterranean.
  notes: Actual past exam question! Watch out for distractors like 'νοτιοδυτική' or
    'βορειοδυτική'. Cyprus is in the northeastern corner of the Mediterranean (βορειοανατολική
    Μεσόγειος).
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Geographical location of Cyprus
  example_el: Η Κύπρος βρίσκεται στη βορειοανατολική λεκάνη της Μεσογείου, στο σταυροδρόμι
    τριών ηπείρων.
  example_en: Cyprus is located in the northeastern basin of the Mediterranean, at
    the crossroads of three continents.
  example2_el: Με έκταση 9.251 τετραγωνικά χιλιόμετρα, η Κύπρος είναι το τρίτο μεγαλύτερο
    νησί της Μεσογείου μετά τη Σικελία και τη Σαρδηνία.
  example2_en: With an area of 9,251 square kilometers, Cyprus is the third largest
    island in the Mediterranean after Sicily and Sardinia.
  audio: null
  status: pending_tts
- id: CYP-U03-002
  greek: — Ποιες είναι οι έξι (6) επαρχίες της Κυπριακής Δημοκρατίας; — Λευκωσία,
    Λεμεσός, Λάρνακα, Πάφος, Αμμόχωστος και Κερύνεια.
  phonetic_hint: pyehs EE-neh ee EHK-see eh-pahr-KHEE-ehs tees kee-pree-ah-KEES theem-oh-krah-TEE-ahs?
    lef-koh-SEE-ah, leh-meh-SOHS, LAHR-nah-kah, PAH-fos, ah-MOH-khoh-stos keh keh-REE-nyah
  english: — What are the six (6) districts of the Republic of Cyprus? — Nicosia,
    Limassol, Larnaca, Paphos, Famagusta, and Kyrenia.
  notes: Essential exam question! Cyprus is administratively divided into 6 districts
    (έξι επαρχίες).
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Six administrative districts of Cyprus
  example_el: Η Κυπριακή Δημοκρατία διαιρείται διοικητικά σε έξι επαρχίες.
  example_en: The Republic of Cyprus is administratively divided into six districts.
  example2_el: Η επαρχία Λευκωσίας είναι η μεγαλύτερη σε πληθυσμό, ενώ η επαρχία Κερύνειας
    είναι η μικρότερη σε έκταση.
  example2_en: The Nicosia district is the largest in population, while the Kyrenia
    district is the smallest in area.
  audio: null
  status: pending_tts
- id: CYP-U03-003
  greek: η Λευκωσία (η πρωτεύουσα)
  phonetic_hint: ee lef-koh-SEE-ah (ee proh-TEH-voo-sah)
  english: Nicosia (the capital city)
  notes: Capital and largest city of Cyprus, located inland near the center of the
    island; surrounded in its historic core by the 16th-century Venetian Walls (τα
    Ενετικά Τείχη).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: τη Λευκωσία
    genitive_singular: της Λευκωσίας
  keg_communicative_function: Geography — Capital of Cyprus
  example_el: Η Λευκωσία είναι η πρωτεύουσα της Κύπρου και η τελευταία διαιρεμένη
    πρωτεύουσα της Ευρώπης.
  example_en: Nicosia is the capital of Cyprus and the last divided capital of Europe.
  example2_el: Η παλιά πόλη της Λευκωσίας περιβάλλεται από τα κυκλικά Ενετικά Τείχη
    του 16ου αιώνα.
  example2_en: The old city of Nicosia is surrounded by the circular Venetian Walls
    of the 16th century.
  audio: null
  status: pending_tts
- id: CYP-U03-004
  greek: η Λεμεσός
  phonetic_hint: ee leh-meh-SOHS
  english: Limassol
  notes: Second largest urban area in Cyprus, located on the southern coast between
    the ancient cities of Amathus (Αμαθούντα) and Kourion (Κούριο); hosts Cyprus's
    largest commercial port.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: τη Λεμεσό
    genitive_singular: της Λεμεσού
  keg_communicative_function: Geography — Major cities of Cyprus
  example_el: Η Λεμεσός διαθέτει το μεγαλύτερο εμπορικό λιμάνι της Κύπρου και αποτελεί
    διεθνές ναυτιλιακό κέντρο.
  example_en: Limassol has the largest commercial port in Cyprus and is an international
    shipping center.
  example2_el: Στη Λεμεσό διοργανώνονται κάθε χρόνο το μεγάλο Καρναβάλι και η παραδοσιακή
    Γιορτή του Κρασιού.
  example2_en: In Limassol, the grand Carnival and the traditional Wine Festival are
    organized every year.
  audio: null
  status: pending_tts
- id: CYP-U03-005
  greek: η Λάρνακα
  phonetic_hint: ee LAHR-nah-kah
  english: Larnaca
  notes: Built over ancient Kition (το αρχαίο Κίτιο), birthplace of the Stoic philosopher
    Zeno (Ζήνωνας ο Κιτιεύς). Home to Cyprus's largest international airport, Finikoudes
    promenade, Saint Lazarus Church, and the Salt Lake.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: τη Λάρνακα
    genitive_singular: της Λάρνακας
  keg_communicative_function: Geography — Major cities of Cyprus
  example_el: Η Λάρνακα είναι χτισμένη στη θέση του αρχαίου βασιλείου του Κιτίου και
    διαθέτει το μεγαλύτερο αεροδρόμιο της χώρας.
  example_en: Larnaca is built on the site of the ancient kingdom of Kition and has
    the country's largest airport.
  example2_el: Τον χειμώνα χιλιάδες ροζ φλαμίνγκο φιλοξενούνται στον υγροβιότοπο της
    Αλυκής Λάρνακας.
  example2_en: In winter, thousands of pink flamingos are hosted at the Larnaca Salt
    Lake wetland.
  audio: null
  status: pending_tts
- id: CYP-U03-006
  greek: η Πάφος
  phonetic_hint: ee PAH-fos
  english: Paphos
  notes: Located in southwestern Cyprus; mythical birthplace of Aphrodite, capital
    of Cyprus in Hellenistic and Roman times, and European Capital of Culture in 2017
    (Πολιτιστική Πρωτεύουσα της Ευρώπης 2017).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    accusative_singular: την Πάφο
    genitive_singular: της Πάφου
  keg_communicative_function: Geography — Major cities of Cyprus
  example_el: Η Πάφος υπήρξε Πολιτιστική Πρωτεύουσα της Ευρώπης το 2017 και φημίζεται
    για τα ρωμαϊκά ψηφιδωτά της.
  example_en: Paphos was European Capital of Culture in 2017 and is famous for its
    Roman mosaics.
  example2_el: Στην επαρχία Πάφου βρίσκεται η Πέτρα του Ρωμιού, η οποία συνδέεται
    με τον μύθο της γέννησης της θεάς Αφροδίτης.
  example2_en: In the Paphos district lies Petra tou Romiou, which is linked to the
    myth of the birth of the goddess Aphrodite.
  audio: null
  status: pending_tts
- id: CYP-U03-007
  greek: — Σε ποια επαρχία ανήκει η Πόλη Χρυσοχούς; — Στην επαρχία Πάφου.
  phonetic_hint: seh pyah eh-pahr-KHEE-ah ah-NEE-kee ee POH-lee khree-soh-KHOOS? steen
    eh-pahr-KHEE-ah PAH-foo
  english: — To which district does Polis Chrysochous belong? — To the Paphos district.
  notes: Actual past exam question! Polis Chrysochous (with the fishing port of Latchi
    / Λατσί and the Baths of Aphrodite) is in the northwestern part of the Paphos
    district.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — District of Polis Chrysochous
  example_el: Η Πόλη Χρυσοχούς βρίσκεται στα βορειοδυτικά της επαρχίας Πάφου, κοντά
    στη χερσόνησο του Ακάμα.
  example_en: Polis Chrysochous is located in the northwest of the Paphos district,
    near the Akamas peninsula.
  example2_el: Κοντά στην Πόλη Χρυσοχούς βρίσκονται το λιμανάκι στο Λατσί και τα Λουτρά
    της Αφροδίτης.
  example2_en: Near Polis Chrysochous are the small harbor of Latchi and the Baths
    of Aphrodite.
  audio: null
  status: pending_tts
- id: CYP-U03-008
  greek: — Σε ποια επαρχία ανήκουν η Αγία Νάπα, το Παραλίμνι και ο Πρωταράς; — Στην
    επαρχία Αμμοχώστου.
  phonetic_hint: seh pyah eh-pahr-KHEE-ah ah-NEE-koon ee ah-YEE-ah NAH-pah, toh pah-rah-LEEM-nee
    keh oh proh-tah-RAHS? steen eh-pahr-KHEE-ah ah-moh-KHOH-stoo
  english: — To which district do Ayia Napa, Paralimni, and Protaras belong? — To
    the Famagusta district.
  notes: Frequent past exam question! Candidates often mistakenly guess Larnaca because
    they fly into Larnaca airport; Ayia Napa, Paralimni, Protaras, Deryneia, and Sotira
    make up the free Famagusta area (ελεύθερη επαρχία Αμμοχώστου).
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Free Famagusta District towns
  example_el: Το Παραλίμνι αποτελεί την προσωρινή διοικητική έδρα της ελεύθερης επαρχίας
    Αμμοχώστου.
  example_en: Paralimni serves as the temporary administrative center of the free
    Famagusta district.
  example2_el: Το εθνικό δασικό πάρκο του Κάβο Γκρέκο βρίσκεται ανάμεσα στην Αγία
    Νάπα και τον Πρωταρά στην επαρχία Αμμοχώστου.
  example2_en: The Cape Greco National Forest Park is located between Ayia Napa and
    Protaras in the Famagusta district.
  audio: null
  status: pending_tts
- id: CYP-U03-009
  greek: — Ποια επαρχία της Κύπρου βρίσκεται ολόκληρη υπό τουρκική κατοχή από το 1974;
    — Η επαρχία Κερύνειας.
  phonetic_hint: pyah eh-pahr-KHEE-ah tees KEE-proo VREE-skeh-teh oh-LOH-klee-ree
    ee-POH toor-kee-KEE kah-toh-KHEE? ee eh-pahr-KHEE-ah keh-REE-nyahs
  english: — Which district of Cyprus has been entirely under Turkish occupation since
    1974? — The Kyrenia district.
  notes: Past exam question! While parts of Nicosia, Famagusta, and Larnaca districts
    are also occupied, Kyrenia (η Κερύνεια) is the only district that is 100% occupied.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Occupied districts of Cyprus
  example_el: Η επαρχία Κερύνειας είναι η μόνη από τις έξι επαρχίες που είναι εξ ολοκλήρου
    κατεχόμενη από το 1974.
  example_en: The Kyrenia district is the only one of the six districts that has been
    wholly occupied since 1974.
  example2_el: Στην πόλη της Κερύνειας βρίσκεται το μεσαιωνικό κάστρο όπου εκτίθεται
    το αρχαίο καράβι της Κερύνειας.
  example2_en: In the city of Kyrenia stands the medieval castle where the ancient
    Kyrenia ship is exhibited.
  audio: null
  status: pending_tts
- id: CYP-U03-010
  greek: η οροσειρά του Τροόδους
  phonetic_hint: ee oh-roh-see-RAH too troh-OH-thoos
  english: the Troodos mountain range
  notes: Largest mountain range in Cyprus, covering much of the western and central
    parts of the island; rich in pine forests, copper ore (οφιολιθικό σύμπλεγμα),
    and UNESCO-listed Byzantine churches.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι οροσειρές
    accusative_singular: την οροσειρά του Τροόδους
  keg_communicative_function: Geography — Mountain ranges of Cyprus
  example_el: Η οροσειρά του Τροόδους είναι ο σημαντικότερος φυσικός πνεύμονας πρασίνου
    και κύρια πηγή νερού της Κύπρου.
  example_en: The Troodos mountain range is the most important natural green lung
    and main water source of Cyprus.
  example2_el: Οι κορυφές Μαδαρή και Παπούτσα ανήκουν στην οροσειρά του Τροόδους.
  example2_en: The peaks Madari and Papoutsa belong to the Troodos mountain range.
  audio: null
  status: pending_tts
- id: CYP-U03-011
  greek: — Ποια είναι η ψηλότερη κορυφή της Κύπρου; — Ο Όλυμπος (Χιονίστρα) στο Τρόοδος,
    με ύψος 1.952 μέτρα.
  phonetic_hint: pyah EE-neh ee psee-LOH-teh-ree koh-ree-FEE tees KEE-proo? oh OH-leem-bos
    (khyoh-NEE-strah) stoh TROH-oh-thos
  english: — What is the highest peak in Cyprus? — Mount Olympus (Chionistra) in Troodos,
    at 1,952 meters.
  notes: Past exam question! Mount Olympus (also called Chionistra / Χιονίστρα) in
    the Troodos range reaches 1,952 meters above sea level.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Highest mountain peak of Cyprus
  example_el: Ο Όλυμπος, γνωστός και ως Χιονίστρα, έχει υψόμετρο 1.952 μέτρα και χιονίζεται
    κάθε χειμώνα.
  example_en: Mount Olympus, also known as Chionistra, has an elevation of 1,952 meters
    and receives snow every winter.
  example2_el: Ο Πρόδρομος, σε υψόμετρο 1.380 μέτρων στο Τρόοδος, είναι το ψηλότερο
    κατοικημένο χωριό της Κύπρου.
  example2_en: Prodromos, at an altitude of 1,380 meters in Troodos, is the highest
    inhabited village in Cyprus.
  audio: null
  status: pending_tts
- id: CYP-U03-012
  greek: η οροσειρά του Πενταδακτύλου
  phonetic_hint: ee oh-roh-see-RAH too pehn-dah-thahk-TEE-loo
  english: the Pentadaktylos (Kyrenia) mountain range
  notes: Past exam question often asks to distinguish Pentadaktylos peaks/castles
    (Κυπαρισσόβουνο 1.024 μ., Άγιος Ιλαρίωνας, Βουφαβέντο, Καντάρα) from Troodos peaks
    (Όλυμπος, Μαδαρή, Παπούτσα).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι οροσειρές
    accusative_singular: την οροσειρά του Πενταδακτύλου
  keg_communicative_function: Geography — Mountain ranges & castles of Cyprus
  example_el: 'Στην οροσειρά του Πενταδακτύλου βρίσκονται τα τρία βυζαντινά κάστρα:
    του Αγίου Ιλαρίωνα, του Βουφαβέντο και της Καντάρας.'
  example_en: 'In the Pentadaktylos range stand the three Byzantine castles: Saint
    Hilarion, Buffavento, and Kantara.'
  example2_el: Η ψηλότερη κορυφή του Πενταδακτύλου είναι το Κυπαρισσόβουνο με ύψος
    1.024 μέτρα.
  example2_en: The highest peak of Pentadaktylos is Kyparissovouno with a height of
    1,024 meters.
  audio: null
  status: pending_tts
- id: CYP-U03-013
  greek: η πεδιάδα της Μεσαορίας
  phonetic_hint: ee peh-thee-AH-thah tees meh-sah-oh-REE-ahs
  english: the Mesaoria plain
  notes: 'Meaning ''between the mountains'' (μεταξύ των ορέων): the central agricultural
    plain stretching across the island from Morphou Bay in the west to Famagusta Bay
    in the east, between Troodos and Pentadaktylos.'
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι πεδιάδες
    accusative_singular: την πεδιάδα της Μεσαορίας
  keg_communicative_function: Geography — Plains and agriculture
  example_el: Η πεδιάδα της Μεσαορίας εκτείνεται ανάμεσα στην οροσειρά του Τροόδους
    και την οροσειρά του Πενταδακτύλου.
  example_en: The Mesaoria plain stretches between the Troodos mountain range and
    the Pentadaktylos mountain range.
  example2_el: Η Μεσαορία αποτελεί τον κύριο σιτοβολώνα της Κύπρου, όπου καλλιεργούνται
    δημητριακά και πατάτες.
  example2_en: Mesaoria is the main breadbasket of Cyprus, where cereals and potatoes
    are cultivated.
  audio: null
  status: pending_tts
- id: CYP-U03-014
  greek: — Ποιος είναι ο μεγαλύτερος ποταμός της Κύπρου; — Ο Πεδιαίος (ή Πηδιάς).
  phonetic_hint: pyos EE-neh oh meh-ghah-LEE-teh-ros poh-tah-MOHS tees KEE-proo? oh
    peh-thee-EH-os (ee pee-THYAHS)
  english: — Which is the longest river in Cyprus? — The Pedieos (or Pidias) river.
  notes: Past exam question! The Pedieos river originates in Troodos near Machairas
    Monastery, flows through Nicosia and the Mesaoria plain, and empties into Famagusta
    Bay (~100 km long).
