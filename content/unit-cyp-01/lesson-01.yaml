- id: CYP-U01-001
  greek: η Κυπριακή Δημοκρατία
  phonetic_hint: ee kee-pree-ah-KEE theem-oh-krah-TEE-ah
  english: the Republic of Cyprus
  notes: Official constitutional name of the state established on 16 August 1960.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι Κυπριακές Δημοκρατίες
    accusative_singular: την Κυπριακή Δημοκρατία
    genitive_singular: της Κυπριακής Δημοκρατίας
  keg_communicative_function: Polity & Institutions — Official state terminology
  example_el: Η Κυπριακή Δημοκρατία ανακηρύχθηκε επίσημα ανεξάρτητο κράτος το 1960.
  example_en: The Republic of Cyprus was officially proclaimed an independent state
    in 1960.
  example2_el: Η Κυπριακή Δημοκρατία είναι πλήρες κράτος μέλος της Ευρωπαϊκής Ένωσης.
  example2_en: The Republic of Cyprus is a full member state of the European Union.
  audio: null
  status: pending_tts
- id: CYP-U01-002
  greek: — Ποιο είναι το πολίτευμα της Κυπριακής Δημοκρατίας; — Προεδρική Δημοκρατία.
  phonetic_hint: PEE-oh EE-neh toh poh-LEE-tev-mah tees kee-pree-ah-KEES theem-oh-krah-TEE-ahs?
    proh-eth-ree-KEE theem-oh-krah-TEE-ah
  english: — What is the system of government of the Republic of Cyprus? — Presidential
    Republic.
  notes: Frequent past exam question! Distractors often include 'Προεδρευόμενη Κοινοβουλευτική
    Δημοκρατία' (Greece's system) or 'Βασιλευόμενη Δημοκρατία'.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Constitutional regime of Cyprus
  example_el: Στην Προεδρική Δημοκρατία ο Πρόεδρος είναι αρχηγός και του κράτους και
    της κυβέρνησης.
  example_en: In a Presidential Republic, the President is head of both the state
    and the government.
  example2_el: Το πολίτευμα της Κύπρου καθορίζεται από το Σύνταγμα του 1960.
  example2_en: The system of government of Cyprus is defined by the Constitution of
    1960.
  audio: null
  status: pending_tts
- id: CYP-U01-003
  greek: το Σύνταγμα
  phonetic_hint: toh SEEN-dahg-mah
  english: the Constitution
  notes: Neuter noun in -μα (-ματα). The Constitution of Cyprus is the supreme law
    of the Republic (ο υπέρτατος νόμος).
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα Συντάγματα
    accusative_singular: το Σύνταγμα
    genitive_singular: του Συντάγματος
  keg_communicative_function: Polity & Institutions — Constitutional law
  example_el: Το Σύνταγμα της Κυπριακής Δημοκρατίας τέθηκε σε ισχύ στις 16 Αυγούστου
    1960.
  example_en: The Constitution of the Republic of Cyprus entered into force on 16
    August 1960.
  example2_el: Το Σύνταγμα κατοχυρώνει τα θεμελιώδη δικαιώματα και τις ελευθερίες
    των πολιτών.
  example2_en: The Constitution safeguards the fundamental rights and freedoms of
    citizens.
  audio: null
  status: pending_tts
- id: CYP-U01-004
  greek: — Ποιες είναι οι επίσημες γλώσσες της Κυπριακής Δημοκρατίας; — Η ελληνική
    και η τουρκική.
  phonetic_hint: pyehs EE-neh ee eh-PEE-see-mehs GHLOH-sehs tees kee-pree-ah-KEES
    theem-oh-krah-TEE-ahs? ee eh-lee-nee-KEE keh ee toor-kee-KEE
  english: — What are the official languages of the Republic of Cyprus? — Greek and
    Turkish.
  notes: Classic past exam question! Under Article 3 of the Constitution, Greek and
    Turkish are the two official languages (English is widely spoken but NOT an official
    constitutional language).
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Official languages under the Constitution
  example_el: Σύμφωνα με το Άρθρο 3 του Συντάγματος, οι επίσημες γλώσσες είναι η ελληνική
    και η τουρκική.
  example_en: According to Article 3 of the Constitution, the official languages are
    Greek and Turkish.
  example2_el: Η αγγλική γλώσσα χρησιμοποιείται ευρέως αλλά δεν είναι επίσημη γλώσσα
    του κράτους.
  example2_en: The English language is widely used but is not an official language
    of the state.
  audio: null
  status: pending_tts
- id: CYP-U01-005
  greek: η διάκριση των εξουσιών
  phonetic_hint: ee thee-AH-kree-see ton ehk-soo-see-ON
  english: the separation of powers
  notes: Core constitutional principle dividing state authority into Executive (Εκτελεστική),
    Legislative (Νομοθετική), and Judicial (Δικαστική).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι διακρίσεις των εξουσιών
    accusative_singular: τη διάκριση των εξουσιών
  keg_communicative_function: Polity & Institutions — Democratic principles
  example_el: Η διάκριση των εξουσιών αποτελεί θεμελιώδη αρχή της δημοκρατίας στην
    Κύπρο.
  example_en: The separation of powers is a fundamental principle of democracy in
    Cyprus.
  example2_el: Οι τρεις εξουσίες είναι η εκτελεστική, η νομοθετική και η δικαστική.
  example2_en: The three powers are the executive, the legislative, and the judicial.
  audio: null
  status: pending_tts
- id: CYP-U01-006
  greek: η εκτελεστική εξουσία
  phonetic_hint: ee ehk-teh-leh-stee-KEE ehk-soo-SEE-ah
  english: the executive power / branch
  notes: Exercised by the President of the Republic and the Council of Ministers (το
    Υπουργικό Συμβούλιο).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι εκτελεστικές εξουσίες
    accusative_singular: την εκτελεστική εξουσία
  keg_communicative_function: Polity & Institutions — Branches of government
  example_el: Στην Κύπρο η εκτελεστική εξουσία ασκείται από τον Πρόεδρο της Δημοκρατίας
    και το Υπουργικό Συμβούλιο.
  example_en: In Cyprus, executive power is exercised by the President of the Republic
    and the Council of Ministers.
  example2_el: Τα μέλη της εκτελεστικής εξουσίας δεν μπορούν να είναι ταυτόχρονα και
    βουλευτές.
  example2_en: Members of the executive branch cannot simultaneously be members of
    parliament.
  audio: null
  status: pending_tts
- id: CYP-U01-007
  greek: — Πόσα χρόνια διαρκεί η θητεία του Προέδρου της Κυπριακής Δημοκρατίας; —
    Πέντε χρόνια.
  phonetic_hint: POH-sah KHROH-nyah theeahr-KEE ee thee-TEE-ah too proh-ETH-roo tees
    kee-pree-ah-KEES theem-oh-krah-TEE-ahs? PEHN-deh KHROH-nyah
  english: — How many years does the term of the President of the Republic of Cyprus
    last? — Five years.
  notes: Past exam question! Both Presidential elections and Parliamentary elections
    in Cyprus take place every 5 years.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Presidential term of office
  example_el: Οι προεδρικές εκλογές στην Κύπρο διεξάγονται κάθε πέντε χρόνια με καθολική
    ψηφοφορία.
  example_en: Presidential elections in Cyprus are held every five years by universal
    suffrage.
  example2_el: Αν κανένας υποψήφιος δεν λάβει πάνω από 50%, διεξάγεται δεύτερος γύρος
    την επόμενη Κυριακή.
  example2_en: If no candidate receives over 50%, a second round is held the following
    Sunday.
  audio: null
  status: pending_tts
- id: CYP-U01-008
  greek: — Ποιος είναι ο σημερινός Πρόεδρος της Κυπριακής Δημοκρατίας; — Ο Νίκος Χριστοδουλίδης.
  phonetic_hint: pyos EE-neh oh see-meh-ree-NOHS PROH-eth-ros tees kee-pree-ah-KEES
    theem-oh-krah-TEE-ahs? oh NEE-kos khree-stoh-thoo-LEE-thees
  english: — Who is the current President of the Republic of Cyprus? — Nikos Christodoulides.
  notes: Elected in February 2023 as the 8th President of the Republic of Cyprus,
    succeeding Nicos Anastasiades.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Current Head of State
  example_el: Ο Νίκος Χριστοδουλίδης εξελέγη Πρόεδρος της Κυπριακής Δημοκρατίας τον
    Φεβρουάριο του 2023.
  example_en: Nikos Christodoulides was elected President of the Republic of Cyprus
    in February 2023.
  example2_el: Πριν εκλεγεί Πρόεδρος, ο Νίκος Χριστοδουλίδης είχε διατελέσει Υπουργός
    Εξωτερικών.
  example2_en: Before being elected President, Nikos Christodoulides had served as
    Minister of Foreign Affairs.
  audio: null
  status: pending_tts
- id: CYP-U01-009
  greek: το Υπουργικό Συμβούλιο
  phonetic_hint: toh ee-poor-yee-KOH seem-VOO-lee-oh
  english: the Council of Ministers / Cabinet
  notes: Appointed by the President of the Republic. Cyprus has 11 Ministries (Υπουργεία)
    and 6 Deputy Ministries (Υφυπουργεία).
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα Υπουργικά Συμβούλια
    accusative_singular: το Υπουργικό Συμβούλιο
    genitive_singular: του Υπουργικού Συμβουλίου
  keg_communicative_function: Polity & Institutions — Executive Cabinet
  example_el: Το Υπουργικό Συμβούλιο διορίζεται από τον Πρόεδρο της Δημοκρατίας και
    χαράσσει την κυβερνητική πολιτική.
  example_en: The Council of Ministers is appointed by the President of the Republic
    and formulates government policy.
  example2_el: Οι συνεδριάσεις του Υπουργικού Συμβουλίου πραγματοποιούνται στο Προεδρικό
    Μέγαρο στη Λευκωσία.
  example2_en: The meetings of the Council of Ministers take place at the Presidential
    Palace in Nicosia.
  audio: null
  status: pending_tts
- id: CYP-U01-010
  greek: η νομοθετική εξουσία
  phonetic_hint: ee noh-moh-theh-tee-KEE ehk-soo-SEE-ah
  english: the legislative power / branch
  notes: Exercised by the House of Representatives (η Βουλή των Αντιπροσώπων), which
    votes on laws and approves the state budget.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι νομοθετικές εξουσίες
    accusative_singular: τη νομοθετική εξουσία
  keg_communicative_function: Polity & Institutions — Legislative branch
  example_el: Ποιο όργανο ασκεί τη νομοθετική εξουσία στην Κύπρο; Η Βουλή των Αντιπροσώπων.
  example_en: Which body exercises legislative power in Cyprus? The House of Representatives.
  example2_el: Η νομοθετική εξουσία ψηφίζει τους νόμους και τον κρατικό προϋπολογισμό.
  example2_en: The legislative branch votes on laws and the state budget.
  audio: null
  status: pending_tts
- id: CYP-U01-011
  greek: η Βουλή των Αντιπροσώπων
  phonetic_hint: ee voo-LEE ton ahn-dee-proh-SOH-pon
  english: the House of Representatives (Parliament of Cyprus)
  notes: Unicameral parliament of Cyprus. Elected for a 5-year term by proportional
    representation.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι Βουλές των Αντιπροσώπων
    accusative_singular: τη Βουλή των Αντιπροσώπων
    genitive_singular: της Βουλής των Αντιπροσώπων
  keg_communicative_function: Polity & Institutions — Parliament of Cyprus
  example_el: Η Βουλή των Αντιπροσώπων εδρεύει στην πρωτεύουσα Λευκωσία.
  example_en: The House of Representatives is based in the capital Nicosia.
  example2_el: Ο Πρόεδρος της Βουλής αναπληρώνει τον Πρόεδρο της Δημοκρατίας όταν
    απουσιάζει στο εξωτερικό.
  example2_en: The President of the House deputizes for the President of the Republic
    when he is abroad.
  audio: null
  status: pending_tts
- id: CYP-U01-012
  greek: — Πόσοι Ελληνοκύπριοι βουλευτές εκλέγονται στη Βουλή των Αντιπροσώπων; —
    Πενήντα έξι (56) βουλευτές.
  phonetic_hint: POH-see eh-lee-noh-KEE-pree-ee voo-lehf-TEHS ehk-LEH-ghon-deh stee
    voo-LEE ton ahn-dee-proh-SOH-pon? peh-NEEN-dah EHK-see voo-lehf-TEHS
  english: — How many Greek Cypriot MPs are elected to the House of Representatives?
    — Fifty-six (56) MPs.
  notes: 'High-frequency exam question! Total constitutional seats Since 1985: 80
    (56 Greek Cypriot + 24 Turkish Cypriot seats, which remain vacant). Plus 3 observers
    from Religious Groups.'
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Composition of Parliament
  example_el: 'Συνολικά οι βουλευτικές έδρες είναι 80: 56 για την ελληνοκυπριακή κοινότητα
    και 24 για την τουρκοκυπριακή.'
  example_en: 'In total there are 80 parliamentary seats: 56 for the Greek Cypriot
    community and 24 for the Turkish Cypriot community.'
  example2_el: Οι 24 έδρες των Τουρκοκυπρίων βουλευτών παραμένουν κενές από το 1964.
  example2_en: The 24 seats of the Turkish Cypriot MPs have remained vacant since
    1964.
  audio: null
  status: pending_tts
- id: CYP-U01-013
  greek: — Ποιες είναι οι τρεις αναγνωρισμένες θρησκευτικές ομάδες στη Βουλή; — Οι
    Μαρωνίτες, οι Αρμένιοι και οι Λατίνοι.
  phonetic_hint: pyehs EE-neh ee trees ah-nah-ghnoh-ree-ZMEH-nehs three-skef-tee-KEHS
    oh-MAH-thehs stee voo-LEE? ee mah-roh-NEE-tehs, ee ahr-MEH-nee-ee keh ee lah-TEE-nee
  english: — Which are the three recognized religious groups in Parliament? — The
    Maronites, the Armenians, and the Latins.
  notes: Past exam question! Under the Constitution, the Maronites, Armenians, and
    Latins (Roman Catholics) are recognized religious groups that each elect 1 representative
    to the House.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Constitutional Religious Groups
  example_el: Οι Μαρωνίτες, οι Αρμένιοι και οι Λατίνοι εκλέγουν από έναν εκπρόσωπο
    στη Βουλή των Αντιπροσώπων.
  example_en: The Maronites, the Armenians, and the Latins each elect one representative
    to the House of Representatives.
  example2_el: Μετά το δημοψήφισμα του 1960, οι τρεις θρησκευτικές ομάδες επέλεξαν
    να ανήκουν στην ελληνοκυπριακή κοινότητα.
  example2_en: Following the 1960 referendum, the three religious groups chose to
    belong to the Greek Cypriot community.
  audio: null
  status: pending_tts
- id: CYP-U01-014
  greek: — Ποια είναι η Πρόεδρος της Βουλής των Αντιπροσώπων; — Η Αννίτα Δημητρίου.
  phonetic_hint: pyah EE-neh ee PROH-eth-ros tees voo-LEES ton ahn-dee-proh-SOH-pon?
    ee ah-NEE-tah theem-ee-TREE-oo
  english: — Who is the President (Speaker) of the House of Representatives? — Annita
    Demetriou.
  notes: Elected in June 2021 as the first female Speaker of the House of Representatives
    in Cyprus, and also President of DISY since 2023.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Past Exam Q&A — Head of the Legislative Branch
  example_el: Η Αννίτα Δημητρίου είναι η πρώτη γυναίκα που εξελέγη Πρόεδρος της Βουλής
    των Αντιπροσώπων.
  example_en: Annita Demetriou is the first woman elected President of the House of
    Representatives.
  example2_el: Ο Πρόεδρος της Βουλής είναι ο δεύτερος τη τάξει πολιτειακός αξιωματούχος
    της Κυπριακής Δημοκρατίας.
  example2_en: The President of the House is the second highest state official of
    the Republic of Cyprus.
  audio: null
  status: pending_tts
- id: CYP-U01-015
  greek: η δικαστική εξουσία
  phonetic_hint: ee thee-kah-stee-KEE ehk-soo-SEE-ah
  english: the judicial power / judiciary
  notes: Completely independent from the executive and legislative branches. Following
    the 2023 judicial reform, headed by the Supreme Constitutional Court and the Supreme
    Court.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι δικαστικές εξουσίες
    accusative_singular: τη δικαστική εξουσία
  keg_communicative_function: Polity & Institutions — Judiciary
  example_el: Η δικαστική εξουσία στην Κύπρο είναι ανεξάρτητη και απονέμει τη δικαιοσύνη.
  example_en: The judicial power in Cyprus is independent and administers justice.
  example2_el: Στην κορυφή της δικαστικής εξουσίας βρίσκονται το Ανώτατο Συνταγματικό
    Δικαστήριο και το Ανώτατο Δικαστήριο.
  example2_en: At the top of the judiciary are the Supreme Constitutional Court and
    the Supreme Court.
  audio: null
  status: pending_tts
- id: CYP-U01-016
  greek: το Ανώτατο Δικαστήριο
  phonetic_hint: toh ah-NOH-tah-toh thee-kah-STEE-ree-oh
  english: the Supreme Court
  notes: Highest appellate court of the Republic, alongside the Supreme Constitutional
    Court (το Ανώτατο Συνταγματικό Δικαστήριο) and the Court of Appeal (το Εφετείο).
  gender_or_pos: noun (neuter)
  grammatical_info:
    part_of_speech: noun (neuter)
    plural: τα Ανώτατα Δικαστήρια
    accusative_singular: το Ανώτατο Δικαστήριο
    genitive_singular: του Ανωτάτου Δικαστηρίου
  keg_communicative_function: Polity & Institutions — Courts of Cyprus
  example_el: Οι δικαστές του Ανωτάτου Δικαστηρίου διορίζονται από τον Πρόεδρο της
    Δημοκρατίας.
