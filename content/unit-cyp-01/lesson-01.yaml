unit_id: unit-cyp-01
lesson_id: lesson-01
title: 'Μάθημα 1: Πολίτευμα, Θεσμοί & Κράτος της Κύπρου (Polity, State Institutions
  & Governance)'
description: Constitutional regime of the Republic of Cyprus (Presidential Republic),
  separation of powers, the President and Council of Ministers, the House of Representatives
  (56+24 seats & 3 religious groups), independent officials, national symbols, and
  political parties.
lesson_status: not_started
lesson_notes: "Unit CYP-01 Core Exam Notes: Πολίτευμα, Θεσμοί & Κράτος της Κύπρου\
  \ (Polity, State Institutions & Governance)\n\n• Το Πολίτευμα της Κυπριακής Δημοκρατίας\
  \ (System of Government):\n  - Η Κύπρος είναι ανεξάρτητη και κυρίαρχη Προεδρική\
  \ Δημοκρατία (Presidential Republic) σύμφωνα με το Σύνταγμα του 1960.\n  - Ο Πρόεδρος\
  \ της Δημοκρατίας είναι ταυτόχρονα Αρχηγός του Κράτους (Head of State) και Αρχηγός\
  \ της Κυβέρνησης (Head of Government).\n  - Εκλέγεται άμεσα από τον λαό με καθολική\
  \ ψηφοφορία για πενταετή θητεία (5-year term). Σημερινός Πρόεδρος (από το 2023):\
  \ Νίκος Χριστοδουλίδης.\n\n• Διάκριση των Εξουσιών (Separation of Powers):\n  1.\
  \ Εκτελεστική Εξουσία (Executive Power): Ασκείται από τον Πρόεδρο της Δημοκρατίας\
  \ και το Υπουργικό Συμβούλιο (Council of Ministers).\n  2. Νομοθετική Εξουσία (Legislative\
  \ Power): Ασκείται από τη Βουλή των Αντιπροσώπων (House of Representatives).\n \
  \    - Συνταγματική σύνθεση: 80 έδρες συνολικά (56 Ελληνοκύπριοι βουλευτές + 24\
  \ Τουρκοκύπριοι βουλευτές, οι οποίοι απέχουν από το 1964).\n     - Επιπλέον 3 εκπρόσωποι\
  \ των Θρησκευτικών Ομάδων (Μαρωνίτες, Αρμένιοι, Λατίνοι) με συμβουλευτικό χαρακτήρα.\n\
  \     - Οι βουλευτικές εκλογές διεξάγονται κάθε 5 χρόνια. Πρόεδρος της Βουλής: Αννίτα\
  \ Δημητρίου.\n  3. Δικαστική Εξουσία (Judicial Power): Ανεξάρτητη εξουσία που ασκείται\
  \ από το Ανώτατο Συνταγματικό Δικαστήριο, το Ανώτατο Δικαστήριο και τα Επαρχιακά\
  \ Δικαστήρια.\n\n• Ανεξάρτητοι Αξιωματούχοι & Εθνικά Σύμβολα:\n  - Ανεξάρτητοι Θεσμοί:\
  \ Γενικός Εισαγγελέας (Attorney General), Γενικός Ελεγκτής (Auditor General), Επίτροπος\
  \ Διοικήσεως (Ombudsman).\n  - Επίσημες Γλώσσες (Άρθρο 3 Συντάγματος): Ελληνική\
  \ και Τουρκική.\n  - Σημαία της Κύπρου: Σχεδιάστηκε το 1960 από τον Τουρκοκύπριο\
  \ ζωγράφο Ισμέτ Γκιουνέι (λευκό φόντο, χαλκόχρωμος χάρτης του νησιού, δύο κλαδιά\
  \ ελιάς).\n  - Εθνικός Ύμνος: «Ύμνος εις την Ελευθερίαν» (στίχοι Διονυσίου Σολωμού,\
  \ μουσική Νικολάου Μάντζαρου, υιοθετήθηκε το 1966)."
