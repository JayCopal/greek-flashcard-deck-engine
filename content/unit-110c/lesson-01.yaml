unit_id: unit-110c
lesson_id: lesson-01
title: 'Ενότητα 10: Διάλογοι & Εξετάσεις — Υγεία, Συμπτώματα, Γιατρός & Φαρμακείο
  (A1 Synthesis)'
description: Conversational, dialogue, and CEFR A1 oral exam practice focusing on
  symptoms, body parts, medical appointments, clinical instructions, pharmacy prescriptions,
  medications, hospital facilities, and traditional Greek convalescence wishes using
  vocabulary from Lessons 100 to 110.
lesson_status: not_started
entries:
- id: A1-U110C-001
  greek: — Τι έχεις; Δεν σε βλέπω καλά σήμερα. — Δεν αισθάνομαι καλά, έχω έντονο πονοκέφαλο.
  phonetic_hint: — Tee EH-khees? Then seh VLEH-poh kah-LAH SEE-meh-rah. — Then eh-STHAH-noh-meh
    kah-LAH, EH-khoh EHN-doh-noh poh-noh-KEH-fah-loh.
  english: — What's wrong? You don't look well today. — I don't feel well, I have
    a severe headache.
  notes: Review Unit 110. Expressing malaise with 'δεν αισθάνομαι καλά' and describing
    headache.
  gender_or_pos: phrase
  audio: ti-echeis-den-se-vle-52a1ae.mp3
  status: verified
  example_el: — Πονάει πολύ το κεφάλι σου; — Ναι, πονάει πάρα πολύ από το πρωί.
  example_en: — Does your head hurt very much? — Yes, it hurts terribly since morning.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring after someone's wellbeing and describing general
    physical malaise
- id: A1-U110C-002
  greek: — Έχεις πυρετό; — Ναι, έβαλα το θερμόμετρο και έχω τριάντα οκτώ και πέντε.
  phonetic_hint: — EH-khees pee-reh-TOH? — Neh, EH-vah-lah toh ther-MOH-meh-troh keh
    EH-khoh tree-AHN-dah ohk-TOH keh PEN-deh.
  english: — Do you have a fever? — Yes, I used the thermometer and I have thirty-eight
    point five.
  notes: Review Unit 110. Stating body temperature in degrees Celsius.
  gender_or_pos: phrase
  audio: echeis-pyreto-nai-ev-555857.mp3
  status: verified
  example_el: — Έχεις δέκατα ή υψηλό πυρετό; — Έχω υψηλό πυρετό και τρέμω.
  example_en: — Do you have a slight fever or high fever? — I have a high fever and
    I am shivering.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Reporting body temperature readings and fever symptoms
- id: A1-U110C-003
  greek: — Πού πονάτε ακριβώς; — Πονάει πολύ ο λαιμός μου όταν μιλάω.
  phonetic_hint: — POO poh-NAH-teh ah-kree-VOHS? — Poh-NAH-ee poh-LEE oh leh-MOHS
    moo OH-tahn mee-LAH-oh.
  english: — Where do you feel pain exactly? — My throat hurts very much when I speak.
  notes: Review Unit 110. Describing sore throat ('πονόλαιμος').
  gender_or_pos: phrase
  audio: poy-ponate-akrivos-p-49d62a.mp3
  status: verified
  example_el: — Έχετε και βήχα; — Ναι, έχω έντονο βήχα και συνάχι εδώ και δύο μέρες.
  example_en: — Do you also have a cough? — Yes, I have a bad cough and runny nose
    for two days now.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Pinpointing location and intensity of physical pain
- id: A1-U110C-004
  greek: — Είσαι κρυωμένος; — Ναι, κρύωσα χθες στο γραφείο γιατί είχε πολύ δυνατό
    κλιματισμό.
  phonetic_hint: — EE-seh kree-oh-MEH-nos? — Neh, KREE-oh-sah khthes stoh ghrah-FEE-oh
    yah-TEE EE-kheh poh-LEE thee-nah-TOH klee-mah-tees-MOH.
  english: — Do you have a cold? — Yes, I caught a cold yesterday at the office because
    the air conditioning was very strong.
  notes: Review Unit 110. Attributing cold symptoms to office air conditioning.
  gender_or_pos: phrase
  audio: eisai-kryomenos-nai--3fc186.mp3
  status: verified
  example_el: — Έχεις όρεξη για φαγητό; — Όχι, δεν έχω καθόλου όρεξη σήμερα.
  example_en: — Do you have an appetite for food? — No, I have no appetite at all
    today.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Explaining the onset and environmental causes of a cold
- id: A1-U110C-005
  greek: — Τι έχεις στο στομάχι σου; — Έφαγα κάτι βαρύ και έχω στομαχόπονο και ναυτία.
  phonetic_hint: — Tee EH-khees stoh stoh-MAH-khee soo? — EH-fah-ghah KAH-tee vah-REE
    keh EH-khoh stoh-mah-KHOH-poh-noh keh nahf-TEE-ah.
  english: — What is wrong with your stomach? — I ate something heavy and have a stomach
    ache and nausea.
  notes: Review Unit 110. Gastric upset symptoms ('στομαχόπονος', 'ναυτία').
  gender_or_pos: phrase
  audio: ti-echeis-sto-stomac-ed6940.mp3
  status: verified
  example_el: — Έχεις και ζάλη; — Ναι, έχω ζάλη και ναυτία από το πρωί.
  example_en: — Do you also have dizziness? — Yes, I have dizziness and nausea since
    morning.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Describing digestive discomfort, nausea, and dizziness
- id: A1-U110C-006
  greek: — Γιατί δεν τρως τίποτα; — Πονάει πολύ το δόντι μου, έχω έντονο πονόδοντο.
  phonetic_hint: — Yah-TEE then trohs TEE-poh-tah? — Poh-NAH-ee poh-LEE toh THOHN-dee
    moo, EH-khoh EHN-doh-noh poh-NOH-thon-doh.
  english: — Why aren't you eating anything? — My tooth hurts very much, I have a
    severe toothache.
  notes: Review Unit 110. Dental pain description ('πονόδοντος').
  gender_or_pos: phrase
  audio: giati-den-tros-tipot-2069c6.mp3
  status: verified
  example_el: — Πότε θα πας στον οδοντίατρο; — Έχω ραντεβού σήμερα το απόγευμα στις
    πέντε.
  example_en: — When will you go to the dentist? — I have an appointment this afternoon
    at five.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Describing dental distress and scheduling dentist appointments
- id: A1-U110C-007
  greek: — Γιατί είσαι κουρασμένος; — Πονάνε τα πόδια μου και η μέση μου από την κούραση.
  phonetic_hint: — Yah-TEE EE-seh koo-rah-SMEH-nos? — Poh-NAH-neh tah POH-thyah moo
    keh ee MEH-see moo ah-POH teen KOO-rah-see.
  english: — Why are you tired? — My legs and my lower back hurt from exhaustion.
  notes: Review Unit 110. Joint and limb ache ('πόδια', 'γόνατα').
  gender_or_pos: phrase
  audio: giati-eisai-koyrasme-6f9ecc.mp3
  status: verified
  example_el: — Πονάει και η πλάτη σου; — Ναι, πονάει η πλάτη και τα γόνατα.
  example_en: — Does your back hurt too? — Yes, my back and knees hurt.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Reporting musculoskeletal pain and joint soreness
- id: A1-U110C-008
  greek: — Τι έχεις στο χέρι σου; — Χτύπησα το δάχτυλο στην πόρτα και πονάει πολύ.
  phonetic_hint: — Tee EH-khees stoh KHEH-ree soo? — KHTEE-pee-sah toh THAHKH-tee-loh
    steen POHR-tah keh poh-NAH-ee poh-LEE.
  english: — What is wrong with your hand? — I hit my finger in the door and it hurts
    a lot.
  notes: Review Unit 110. Hand and finger trauma reporting ('χέρι', 'δάχτυλο').
  gender_or_pos: phrase
  audio: ti-echeis-sto-cheri--c40164.mp3
  status: verified
  example_el: — Πονάει πολύ το δάχτυλο; — Ναι, βάλε λίγο κρύο νερό πάνω στο δάχτυλο.
  example_en: — Does the finger hurt very much? — Yes, put some cold water on the
    finger.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Describing acute injuries and first aid responses
- id: A1-U110C-009
  greek: — Είναι δύσκολη η αρρώστια σου; — Όχι, είναι μια απλή ίωση που περνάει σε
    λίγες μέρες.
  phonetic_hint: — EE-neh THEE-skoh-lee ee ahr-ROH-styah soo? — OH-khee, EE-neh myah
    ah-PLEE EE-oh-see poo pehr-NAH-ee seh LEE-ghes MEH-res.
  english: — Is your illness difficult? — No, it is a simple viral infection that
    clears up in a few days.
  notes: Review Unit 110. Classifying common viral illnesses ('απλή ίωση').
  gender_or_pos: phrase
  audio: einai-dyskoli-i-arro-753766.mp3
  status: verified
  example_el: — Έχεις γρίπη ή κρυολόγημα; — Ο γιατρός είπε ότι είναι μια απλή γρίπη.
  example_en: — Do you have the flu or a cold? — The doctor said that it is a simple
    flu.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Discussing medical severity and virus characteristics
- id: A1-U110C-010
  greek: — Πώς νιώθεις σήμερα το πρωί; — Είμαι πολύ καλύτερα, ο πυρετός έπεσε και
    δεν πονάει ο λαιμός μου.
  phonetic_hint: — Pos NYOH-thees SEE-meh-rah toh proh-EE? — EE-meh poh-LEE kah-LEE-teh-rah,
    oh pee-reh-TOHS EH-peh-seh keh then poh-NAH-ee oh leh-MOHS moo.
  english: — How do you feel this morning? — I am much better, the fever dropped and
    my throat doesn't hurt.
  notes: Review Unit 110. Describing symptom remission and recovery progress.
  gender_or_pos: phrase
  audio: pos-niotheis-simera--fa1089.mp3
  status: verified
  example_el: — Έχεις ακόμα συνάχι; — Όχι, το συνάχι πέρασε και νιώθω πολύ καλά.
  example_en: — Do you still have a runny nose? — No, the runny nose passed and I
    feel very well.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Reporting morning health progress and symptom alleviation
- id: A1-U110C-011
  greek: — Γιατί δεν ήσουν στο μάθημα χθες; — Ήμουν άρρωστος στο κρεβάτι με υψηλό
    πυρετό και βήχα.
  phonetic_hint: — Yah-TEE then EE-soon stoh MAH-thee-mah khthes? — EE-moon AHR-roh-stos
    stoh kreh-VAH-tee meh eep-see-LOH pee-reh-TOH keh VEE-khah.
  english: — Why were you not in class yesterday? — I was sick in bed with high fever
    and a cough.
  notes: Review Unit 110. Explaining absence due to acute illness.
  gender_or_pos: phrase
  audio: giati-den-isoyn-sto--55f4a1.mp3
  status: verified
  example_el: — Ποιος είναι άρρωστος; — Η Μαρία είναι άρρωστη με βήχα.
  example_en: — Who is sick? — Maria is sick with a cough.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Justifying absence from school or work due to illness
- id: A1-U110C-012
  greek: — Πονάει το στήθος σου όταν παίρνεις ανάσα; — Όχι, πονάει μόνο η πλάτη μου
    και ο ώμος μου.
  phonetic_hint: — Poh-NAH-ee toh STEE-thos soo OH-tahn PEHR-nees ah-NAH-sah? — OH-khee,
    poh-NAH-ee MOH-noh ee PLAH-tee moo keh oh OH-mohs moo.
  english: — Does your chest hurt when you breathe? — No, only my back and my shoulder
    hurt.
  notes: Review Unit 110. Differentiating upper torso pains ('στήθος', 'πλάτη', 'ώμος').
  gender_or_pos: phrase
  audio: ponaei-to-stithos-so-16adf4.mp3
  status: verified
  example_el: — Πονάει ο ώμος σου; — Ναι, πονάει λίγο μετά από το γυμναστήριο.
  example_en: — Does your shoulder hurt? — Yes, it hurts a little after the gym.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Clarifying torso symptoms and differentiating muscular
    pain
- id: A1-U110C-013
  greek: — Καλημέρα σας, έχετε ραντεβού με τον γιατρό; — Ναι, έχω ραντεβού με τον
    παθολόγο στις έντεκα.
  phonetic_hint: — Kah-lee-MEH-rah sahs, EH-kheh-teh rahn-deh-VOO meh ton yah-TROH?
    — Neh, EH-khoh rahn-deh-VOO meh ton pah-thoh-LOH-ghoh stees EHN-deh-kah.
  english: — Good morning, do you have an appointment with the doctor? — Yes, I have
    an appointment with the internist at eleven.
  notes: Review Unit 110. Reception desk check-in at a medical clinic.
  gender_or_pos: phrase
  audio: kalimera-sas-echete--20148b.mp3
  status: verified
  example_el: — Περάστε στην αίθουσα αναμονής, παρακαλώ. — Ευχαριστώ πολύ, θα περιμένω
    εκεί.
  example_en: — Please step into the waiting room. — Thank you very much, I will wait
    there.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Checking in for a medical appointment at reception
- id: A1-U110C-014
  greek: — Ποιο είναι το πρόβλημα, κύριε Παπαδόπουλε; — Από χθες έχω έντονο πονόλαιμο
    και δέκατα.
  phonetic_hint: — PEE-oh EE-neh toh PROHV-lee-mah, KEE-ree-eh Pah-pah-THOH-poo-leh?
    — Ah-POH khthes EH-khoh EHN-doh-noh poh-NOH-leh-moh keh THEH-kah-tah.
  english: — What is the problem, Mr. Papadopoulos? — Since yesterday I have a bad
    sore throat and low-grade fever.
  notes: Review Unit 110. Presenting complaint to the examining physician.
  gender_or_pos: phrase
  audio: poio-einai-to-provli-a1be50.mp3
  status: verified
  example_el: — Από πότε άρχισαν τα συμπτώματα; — Άρχισαν χθες το βράδυ μετά τη δουλειά.
  example_en: — When did the symptoms start? — They started last night after work.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Describing onset of primary symptoms to the physician
- id: A1-U110C-015
  greek: — Ανοίξτε το στόμα σας και βγάλτε τη γλώσσα, παρακαλώ. — Ορίστε... πονάει
    πολύ εδώ δεξιά.
  phonetic_hint: — Ah-NEEK-steh toh STOH-mah sahs keh VGHAL-teh tee GHLOH-sah, pah-rah-kah-LOH.
    — Oh-REES-teh... poh-NAH-ee poh-LEE eh-KHEE thehk-SYAH.
  english: — Open your mouth and stick out your tongue, please. — Here you are...
    it hurts a lot here on the right.
  notes: Review Unit 110. Standard clinical oral examination command.
  gender_or_pos: phrase
  audio: anoixte-to-stoma-sas-56ee96.mp3
  status: verified
  example_el: — Ο λαιμός σας έχει πρόβλημα. — Χρειάζεται να πάρω αντιβίωση;
  example_en: — Your throat has a problem. — Do I need to take an antibiotic?
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Complying with oral clinical examination instructions
- id: A1-U110C-016
  greek: — Πάρτε μια βαθιά ανάσα και κρατήστε την αναπνοή σας. — Εντάξει, είναι όλα
    καλά;
  phonetic_hint: — PAHR-teh myah vah-THYAH ah-NAH-sah keh krah-TEE-steh teen ah-nah-pnoh-EE
    sahs. — En-DAH-ksee, EE-neh OH-lah kah-LAH?
  english: — Take a deep breath and hold your breath. — Alright, is everything fine?
  notes: Review Unit 110. Stethoscope lung examination instruction.
  gender_or_pos: phrase
  audio: parte-mia-vathia-ana-08b722.mp3
  status: verified
  example_el: — Μην ανησυχείτε, όλα είναι καθαρά. — Πολύ ωραία, χαίρομαι πολύ.
  example_en: — Don't worry, everything is clear. — Very nice, I am very glad.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Following chest auscultation instructions and receiving
    reassurance
- id: A1-U110C-017
  greek: — Μπορείτε να μου μετρήσετε την αρτηριακή πίεση; — Βεβαίως, βάλτε το χέρι
    σας στο τραπέζι.
  phonetic_hint: — Boh-REE-teh nah moo meh-TREE-seh-teh teen ahr-tee-ree-ah-KEE PEE-eh-see?
    — Veh-VEH-ohs, VHAL-teh toh KHEH-ree sahs stoh trah-PEH-zee.
  english: — Could you measure my blood pressure? — Certainly, place your arm on the
    table.
  notes: Review Unit 110. Blood pressure measurement request.
  gender_or_pos: phrase
  audio: mporeite-na-moy-metr-1804e4.mp3
  status: verified
  example_el: — Πόσο είναι η πίεσή μου; — Η πίεσή σας είναι δώδεκα με οκτώ, φυσιολογική.
  example_en: — How is my blood pressure? — Your blood pressure is twelve over eight,
    normal.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Requesting blood pressure measurement and hearing numeric
    results
- id: A1-U110C-018
  greek: — Τι πρέπει να κάνω τώρα; — Πρέπει να μείνετε στο κρεβάτι και να ξεκουραστείτε
    καλά.
  phonetic_hint: — Tee PREH-pee nah KAH-noh TOH-rah? — PREH-pee nah MEE-neh-teh stoh
    kreh-VAH-tee keh nah kseh-koo-rah-STEE-teh kah-LAH.
  english: — What must I do now? — You must stay in bed and get plenty of rest.
  notes: Review Unit 110. Physician orders for bed rest and recuperation.
  gender_or_pos: phrase
  audio: ti-prepei-na-kano-to-9d830d.mp3
  status: verified
  example_el: — Μπορώ να πάω στη δουλειά αύριο; — Όχι, πρέπει να μείνετε στο σπίτι.
  example_en: — Can I go to work tomorrow? — No, you must stay at home.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Receiving lifestyle restrictions and bed rest instructions
    from doctor
- id: A1-U110C-019
  greek: — Τι υγρά μπορώ να πίνω; — Πιείτε πολλά ζεστά υγρά, τσάι του βουνού και χαμομήλι.
  phonetic_hint: — Tee ee-GHRAH boh-ROH nah PEE-noh? — PEE-teh poh-LAH zes-TAH ee-GHRAH,
    TSAH-ee too voo-NOO keh khah-moh-MEE-lee.
  english: — What liquids can I drink? — Drink plenty of warm liquids, mountain tea
    and chamomile.
  notes: Review Unit 110. Dietary hydration recommendations for recovery.
  gender_or_pos: phrase
  audio: ti-ygra-mporo-na-pin-77b038.mp3
  status: verified
  example_el: — Βοηθάει το ζεστό χαμομήλι; — Ναι, βοηθάει πολύ στον λαιμό και στον
    ύπνο.
  example_en: — Does warm chamomile help? — Yes, it helps a lot for the throat and
    for sleep.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Advising herbal remedies and fluid intake during recuperation
- id: A1-U110C-020
  greek: — Χρειάζεται να πάρω κάποια φάρμακα; — Θα σας γράψω μια αντιβίωση και μερικά
    παυσίπονα.
  phonetic_hint: — Khree-AH-zeh-teh nah PAH-roh KAH-pyah FAHR-mah-kah? — Thah sahs
    GHAHP-soh myah ahn-tee-VEE-oh-see keh meh-ree-KAH pahf-SEE-poh-nah.
  english: — Do I need to take some medicines? — I will write you an antibiotic and
    some painkillers.
  notes: Review Unit 110. Doctor issuing medical prescription ('ιατρική συνταγή').
  gender_or_pos: phrase
  audio: chreiazetai-na-paro--38d78b.mp3
  status: verified
  example_el: — Πού θα πάρω τα φάρμακα; — Θα πάρετε τα φάρμακα από το φαρμακείο της
    γειτονιάς σας.
  example_en: — Where will I get the medicines? — You will get the medicines from
    your neighborhood pharmacy.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Explaining medical prescription issuance and pharmacy
    fulfillment
- id: A1-U110C-021
  greek: — Σε ποιον γιατρό πηγαίνεις όταν είσαι άρρωστος; — Πηγαίνω σε έναν παθολόγο
    στο κέντρο της πόλης.
  phonetic_hint: — Seh PEE-on yah-TROH pee-GHEH-nees OH-tahn EE-seh AHR-roh-stos?
    — Pee-GHEH-noh seh EH-nahn pah-thoh-LOH-ghoh stoh KEN-droh tees POH-lees.
  english: — To which doctor do you go when you are sick? — I go to an internist in
    the city center.
  notes: Review Unit 110. Inquiring doctor choice with relative interrogative 'σε
    ποιον'.
  gender_or_pos: phrase
  audio: se-poion-giatro-piga-2d992b.mp3
  status: verified
  example_el: — Είναι καλός γιατρός; — Ναι, είναι πολύ προσεκτικός και έμπειρος γιατρός.
  example_en: — Is he a good doctor? — Yes, he is a very attentive and experienced
    doctor.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Discussing preferred primary care physicians and medical
    reputation
- id: A1-U110C-022
  greek: — Ποια είναι η γιατρός σας στο νοσοκομείο; — Η γιατρός μου είναι καρδιολόγος
    στο νοσοκομείο στο κέντρο.
  phonetic_hint: — PEE-ah EE-neh ee yah-TROHS sahs stoh noh-soh-koh-MEE-oh? — Ee yah-TROHS
    moo EE-neh kahr-thee-oh-LOH-ghos stoh noh-soh-koh-MEE-oh stoh KEN-droh.
  english: — Who is your doctor at the hospital? — My doctor is a cardiologist at
    the hospital in the center.
  notes: Review Unit 110. Medical specialization ('καρδιολόγος').
  gender_or_pos: phrase
  audio: poia-einai-i-giatros-8953a7.mp3
  status: verified
  example_el: — Πότε έχετε νέο ραντεβού; — Έχω ραντεβού τον επόμενο μήνα.
  example_en: — When do you have a new appointment? — I have an appointment next month.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Identifying medical specialists and follow-up consultation
    dates
- id: A1-U110C-023
