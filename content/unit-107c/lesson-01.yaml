  english: — Does this tie go with my suit? — Yes, it matches the white shirt very
    well.
  notes: 'Review Unit 108. Formal wear vocabulary: ''κοστούμι'' (suit), ''γραβάτα''
    (tie), ''πουκάμισο'' (shirt).'
  gender_or_pos: phrase
  audio: ayti-i-gravata-pigai-01e246.mp3
  status: verified
  example_el: — Ποια γραβάτα φοράς; — Φοράω τη μπλε γραβάτα.
  example_en: — Which tie are you wearing? — I am wearing the blue tie.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking for advice on formal attire and color coordination
- id: A1-U107C-021
  greek: — Πόσο κοστίζει αυτό το ζευγάρι παπούτσια; — Κοστίζει ογδόντα ευρώ.
  phonetic_hint: — POH-soh koh-STEE-zee af-TOH toh zev-GHAH-ree pah-POO-tsyah? — Koh-STEE-zee
    ogh-THOHN-dah ev-ROH.
  english: — How much does this pair of shoes cost? — It costs eighty euros.
  notes: Review Unit 108. Using the verb 'κοστίζω' (to cost) alongside numbers in
    tens ('ογδόντα').
  gender_or_pos: phrase
  audio: poso-kostizei-ayto-t-929078.mp3
  status: verified
  example_el: — Πόσο κάνουν οι μπότες; — Κάνουν ενενήντα ευρώ.
  example_en: — How much are the boots? — They are ninety euros.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking the cost of shoes and understanding numerical
    prices
- id: A1-U107C-022
  greek: — Στις εκπτώσεις όλα τα είδη έχουν έκπτωση είκοσι τοις εκατό; — Ναι, όλα
    τα ρούχα έχουν έκπτωση.
  phonetic_hint: — stees ehk-PTOH-sees OH-lah tah EE-thee EH-khoon EHK-ptoh-see EE-koh-see
    tees eh-kah-TOH? — Neh, OH-lah tah ROO-khah EH-khoon EHK-ptoh-see.
  english: — During sales do all items have a twenty percent discount? — Yes, all
    clothes have a discount.
  notes: 'Review Unit 108. Seasonal sales vocabulary: ''εκπτώσεις'' (sales) and percentages
    (''τοις εκατό'').'
  gender_or_pos: phrase
  audio: stis-ekptoseis-ola-t-e839c4.mp3
  status: verified
  example_el: — Έχει έκπτωση αυτό το μπουφάν; — Ναι, έχει τριάντα τοις εκατό έκπτωση.
  example_en: — Does this jacket have a discount? — Yes, it has a thirty percent discount.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about sale percentages and promotional discounts
- id: A1-U107C-023
