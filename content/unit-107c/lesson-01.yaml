unit_id: unit-107c
lesson_id: lesson-01
title: 'Ενότητα 7: Διάλογοι & Εξετάσεις — Ψώνια, Ρούχα, Μέλλον & Γιορτές (A1 Synthesis
  101-108)'
description: Conversational, dialogue, and CEFR A1 oral exam practice focusing on
  department store shopping, clothing sizes, fitting rooms, sales, simple future tense
  plans, invitations, birthdays, and holiday wishes using vocabulary from Lessons
  100 to 107.
lesson_status: not_started
entries:
- id: A1-U107C-001
  greek: — Γεια σας, μπορούμε να σας βοηθήσουμε; — Ναι, παρακαλώ, ψάχνω ένα ζεστό
    παλτό για τον χειμώνα.
  phonetic_hint: — YAH sahs, bo-ROO-meh nah sahs voy-THEE-soo-meh? — Neh, pah-rah-kah-LOH,
    PSAH-khno EH-nah zeh-STOH pahl-TOH yah ton khee-MOH-nah.
  english: — Hello, can we help you? — Yes, please, I am looking for a warm coat for
    the winter.
  notes: Review Unit 108. Customer service dialogue at a clothing department store.
  gender_or_pos: phrase
  audio: geia-sas-mporoyme-na-b3d760.mp3
  status: verified
  example_el: — Τι ακριβώς ψάχνετε; — Ψάχνω ένα μαύρο σακάκι για τη δουλειά.
  example_en: — What exactly are you looking for? — I am looking for a black blazer
    for work.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking for customer assistance and browsing seasonal
    clothing in a department store
- id: A1-U107C-002
  greek: — Ποιο πουκάμισο προτιμάς, αυτό εδώ ή εκείνο στη βιτρίνα; — Προτιμώ εκείνο
    το λευκό πουκάμισο.
  phonetic_hint: — PYO poo-KAH-mee-soh proh-tee-MAHS, af-TOH eh-THOH ee eh-KEE-noh
    stee vee-TREE-nah? — Proh-tee-MOH eh-KEE-noh toh lef-KOH poo-KAH-mee-soh.
  english: — Which shirt do you prefer, this one here or that one in the shop window?
    — I prefer that white shirt.
  notes: Review Unit 108. Demonstrative pronouns 'αυτός, αυτή, αυτό' (this) vs 'εκείνος,
    εκείνη, εκείνο' (that).
  gender_or_pos: phrase
  audio: poio-poykamiso-proti-c0a86e.mp3
  status: verified
  example_el: — Σου αρέσει εκείνη η φούστα; — Ναι, μου αρέσει πολύ το χρώμα της.
  example_en: — Do you like that skirt? — Yes, I really like its color.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing preferences using demonstrative pronouns
    for clothing displays
- id: A1-U107C-003
  greek: — Αυτό το παλτό είναι καλό, αλλά εκείνο είναι πιο ζεστό. — Έχεις δίκιο, εκείνο
    είναι μάλλινο.
  phonetic_hint: — af-TOH toh pahl-TOH EE-neh kah-LOH, ah-LAH eh-KEE-noh EE-neh pyoh
    zeh-STOH. — EH-khees THEE-kyo, eh-KEE-noh EE-neh MAH-lee-noh.
  english: — This coat is good, but that one is warmer. — You are right, that one
    is woolen.
  notes: Review Unit 108. Comparative degree with 'πιο' and clothing materials ('μάλλινος').
  gender_or_pos: phrase
  audio: ayto-to-palto-einai--9515b7.mp3
  status: verified
  example_el: — Ποιο μπουφάν είναι πιο ζεστό; — Εκείνο το μπλε μπουφάν είναι πιο ζεστό.
  example_en: — Which jacket is warmer? — That blue jacket is warmer.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Comparing clothing items by warmth, quality, and fabric
    materials
- id: A1-U107C-004
  greek: — Τι νούμερο φοράτε σε παντελόνι; — Φοράω συνήθως το σαράντα.
  phonetic_hint: — tee NOO-meh-roh foh-RAH-teh seh pahn-deh-LOH-nee? — Foh-RAH-oh
    see-NEE-thohs toh sah-RAHN-dah.
  english: — What size pants do you wear? — I usually wear size forty.
  notes: Review Unit 108. Inquiring and stating clothing size ('νούμερο').
  gender_or_pos: phrase
  audio: ti-noymero-forate-se-cfecf1.mp3
  status: verified
  example_el: — Τι μέγεθος φοράτε σε μπλούζα; — Φοράω το μεσαίο μέγεθος.
  example_en: — What size blouse do you wear? — I wear medium size.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about and stating clothing sizes and measurements
- id: A1-U107C-005
  greek: — Έχετε αυτό το τζιν σε μαύρο χρώμα; — Ναι, βεβαίως, ορίστε το μαύρο τζιν.
  phonetic_hint: — EH-kheh-teh af-TOH toh tzeen seh MAH-vroh KHROH-mah? — Neh, veh-VEH-ohs,
    oh-REES-teh toh MAH-vroh tzeen.
  english: — Do you have these jeans in black? — Yes, certainly, here are the black
    jeans.
  notes: Review Unit 108. Requesting specific clothing items by color.
  gender_or_pos: phrase
  audio: echete-ayto-to-tzin--a5bd35.mp3
  status: verified
  example_el: — Έχετε αυτό το φόρεμα σε κόκκινο χρώμα; — Ναι, υπάρχει και σε κόκκινο.
  example_en: — Do you have this dress in red? — Yes, it is also available in red.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking for clothing items in specific colors and variations
- id: A1-U107C-006
  greek: — Πόσο κάνει αυτό το πουλόβερ; — Κάνει σαράντα πέντε ευρώ.
  phonetic_hint: — POH-soh KAH-nee af-TOH toh poo-LOH-vehr? — KAH-nee sah-RAHN-dah
    PEN-deh ev-ROH.
  english: — How much is this sweater? — It is forty-five euros.
  notes: Review Unit 108. Inquiring about prices of garments using 'πόσο κάνει'.
  gender_or_pos: phrase
  audio: poso-kanei-ayto-to-p-815dd4.mp3
  status: verified
  example_el: — Είναι ακριβό αυτό το κοστούμι; — Όχι, έχει πολύ καλή τιμή.
  example_en: — Is this suit expensive? — No, it has a very good price.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about garment prices and affordability in
    retail shops
- id: A1-U107C-007
  greek: — Αυτά τα γάντια είναι από δέρμα; — Ναι, αυτά είναι από δέρμα, ενώ εκείνα
    είναι μάλλινα.
  phonetic_hint: — af-TAH tah GHAHN-dyah EE-neh ah-POH THEHR-mah? — Neh, af-TAH EE-neh
    ah-POH THEHR-mah, eh-NOH eh-KEE-nah EE-neh MAH-lee-nah.
  english: — Are these gloves made of leather? — Yes, these are made of leather, whereas
    those are woolen.
  notes: Review Unit 108. Identifying clothing accessories and material types ('δέρμα',
    'μάλλινος').
  gender_or_pos: phrase
  audio: ayta-ta-gantia-einai-eff89f.mp3
  status: verified
  example_el: — Έχετε ζεστό κασκόλ και σκούφο; — Ναι, είναι όλα στον πρώτο όροφο.
  example_en: — Do you have a warm scarf and beanie? — Yes, they are all on the first
    floor.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about accessories and contrasting material
    fabrics
- id: A1-U107C-008
  greek: — Ψάχνω ένα ζευγάρι παπούτσια για περπάτημα. — Ορίστε, αυτά τα παπούτσια
    είναι πολύ άνετα.
  phonetic_hint: — PSAH-khno EH-nah zev-GHAH-ree pah-POO-tsyah yah pehr-PAH-tee-mah.
    — oh-REES-teh, af-TAH tah pah-POO-tsyah EE-neh poh-LEE AH-neh-tah.
  english: — I am looking for a pair of walking shoes. — Here you are, these shoes
    are very comfortable.
  notes: Review Unit 108. Describing footwear and comfort ('άνετα παπούτσια').
  gender_or_pos: phrase
  audio: psachno-ena-zeygari--bf3a70.mp3
  status: verified
  example_el: — Τι νούμερο παπούτσι φοράτε; — Φοράω το σαράντα δύο.
  example_en: — What shoe size do you wear? — I wear size forty-two.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Buying footwear and evaluating shoe comfort
- id: A1-U107C-009
  greek: — Εκείνο το κατάστημα στον πεζόδρομο έχει πολύ καλές τιμές. — Ναι, ελάτε
    να δείτε τη βιτρίνα του!
  phonetic_hint: — eh-KEE-noh toh kah-TAH-stee-mah ston peh-ZOH-throh-moh EH-khee
    poh-LEE kah-LES tee-MES. — Neh, eh-LAH-teh nah THEE-teh tee vee-TREE-nah too!
  english: — That store on the pedestrian street has very good prices. — Yes, come
    and see its window display!
  notes: Review Units 103, 107 & 108. Recommending shops on pedestrian walkways and
    looking at shop windows.
  gender_or_pos: phrase
  audio: ekeino-to-katastima--3a3592.mp3
  status: verified
  example_el: — Πού είναι το πολυκατάστημα; — Είναι στο κέντρο της πόλης.
  example_en: — Where is the department store? — It is in the city center.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Discussing store locations and window shopping recommendations
- id: A1-U107C-010
  greek: — Αύριο θα πάω στην αγορά για ψώνια. — Θέλεις να έρθω μαζί σου; — Ναι, με
    χαρά!
  phonetic_hint: — AHV-ree-oh thah PAH-oh steen ah-ghoh-RAH yah PSOH-nyah. — THEH-lees
    nah EHR-thoh mah-ZEE soo? — Neh, meh khah-RAH!
  english: — Tomorrow I will go to the market for shopping. — Do you want me to come
    with you? — Yes, with pleasure!
  notes: Review Unit 108. Simple Future tense ('θα πάω') and inviting a companion
    to go shopping.
  gender_or_pos: phrase
  audio: ayrio-tha-pao-stin-a-b90dc3.mp3
  status: verified
  example_el: — Τι θα πάρεις στην αγορά; — Θα αγοράσω ρούχα και δώρα για τη γιορτή.
  example_en: — What will you get at the market? — I will buy clothes and gifts for
    the celebration.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Planning a shopping trip using the simple future and
    inviting a friend
- id: A1-U107C-011
  greek: — Μπορώ να δοκιμάσω αυτό το σακάκι; — Βεβαίως, το δοκιμαστήριο είναι στο
    βάθος αριστερά.
  phonetic_hint: — boh-ROH nah thoh-kee-MAH-soh af-TOH toh sah-KAH-kee? — veh-VEH-ohs,
    toh thoh-kee-mah-STEE-ree-oh EE-neh stoh VAH-thos ah-ree-steh-RAH.
  english: — May I try on this blazer? — Certainly, the fitting room is at the back
    on the left.
  notes: Review Unit 108. Requesting to try on clothes ('δοκιμάζω') and locating the
    fitting rooms ('δοκιμαστήριο').
  gender_or_pos: phrase
  audio: mporo-na-dokimaso-ay-09520d.mp3
  status: verified
  example_el: — Συγγνώμη, πού είναι τα δοκιμαστήρια; — Είναι πίσω από τις μπλούζες.
  example_en: — Excuse me, where are the fitting rooms? — They are behind the tops.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking permission to try on clothes and locating fitting
    rooms
- id: A1-U107C-012
  greek: — Πώς σας φαίνεται το φόρεμα; — Σας πηγαίνει πάρα πολύ αυτό το χρώμα!
  phonetic_hint: — pohs sahs FEH-neh-teh toh FOH-reh-mah? — sahs pee-YEH-nee PAH-rah
    poh-LEE af-TOH toh KHROH-mah!
  english: — How does the dress look to you? — This color suits you very much!
  notes: Review Unit 108. Giving compliments on fit and color ('σας πηγαίνει').
  gender_or_pos: phrase
  audio: pos-sas-fainetai-to--aa7d6d.mp3
  status: verified
  example_el: — Σου ταιριάζει πολύ αυτό το πουκάμισο! — Ευχαριστώ, μου αρέσει κι εμένα.
  example_en: — This shirt suits you very well! — Thank you, I like it too.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Complimenting appearance and evaluating how clothes
    look on someone
- id: A1-U107C-013
  greek: — Αυτό το τζιν μου είναι πολύ στενό στη μέση. — Δοκιμάστε ένα νούμερο μεγαλύτερο!
  phonetic_hint: — af-TOH toh tzeen moo EE-neh poh-LEE steh-NOH stee MEH-see. — thoh-kee-MAH-steh
    EH-nah NOO-meh-roh meh-ghah-LEE-teh-roh!
  english: — These jeans are too tight on my waist. — Try one size larger!
  notes: Review Unit 108. Describing clothes that are too tight ('στενός') and suggesting
    larger sizes.
  gender_or_pos: phrase
  audio: ayto-to-tzin-moy-ein-ea8c98.mp3
  status: verified
  example_el: — Είναι στενό το παντελόνι; — Ναι, μου είναι λίγο στενό.
  example_en: — Are the pants tight? — Yes, they are a little tight on me.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing that clothes are too tight and recommending
    sizing up
- id: A1-U107C-014
  greek: — Αυτή η μπλούζα σας είναι πολύ φαρδιά. — Ναι, φέρε μου ένα μικρότερο νούμερο,
    παρακαλώ.
  phonetic_hint: — af-TEE ee BLOO-zah sahs EE-neh poh-LEE fahr-THYAH. — Neh, FEH-reh
    moo EH-nah mee-KROH-teh-roh NOO-meh-roh, pah-rah-kah-LOH.
  english: — This top is too loose on you. — Yes, bring me a smaller size, please.
  notes: Review Unit 108. Describing clothes that are too loose ('φαρδύς') and requesting
    a smaller size.
  gender_or_pos: phrase
  audio: ayti-i-mployza-sas-e-bae04a.mp3
  status: verified
  example_el: — Σας κάνει η μπλούζα; — Όχι, μου είναι πολύ φαρδιά.
  example_en: — Does the top fit you? — No, it is too loose on me.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Reporting loose garments and requesting smaller sizes
- id: A1-U107C-015
  greek: — Το μήκος είναι καλό, αλλά τα μανίκια είναι πολύ μακριά. — Ναι, τα μανίκια
    είναι μακριά.
  phonetic_hint: — toh MEE-kos EE-neh kah-LOH, ah-LAH tah mah-NEE-kyah EE-neh poh-LEE
    mah-KRYAH. — Neh, tah mah-NEE-kyah EE-neh mah-KRYAH.
  english: — The length is good, but the sleeves are too long. — Yes, the sleeves
    are long.
  notes: 'Review Unit 108. Discussing clothing fit details: length (''μήκος'') and
    sleeves (''μανίκια'').'
  gender_or_pos: phrase
  audio: to-mikos-einai-kalo--d773a1.mp3
  status: verified
  example_el: — Είναι μακριά τα μανίκια; — Ναι, είναι λίγο μακριά.
  example_en: — Are the sleeves long? — Yes, they are a bit long.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Evaluating clothing dimensions and sleeve length
- id: A1-U107C-016
  greek: — Σας κάνει το σακάκι ή θέλετε άλλο σχέδιο; — Μου κάνει τέλεια και είναι
    άνετο.
  phonetic_hint: — sahs KAH-nee toh sah-KAH-kee ee THEH-leh-teh AH-loh SKHEH-thyoh?
    — moo KAH-nee TEH-lyah keh EE-neh AH-neh-toh.
  english: — Does the jacket fit you or do you want another design? — It fits me perfectly
    and is comfortable.
  notes: Review Unit 108. Expressing perfect fit using 'μου κάνει τέλεια'.
  gender_or_pos: phrase
  audio: sas-kanei-to-sakaki--0e1fd6.mp3
  status: verified
  example_el: — Θα το πάρεις αυτό το σακάκι; — Ναι, θα το αγοράσω.
  example_en: — Will you take this jacket? — Yes, I will buy it.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Confirming proper fit and garment comfort
- id: A1-U107C-017
  greek: — Αυτό το παλτό ταιριάζει πολύ με τις μπότες σας. — Ναι, είναι πάρα πολύ
    όμορφο!
  phonetic_hint: — af-TOH toh pahl-TOH teh-ree-AH-zee poh-LEE meh tees BOH-tes sahs.
    — Neh, EE-neh PAH-rah poh-LEE OH-mor-foh!
  english: — This coat matches your boots very well. — Yes, it is very beautiful!
  notes: Review Unit 108. Coordinating clothing items with 'ταιριάζει με' (matches
    with).
  gender_or_pos: phrase
  audio: ayto-to-palto-tairia-268d29.mp3
  status: verified
  example_el: — Ταιριάζει το πουκάμισο με τη ζώνη; — Ναι, έχουν ακριβώς το ίδιο χρώμα.
  example_en: — Does the shirt match the belt? — Yes, they have exactly the same color.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Coordinating apparel items and matching colors
- id: A1-U107C-018
  greek: — Θέλω να δοκιμάσω και εκείνη την πράσινη ζακέτα. — Ορίστε, πάρτε την στο
    δοκιμαστήριο.
  phonetic_hint: — THEH-loh nah thoh-kee-MAH-soh keh eh-KEE-nee teen PRAH-see-nee
    zah-KEH-tah. — oh-REES-teh, PAHR-teh teen stoh thoh-kee-mah-STEE-ree-oh.
  english: — I want to try on that green cardigan as well. — Here you are, take it
    into the fitting room.
  notes: Review Unit 108. Expressing desires with 'θέλω να δοκιμάσω' and selecting
    specific knitwear ('ζακέτα').
  gender_or_pos: phrase
  audio: thelo-na-dokimaso-ka-495638.mp3
  status: verified
  example_el: — Σας αρέσει η ζακέτα; — Ναι, είναι πολύ ζεστή και όμορφη.
  example_en: — Do you like the cardigan? — Yes, it is very warm and nice.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Selecting additional garments to test in the fitting
    room
- id: A1-U107C-019
  greek: — Αυτό το τζιν μου είναι πολύ στενό. — Δοκιμάστε το νούμερο σαράντα ένα.
  phonetic_hint: — af-TOH toh tzeen moo EE-neh poh-LEE steh-NOH. — thoh-kee-MAH-steh
