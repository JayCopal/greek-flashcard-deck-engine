  gender_or_pos: phrase
  audio: ayto-to-tzin-moy-ein-a92a4d.mp3
  status: verified
  example_el: — Σου είναι στενό το παντελόνι; — Ναι, μου είναι λίγο στενό.
  example_en: — Are the pants tight on you? — Yes, they are a little tight on me.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Stating sizing difficulties and testing specific alternative
    sizes
- id: A1-U107C-020
  greek: — Αυτή η γραβάτα πηγαίνει με το κοστούμι μου; — Ναι, ταιριάζει πολύ με το
    λευκό πουκάμισο.
  phonetic_hint: — af-TEE ee ghrah-VAH-tah pee-YEH-nee meh toh koh-STOO-mee moo? —
