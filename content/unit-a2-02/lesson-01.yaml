unit_id: unit-a2-02
lesson_id: lesson-01
title: 'Μάθημα 2: Καθημερινές Συνήθειες στο Παρελθόν & Χρόνος (Past Habits, Duration
  & Continuity)'
description: Describing past routines, enduring habits, and lifestyle transformations
  using the Imperfect tense (Παρατατικός), temporal connectors (ενώ, καθώς, όταν),
  and narrative contrast with the Simple Past.
lesson_status: not_started
lesson_notes: "Unit A2-02 Core Notes: Παρατατικός & Χρονική Σύνδεση (Imperfect & Temporal\
  \ Aspect)\n• Imperfect (Παρατατικός) Functions:\n  - Expresses ongoing duration,\
  \ past habit/repetition, or background atmosphere in narratives.\n  - Forms: έμενα,\
  \ διάβαζα, δούλευα, μιλούσα, ξυπνούσα, κοιμόμουν, οδηγούσα.\n  - Irregular foundations:\
  \ ήμουν (I was), είχα (I had).\n\n• Aspectual Contrast: Παρατατικός vs. Αόριστος:\n\
  \  - Background duration interrupted by a punctive event: 'Ενώ μαγείρευα (παρατατικός),\
  \ χτύπησε (αόριστος) το κουδούνι.'\n  - Habitual routine vs. single event: 'Παλιά\
  \ πήγαινα (παρατατικός) κάθε μέρα, αλλά χθες δεν πήγα (αόριστος).'\n\n• Key Connectors:\n\
  \  - ενώ (while), καθώς (as/while), όταν (when), ξαφνικά (suddenly), την ώρα που\
  \ (at the time that)."
