unit_id: unit-109b
lesson_id: lesson-01
title: 'Ενότητα 8: Προτάσεις & Γραμματική — Από τον μανάβη στο πιάτο μας! (Pages 175-194)'
description: 'Expansion & Complementary to Lesson 109: Sentence structures, syntax
  patterns, Indefinite pronouns and quantifiers (κανένας/καμία/κανένα, τίποτα, κάποιος,
  κάτι, κάθε, μερικοί), strong personal pronouns after prepositions (με, για, από,
  σε, χωρίς), quantifiers (πολύς, πολλή, πολύ vs πόσος, πόση, πόσο), supermarket and
  produce vendor shopping dialogues, taverna and restaurant ordering interactions,
  and cooking recipe imperatives (κόψτε, βάλτε, ανακατέψτε, ψήστε).'
lesson_status: not_started
entries:
- id: A1-U109B-001
  greek: Υπάρχει κανένας φούρνος εδώ στη γειτονιά;
  phonetic_hint: ee-PAHR-khee kah-NEH-nahs FOOR-nos eh-THO stee yee-to-NYAH
  english: Is there any bakery here in the neighborhood?
  notes: 'Klik A1 p. 184, 185. Grammar: Indefinite pronoun / determiner masculine
    singular (κανένας) in an affirmative interrogative context.'
  gender_or_pos: phrase
  audio: yparchei-kanenas-foy-b6f932.mp3
  status: verified
  example_el: — Συγγνώμη, υπάρχει κανένας φούρνος εδώ στη γειτονιά; — Ναι, στον επόμενο
    δρόμο δεξιά.
  example_en: — Excuse me, is there any bakery here in the neighborhood? — Yes, on
    the next street on the right.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about nearby food shops using indefinite pronouns
- id: A1-U109B-002
  greek: Όχι, δεν υπάρχει κανένας φούρνος ανοιχτός τέτοια ώρα.
  phonetic_hint: O-khee, then ee-PAHR-khee kah-NEH-nahs FOOR-nos ah-neekh-TOS TEH-tyah
    O-rah
  english: No, there is no bakery open at this hour.
  notes: 'Klik A1 p. 184, 185. Grammar: Double negation with δεν ... κανένας (not
    ... any / no).'
  gender_or_pos: phrase
  audio: ochi-den-yparchei-ka-8de80d.mp3
  status: verified
  example_el: — Μπορούμε να πάρουμε ψωμί; — Όχι, δεν υπάρχει κανένας φούρνος ανοιχτός
    τέτοια ώρα.
  example_en: — Can we get bread? — No, there is no bakery open at this hour.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing absence of commercial venues using negative
    quantifiers
- id: A1-U109B-003
  greek: Έχουμε καμία μπύρα στο ψυγείο ή να πάρω από το περίπτερο;
  phonetic_hint: EH-khoo-meh kah-MEE-ah BEE-rah sto psee-YEE-o ee nah PAH-ro ah-PO
    to peh-REE-pteh-ro
  english: Do we have any beer in the fridge or should I get some from the kiosk?
  notes: 'Klik A1 p. 184, 185. Grammar: Indefinite pronoun feminine singular (καμία)
    modifying feminine noun μπύρα.'
  gender_or_pos: phrase
  audio: echoyme-kamia-mpyra--35724b.mp3
  status: verified
  example_el: — Έχουμε καμία μπύρα στο ψυγείο ή να πάρω από το περίπτερο; — Έχουμε
    δύο κουτάκια, μην ανησυχείς.
  example_en: — Do we have any beer in the fridge or should I get some from the kiosk?
    — We have two cans, don't worry.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Checking household beverage supplies using indefinite
    feminine determiner
- id: A1-U109B-004
  greek: Στο σπίτι δεν υπάρχει καμία κρύα μπύρα.
  phonetic_hint: sto SPEE-tee then ee-PAHR-khee kah-MEE-ah KREE-ah BEE-rah
  english: At home there is not a single cold beer.
  notes: 'Klik A1 p. 184, 185. Grammar: Negation δεν + καμία (none / not any).'
  gender_or_pos: phrase
  audio: sto-spiti-den-yparch-1a647b.mp3
  status: verified
  example_el: — Βρήκες τίποτα να πιούμε; — Δυστυχώς, στο σπίτι δεν υπάρχει καμία κρύα
    μπύρα.
  example_en: — Did you find anything for us to drink? — Unfortunately, at home there
    is not a single cold beer.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Confirming complete lack of items with feminine negative
    pronoun
- id: A1-U109B-005
  greek: Θέλεις τίποτα άλλο από το σούπερ μάρκετ;
  phonetic_hint: THEH-lees TEE-po-tah AH-lo ah-PO to SOO-per MAHR-ket
  english: Do you want anything else from the supermarket?
  notes: 'Klik A1 p. 184, 185. Grammar: Indefinite pronoun τίποτα (anything / something)
    combined with άλλο (else).'
  gender_or_pos: phrase
  audio: theleis-tipota-allo--e2aa65.mp3
  status: verified
  example_el: — Φεύγω για ψώνια! Θέλεις τίποτα άλλο από το σούπερ μάρκετ; — Πάρε και
    ένα γάλα, παρακαλώ.
  example_en: — I am leaving for shopping! Do you want anything else from the supermarket?
    — Get a milk too, please.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about additional grocery needs
- id: A1-U109B-006
  greek: Όχι, ευχαριστώ, δεν χρειάζομαι τίποτα παραπάνω.
  phonetic_hint: O-khee, ef-khah-ree-STO, then khree-AH-zo-meh TEE-po-tah pah-rah-PAH-no
  english: No, thank you, I do not need anything more.
  notes: 'Klik A1 p. 184, 185. Grammar: Double negation with δεν ... τίποτα (nothing
    / not anything).'
  gender_or_pos: phrase
  audio: ochi-eycharisto-den--1f1751.mp3
  status: verified
  example_el: — Να σου φέρω κάτι από το περίπτερο; — Όχι, ευχαριστώ, δεν χρειάζομαι
    τίποτα παραπάνω.
  example_en: — Should I bring you something from the kiosk? — No, thank you, I do
    not need anything more.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Declining additional purchases with negative indefinite
    pronoun
- id: A1-U109B-007
  greek: Κανείς δεν ήρθε ακόμα στην ταβέρνα.
  phonetic_hint: kah-NEES then EER-theh ah-KO-mah steen tah-VER-nah
  english: Nobody has arrived at the tavern yet.
  notes: 'Klik A1 p. 184, 185. Grammar: Indefinite pronoun κανείς (nobody) as preverbal
    subject with negation δεν.'
  gender_or_pos: phrase
  audio: kaneis-den-irthe-ako-78d3ad.mp3
  status: verified
  example_el: — Ήρθαν τα παιδιά στο ραντεβού; — Όχι, κανείς δεν ήρθε ακόμα στην ταβέρνα.
  example_en: — Did the gang arrive at the meetup? — No, nobody has arrived at the
    tavern yet.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Reporting complete absence of people using κανείς
- id: A1-U109B-008
  greek: Θέλω κάτι ελαφρύ και νόστιμο για μεσημεριανό.
  phonetic_hint: THEH-lo KAH-tee eh-lah-FREE keh NO-stee-mo yah meh-see-meh-ree-ah-NO
  english: I want something light and tasty for lunch.
  notes: 'Klik A1 p. 176, 184. Grammar: Indefinite pronoun κάτι (something) modifying
    neuter adjectives.'
  gender_or_pos: phrase
  audio: thelo-kati-elafry-ka-298628.mp3
  status: verified
  example_el: — Τι να μαγειρέψουμε σήμερα; — Θέλω κάτι ελαφρύ και νόστιμο για μεσημεριανό,
    όπως μια σαλάτα.
  example_en: — What should we cook today? — I want something light and tasty for
    lunch, like a salad.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Stating general culinary preferences with indefinite
    pronoun κάτι
- id: A1-U109B-009
  greek: Κάθε πρωί πίνω έναν ζεστό καφέ και τρώω φρέσκα φρούτα.
  phonetic_hint: KAH-theh pro-EE PEE-no EH-nahn zeh-STO kah-FEH keh TRO-o FREH-skah
    FROO-tah
  english: Every morning I drink a hot coffee and eat fresh fruit.
  notes: 'Klik A1 p. 184, 187. Grammar: Undeclinable quantifier κάθε followed by singular
    noun without article.'
  gender_or_pos: phrase
  audio: kathe-proi-pino-enan-db131f.mp3
  status: verified
  example_el: — Ποια είναι η πρωινή σου συνήθεια; — Κάθε πρωί πίνω έναν ζεστό καφέ
    και τρώω φρέσκα φρούτα.
  example_en: — What is your morning habit? — Every morning I drink a hot coffee and
    eat fresh fruit.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Describing habitual dietary routines using κάθε
- id: A1-U109B-010
  greek: Αγόρασε μερικές μπανάνες και μερικά μήλα από τον μανάβη.
  phonetic_hint: ah-GO-rah-seh meh-ree-KES bah-NAH-nes keh meh-ree-KAH MEE-lah ah-PO
    ton mah-NAH-vee
  english: Buy a few bananas and a few apples from the greengrocer.
  notes: 'Klik A1 p. 178, 184. Grammar: Indefinite quantifier μερικοί/μερικές/μερικά
    (some / a few) in plural.'
  gender_or_pos: phrase
  audio: agorase-merikes-mpan-4ffa2f.mp3
  status: verified
  example_el: — Τι φρούτα να πάρω; — Αγόρασε μερικές μπανάνες και μερικά μήλα από
    τον μανάβη.
  example_en: — What fruits should I get? — Buy a few bananas and a few apples from
    the greengrocer.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Instructing purchases of small indefinite quantities
- id: A1-U109B-011
  greek: Θέλεις να έρθεις μαζί μου στο σούπερ μάρκετ;
  phonetic_hint: THEH-lees nah ER-thees mah-ZEE moo sto SOO-per MAHR-ket
  english: Do you want to come with me to the supermarket?
  notes: 'Klik A1 p. 185, 186. Grammar: Prepositional phrase μαζί μου (= με μένα).
    Strong personal pronoun equivalent.'
  gender_or_pos: phrase
  audio: theleis-na-ertheis-m-3c5128.mp3
  status: verified
  example_el: — Θέλεις να έρθεις μαζί μου στο σούπερ μάρκετ; — Ναι, να σε βοηθήσω
    με τα ψώνια.
  example_en: — Do you want to come with me to the supermarket? — Yes, to help you
    with the groceries.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inviting someone along for a shopping errand
- id: A1-U109B-012
  greek: Έχω ένα μικρό δώρο για σένα.
  phonetic_hint: EH-kho EH-nah mee-KRO THO-ro yah SEH-nah
  english: I have a small gift for you.
  notes: 'Klik A1 p. 185, 186. Grammar: Preposition για + strong pronoun accusative
    2nd person (εσένα / σένα).'
  gender_or_pos: phrase
  audio: echo-ena-mikro-doro--e20cb2.mp3
  status: verified
  example_el: — Γύρισες από την αγορά; — Ναι, και έχω ένα μικρό δώρο για σένα!
  example_en: — Did you return from the market? — Yes, and I have a small gift for
    you!
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Presenting an item to someone using strong personal
    pronouns
- id: A1-U109B-013
  greek: Να πάρω κάτι από το περίπτερο για σας;
  phonetic_hint: nah PAH-ro KAH-tee ah-PO to peh-REE-pteh-ro yah sahs
  english: Shall I get something from the kiosk for you?
  notes: 'Klik A1 p. 185, 186. Grammar: Preposition για + strong pronoun accusative
    2nd person plural / formal (εσάς / σας).'
  gender_or_pos: phrase
  audio: na-paro-kati-apo-to--340408.mp3
  status: verified
  example_el: — Βγαίνω για μια στιγμή. Να πάρω κάτι από το περίπτερο για σας; — Μια
    εφημερίδα, παρακαλώ.
  example_en: — I am stepping out for a moment. Shall I get something from the kiosk
    for you? — A newspaper, please.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Politely offering to fetch kiosk items for someone
- id: A1-U109B-014
  greek: Χωρίς εσένα δεν περνάω καλά στην παρέα.
  phonetic_hint: kho-REES eh-SEH-nah then per-NAH-o kah-LAH steen pah-REH-ah
  english: Without you I don't have a good time in the group.
  notes: 'Klik A1 p. 185, 186. Grammar: Preposition χωρίς + strong pronoun accusative
    (εσένα).'
  gender_or_pos: phrase
  audio: choris-esena-den-per-1f8f78.mp3
  status: verified
  example_el: — Δεν νομίζω να έρθω στο τραπέζι. — Έλα σε παρακαλώ! Χωρίς εσένα δεν
    περνάω καλά στην παρέα.
  example_en: — I don't think I'll come to dinner. — Please come! Without you I don't
    have a good time in the group.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing personal attachment using preposition χωρίς
    with strong pronoun
- id: A1-U109B-015
  greek: Μπορείτε να έρθετε με μας στη λαϊκή αγορά.
  phonetic_hint: bo-REE-teh nah ER-theh-teh meh mahs stee lah-ee-KEE ah-go-RAH
  english: You can come with us to the street market.
  notes: 'Klik A1 p. 185, 186. Grammar: Preposition με + strong pronoun accusative
    1st person plural (εμάς / μας).'
  gender_or_pos: phrase
  audio: mporeite-na-erthete--04b8ec.mp3
  status: verified
  example_el: — Δεν έχουμε αυτοκίνητο για την αγορά. — Κανένα πρόβλημα, μπορείτε να
    έρθετε με μας στη λαϊκή αγορά.
  example_en: — We don't have a car for the market. — No problem, you can come with
    us to the street market.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Offering a ride or shared outing with prepositional
    pronoun
- id: A1-U109B-016
  greek: Αυτή η παραδοσιακή συνταγή είναι από μένα.
  phonetic_hint: af-TEE ee pah-rah-tho-see-ah-KEE seen-tah-YEE EE-neh ah-PO MEH-nah
  english: This traditional recipe is from me.
  notes: 'Klik A1 p. 185, 186, 193. Grammar: Preposition από + strong pronoun accusative
    1st person singular (εμένα / μένα).'
  gender_or_pos: phrase
  audio: ayti-i-paradosiaki-s-7a5e38.mp3
  status: verified
  example_el: — Ποιος σου έμαθε αυτό το φαγητό; — Αυτή η παραδοσιακή συνταγή είναι
    από μένα!
  example_en: — Who taught you this dish? — This traditional recipe is from me!
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Claiming origin or authorship with preposition από
- id: A1-U109B-017
  greek: Ελάτε σε μας το βράδυ να φάμε όλοι μαζί!
  phonetic_hint: eh-LAH-teh seh mahs to VRAH-thee nah FAH-meh O-lee mah-ZEE
  english: Come over to our place tonight to eat all together!
  notes: 'Klik A1 p. 185, 186. Idiom: σε μας = to our place / home. Imperative ελάτε.'
  gender_or_pos: phrase
  audio: elate-se-mas-to-vrad-502613.mp3
  status: verified
  example_el: — Τι θα κάνετε απόψε; — Μαγειρεύουμε παστίτσιο, ελάτε σε μας το βράδυ
    να φάμε όλοι μαζί!
  example_en: — What are you doing tonight? — We are cooking pastitsio, come over
    to our place tonight to eat all together!
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inviting friends to one's home for dinner
- id: A1-U109B-018
  greek: Δεν πάμε πουθενά χωρίς αυτούς τους καλούς φίλους.
  phonetic_hint: then PAH-meh poo-theh-NAH kho-REES af-TOOS toos kah-LOOS FEE-loos
  english: We go nowhere without these good friends.
  notes: 'Klik A1 p. 185, 186. Grammar: Preposition χωρίς with demonstrative and noun
    in accusative plural.'
  gender_or_pos: phrase
  audio: den-pame-poythena-ch-d2f24b.mp3
  status: verified
  example_el: — Ποιοι θα έρθουν στην εκδρομή; — Δεν πάμε πουθενά χωρίς αυτούς τους
    καλούς φίλους.
  example_en: — Who will come on the excursion? — We go nowhere without these good
    friends.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing loyalty to companions using preposition χωρίς
- id: A1-U109B-019
  greek: Στη λαϊκή αγορά έχει πάρα πολύ κόσμο σήμερα.
  phonetic_hint: stee lah-ee-KEE ah-go-RAH EH-khee PAH-rah po-LEE KO-zmo SEE-meh-rah
  english: At the street market there are very many people today.
  notes: 'Klik A1 p. 190. Grammar: Masculine accusative singular of πολύς (πολύ κόσμο)
    modifying collective noun ο κόσμος.'
  gender_or_pos: phrase
  audio: sti-laiki-agora-eche-57e1f5.mp3
  status: verified
  example_el: — Γιατί άργησες; — Στη λαϊκή αγορά έχει πάρα πολύ κόσμο σήμερα και περίμενα
    στην ουρά.
  example_en: — Why are you late? — At the street market there are very many people
    today and I waited in line.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Describing crowded marketplace conditions
- id: A1-U109B-020
  greek: Μην βάζεις πολλή ζάχαρη στον ελληνικό καφέ.
  phonetic_hint: meen VAH-zees po-LEE ZAH-khah-ree ston eh-lee-nee-KO kah-FEH
  english: Do not put much sugar in the Greek coffee.
  notes: 'Klik A1 p. 190. Orthography alert: Adjective feminine singular accusative
    πολλή (-λλ-) modifying ζάχαρη, contrasted with adverb πολύ (-λ-).'
  gender_or_pos: phrase
  audio: min-vazeis-polli-zac-500d79.mp3
  status: verified
  example_el: — Πώς τον πίνεις τον καφέ; — Μέτριο, μην βάζεις πολλή ζάχαρη στον ελληνικό
    καφέ.
  example_en: — How do you drink your coffee? — Medium-sweet, do not put much sugar
    in the Greek coffee.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Giving coffee sweetness specifications with feminine
    quantifier πολλή
- id: A1-U109B-021
  greek: Έχουμε πολύ φαγητό στο ψυγείο για το βραδινό τραπέζι.
  phonetic_hint: EH-khoo-meh po-LEE fah-yee-TO sto psee-YEE-o yah to vrah-thee-NO
    trah-PEH-zee
  english: We have a lot of food in the fridge for the evening meal.
  notes: 'Klik A1 p. 190. Grammar: Neuter singular πολύ modifying neuter noun φαγητό.'
  gender_or_pos: phrase
  audio: echoyme-poly-fagito--35df3f.mp3
  status: verified
  example_el: — Να παραγγείλουμε πίτσα; — Όχι, έχουμε πολύ φαγητό στο ψυγείο για το
    βραδινό τραπέζι.
  example_en: — Shall we order pizza? — No, we have a lot of food in the fridge for
    the evening meal.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Stating abundance of food supplies with neuter quantifier
- id: A1-U109B-022
  greek: Στο τραπέζι κάθονται πολλοί καλεσμένοι.
  phonetic_hint: sto trah-PEH-zee KAH-thon-deh po-LEE kah-leh-ZMEH-nee
  english: Many guests are sitting at the table.
  notes: 'Klik A1 p. 190. Grammar: Masculine nominative plural πολλοί modifying plural
    noun καλεσμένοι.'
  gender_or_pos: phrase
  audio: sto-trapezi-kathonta-de009e.mp3
  status: verified
  example_el: — Χωράμε όλοι στην τραπεζαρία; — Ναι, αλλά στο τραπέζι κάθονται πολλοί
    καλεσμένοι.
  example_en: — Do we all fit in the dining room? — Yes, but many guests are sitting
    at the table.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Describing large numbers of dinner attendees
- id: A1-U109B-023
  greek: Πόσο κοστίζει το κιλό οι φρέσκες ντομάτες;
  phonetic_hint: PO-so ko-STEE-zee to kee-LO ee FREH-skes do-MAH-tes
  english: How much do the fresh tomatoes cost per kilo?
  notes: 'Klik A1 p. 182, 190. Pricing inquiry: πόσο κοστίζει + το κιλό (per kilo).'
  gender_or_pos: phrase
  audio: poso-kostizei-to-kil-966bdb.mp3
  status: verified
  example_el: — Πόσο κοστίζει το κιλό οι φρέσκες ντομάτες; — Είναι ένα ευρώ και πενήντα
    λεπτά το κιλό.
  example_en: — How much do fresh tomatoes cost per kilo? — They are one euro and
    fifty cents a kilo.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Inquiring about unit price per kilogram for produce
- id: A1-U109B-024
  greek: Πόση φέτα και πόσο γιαούρτι θέλετε;
  phonetic_hint: PO-see FEH-tah keh PO-so yah-OOR-tee THEH-leh-teh
  english: How much feta and how much yogurt do you want?
  notes: 'Klik A1 p. 190. Grammar: Interrogative πόση (fem.) modifying φέτα and πόσο
    (neut.) modifying γιαούρτι.'
  gender_or_pos: phrase
  audio: posi-feta-kai-poso-g-9768f2.mp3
  status: verified
  example_el: — Καλημέρα! Πόση φέτα και πόσο γιαούρτι θέλετε; — Μισό κιλό φέτα και
    δύο γιαούρτια, παρακαλώ.
  example_en: — Good morning! How much feta and how much yogurt do you want? — Half
    a kilo of feta and two yogurts, please.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking customer grocery quantities across gender agreements
- id: A1-U109B-025
  greek: Πόσους καφέδες να παραγγείλω για όλους;
  phonetic_hint: PO-soos kah-FEH-thes nah pah-rahn-GEE-lo yah O-loos
  english: How many coffees should I order for everyone?
