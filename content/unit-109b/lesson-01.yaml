  notes: 'Klik A1 p. 207, 208, 209. Grammar: Past tense 1st person singular (άκουσα)
    of verb ακούω (stem in -ουσ-).'
  gender_or_pos: phrase
  audio: to-proi-akoysa-tis-e-2067af.mp3
  status: verified
  example_el: — Έμαθες τι έγινε στον κόσμο; — Ναι, το πρωί άκουσα τις ειδήσεις στο
    ραδιόφωνο.
  example_en: — Did you learn what happened in the world? — Yes, in the morning I
