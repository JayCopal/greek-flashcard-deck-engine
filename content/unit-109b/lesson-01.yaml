unit_id: unit-109b
lesson_id: lesson-01
title: 'Ενότητα 9: Προτάσεις & Γραμματική — Σπουδάζεις ή δουλεύεις; (Pages 195-218)'
description: 'Expansion & Complementary to Lesson 100: Sentence structures, syntax
  patterns, Simple Past / Aorist tense of regular verbs (διάβασα, έγραψα, άκουσα,
  μαγείρεψα, δούλεψα, τελείωσα, πλήρωσα) and irregular high-frequency verbs (πήγα,
  ήρθα, είδα, βρήκα, πήρα, έστειλα, έφυγα, έφαγα, ήπια, είπα, έκανα, κατάλαβα, βγήκα,
  μπήκα, έμαθα), past tense of ''είμαι'' and ''έχω'' (ήμουν, είχα), adverbs and comparative
  constructions (πιο γρήγορα από, πιο αργά από, καλύτερα από), professional employment
  and work inquiries (job interviews, work schedules, salary, vacation leave), and
  educational institution course enrollments and schedules.'
lesson_status: not_started
entries:
- id: A1-U109B-001
  greek: Χθες διάβασα όλο το απόγευμα για το μάθημα της ιστορίας.
  phonetic_hint: khthes thee-AH-vah-sah O-lo to ah-PO-yev-mah yah to MAH-thee-mah
    tees ee-sto-REE-ahs
  english: Yesterday I studied all afternoon for the history lesson.
  notes: 'Klik A1 p. 207, 208, 209. Grammar: Past tense (Αόριστος) 1st person singular
    (διάβασα) of verb διαβάζω (stem in -ασ-).'
  gender_or_pos: phrase
  audio: chthes-diavasa-olo-t-9be910.mp3
  status: verified
  example_el: — Τι έκανες χθες; — Χθες διάβασα όλο το απόγευμα για το μάθημα της ιστορίας.
  example_en: — What did you do yesterday? — Yesterday I studied all afternoon for
    the history lesson.
