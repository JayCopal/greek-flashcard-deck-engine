- id: A1-U109B-005
  greek: Δούλεψα οκτώ ώρες στο γραφείο και γύρισα πολύ κουρασμένος.
  phonetic_hint: THOO-leh-psah ok-TO O-res sto ghrah-FEE-o keh YEE-ree-sah po-LEE
    koo-rah-ZMEH-nos
  english: I worked eight hours at the office and came back very tired.
  notes: 'Klik A1 p. 201, 202, 208. Grammar: Past tense (δούλεψα) of verb δουλεύω
    + (γύρισα) of verb γυρίζω.'
  gender_or_pos: phrase
  audio: doylepsa-okto-ores-s-967a49.mp3
  status: verified
  example_el: — Θέλεις να βγούμε μια βόλτα; — Προτιμώ να ξεκουραστώ, δούλεψα οκτώ
    ώρες στο γραφείο και γύρισα πολύ κουρασμένος.
  example_en: — Do you want to go out for a walk? — I prefer to rest, I worked eight
    hours at the office and returned very tired.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Relating workday exertion and exhaustion in the past
- id: A1-U109B-006
