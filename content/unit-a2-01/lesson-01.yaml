unit_id: unit-a2-01
lesson_id: lesson-01
title: 'Μάθημα 1: Βιογραφία, Αναμνήσεις & Το Παρελθόν μου (Personal Biography & Past
  Experiences)'
description: Recounting life milestones, childhood memories, educational history,
  and past journeys using the Simple Past (Αόριστος) active voice and essential irregular
  stems.
lesson_status: not_started
lesson_notes: "Unit A2-01 Core Notes: Βιογραφία & Αόριστος (Personal Biography & Simple\
  \ Past)\n• Simple Past (Αόριστος) Active Formation:\n  - Regular -ω verbs form past\
  \ in -σα, -ξα, -ψα (δούλεψα, άνοιξα, έγραψα).\n  - Regular -άω / -ώ verbs form past\
  \ in -ησα (μίλησα, ζήτησα) or -εσα / -ασα (φόρεσα, πέρασα).\n  - Crucial High-Yield\
  \ Irregulars: πήγα (πηγαίνω), είδα (βλέπω), είπα (λέω), ήπια (πίνω), έφαγα (τρώω),\
  \ πήρα (παίρνω), βρήκα (βρίσκω), έδωσα (δίνω), έμαθα (μαθαίνω), έστειλα (στέλνω),\
  \ έφυγα (φεύγω), ήρθα (έρχομαι).\n  - Essential Biography Deponents: γεννήθηκα (γεννιέμαι),\
  \ παντρεύτηκα (παντρεύομαι).\n\n• Examination Relevance:\n  - Writing Task 2 (Letter/Email):\
  \ Recounting a past trip, describing personal background or explaining past events.\n\
  \  - Speaking Stage 1: Personal interview regarding studies, career background,\
  \ and origins."
entries:
- id: A2-U01-001
