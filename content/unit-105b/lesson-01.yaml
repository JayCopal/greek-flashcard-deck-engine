unit_id: unit-105b
lesson_id: lesson-01
title: 'Ενότητα 5: Προτάσεις & Γραμματική — Ετοιμάζω ταξίδι! (Pages 111-134)'
description: 'Expansion & Complementary to Lesson 100: Sentence structures, syntax
  patterns, verb conjugations, modal verbs with subjunctive (θέλω/μπορώ/πρέπει/λέω
  να + Aorist Subjunctive), comparative degrees of adjectives (πιο + adjective + από),
  transit navigation, and communicative dialogues.'
lesson_status: not_started
entries:
- id: A1-U105B-001
  greek: Θέλω να πάω ένα ταξίδι στην Ελλάδα.
  phonetic_hint: THEH-lo nah PAH-o EH-nah tahk-SEE-thee steen eh-LAH-thah
  english: I want to go on a trip to Greece.
  notes: 'Klik A1 p. 111, 115. Grammar: ''θέλω να'' + subjunctive of irregular verb
    πηγαίνω/πάω.'
  gender_or_pos: phrase
  audio: thelo-na-pao-ena-tax-bea078.mp3
  status: verified
  example_el: — Τι σχέδια έχεις για το καλοκαίρι; — Θέλω να πάω ένα ταξίδι στην Ελλάδα.
  example_en: — What plans do you have for the summer? — I want to go on a trip to
    Greece.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing desires for holiday travel
- id: A1-U105B-002
  greek: Πρέπει να αγοράσουμε τα εισιτήρια σήμερα.
  phonetic_hint: PREH-pee nah ah-go-RAH-soo-meh tah ee-see-TEE-ree-ah SEE-meh-rah
  english: We must buy the tickets today.
  notes: 'Klik A1 p. 111, 115. Grammar: impersonal modal ''πρέπει να'' + Aorist Subjunctive
    1st person plural (αγοράσουμε).'
  gender_or_pos: phrase
  audio: prepei-na-agorasoyme-000d85.mp3
  status: verified
  example_el: — Πότε θα πάρουμε τα εισιτήρια; — Πρέπει να αγοράσουμε τα εισιτήρια
    σήμερα.
  example_en: — When shall we get the tickets? — We must buy the tickets today.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing necessity and urgent booking tasks
- id: A1-U105B-003
  greek: Μπορείτε να κλείσετε ένα δωμάτιο στο διαδίκτυο;
  phonetic_hint: bo-REE-teh nah KLEE-seh-teh EH-nah tho-MAH-tee-o sto thee-ah-THEEK-tee-o
  english: Can you book a room on the internet?
  notes: 'Klik A1 p. 111, 115. Grammar: polite question ''μπορείτε να'' (2nd person
    plural) + Aorist Subjunctive (κλείσετε).'
  gender_or_pos: phrase
  audio: mporeite-na-kleisete-d61191.mp3
  status: verified
  example_el: — Δεν έχω υπολογιστή. Μπορείτε να κλείσετε ένα δωμάτιο στο διαδίκτυο;
    — Βεβαίως, αμέσως.
  example_en: — I don't have a computer. Can you book a room on the internet? — Certainly,
    right away.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Making polite requests for accommodation booking
- id: A1-U105B-004
  greek: Λέω να πάμε στο βουνό ή στη θάλασσα;
  phonetic_hint: LEH-o nah PAH-meh sto voo-NO ee stee THAH-lah-sah
  english: Shall we go to the mountain or to the sea?
  notes: 'Klik A1 p. 111, 115. Grammar: ''λέω να'' expressing suggestion or tentative
    plan + subjunctive 1st plural (πάμε).'
  gender_or_pos: phrase
  audio: leo-na-pame-sto-voyn-6464e6.mp3
  status: verified
  example_el: — Λέω να πάμε στο βουνό ή στη θάλασσα; — Προτιμώ να πάμε στη θάλασσα.
  example_en: — Shall we go to the mountain or to the sea? — I prefer going to the
    sea.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Proposing destination options
- id: A1-U105B-005
  greek: Πρέπει να φτιάξω τη βαλίτσα μου απόψε το βράδυ.
  phonetic_hint: PREH-pee nah FTYAH-kso tee vah-LEET-sah moo ah-PO-pseh to VRAH-thee
  english: I must pack my suitcase tonight.
  notes: 'Klik A1 p. 114, 118. Grammar: ''πρέπει να'' + Aorist Subjunctive 1st singular
    of φτιάχνω (φτιάξω).'
  gender_or_pos: phrase
  audio: prepei-na-ftiaxo-ti--ba23cb.mp3
  status: verified
  example_el: — Έρχεσαι για καφέ; — Όχι, πρέπει να φτιάξω τη βαλίτσα μου απόψε το
    βράδυ.
  example_en: — Are you coming for coffee? — No, I must pack my suitcase tonight.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Stating packing requirements before departure
- id: A1-U105B-006
  greek: Θέλω να αγοράσω μια καινούργια φωτογραφική μηχανή.
  phonetic_hint: THEH-lo nah ah-go-RAH-so mee-ah keh-NOOR-gyah foh-toh-grah-fee-KEE
    mee-khah-NEE
  english: I want to buy a new camera.
  notes: 'Klik A1 p. 111, 116. Grammar: ''θέλω να'' + Aorist Subjunctive (αγοράσω)
    + feminine accusative noun phrase.'
  gender_or_pos: phrase
  audio: thelo-na-agoraso-mia-48bf74.mp3
  status: verified
  example_el: — Τι θέλεις να πάρεις για το ταξίδι; — Θέλω να αγοράσω μια καινούργια
    φωτογραφική μηχανή.
  example_en: — What do you want to get for the trip? — I want to buy a new camera.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Expressing intention to purchase travel equipment
- id: A1-U105B-007
  greek: Μπορώ να ανοίξω το παράθυρο, γιατί έχει ζέστη;
  phonetic_hint: bo-RO nah ah-NEEK-so to pah-RAH-thee-ro yah-TEE EH-khee ZEH-stee
  english: Can I open the window, because it is hot?
  notes: 'Klik A1 p. 116, 118. Grammar: permission inquiry ''μπορώ να'' + Aorist Subjunctive
    of ανοίγω (ανοίξω).'
  gender_or_pos: phrase
  audio: mporo-na-anoixo-to-p-b84608.mp3
  status: verified
  example_el: — Συγγνώμη, μπορώ να ανοίξω το παράθυρο, γιατί έχει ζέστη; — Ναι, φυσικά.
  example_en: — Excuse me, can I open the window, because it is hot? — Yes, of course.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking for permission politely in transport or rooms
- id: A1-U105B-008
  greek: Πρέπει να φύγουμε νωρίς για να μη χάσουμε το πλοίο.
  phonetic_hint: PREH-pee nah FEE-goo-meh no-REES yah nah mee KHAH-soo-meh to PLEE-o
  english: We must leave early so we don't miss the ferry.
  notes: 'Klik A1 p. 116, 117. Grammar: ''πρέπει να φύγουμε'' + negative purpose clause
    ''για να μη χάσουμε''.'
  gender_or_pos: phrase
  audio: prepei-na-fygoyme-no-fa7a64.mp3
  status: verified
  example_el: — Τι ώρα θα ξεκινήσουμε; — Πρέπει να φύγουμε νωρίς για να μη χάσουμε
    το πλοίο.
  example_en: — What time shall we set off? — We must leave early so we don't miss
    the ferry.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Coordinating timely departure for travel
- id: A1-U105B-009
  greek: Σήμερα λέω να μη βγω έξω, γιατί βρέχει όλη μέρα.
  phonetic_hint: SEE-meh-rah LEH-o nah mee vgo EH-kso yah-TEE VREH-khee O-lee MEH-rah
  english: Today I'm thinking of not going out, because it's raining all day.
  notes: 'Klik A1 p. 116. Grammar: negative subjunctive with ''να μη + βγω'' (dependent
    form of βγαίνω).'
  gender_or_pos: phrase
  audio: simera-leo-na-mi-vgo-e3ef6c.mp3
  status: verified
  example_el: — Πάμε μια βόλτα; — Σήμερα λέω να μη βγω έξω, γιατί βρέχει όλη μέρα.
  example_en: — Shall we go for a walk? — Today I'm thinking of not going out, because
    it's raining all day.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Stating intentions to stay indoors due to bad weather
- id: A1-U105B-010
  greek: Θέλεις να φάμε σε ένα παραδοσιακό εστιατόριο;
  phonetic_hint: THEH-lees nah FAH-meh seh EH-nah pah-rah-tho-see-ah-KO eh-stee-ah-TO-ree-o
  english: Do you want us to eat at a traditional restaurant?
  notes: 'Klik A1 p. 115, 117, 118. Grammar: ''θέλεις να'' + Aorist Subjunctive 1st
    plural of τρώω (φάμε).'
  gender_or_pos: phrase
  audio: theleis-na-fame-se-e-f9154f.mp3
  status: verified
  example_el: — Πού θα πάμε για φαγητό; — Θέλεις να φάμε σε ένα παραδοσιακό εστιατόριο;
  example_en: — Where shall we go to eat? — Do you want us to eat at a traditional
    restaurant?
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Proposing dining options during travel
- id: A1-U105B-011
  greek: Μπορούμε να πιούμε έναν καφέ στο λιμάνι πριν φύγουμε;
  phonetic_hint: bo-ROO-meh nah PYOO-meh EH-nahn kah-FEH sto lee-MAH-nee preen FEE-goo-meh
  english: Can we have a coffee at the port before we leave?
  notes: 'Klik A1 p. 117, 118. Grammar: ''μπορούμε να'' + subjunctive of πίνω (πιούμε)
    + temporal clause ''πριν φύγουμε''.'
  gender_or_pos: phrase
  audio: mporoyme-na-pioyme-e-1bd574.mp3
  status: verified
  example_el: — Έχουμε ακόμα μισή ώρα. Μπορούμε να πιούμε έναν καφέ στο λιμάνι πριν
    φύγουμε; — Πολύ καλή ιδέα!
  example_en: — We still have half an hour. Can we have a coffee at the port before
    we leave? — Great idea!
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Suggesting a pre-departure coffee break
- id: A1-U105B-012
  greek: Πρέπει να μάθω μια ξένη γλώσσα για να σπουδάσω στο εξωτερικό.
  phonetic_hint: PREH-pee nah MAH-tho mee-ah KSEH-nee GLOH-sah yah nah spoo-THAH-so
    sto ehk-so-teh-ree-KO
  english: I must learn a foreign language in order to study abroad.
  notes: 'Klik A1 p. 117, 118. Grammar: ''πρέπει να μάθω'' (dependent of μαθαίνω)
    + ''για να σπουδάσω'' (dependent of σπουδάζω).'
  gender_or_pos: phrase
  audio: prepei-na-matho-mia--c8aef6.mp3
  status: verified
  example_el: — Γιατί κάνεις εντατικά μαθήματα; — Πρέπει να μάθω μια ξένη γλώσσα για
    να σπουδάσω στο εξωτερικό.
  example_en: — Why are you doing intensive lessons? — I must learn a foreign language
    in order to study abroad.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Explaining educational and language learning goals
- id: A1-U105B-013
  greek: Τι ώρα μπορεί να έρθει το ταξί στο ξενοδοχείο;
  phonetic_hint: tee O-rah bo-REE nah EHR-thee to tahk-SEE sto kseh-no-tho-KHEE-o
  english: What time can the taxi arrive at the hotel?
  notes: 'Klik A1 p. 117. Grammar: question with ''μπορεί να'' + dependent of irregular
    verb έρχομαι (έρθει).'
  gender_or_pos: phrase
  audio: ti-ora-mporei-na-ert-3dcf42.mp3
  status: verified
  example_el: — Τι ώρα μπορεί να έρθει το ταξί στο ξενοδοχείο; — Μπορεί να είναι εδώ
    στις επτά και μισή.
  example_en: — What time can the taxi arrive at the hotel? — It can be here at seven
    thirty.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Scheduling taxi arrival at accommodation
- id: A1-U105B-014
  greek: Πρέπει να βρούμε ένα οικονομικό ξενοδοχείο κοντά στο κέντρο.
  phonetic_hint: PREH-pee nah VROO-meh EH-nah ee-ko-no-mee-KO kseh-no-tho-KHEE-o kon-DAH
    sto KEN-tro
  english: We must find an economical hotel near the center.
  notes: 'Klik A1 p. 117. Grammar: ''πρέπει να'' + dependent of irregular verb βρίσκω
    (βρούμε).'
  gender_or_pos: phrase
  audio: prepei-na-vroyme-ena-52d13b.mp3
  status: verified
  example_el: — Πού θα μείνουμε στην Αθήνα; — Πρέπει να βρούμε ένα οικονομικό ξενοδοχείο
    κοντά στο κέντρο.
  example_en: — Where will we stay in Athens? — We must find an economical hotel near
    the center.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Prioritizing central and affordable lodging
- id: A1-U105B-015
  greek: Μπορείτε να μου πείτε πού είναι ο σιδηροδρομικός σταθμός;
  phonetic_hint: bo-REE-teh nah moo PEE-teh poo EE-neh o see-thee-ro-thro-mee-KOS
    stahth-MOS
  english: Can you tell me where the railway station is?
  notes: 'Klik A1 p. 117, 120. Grammar: polite formula ''μπορείτε να μου πείτε'' (λέω
    -> πείτε) + indirect question.'
  gender_or_pos: phrase
  audio: mporeite-na-moy-peit-8915b9.mp3
  status: verified
  example_el: — Με συγχωρείτε, μπορείτε να μου πείτε πού είναι ο σιδηροδρομικός σταθμός;
    — Βεβαίως, στην επόμενη γωνία.
  example_en: — Excuse me, can you tell me where the railway station is? — Certainly,
    around the next corner.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Asking for station directions politely
- id: A1-U105B-016
  greek: Θέλω να μείνω σε ένα δίκλινο δωμάτιο με πρωινό.
  phonetic_hint: THEH-lo nah MEE-no seh EH-nah THEE-klee-no tho-MAH-tee-o meh pro-ee-NO
  english: I want to stay in a double room with breakfast.
  notes: 'Klik A1 p. 113, 115, 121. Grammar: ''θέλω να μείνω'' (dependent of μένω)
    + prepositional phrase.'
  gender_or_pos: phrase
  audio: thelo-na-meino-se-en-046753.mp3
  status: verified
  example_el: — Τι είδους δωμάτιο ψάχνετε; — Θέλω να μείνω σε ένα δίκλινο δωμάτιο
    με πρωινό.
  example_en: — What kind of room are you looking for? — I want to stay in a double
    room with breakfast.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Specifying room type preferences to reception
- id: A1-U105B-017
  greek: Πρέπει να προσέχεις τα προσωπικά σου αντικείμενα στον σταθμό.
  phonetic_hint: PREH-pee nah pro-SEH-khees tah pro-so-pee-KAH soo ahn-dee-KEE-meh-nah
    ston stahth-MO
  english: You must watch your personal belongings at the station.
  notes: 'Klik A1 p. 116. Grammar: ''πρέπει να'' + subjunctive of προσέχω (προσέχεις)
    + plural accusative direct object.'
  gender_or_pos: phrase
  audio: prepei-na-prosecheis-4d84b1.mp3
  status: verified
  example_el: — Έχει πάρα πολύ κόσμο εδώ! — Ναι, πρέπει να προσέχεις τα προσωπικά
    σου αντικείμενα στον σταθμό.
  example_en: — It is very crowded here! — Yes, you must watch your personal belongings
    at the station.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Giving safety advice in public transit areas
- id: A1-U105B-018
  greek: Λέμε να ταξιδέψουμε με το πλοίο αντί για το αεροπλάνο.
  phonetic_hint: LEH-meh nah tahk-see-THEHP-soo-meh meh to PLEE-o ahn-DEE yah to ah-eh-ro-PLAH-no
  english: We are thinking of travelling by ferry instead of by airplane.
  notes: 'Klik A1 p. 113, 115. Grammar: ''λέμε να'' (1st plural) + Aorist Subjunctive
    of ταξιδεύω (ταξιδέψουμε).'
  gender_or_pos: phrase
  audio: leme-na-taxidepsoyme-5ed422.mp3
  status: verified
  example_el: — Πώς θα πάτε στην Κρήτη; — Λέμε να ταξιδέψουμε με το πλοίο αντί για
    το αεροπλάνο.
  example_en: — How will you go to Crete? — We are thinking of travelling by ferry
    instead of by airplane.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Discussing preferred transit modes
- id: A1-U105B-019
  greek: Μπορείς να μου δώσεις το εισιτήριό μου, σε παρακαλώ;
  phonetic_hint: bo-REES nah moo THOH-sees to ee-see-TEE-ree-o moo seh pah-rah-kah-LO
  english: Can you give me my ticket, please?
  notes: 'Klik A1 p. 117. Grammar: ''μπορείς να'' + dependent of irregular verb δίνω
    (δώσεις) + clitic pronoun μου.'
  gender_or_pos: phrase
  audio: mporeis-na-moy-dosei-cb37fe.mp3
  status: verified
  example_el: — Φτάνουμε στον έλεγχο. Μπορείς να μου δώσεις το εισιτήριό μου, σε παρακαλώ;
    — Ορίστε, το έχω εδώ.
  example_en: — We are arriving at the check-in. Can you give me my ticket, please?
    — Here you go, I have it right here.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Requesting documents during travel checks
- id: A1-U105B-020
  greek: Πρέπει να βάλουμε τα ρούχα στη βαλίτσα τώρα.
  phonetic_hint: PREH-pee nah VAH-loo-meh tah ROO-khah stee vah-LEET-sah TO-rah
  english: We must put the clothes into the suitcase now.
  notes: 'Klik A1 p. 117. Grammar: ''πρέπει να'' + dependent of irregular verb βάζω
    (βάλουμε).'
  gender_or_pos: phrase
  audio: prepei-na-valoyme-ta-b2affe.mp3
  status: verified
  example_el: — Η ώρα περνάει! — Ναι, πρέπει να βάλουμε τα ρούχα στη βαλίτσα τώρα.
  example_en: — Time is flying! — Yes, we must put the clothes into the suitcase now.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Organizing luggage packing
- id: A1-U105B-021
  greek: Το ξενοδοχείο αυτό είναι πιο ακριβό από το άλλο.
  phonetic_hint: to kseh-no-tho-KHEE-o ahf-TO EE-neh PYO ah-kree-VO ah-PO to AHL-lo
  english: This hotel is more expensive than the other one.
  notes: 'Klik A1 p. 129. Grammar: comparative construction ''πιο + επίθετο + από
    + αιτιατική''.'
  gender_or_pos: phrase
  audio: to-xenodocheio-ayto--b062c9.mp3
  status: verified
  example_el: — Ποιο ξενοδοχείο να επιλέξουμε; — Το ξενοδοχείο αυτό είναι πιο ακριβό
    από το άλλο, αλλά έχει πισίνα.
  example_en: — Which hotel shall we choose? — This hotel is more expensive than the
    other one, but it has a pool.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Comparing hotel prices
- id: A1-U105B-022
  greek: Η εκδρομή στη Βέροια είναι πιο φθηνή από την εκδρομή στην Αθήνα.
  phonetic_hint: ee ek-thro-MEE stee VEH-ree-ah EE-neh PYO fthee-NEE ah-PO teen ek-thro-MEE
    steen ah-THEE-nah
  english: The excursion to Veroia is cheaper than the excursion to Athens.
  notes: 'Klik A1 p. 119, 129. Grammar: comparative of feminine adjective: ''πιο φθηνή
    από + αιτιατική''.'
  gender_or_pos: phrase
  audio: i-ekdromi-sti-veroia-d0dcdd.mp3
  status: verified
  example_el: — Πόσο κάνουν οι εκδρομές; — Η εκδρομή στη Βέροια είναι πιο φθηνή από
    την εκδρομή στην Αθήνα.
  example_en: — How much do the excursions cost? — The excursion to Veroia is cheaper
    than the excursion to Athens.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Comparing tour package rates
- id: A1-U105B-023
  greek: Το αεροπλάνο είναι πιο γρήγορο από το τρένο.
  phonetic_hint: to ah-eh-ro-PLAH-no EE-neh PYO GREE-go-ro ah-PO to TREH-no
  english: The airplane is faster than the train.
  notes: 'Klik A1 p. 129, 130. Grammar: comparative ''πιο γρήγορο από'' with neuter
    nouns.'
  gender_or_pos: phrase
  audio: to-aeroplano-einai-p-5b3c82.mp3
  status: verified
  example_el: — Γιατί παίρνεις αεροπλάνο; — Επειδή το αεροπλάνο είναι πιο γρήγορο
    από το τρένο.
  example_en: — Why are you taking a plane? — Because the airplane is faster than
    the train.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Comparing travel speed between transit modes
- id: A1-U105B-024
  greek: Το πλοίο είναι πιο αργό από το αεροπλάνο.
  phonetic_hint: to PLEE-o EE-neh PYO ar-GO ah-PO to ah-eh-ro-PLAH-no
  english: The ferry is slower than the airplane.
  notes: 'Klik A1 p. 130. Grammar: comparative of αργός: ''πιο αργό από''.'
  gender_or_pos: phrase
  audio: to-ploio-einai-pio-a-87f885.mp3
  status: verified
  example_el: — Κάνει πολλές ώρες το ταξίδι; — Ναι, το πλοίο είναι πιο αργό από το
    αεροπλάνο.
  example_en: — Does the trip take many hours? — Yes, the ferry is slower than the
    airplane.
  grammatical_info:
    part_of_speech: phrase
  keg_communicative_function: Contrasting transit durations
- id: A1-U105B-025
  greek: Η Μαρία είναι πιο ψηλή από την Ελένη.
  phonetic_hint: ee mah-REE-ah EE-neh PYO psee-LEE ah-PO teen eh-LEH-nee
  english: Maria is taller than Eleni.
  notes: 'Klik A1 p. 129. Textbook example: comparative degree of ψηλός with feminine
    proper nouns.'
  gender_or_pos: phrase
