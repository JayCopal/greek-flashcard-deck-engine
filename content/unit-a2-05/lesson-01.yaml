  greek: ο γάμος
  english: wedding / marriage
  notes: Masculine noun in -ος (-οι). Covers wedding ceremony and marital institution.
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι γάμοι
    genitive_singular: του γάμου
    verb: παντρεύομαι
  keg_communicative_function: Interpreting wedding announcements and composing congratulatory
    messages
