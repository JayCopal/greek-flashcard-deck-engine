  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι βαφτίσεις
    verb: βαφτίζω
  keg_communicative_function: Recognizing family event invitations and social gathering
    protocols
  example_el: Μας κάλεσαν στη βάφτιση της ανιψιάς μου την επόμενη Κυριακή.
  example_en: They invited us to my niece's christening next Sunday.
  example2_el: Μετά τη βάφτιση ακολούθησε δεξίωση με φαγητό και παραδοσιακή μουσική.
  example2_en: After the christening a reception followed with food and traditional
    music.
  audio: i-vaftisi-6b9679.mp3
