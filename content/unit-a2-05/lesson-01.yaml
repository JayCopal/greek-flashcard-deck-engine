unit_id: unit-a2-05
lesson_id: lesson-01
title: 'Μάθημα 5: Κοινωνική Ζωή, Προσκλήσεις & Ευχές (Social Events, Invitations &
  Wishes)'
description: Composing and replying to invitations, expressing wishes for birthdays,
  weddings, name days, and using weak indirect object clitic pronouns (μου, σου, του,
  της, μας, σας, τους) in formal and informal social interactions.
lesson_status: not_started
lesson_notes: "Unit A2-05 Core Notes: Κοινωνική Ζωή, Προσκλήσεις & Ευχές (Social Life\
  \ & Etiquette)\n• Indirect Object Weak Clitic Pronouns (Γενική αδύνατων αντωνυμιών):\n\
  \  - Singular: μου (to me), σου (to you), του (to him/it), της (to her).\n  - Plural:\
  \ μας (to us), σας (to you / formal singular), τους (to them).\n  - Position: immediately\
  \ preceding conjugated verbs (μου στέλνει, σου εύχομαι) and immediately following\
  \ imperatives (πες μου, δώστε μας).\n\n• Formulaic Social Wishes:\n  - Χρόνια πολλά\
  \ (birthdays, namedays, holidays).\n  - Καλή επιτυχία (exams, interviews, trials).\n\
  \  - Περαστικά (illness, recovery).\n  - Συγχαρητήρια (diplomas, achievements, promotions).\n\
  \  - Να ζήσετε (wedding wish to newlyweds).\n  - Να σας ζήσει (birth/baptism wish\
  \ to parents).\n\n• Writing Task 1 Protocol (40-50 words):\n  - Polite invitation:\
  \ αφορμή (occasion) + τόπος (place) + χρόνος (time).\n  - Acceptance: με χαρά (with\
  \ pleasure) + ανυπομονώ (look forward to).\n  - Polite decline: δυστυχώς δεν μπορώ\
  \ (unfortunately cannot) + δικαιολόγηση (justification)."
entries:
- id: A2-U05-001
  greek: η πρόσκληση
  english: invitation
  notes: Feminine noun in -η (-εις). Core text type in KEG A2 Writing Task 1 (40-50
    words invitation or response).
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι προσκλήσεις
    accusative_singular: την πρόσκληση
    genitive_singular: της πρόσκλησης
    verb: προσκαλώ
  keg_communicative_function: Reading and writing formal and informal invitations
    for celebrations
  example_el: Σας στέλνω αυτή την πρόσκληση για τα εγκαίνια της νέας μας έκθεσης.
  example_en: I am sending you this invitation for the opening of our new exhibition.
  example2_el: Λάβαμε μια όμορφη πρόσκληση για τον γάμο της Ελένης και του Γιώργου.
  example2_en: We received a lovely invitation to Eleni and Giorgos's wedding.
  audio: i-prosklisi-271aa1.mp3
  status: verified
  example_audio: sas-stelno-ayti-tin--a09879.mp3
  example2_audio: lavame-mia-omorfi-pr-ebdea5.mp3
- id: A2-U05-002
  greek: προσκαλώ
  english: to invite
  notes: 'Contracted verb (προσκαλώ, προσκαλείς, προσκαλεί). Simple past: ''προσκάλεσα''.
    Simple future: ''θα προσκαλέσω''.'
  gender_or_pos: verb
  grammatical_info:
    part_of_speech: verb
    simple_past: προσκάλεσα
    simple_future: θα προσκαλέσω
    noun_derivative: η πρόσκληση
  keg_communicative_function: Inviting friends, colleagues, or neighbors to social
    gatherings
  example_el: Θα ήθελα να σας προσκαλέσω στο σπίτι μου για φαγητό το βράδυ του Σαββάτου.
  example_en: I would like to invite you to my house for dinner on Saturday evening.
  example2_el: Μας προσκάλεσαν σε μια μουσική εκδήλωση στο αρχαίο θέατρο.
  example2_en: They invited us to a musical event at the ancient theater.
  audio: proskalo-a2db92.mp3
  status: verified
  example_audio: tha-ithela-na-sas-pr-f6180a.mp3
  example2_audio: mas-proskalesan-se-m-91c94f.mp3
- id: A2-U05-003
  greek: δέχομαι
  english: to accept
  notes: 'Deponent verb (δέχομαι, δέχεσαι, δέχεται). Simple past: ''δέχτηκα'' / ''δέχθηκα''.
    Antonym: ''αρνούμαι''.'
  gender_or_pos: verb (deponent)
  grammatical_info:
    part_of_speech: verb
    simple_past: δέχτηκα
    simple_future: θα δεχτώ
    antonym: αρνούμαι
    noun_derivative: η αποδοχή
  keg_communicative_function: Accepting invitations gladly in Writing Task 1 responses
  example_el: Δέχομαι με μεγάλη χαρά την πρόσκλησή σας και ανυπομονώ να σας δω.
  example_en: I accept your invitation with great joy and look forward to seeing you.
  example2_el: Ο διευθυντής δέχτηκε να συναντηθεί μαζί μας αύριο το πρωί.
  example2_en: The director agreed to meet with us tomorrow morning.
  audio: dechomai-6dc361.mp3
  status: verified
  example_audio: dechomai-me-megali-c-5e349d.mp3
  example2_audio: o-dieythyntis-dechti-5d91b1.mp3
- id: A2-U05-004
  greek: αρνούμαι
  english: to refuse / to decline
  notes: 'Deponent verb (αρνούμαι, αρνείσαι, αρνείται). Simple past: ''αρνήθηκα''.
    Must be accompanied by polite apology in A2 letters.'
  gender_or_pos: verb (deponent)
  grammatical_info:
    part_of_speech: verb
    simple_past: αρνήθηκα
    simple_future: θα αρνηθώ
    noun_derivative: η άρνηση
  keg_communicative_function: Declining an invitation politely and stating reasons
    in Writing Task 1
  example_el: Δυστυχώς αναγκάζομαι να αρνηθώ την πρόσκληση λόγω ανειλημμένων υποχρεώσεων.
  example_en: Unfortunately I am forced to decline the invitation due to prior commitments.
  example2_el: Δεν μπορώ να αρνηθώ τη βοήθεια που μου προσφέρει ο φίλος μου.
  example2_en: I cannot refuse the help that my friend offers me.
  audio: arnoymai-1e629c.mp3
  status: verified
  example_audio: dystychos-anagkazoma-ae914c.mp3
  example2_audio: den-mporo-na-arnitho-81ac97.mp3
- id: A2-U05-005
  greek: με χαρά
  english: with pleasure / gladly
  notes: Prepositional adverbial formula expressing enthusiastic acceptance.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
    collocation: με μεγάλη χαρά (with great pleasure)
    synonym: ευχαρίστως
  keg_communicative_function: Accepting social invitations enthusiastically in email
    correspondence
  example_el: Θα έρθω με χαρά στα γενέθλιά σου την επόμενη Παρασκευή!
  example_en: I will come with pleasure to your birthday next Friday!
  example2_el: Με μεγάλη χαρά σάς ανακοινώνουμε τη γέννηση της κόρης μας.
  example2_en: With great pleasure we announce to you the birth of our daughter.
  audio: me-chara-db2bd9.mp3
  status: verified
  example_audio: tha-ertho-me-chara-s-74492f.mp3
  example2_audio: me-megali-chara-sas--c64a08.mp3
- id: A2-U05-006
  greek: δυστυχώς δεν μπορώ
  english: unfortunately I cannot
  notes: Fixed formula for declining invitations politely before giving an excuse.
  gender_or_pos: phrase
  grammatical_info:
    part_of_speech: phrase
    usage: polite refusal followed by excuse (γιατί, επειδή)
  keg_communicative_function: Softening refusals in formal and informal written responses
  example_el: Σας ευχαριστώ πολύ για το κάλεσμα, αλλά δυστυχώς δεν μπορώ να παρευρεθώ.
  example_en: Thank you very much for the invite, but unfortunately I cannot attend.
  example2_el: Δυστυχώς δεν μπορώ να έρθω μαζί σας επειδή δουλεύω μέχρι αργά.
  example2_en: Unfortunately I cannot come with you because I work until late.
  audio: dystychos-den-mporo-61833a.mp3
  status: verified
  example_audio: sas-eycharisto-poly--9b35f5.mp3
  example2_audio: dystychos-den-mporo--115ae6.mp3
- id: A2-U05-007
  greek: η ευχή
  english: wish / blessing
  notes: Feminine noun in -ή (-ές). Core concept in Greek cultural etiquette.
  gender_or_pos: noun (feminine)
  grammatical_info:
    part_of_speech: noun (feminine)
    plural: οι ευχές
    accusative_singular: την ευχή
    verb: εύχομαι
  keg_communicative_function: Exchanging wishes for holidays, birthdays, and name
    days
  example_el: Σας στέλνω τις θερμότερες ευχές μου για υγεία και ευτυχία.
  example_en: I send you my warmest wishes for health and happiness.
  example2_el: Τις ημέρες των εορτών ανταλλάσσουμε παραδοσιακές ευχές με φίλους και
    συγγενείς.
  example2_en: During the holidays we exchange traditional wishes with friends and
    relatives.
  audio: i-eychi-8ca97d.mp3
  status: verified
  example_audio: sas-stelno-tis-therm-3d809b.mp3
  example2_audio: tis-imeres-ton-eorto-d381de.mp3
- id: A2-U05-008
  greek: χρόνια πολλά
  english: happy birthday / many happy returns / happy name day
  notes: Universal Greek festive greeting used on birthdays, name days, New Year,
    Christmas, and national holidays.
  gender_or_pos: phrase (greeting)
  grammatical_info:
    part_of_speech: formulaic greeting
    literal: many years
    usage: birthdays, namedays, Easter, Christmas
  keg_communicative_function: Congratulating celebrants on festive occasions
  example_el: Χρόνια πολλά για τη γιορτή σου! Να είσαι πάντα γερός και ευτυχισμένος.
  example_en: Many happy returns for your name day! May you always be healthy and
    happy.
  example2_el: Της τηλεφώνησα για να της ευχηθώ χρόνια πολλά για τα γενέθλιά της.
  example2_en: I phoned her to wish her happy birthday for her birthday.
  audio: chronia-polla-a6e13f.mp3
  status: verified
  example_audio: chronia-polla-gia-ti-89e71a.mp3
  example2_audio: tis-tilefonisa-gia-n-0d3f85.mp3
- id: A2-U05-009
  greek: καλή επιτυχία
  english: good luck / every success
  notes: Formulaic greeting used before tests, job interviews, or new ventures.
  gender_or_pos: phrase (greeting)
  grammatical_info:
    part_of_speech: phrase
    noun: η επιτυχία
    adjective: καλή
  keg_communicative_function: Wishing success to peers before exams or challenging
    tasks
  example_el: Καλή επιτυχία σε όλους τους υποψηφίους στις αυριανές εξετάσεις!
  example_en: Good luck to all candidates in tomorrow's examinations!
  example2_el: Σου εύχομαι καλή επιτυχία στη νέα σου δουλειά.
  example2_en: I wish you good luck in your new job.
  audio: kali-epitychia-25cbef.mp3
  status: verified
  example_audio: kali-epitychia-se-ol-0de763.mp3
  example2_audio: soy-eychomai-kali-ep-9030cc.mp3
- id: A2-U05-010
  greek: περαστικά
  english: get well soon / may it pass quickly
  notes: Neuter plural adjective used as formulaic greeting to someone sick or recovering
    from illness/injury.
  gender_or_pos: phrase (greeting)
  grammatical_info:
    part_of_speech: formulaic greeting
    origin: περαστικός (transitory)
    usage: when someone is unwell or injured
  keg_communicative_function: Expressing sympathy and wishing prompt recovery to friends
    or colleagues
  example_el: Έμαθα ότι είσαι άρρωστος με γρίπη. Περαστικά και γρήγορη ανάρρωση!
  example_en: I heard that you are ill with the flu. Get well soon and a speedy recovery!
  example2_el: Περαστικά στην αδελφή σου, ελπίζω να βγει σύντομα από το νοσοκομείο.
  example2_en: Get well wishes to your sister; I hope she is discharged from the hospital
    soon.
  audio: perastika-fc7434.mp3
  status: verified
  example_audio: ematha-oti-eisai-arr-1049ea.mp3
  example2_audio: perastika-stin-adelf-7b9398.mp3
- id: A2-U05-011
  greek: συγχαρητήρια
  english: congratulations
  notes: Neuter plural noun used as exclamation. High-utility response to graduations,
    promotions, or passing exams.
  gender_or_pos: noun (neuter plural)
  grammatical_info:
    part_of_speech: noun (plural) / exclamation
    collocation: θερμά συγχαρητήρια (warm congratulations)
  keg_communicative_function: Congratulating friends on academic diplomas or career
    advancements
  example_el: Θερμά συγχαρητήρια για την επιτυχία σου στις εξετάσεις ελληνομάθειας!
  example_en: Warm congratulations on your success in the Greek language examinations!
  example2_el: Όλοι οι συνάδελφοι έδωσαν συγχαρητήρια στον Νίκο για την προαγωγή του.
  example2_en: All colleagues offered congratulations to Nikos on his promotion.
  audio: sygcharitiria-26655f.mp3
  status: verified
  example_audio: therma-sygcharitiria-843e32.mp3
  example2_audio: oloi-oi-synadelfoi-e-053e1a.mp3
- id: A2-U05-012
  greek: να ζήσετε
  english: may you live long and happily (wedding wish to the newlyweds)
  notes: Fixed subjunctive formula addressed to bride and groom at Greek weddings.
  gender_or_pos: phrase (wish)
  grammatical_info:
    part_of_speech: formulaic wish
    syntax: να + ζήσετε (aorist subjunctive plural of ζω)
  keg_communicative_function: Offering appropriate wedding congratulations in letters
    and conversations
  example_el: Να ζήσετε και να είστε πάντα αγαπημένοι και ευτυχισμένοι!
  example_en: May you live long together and always be loving and happy!
  example2_el: 'Γράψαμε στην κάρτα του γάμου: «Να ζήσετε με υγεία και χαρά».'
  example2_en: 'We wrote on the wedding card: ''May you live long with health and
    joy.'''
  audio: na-zisete-370b3c.mp3
  status: verified
  example_audio: na-zisete-kai-na-eis-c0099a.mp3
  example2_audio: grapsame-stin-karta--a5a04b.mp3
- id: A2-U05-013
  greek: να σας ζήσει
  english: may your newborn live long (wish to new parents)
  notes: Fixed formula addressed to parents on the birth or baptism of a child.
  gender_or_pos: phrase (wish)
  grammatical_info:
    part_of_speech: formulaic wish
    syntax: να + σας (indirect clitic) + ζήσει (third person)
  keg_communicative_function: Congratulating parents on the arrival or christening
    of a child
  example_el: Να σας ζήσει ο νεογέννητος γιος σας και να τον καμαρώσετε όπως επιθυμείτε!
  example_en: May your newborn son live long and may you be proud of him as you desire!
  example2_el: 'Στείλαμε λουλούδια στους νέους γονείς με την ευχή: «Να σας ζήσει!».'
  example2_en: 'We sent flowers to the new parents with the wish: ''May he/she live
    long!'''
  audio: na-sas-zisei-4bce74.mp3
  status: verified
  example_audio: na-sas-zisei-o-neoge-7785e3.mp3
  example2_audio: steilame-loyloydia-s-b2cdbf.mp3
- id: A2-U05-014
  greek: καλή διασκέδαση
  english: have fun / have a great time
  notes: Formulaic farewell wish before someone goes to a party, concert, cinema,
    or weekend outing.
  gender_or_pos: phrase (greeting)
  grammatical_info:
    part_of_speech: phrase
    noun: η διασκέδαση
    verb: διασκεδάζω
  keg_communicative_function: Wishing an enjoyable evening or outing to companions
  example_el: Καλή διασκέδαση στη συναυλία απόψε, τα λέμε αύριο!
  example_en: Have a great time at the concert tonight, see you tomorrow!
  example2_el: Εύχομαι καλή διασκέδαση σε όλους σας στην αποψινή έξοδο.
  example2_en: I wish everyone a wonderful time on tonight's night out.
  audio: kali-diaskedasi-d531d3.mp3
  status: verified
  example_audio: kali-diaskedasi-sti--9cae82.mp3
  example2_audio: eychomai-kali-diaske-bf7a46.mp3
- id: A2-U05-015
  greek: τα γενέθλια
  english: birthday
  notes: Neuter plural noun (always plural in Greek). Collocates with 'γιορτάζω τα
    γενέθλιά μου'.
  gender_or_pos: noun (neuter plural)
  grammatical_info:
    part_of_speech: noun (plural only)
    genitive: των γενεθλίων
    collocation: τούρτα γενεθλίων (birthday cake)
  keg_communicative_function: Writing birthday party invitations and scheduling parties
    in Task 1
  example_el: Το Σάββατο γιορτάζω τα γενέθλιά μου και οργανώνω ένα πάρτι στο σπίτι.
  example_en: On Saturday I am celebrating my birthday and organizing a party at home.
  example2_el: Σου εύχομαι ολόψυχα χρόνια πολλά για τα τριακοστά σου γενέθλια!
  example2_en: I wholeheartedly wish you many happy returns for your thirtieth birthday!
  audio: ta-genethlia-d8825b.mp3
  status: verified
  example_audio: to-savvato-giortazo--403432.mp3
  example2_audio: soy-eychomai-olopsyc-1243c0.mp3
- id: A2-U05-016
  greek: η ονομαστική γιορτή
  english: name day celebration
  notes: Feminine noun phrase. Highly celebrated social tradition in Greek culture.
  gender_or_pos: noun phrase (feminine)
  grammatical_info:
    part_of_speech: noun phrase
    plural: οι ονομαστικές γιορτές
    cultural_note: celebrated on the saint's feast day
  keg_communicative_function: Discussing cultural customs and congratulating friends
    on their name day
  example_el: Στην Ελλάδα η ονομαστική γιορτή είναι συχνά πιο σημαντική από τα γενέθλια.
  example_en: In Greece the name day celebration is often more important than birthdays.
  example2_el: Σήμερα είναι η ονομαστική γιορτή του Γιώργου και το σπίτι είναι γεμάτο
    επισκέπτες.
  example2_en: Today is Giorgos's name day and the house is full of visitors.
  audio: i-onomastiki-giorti-ae383c.mp3
  status: verified
  example_audio: stin-ellada-i-onomas-908524.mp3
  example2_audio: simera-einai-i-onoma-712c02.mp3
