unit_id: unit-106
lesson_id: lesson-01
title: 'Ενότητα 6: Σπίτι μου, σπιτάκι μου — Βασικό Λεξιλόγιο (Pages 133-150)'
description: 'CEFR A1: Housing and property types, rooms and structural components,
  furniture and appliances, real estate terminology, and housekeeping verbs from Klik
  A1 (Pages 133-150).'
lesson_status: not_started
lesson_notes: "Κλικ στα Ελληνικά Α1 — Ενότητα 6: Σπίτι μου, σπιτάκι μου (Σελίδες 133-150):\n\
  • Τύποι Κατοικίας & Κτίρια (Housing & Property Types):\n  - το σπίτι, το διαμέρισμα,\
  \ η πολυκατοικία, η μονοκατοικία, το κτίριο.\n• Χώροι & Δωμάτια του Σπιτιού (Rooms\
  \ & Spaces):\n  - το δωμάτιο, το υπνοδωμάτιο, το σαλόνι, το καθιστικό, η κουζίνα,\
  \ το μπάνιο.\n  - ο διάδρομος, το χολ, το μπαλκόνι, η αυλή, ο κήπος, το πάρκινγκ.\n\
  • Δομικά Στοιχεία & Υποδομές (Building Components):\n  - ο όροφος, το ισόγειο, η\
  \ είσοδος, το ασανσέρ, η σκάλα, η πόρτα, το παράθυρο.\n  - ο τοίχος, το πάτωμα,\
  \ το ταβάνι, το τζάκι.\n• Έπιπλα & Οικιακός Εξοπλισμός (Furniture & Furnishings):\n\
  \  - το έπιπλο, ο καναπές, η πολυθρόνα, το τραπέζι, το τραπεζάκι, η καρέκλα.\n \
  \ - το γραφείο, η βιβλιοθήκη, το κρεβάτι, το κομοδίνο, η ντουλάπα, το συρτάρι.\n\
  • Ηλεκτρικές Συσκευές & Εγκαταστάσεις (Appliances & Utilities):\n  - το ψυγείο,\
  \ η ηλεκτρική κουζίνα, το πλυντήριο ρούχων, ο νιπτήρας, η μπανιέρα, η βρύση.\n \
  \ - το καλοριφέρ, το κλιματιστικό, ο θερμοσίφωνας, η τηλεόραση, το φωτιστικό, το\
  \ χαλί, η κουρτίνα, ο καθρέφτης.\n• Ενοικίαση & Γειτονιά (Real Estate & Neighborhood):\n\
  \  - το ενοίκιο, τα κοινόχρηστα, η αγγελία, η γειτονιά, ο γείτονας.\n• Επίθετα &\
  \ Ρήματα Κατοικίας (Adjectives & Housekeeping Verbs):\n  - φωτεινός, ήσυχος, καθαρίζω,\
  \ τακτοποιώ, ανάβω."
