unit_id: unit-106
lesson_id: lesson-01
title: 'Ενότητα 5: Ετοιμάζω ταξίδι! — Βασικό Λεξιλόγιο (Pages 111-134)'
description: 'CEFR A1: Travel and transportation vocabulary, accommodation and room
  bookings, transit stations and infrastructure, vacation planning, cardinal numbers
  100-1,000, and ordinal numbers 1st-10th from Klik A1 (Pages 111-134).'
lesson_status: not_started
lesson_notes: "Κλικ στα Ελληνικά Α1 — Ενότητα 5: Ετοιμάζω ταξίδι! (Σελίδες 111-134):\n\
  • Ταξίδια & Διακοπές (Travel & Vacation Basics):\n  - το ταξίδι, οι διακοπές, η\
  \ εκδρομή, το εισιτήριο, το ταξιδιωτικό γραφείο.\n  - Εξοπλισμός: η βαλίτσα, η φωτογραφική\
  \ μηχανή, τα ρούχα.\n• Μεταφορικά Μέσα & Υποδομές (Transit & Infrastructure):\n\
  \  - το αεροπλάνο, το πλοίο, το καράβι, το τρένο, το λεωφορείο, το ταξί, το μετρό.\n\
  \  - το αεροδρόμιο, το λιμάνι, ο σταθμός, η στάση, η καθυστέρηση.\n• Διαμονή & Φιλοξενία\
  \ (Accommodation & Hospitality):\n  - το ξενοδοχείο, το δωμάτιο, το μονόκλινο, το\
  \ δίκλινο, το κάμπινγκ.\n  - το κρεβάτι (μονό / διπλό), το πρωινό, το μεσημεριανό,\
  \ το βραδινό, η διαμονή, η διατροφή, η τιμή.\n• Γεωγραφικοί Προορισμοί (Destinations\
  \ & Nature):\n  - το βουνό, η θάλασσα, το νησί, το χωριό, το εξωτερικό, το διαδίκτυο.\n\
  • Βασικά Ρήματα Ενότητας 5 (Verbs):\n  - ταξιδεύω, ετοιμάζω, κλείνω, αποφασίζω,\
  \ οργανώνω, ανεβαίνω, κατεβαίνω.\n• Επίθετα & Σύγκριση (Adjectives & Comparatives):\n\
  \  - ακριβός, φθηνός, γρήγορος, αργός, τελευταίος.\n• Αριθμοί: Εκατοντάδες & Τακτικά\
  \ (Hundreds & Ordinals):\n  - εκατό (100), διακόσια (200), πεντακόσια (500), χίλια\
  \ (1.000).\n  - πρώτος, δεύτερος, τρίτος..."
