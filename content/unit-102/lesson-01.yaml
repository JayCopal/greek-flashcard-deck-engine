unit_id: unit-102
lesson_id: lesson-01
title: 'Ενότητα 1: Γεια χαρά! — Χαιρετισμοί, Συστάσεις & Το Ρήμα Είμαι (Pages 43-54)'
description: 'CEFR A1: Greetings by time of day, formal and informal introductions,
  personal pronouns, the present tense of ''είμαι'', vocative address, and social
  etiquette from Klik A1 (pages 43-54).'
lesson_status: not_started
lesson_notes: "Κλικ στα Ελληνικά Α1 — Ενότητα 1: Γεια χαρά! (Σελίδες 43-54):\n• Χαιρετισμοί\
  \ & Χρόνος (Greetings by Time):\n  - Πρωί: Καλημέρα! (Good morning!)\n  - Απόγευμα\
  \ & Βράδυ: Καλησπέρα! (Good evening!)\n  - Αποχαιρετισμός: Αντίο!, Γεια σου/σας!,\
  \ Τα λέμε!, Καλό βράδυ!, Καληνύχτα!\n• Συστάσεις (Introductions):\n  - «Με λένε\
  \ + Αιτιατική / όνομα» (π.χ. Με λένε Κώστα / Σοφία).\n  - «Είμαι ο / η + Ονομαστική»\
  \ (π.χ. Είμαι ο Νίκος / Είμαι η Μαρία).\n  - «Από εδώ ο φίλος μου / η φίλη μου...»\
  \ (This is my friend...).\n  - Απάντηση: «Χαίρω πολύ!», «Κι εγώ!», «Επίσης!».\n\
  • Κλητική Πτώση (Vocative in Direct Address):\n  - Αρσενικά σε -ος: κύριε Παπαδόπουλε!,\
  \ Νίκο!\n  - Αρσενικά σε -ης: Δημήτρη!, Άρη!\n  - Αρσενικά σε -ας: Κώστα!\n  - Θηλυκά\
  \ παραμένουν ίδια: Άννα!, Ελένη!\n• Προσωπικές Αντωνυμίες & Ρήμα «είμαι» (Present):\n\
  \  - εγώ είμαι, εσύ είσαι, αυτός/αυτή/αυτό είναι\n  - εμείς είμαστε, εσείς είστε,\
  \ αυτοί/αυτές/αυτά είναι\n• Άρνηση (Negation):\n  - «Όχι, δεν είμαι ο Γιάννης.»\
  \ (No, I am not Giannis)."
