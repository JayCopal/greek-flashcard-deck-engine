unit_id: unit-109
lesson_id: lesson-01
title: 'Ενότητα 9: Σπουδάζεις ή δουλεύεις; — Βασικό Λεξιλόγιο (Pages 195-218)'
description: 'Core vocabulary for Unit 9 and Review 7-9 of Klik sta Ellinika A1: Academic
  institutions & education (σπουδές, πανεπιστήμιο, σχολή, φροντιστήριο, εργαστήριο,
  σχολείο, γυμνάσιο, λύκειο), classroom and school supplies (πίνακας, θρανίο, κασετίνα,
  σακίδιο, τετράδιο, μολύβι, στυλό), musical instruments & arts (μουσική, πιάνο, κιθάρα,
  βιολί, μπουζούκι, ζωγραφική, πινέλο), professions (καθηγητής, δάσκαλος, φοιτητής,
  διευθυντής, γραμματέας, υπάλληλος, γιατρός, δικηγόρος, μηχανικός, μάγειρας, λογιστής,
  κομμωτής), workplaces and employment (εργασία, μισθός, ωράριο, υπερωρία, άδεια,
  εταιρεία, εργοστάσιο, νοσοκομείο, κομμωτήριο).'
lesson_status: not_started
