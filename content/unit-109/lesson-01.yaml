unit_id: unit-109
lesson_id: lesson-01
title: 'Ενότητα 8: Από τον μανάβη στο πιάτο μας! — Βασικό Λεξιλόγιο (Pages 175-194)'
description: 'Core vocabulary for Unit 8 of Klik sta Ellinika A1: Food retail venues
  (μανάβικο, κρεοπωλείο, φούρνος, περίπτερο, λαϊκή αγορά), fresh produce (μήλα, πορτοκάλια,
  ντομάτες, αγγούρια, πατάτες, κρεμμύδια), meat and poultry (κρέας, κοτόπουλο, μοσχάρι,
  χοιρινό, αρνί, κιμάς), dairy, bakery and pantry staples (γάλα, τυρί, φέτα, γιαούρτι,
  ψωμί, μακαρόνια, λάδι, αλάτι), beverages and kiosk items (αναψυκτικό, χυμός, μπύρα,
  ούζο, σοκολάτα, παγωτό).'
lesson_status: not_started
