unit_id: unit-03
lesson_id: lesson-01
title: Επαγγέλματα, Σπουδές & Στοιχεία Επικοινωνίας (Professions & Contact Details)
description: 'CEFR A1: Occupations, workplaces, phone numbers, addresses, digits 0-10,
  and verbs (δουλεύω, σπουδάζω, διδάσκω).'
lesson_status: not_started
lesson_notes: 'Unit 3 Core Grammar Notes:

  • Professions & Gender Suffixes: Masculine in -ος, Feminine in -α/-ος (ο δάσκαλος
  / η δασκάλα, ο/η γιατρός, ο/η δικηγόρος). Masculine in -ης, Feminine in -τρια (ο
  καθηγητής / η καθηγήτρια, ο φοιτητής / η φοιτήτρια).

  • Asking about Profession: ''Τι δουλειά κάνεις;'' or ''Με τι ασχολείσαι;''

  • Cardinal Numerals: μηδέν (0), ένας/μία/ένα (1), δέκα (10), είκοσι (20), εκατό
  (100).'
entries:
