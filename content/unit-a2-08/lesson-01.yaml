unit_id: unit-a2-08
lesson_id: lesson-01
title: 'Μάθημα 8: Καιρός, Φύση & Γεωγραφία της Ελλάδας (Weather, Nature & Geography)'
description: Interpreting weather bulletins, seasonal forecasts, and maritime Beaufort
  scales, describing Greek geography (mountains, islands, rivers, lakes), and mastering
  adjectives in -ύς, -ιά, -ύ (βαθύς, βαρύς, ελαφρύς, πλατύς).
lesson_status: not_started
lesson_notes: "Unit A2-08 Core Notes: Καιρός, Φύση & Γεωγραφία (Weather & Greek Geography)\n\
  • Weather Forecast Terminology:\n  - θερμοκρασία (temperature), βροχή (rain), καταιγίδα\
  \ (storm), χιόνι (snow), άνεμος (wind), μποφόρ (Beaufort).\n  - αίθριος καιρός (clear\
  \ skies), νεφώσεις (cloud cover), υγρασία (humidity).\n• Adjectives in -ύς, -ιά,\
  \ -ύ:\n  - βαθύς/βαθιά/βαθύ (deep), βαρύς/βαριά/βαρύ (heavy), ελαφρύς/ελαφριά/ελαφρύ\
  \ (light), πλατύς/πλατιά/πλατύ (wide)."
entries:
- id: A2-U08-001
  greek: ο καιρός
  english: weather / time
  notes: Masculine noun in -ός (-οί). 'Τι καιρό κάνει;' = What's the weather like?
  gender_or_pos: noun (masculine)
  grammatical_info:
    part_of_speech: noun (masculine)
    plural: οι καιροί
    collocation: δελτίο καιρού (weather forecast / bulletin)
  keg_communicative_function: Asking about and describing weather conditions in dialogues
    and listening tasks
  example_el: Τι καιρό προβλέπεται να κάνει το Σαββατοκύριακο στην Αττική;
  example_en: What weather is forecast for the weekend in Attica?
