<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Modern Greek Flashcard & Audio Asset Deck Engine (Offline PWA)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GreekCards" />
    <title>Modern Greek Flashcard Deck Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var activeId = localStorage.getItem('greek_deck_active_user');
          var key = activeId ? 'greek_deck_study_prefs_' + activeId : null;
          var raw = key ? localStorage.getItem(key) : null;
          var prefs = raw ? JSON.parse(raw) : null;
          var size = (prefs && prefs.textSizePreference) || 'normal';
          document.documentElement.classList.remove('text-scale-normal', 'text-scale-large', 'text-scale-xlarge');
          document.documentElement.classList.add('text-scale-' + size);
        } catch (e) {
          document.documentElement.classList.add('text-scale-normal');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
